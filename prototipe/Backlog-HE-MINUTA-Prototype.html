<style id="brand-eppat">
/**
 * E-PPAT Brand Theme untuk INA Digital Design System (IDDS)
 * --------------------------------------------------------------------------
 * Format mengikuti brand bawaan IDDS (@idds/styles: [data-brand='inagov'], 'panrb', dll.).
 * Hanya token brand (primary, secondary, hover) yang diganti; warna netral, sentimen
 * (positive/negative/warning/guide), tipografi, spacing, dan komponen tetap milik IDDS.
 *
 * Pemakaian:
 *   1. import '@idds/react/index.css'            (atau @idds/styles/dist/index.css)
 *   2. import './eppat.css'                       (berkas ini, SETELAH CSS IDDS)
 *   3. document.documentElement.setAttribute('data-brand', 'eppat')
 *      — atau setCustomTheme(eppatTheme) dari eppat-theme.ts (tanpa dukungan mode gelap)
 *
 * Sumber warna: tema aktif E-PPAT (CMS › Setting Theme) di dev-app.eppat.id, dibaca 23 Okt 2026:
 *   --eppat-brand-rgb 61 107 94 (#3D6B5E), --eppat-brand-hover-rgb 52 93 82 (#345D52),
 *   --eppat-sidebar-bg #2C3C42, --eppat-sidebar-hover #3A4D54, --eppat-line-sand-rgb 210 221 217,
 *   --eppat-paper-cream-rgb 238 243 241, --eppat-paper-vanilla-rgb 245 248 247, kartu kantor #DAC999.
 * Kontras (WCAG 2.2): teks putih di atas primary-500 #3D6B5E = 6,06:1 (AA); hover #345D52 = 7,41:1;
 *   primary-400 #4E7C6F = 4,73:1 (dipakai sebagai warna utama mode gelap).
 */

/* E-PPAT Theme - Pejabat Pembuat Akta Tanah */
[data-brand='eppat'] {
  /* Primary Colors - Hijau E-PPAT */
  --ina-primary-25: #f5f8f7;
  --ina-primary-50: #eef3f1;
  --ina-primary-100: #dde5e2;
  --ina-primary-200: #c2d3cc;
  --ina-primary-300: #9db8ae;
  --ina-primary-400: #4e7c6f;
  --ina-primary-500: #3d6b5e;
  --ina-primary-600: #345d52;
  --ina-primary-700: #2a4b42;
  --ina-primary-800: #1d3530;
  --ina-primary-900: #0f1c19;
  --ina-primary-primary: #3d6b5e;

  /* Secondary Colors - Emas kartu kantor E-PPAT */
  --ina-secondary-25: #fcfbf6;
  --ina-secondary-50: #f8f4e7;
  --ina-secondary-100: #f0e8cc;
  --ina-secondary-200: #e6dab2;
  --ina-secondary-300: #dac999;
  --ina-secondary-400: #c7b077;
  --ina-secondary-500: #ae9358;
  --ina-secondary-600: #8c7444;
  --ina-secondary-700: #6a5733;
  --ina-secondary-800: #483b23;
  --ina-secondary-900: #272013;

  /* Accent Colors (legacy IDDS, disamakan dengan secondary) */
  --ina-accent-100: #fcfbf6 !important;
  --ina-accent-200: #f8f4e7 !important;
  --ina-accent-300: #f0e8cc !important;
  --ina-accent-400: #e6dab2 !important;
  --ina-accent-500: #dac999 !important;
  --ina-accent-600: #ae9358 !important;
  --ina-accent-700: #6a5733 !important;

  /* Interactive Colors */
  --ina-brand-primary: #3d6b5e;
  --ina-brand-hover: #345d52 !important;
  --ina-neutral-hover: var(--ina-neutral-100) !important;

  /* Brand-specific colors (seperti --ina-bgn-brand-primary pada brand BGN) */
  --ina-eppat-sidebar-bg: #2c3c42;
  --ina-eppat-sidebar-hover: #3a4d54;
  --ina-eppat-sidebar-active: var(--ina-primary-500);
  --ina-eppat-sidebar-content: rgba(255, 255, 255, 0.8);
  --ina-eppat-office-card: var(--ina-secondary-300);
  --ina-eppat-stroke-brand: #d2ddd9;
  --ina-eppat-surface-cream: var(--ina-primary-50);
}

/* Aksen komponen mengikuti brand E-PPAT.
   IDDS memakai biru "guide" atau hitam untuk elemen penunjuk berikut; di E-PPAT diganti hijau brand.
   Warna status (positive/negative/warning/info pada Alert, Badge, Toast) TIDAK diubah. */
[data-brand='eppat'] .ina-button.ina-button--link { color: var(--ina-primary-500) !important; }
[data-brand='eppat'] .ina-button--link:hover:not(:disabled),
[data-brand='eppat'] .ina-button--link:focus:not(:disabled) { color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-stepper__item--active .ina-stepper__icon-wrapper {
  border-color: var(--ina-primary-500); color: var(--ina-primary-500); background-color: var(--ina-primary-50);
}
[data-brand='eppat'] .ina-stepper__item--active .ina-stepper__label { color: var(--ina-primary-500); }
[data-brand='eppat'] .ina-stepper__item--completed .ina-stepper__icon-wrapper {
  border-color: var(--ina-primary-500); color: #fff; background-color: var(--ina-primary-500);
}
[data-brand='eppat'] .ina-stepper__item--completed .ina-stepper__label { color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-stepper__separator--completed { background-color: var(--ina-primary-500); }
[data-brand='eppat'] .ina-checkbox__box--checked {
  background-color: var(--ina-primary-500); border-color: var(--ina-primary-500);
  box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 2px var(--ina-primary-500);
}
[data-brand='eppat'] .ina-pagination__page-button--active { border-color: var(--ina-primary-500); color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-breadcrumb__link--active { color: var(--ina-primary-600); }

/* Penyesuaian kontras (WCAG 2.2 AA, minimal 4,5:1 untuk teks biasa).
   Warna bawaan IDDS berikut di bawah standar pada latar terang; diganti dengan corak lebih gelap
   dari keluarga warna yang SAMA sehingga arti warna tidak berubah. */
[data-brand='eppat'] .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__label,
[data-brand='eppat'] .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__icon-wrapper {
  color: var(--ina-content-secondary);                  /* #a3a3a3 2,5:1 → #525252 7,8:1 */
}
[data-brand='eppat'] .ina-text-field__required,
[data-brand='eppat'] .ina-text-area__required,
[data-brand='eppat'] .ina-select-dropdown__required,
[data-brand='eppat'] .ina-password-input__required,
[data-brand='eppat'] .ina-input-search__asterisk { color: var(--ina-negative-600); }      /* #f02d2d 4,1:1 → #d50b0b */
[data-brand='eppat'] .ina-select-dropdown__trigger-text--placeholder,
[data-brand='eppat'] .ina-date-picker__trigger-text--placeholder { color: var(--ina-content-secondary) !important; } /* IDDS memakai !important */
[data-brand='eppat'] .ina-alert--caution .ina-alert__title { color: var(--ina-warning-600); } /* #eebb04 1,7:1 → #855f00 */
[data-brand='eppat'] .ina-alert--info .ina-alert__title { color: var(--ina-guide-600); }
[data-brand='eppat'] .ina-alert--critical .ina-alert__title { color: var(--ina-negative-600); } /* #f02d2d 3,6:1 di atas latar alert → #d50b0b */
/* teks galat isian (#f02d2d 4,1:1 → negative-600 #d50b0b) */
[data-brand='eppat'] .ina-one-time-password__helper-text--error,
[data-brand='eppat'] .ina-text-area__helper-text--error,
[data-brand='eppat'] .ina-phone-input__helper-text--error,
[data-brand='eppat'] .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--error,
[data-brand='eppat'] .ina-file-upload__file-error,
[data-brand='eppat'] .ina-file-upload__file--error .ina-file-upload__file-name,
[data-brand='eppat'] .ina-file-upload__error-message { color: var(--ina-negative-600); }
[data-brand='eppat'] .ina-file-upload__error-message:empty { display: none; }
[data-brand='eppat'] .ina-password-input__status-message--error,
[data-brand='eppat'] .ina-password-input .ina-password-input__status-area .ina-password-input__status-message.ina-password-input__status-message--error,
[data-brand='eppat'] .ina-password-input__character-count--error { color: var(--ina-negative-600); }
/* teks peringatan isian (#eebb04 1,8:1 → warning-600) */
[data-brand='eppat'] .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--warning,
[data-brand='eppat'] .ina-text-area__helper-text--warning,
[data-brand='eppat'] .ina-password-input__status-message--warning,
[data-brand='eppat'] .ina-password-input__character-count--warning { color: var(--ina-warning-600); }
[data-brand='eppat'] .ina-password-input__status-message--success { color: var(--ina-content-positive); }

/* E-PPAT Dark Mode Overrides */
[data-theme='dark'][data-brand='eppat'] {
  --ina-primary-primary: var(--ina-primary-400);
  --ina-brand-hover: var(--ina-primary-500) !important;
  --ina-neutral-hover: var(--ina-neutral-800) !important;
  --ina-eppat-sidebar-bg: #141c1f;
  --ina-eppat-sidebar-hover: #22302d;
  --ina-eppat-sidebar-active: var(--ina-primary-400);
  --ina-eppat-stroke-brand: #2a3a36;
  --ina-eppat-surface-cream: #18211f;
}


/* Bantuan dalam IDDS Drawer + Accordion */
.ina-drawer__content .bantu-langkah{margin:4px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.ina-drawer__content .bantu-langkah li{margin-bottom:8px}
.ina-drawer__content > p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.ina-drawer__content .bantu-sub{margin:20px 0 8px}
.ina-drawer__content .bantu-kontak{grid-template-columns:1fr}
.ina-drawer__content .ina-accordion{border-bottom:1px solid var(--ina-stroke-primary)}
.ina-drawer__content .ina-accordion__body p{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}

.judul-halaman{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.judul-halaman .judul-kiri{min-width:0}
</style>
<style id="kerangka-css">
/* ===== Order AJB — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 23–24 (HE-ORDER-01…05)
   Kerangka & teks mengikuti layar live Peruri (dilihat 23 Okt 2026, akun Asisten). ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ina-content-primary);background:var(--ina-background-secondary);-webkit-font-smoothing:antialiased}

/* protobar (khusus prototipe) */
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#0f1a17;color:#E6EDEA;font-size:12px;position:relative;z-index:60}
.protobar a{color:#E6EDEA;text-decoration:none;border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:500 11px Inter,sans-serif}
.protobar b{color:#fff}
.protobar .sep{opacity:.6}
.protobar button.pil{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
.protobar button.pil[aria-pressed="true"]{background:#3D6B5E;border-color:#3D6B5E;color:#fff}
.protobar .kanan{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
.protobar .utama{background:#3D6B5E!important;border-color:#3D6B5E!important;color:#fff!important;font-weight:600!important}
.tag-usulan{display:none!important;align-items:center;font:600 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.penanda .tag-usulan{display:inline-flex!important}
body.penanda .ditandai{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px;border-radius:10px}
.sorot{outline:3px solid #2563EB!important;outline-offset:4px;border-radius:12px}

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:var(--eppat-sidebar-icon)}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu warna (pola backlog Perdana Niaga) — nanti dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:#C2BB4B;--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.ava{width:32px;height:32px;font:600 12px Inter,sans-serif;background:var(--ina-primary-primary)!important;color:#fff!important;border-color:var(--ina-primary-primary)!important}
.uname{display:block;font:600 12px/14px Inter,sans-serif;color:var(--ina-primary-primary)}

.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}

/* daftar order */
.daftar-atas{display:flex;justify-content:flex-end;margin-top:20px}
.saring{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end;margin-top:16px}
.saring .ina-text-field__label{display:block}
.saring .cari-wadah .ina-input-search{width:100%;margin-top:6px} /* IDDS Input Search, sama dengan Minuta & Verifikasi */
.tabel-wadah{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tabel-gulir{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tabel-wadah .ina-table{border:0;border-radius:0}
table.tb td{vertical-align:middle}
table.tb td .kd{font-weight:600;color:var(--ina-primary-primary);cursor:pointer}
table.tb td .kc{font-size:12px;color:var(--ina-content-secondary)}
table.tb tr.klik{cursor:pointer}
table.tb tr.klik:hover td{background:var(--ina-primary-25)}
.aksi-baris{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kosong{padding:28px;text-align:center;color:var(--ina-content-secondary)}
.halaman{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ina-stroke-primary);font-size:13px;color:var(--ina-content-secondary)}
.halaman > span{white-space:nowrap}
[data-merah]{color:var(--ina-negative-600)!important}
.tb .ina-table__cell,.tb .ina-table__header-cell{padding:12px 16px}
.tb .ina-table__cell{white-space:normal}
.lengkap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lengkap.ok{color:var(--ina-content-positive)}
.lengkap.kurang{color:var(--ina-content-secondary)}
.lengkap svg{flex:none}

/* detail order */
.det-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kepala .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);margin-top:12px}
.det-kepala h2{margin:2px 0 0;font:600 20px/28px Inter,sans-serif}
.status-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px 28px}
.status-kartu .ina-stepper{align-items:flex-start;min-height:92px;padding:4px 64px 0}
.status-kartu .ina-stepper__separator{align-self:flex-start;margin-top:11px}
.status-kartu .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.status-kaki{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ina-stroke-primary);margin-top:8px;padding-top:16px}
.status-kaki p{margin:0;font-size:14px;color:var(--ina-content-secondary)}
.status-kaki p b{color:var(--ina-content-primary)}
.status-kaki .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-kaki .alasan{font-size:12.5px;color:var(--ina-content-secondary)}
.syarat{margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.syarat h4{margin:0 0 10px;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syarat h4 .hit{font-weight:500;color:var(--ina-content-secondary)}
.syarat ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.syarat li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.syarat li .ik{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none}
.syarat li.ok .ik{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.syarat li.kurang .ik{background:var(--ina-warning-100);color:var(--ina-warning-600)}
.syarat li.ok span.t{color:var(--ina-content-secondary)}
.syarat li .ina-button{padding:0;height:auto;min-height:0}
.syarat-alert{margin-top:16px}
.syarat-alert .ina-alert__description{display:flex;flex-direction:column;gap:10px}
.syarat-daftar{display:flex;flex-wrap:wrap;gap:8px 16px}
.syarat-item{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-badge{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-button{padding:0 4px}
.langkah-berikut{color:var(--ina-content-primary)}
.info-baris{margin-top:16px}
.info-baris .ina-alert__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
.info-baris .ina-alert__text-section{flex:1;min-width:220px}

.tab-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tab-kartu > .ina-tab-horizontal{padding:0 12px;border-bottom:1px solid var(--ina-stroke-primary)}
.tab-kartu .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center}
.tab-kartu .tanda{font:600 11px Inter,sans-serif;border-radius:999px;padding:1px 7px}
.tab-kartu .tanda.ok{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.tab-kartu .tanda.kurang{background:var(--ina-warning-100);color:var(--ina-warning-700)}
.tab-kartu .tanda.netral{background:var(--ina-neutral-100);color:var(--ina-content-secondary)}
.tab-isi{padding:20px}
.tab-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tab-bar p{margin:0;font-size:13px;color:var(--ina-content-secondary)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-field textarea.ina-text-field__input{min-height:80px;resize:vertical;padding:0}
.f-kaki{display:flex;justify-content:flex-end;margin-top:16px}
.tb .nm{font-weight:500}
.tb .sub2{font-size:12px;color:var(--ina-content-secondary)}
.kunci{margin-bottom:16px}

/* dialog */
.ina-modal__body p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary)}
.seg button{border:0;border-radius:7px;background:transparent;padding:7px 14px;font:500 14px Inter,sans-serif;color:var(--ina-content-secondary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ina-primary-primary);color:#fff}
.fld{margin-bottom:16px}
.fld > .ina-text-field__label{display:flex;align-items:center;gap:6px}
.select-wadah{position:relative;display:block;width:100%}
.select-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:0;max-height:240px}
.cari-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.1);padding:4px;max-height:220px;overflow:auto}
.cari-panel button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.cari-panel button:hover{background:var(--ina-background-tertiary)}
.cari-panel small{display:block;font-size:12px;color:var(--ina-content-secondary)}
.kartu-pihak{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px;background:var(--ina-background-secondary);font-size:13.5px}
.kartu-pihak b{display:block;font-size:14px;margin-bottom:6px}
.kartu-pihak dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.kartu-pihak dt{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu-pihak dd{margin:0}
.belum-ada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ina-primary-25);border:1px solid var(--ina-primary-100);font-size:13px}
.ringkas-kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:12px 0 14px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas-kv dt{color:var(--ina-content-secondary)}
.ringkas-kv dd{margin:0;font-weight:500}
.cek-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;cursor:pointer}

.daftar-ubah{display:flex;flex-direction:column;gap:10px}
.daftar-ubah .it{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px}
.daftar-ubah .it .a{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daftar-ubah .it code{font:600 11.5px ui-monospace,Menlo,monospace;color:#2563EB}
.daftar-ubah .it b{font-size:14px}
.daftar-ubah .it p{margin:6px 0 4px;font-size:13px;line-height:19px;color:var(--ina-content-primary)}
.daftar-ubah .it .lama{font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.bantu-langkah{margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.bantu-langkah li{margin-bottom:6px}
.bantu-sub{margin:18px 0 8px;font:600 14px Inter,sans-serif;display:flex;align-items:center}
.bantu-faq{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.bantu-faq summary{cursor:pointer;font-weight:500}
.bantu-faq p{margin:8px 0 0!important}
.bantu-kontak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bantu-kontak div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.bantu-kontak b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.bantu-kontak span{font-size:14px}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.toast-wadah{position:fixed;bottom:24px;right:24px;z-index:100;max-width:calc(100vw - 32px)}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--ina-stroke-secondary);color:var(--ina-content-secondary);font:600 10px Inter,sans-serif;cursor:help;background:transparent;padding:0}
.ina-tooltip__bubble{max-width:260px;white-space:normal}

@media (max-width:1024px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,26,23,.45);z-index:35;opacity:0;pointer-events:none;transition:.22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .syarat ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){

<style id="minuta-css">
/* ===== Minuta Akta — komponen IDDS + brand E-PPAT (HE-UMUM-01)

/* daftar minuta */
.saring-m{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.saring-m .ina-input-search{flex:1;width:auto;min-width:220px}

/* kepala detail */
.det-kepala{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kiri{display:flex;align-items:center;gap:12px;min-width:0}
.det-kiri h2{margin:0;font:600 18px/26px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.det-kiri h2 .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary)}
.det-kiri .jenis{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:12.5px;color:var(--ina-content-secondary)}
.det-aksi{display:flex;gap:8px;flex-wrap:wrap}
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45}
/* ikon ? bertooltip untuk istilah (pola bersama) */
.tanya-btn{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;margin-left:4px;border:0;border-radius:50%;background:transparent;color:var(--ina-content-secondary);cursor:help;vertical-align:middle}.tanya-btn:hover,.tanya-btn:focus-visible{color:var(--ina-primary-500);outline:2px solid var(--ina-primary-500);outline-offset:1px}
.tanya:focus-within .ina-tooltip__content{visibility:visible;opacity:1}
.tanya .tanya-btn svg{color:inherit}
.tanya .ina-tooltip__bubble{font-weight:400;font-size:12px;letter-spacing:normal;text-transform:none;color:var(--ina-white,#fff)}
.ikon-alert{display:grid;place-items:center;color:var(--ina-negative-600);margin-top:1px}
.ina-alert--critical .ina-alert__title{color:var(--ina-negative-600)}
.peran-info{margin-top:14px}
.ejaan{margin-top:14px}

/* tata letak editor */
.ruang{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.panel-kiri{background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden;position:sticky;top:80px}
.panel-kiri .ina-tab-horizontal{padding:0 8px;border-bottom:1px solid var(--ina-stroke-primary)}
.panel-kiri > .ina-tab-horizontal{padding:0 12px}
.panel-kiri .ina-tab-horizontal__container{display:flex;width:100%;min-width:0;margin:0;padding:0;box-sizing:border-box}
.panel-kiri .ina-tab-horizontal__container > *{flex:1;min-width:0;display:flex}
.panel-kiri .ina-tab-horizontal__tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font-size:14px}
.panel-ket{display:flex;align-items:flex-start;gap:8px;margin:12px 12px 4px;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.panel-ket svg{flex:none;margin-top:1px}
.daftar-pasal{list-style:none;margin:0;padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow:auto}
.it-pasal{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 6px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-primary);cursor:pointer}
.it-pasal:hover{border-color:var(--ina-primary-300)}
.it-pasal.aktif{border-color:var(--ina-primary-500);box-shadow:0 0 0 1px var(--ina-primary-500)}
.it-pasal.catatan{border-left:3px solid var(--ina-secondary-300)}
.it-pasal .geser{display:flex;flex-direction:column}
.it-pasal .geser button{border:0;background:transparent;padding:0 2px;height:14px;line-height:0;color:var(--ina-content-secondary);cursor:pointer}
.it-pasal .geser button:disabled{opacity:.3;cursor:default}
.it-pasal .no{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--ina-primary-500);color:#fff;font:600 11px Inter,sans-serif}
.it-pasal .no.cat{background:var(--ina-secondary-100);color:var(--ina-secondary-700)}
.it-pasal .nm{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-pasal .nm small{display:block;font-size:11.5px;font-weight:400;color:var(--ina-content-secondary)}
/* tombol hapus = IDDS Button tertiary sm (ikon saja) */
.it-pasal .hapus.ina-button{width:32px;height:32px;min-height:0;padding:0;justify-content:center;opacity:0}
.it-pasal:hover .hapus,.it-pasal.aktif .hapus,.it-pasal .hapus:focus-visible{opacity:1}
.it-pasal .hapus.ina-button:hover{color:var(--ina-negative-600)}
.it-pasal.baru{animation:kilau 1.6s ease}
@keyframes kilau{0%{background:var(--ina-primary-100)}100%{background:var(--ina-background-primary)}}
.panel-kaki{display:flex;gap:8px;padding:12px;border-top:1px solid var(--ina-stroke-primary)}
.panel-kaki .ina-button{flex:1;justify-content:center}

.panel-kanan{background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:visible;min-width:0}
.panel-kanan > .ina-tab-horizontal{padding:0 12px;border-bottom:1px solid var(--ina-stroke-primary)}
.panel-kanan .ina-tab-horizontal__tab{display:inline-flex;align-items:center;gap:6px}
.kosong-ed{padding:72px 24px;text-align:center;color:var(--ina-content-secondary);font-size:14px}
.kosong-ed svg{display:block;margin:0 auto 12px;color:var(--ina-stroke-secondary)}
.isi-ed{padding:20px 24px 24px}
.ed-judul{display:flex;align-items:center;gap:8px;margin:0 0 16px;font:600 15px Inter,sans-serif;color:var(--ina-primary-primary)}
.ed-judul .ina-badge{font-weight:500}
.baris2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.cek{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin-top:12px}
.cek small{color:var(--ina-content-secondary);font-size:12.5px}
.label-isi{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 6px;font-size:14px;font-weight:500}

/* bilah alat (HE-MINUTA-02) */
.alat{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:8px;border:1px solid var(--ina-stroke-primary);border-bottom:0;border-radius:10px 10px 0 0;background:var(--ina-background-secondary);position:relative}
.alat .pisah{width:1px;height:22px;background:var(--ina-stroke-primary);margin:0 6px}
/* alat = IDDS Button tertiary sm ikon saja; hanya ukuran yang diatur */
.alat .btn-alat.ina-button{width:34px;height:34px;min-height:0;padding:0;justify-content:center;font-weight:600;font-size:15px}
.alat .btn-alat.i{font-style:italic;font-family:Georgia,serif}
.alat .btn-alat.u span{text-decoration:underline}
.alat .kanan-alat{margin-left:auto;display:flex;gap:6px;align-items:center}
.alat .kanan-alat .ina-button{white-space:nowrap}
/* menu Lainnya = IDDS Action Dropdown (posisi & paksa tampil seperti menu profil TERA) */
/* wadah resmi IDDS (.ina-action-dropdown / .ina-select-dropdown) diletakkan absolut di kanan bilah alat */
.pop-wadah{position:absolute;right:8px;left:auto;top:calc(100% - 4px);z-index:16;width:auto}
.pop-wadah .menu-lain.ina-action-dropdown__menu{position:relative;right:auto;left:auto;top:0;margin-top:0;min-width:240px;visibility:visible;opacity:1;pointer-events:auto;transform:none}

/* panel variabel = IDDS Select Dropdown (panel + pencarian + opsi) (HE-MINUTA-03) */
.pop-wadah .panel-var.ina-select-dropdown__panel{position:relative;top:0;left:auto;right:auto;margin-top:0;width:380px;max-width:calc(100vw - 48px);display:flex;flex-direction:column;max-height:460px}
.panel-var .kepala-var{padding:12px 14px 4px}
.panel-var .kepala-var b{display:block;font-size:14px;margin-bottom:4px}
.panel-var .kepala-var p{margin:0;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.panel-var .ina-select-dropdown__options{overflow:auto;max-height:none;flex:1}
.panel-var .grup-var{font:600 11px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--ina-content-secondary);padding:10px 12px 4px}
.panel-var .opsi-var{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.panel-var .opsi-var .ina-select-dropdown__option-content{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:1;min-width:0}
.panel-var .opsi-var .ina-select-dropdown__option-label{font-size:14px;color:var(--ina-content-primary)}
.panel-var .opsi-var .c{font-size:12.5px;color:var(--ina-content-secondary)}
.panel-var .opsi-var code{flex:none;font:500 11px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}

/* kertas editor */
.kertas-wadah{border:1px solid var(--ina-stroke-primary);border-radius:0 0 10px 10px;background:var(--ina-background-secondary);padding:20px}
.kertas{background:#fff;min-height:320px;padding:28px 32px 28px 72px;border:1px solid var(--ina-stroke-primary);box-shadow:0 1px 3px rgba(0,0,0,.05);font:15px/2 "Courier New",Courier,monospace;color:#111;outline:0;text-align:justify}
.kertas:focus{border-color:var(--ina-primary-300)}
.kertas p{margin:0 0 8px}
.kertas h2,.kertas h3{font-family:inherit;margin:0 0 8px}
/* label variabel = IDDS Badge soft brand / warning; hanya tata letak di dalam baris teks yang diatur */
.var-chip.ina-badge{display:inline-flex;margin:0 1px;font-family:Inter,sans-serif;line-height:22px;vertical-align:baseline;white-space:nowrap;cursor:default}
.var-chip .vk{display:none;font:500 12px ui-monospace,Menlo,monospace}
.mode-kode .var-chip .vl{display:none}
.mode-kode .var-chip .vk{display:inline}
.var-chip.galat .vl::before{content:"⚠ "}
.ket-var{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ina-content-secondary)}
.ket-toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--ina-content-primary);cursor:pointer}
.galat-var{margin-top:12px}
.ed-kaki{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.ed-kaki .status-simpan{margin-right:auto;font-size:13px;color:var(--ina-content-secondary);display:inline-flex;align-items:center;gap:6px}
.ed-kaki .status-simpan.belum{color:var(--ina-warning-700,#6b4c00)}

/* hasil cek ejaan */
.hasil-ejaan.ina-card{display:block;width:100%;max-width:none;padding:14px 16px}
.hasil-ejaan .ina-card__content{padding:0;display:block}
.ina-modal-confirmation{max-width:560px}
.hasil-ejaan .kp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hasil-ejaan h4{margin:0;font:600 14px Inter,sans-serif;display:flex;align-items:center;gap:8px}
.hasil-ejaan .ina-card__content > p{margin:0 0 10px;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.hasil-ejaan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hasil-ejaan li{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;font-size:14px}
.hasil-ejaan .sek{font-size:12px;font-weight:600;color:var(--ina-primary-600);display:block;margin-bottom:2px}
.hasil-ejaan del{background:var(--ina-negative-50,#fef2f2);color:var(--ina-negative-600);padding:0 4px;border-radius:4px}
.hasil-ejaan ins{text-decoration:none;background:var(--ina-positive-50,#ecfdf3);color:var(--ina-content-positive);padding:0 4px;border-radius:4px}

/* pengaturan dokumen (HE-MINUTA-06) */
.atur{padding:20px 24px 24px}
.atur-ringkas{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:24px;align-items:start}
.atur-ringkas dl{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;margin:16px 0 0;font-size:14px}
.atur-ringkas dt{color:var(--ina-content-secondary)}
.atur-ringkas dd{margin:0;font-weight:500}
.halaman-mini{position:relative;width:130px;height:200px;background:#fff;border:1px solid var(--ina-stroke-secondary);box-shadow:0 2px 6px rgba(0,0,0,.08);margin:0 auto}
.halaman-mini .area{position:absolute;border:1px dashed var(--ina-primary-300);background:repeating-linear-gradient(transparent 0 7px,var(--ina-neutral-100,#f2f2f2) 7px 8px)}
.halaman-mini .jilid{position:absolute;left:4px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left top;font:600 8px Inter,sans-serif;color:var(--ina-content-secondary);letter-spacing:.5px;white-space:nowrap}
.halaman-mini + small{display:block;text-align:center;margin-top:8px;font-size:12px;color:var(--ina-content-secondary)}
.atur-grup{margin-top:20px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.atur-grup h4{margin:0 0 12px;font:600 13px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ina-text-field__suffix{font-size:13px;color:var(--ina-content-secondary);padding-right:4px}
.var-footer{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.var-footer .ina-badge{cursor:help}
.atur-kaki{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.atur-kaki .kiri{margin-right:auto}

/* preview */
.pratinjau{max-height:62vh;overflow:auto;background:var(--ina-background-secondary);padding:16px;border-radius:10px}
.pratinjau .kertas{min-height:0;cursor:default}
.pratinjau .isi-var{background:var(--ina-primary-50);border-radius:3px;padding:0 2px}
.pratinjau .isi-var.galat{background:var(--ina-warning-100);color:var(--ina-warning-700,#6b4c00)}
.pratinjau h5{margin:12px 0 4px;font:700 15px "Courier New",monospace;text-align:center}

@media (max-width:1100px){
  .ruang{grid-template-columns:1fr}
  .panel-kiri{position:static}
  .daftar-pasal{max-height:280px}
}
@media (max-width:760px){
  .det-aksi{width:100%}
  .det-aksi .ina-tooltip{flex:1 1 140px}
  .det-aksi .ina-button{width:100%;justify-content:center;white-space:nowrap}
  .kertas{text-align:left}
  .ed-kaki .status-simpan{width:100%}
  .ed-kaki .ina-button{flex:1;justify-content:center}
  .isi-ed,.atur{padding:16px}
  .kertas{padding:20px 16px 20px 28px;font-size:14px}
  .kertas-wadah{padding:10px}
  .baris2,.atur-ringkas,.g4,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .atur-ringkas dl{grid-template-columns:1fr;gap:2px}
  .atur-ringkas dd{margin-bottom:8px}
  .it-pasal .hapus{opacity:1}
  .alat .kanan-alat{margin-left:0;width:100%;justify-content:space-between}
  .pop-wadah{right:auto;left:0}
}
</style>

/* ---------------- gambar ---------------- */
function simpanDraf() {
  const ed = $('#editor'); if (!ed || !item() || !S.ubah) return;
  S.draf = { judul:$('#judulPasal').value, isi:serialisasi(ed), tampil:!!$('#tampilJudul')?.checked };
}
function serialisasi(ed) {
  const c = ed.cloneNode(true);
  c.querySelectorAll('.var-chip').forEach(v => v.replaceWith(`{{${v.dataset.var}}}`));
  return c.innerHTML;
}
function gambar() {
  simpanDraf(); gambarNav();
  $('#halaman').innerHTML = S.layar === 'daftar' ? layarDaftar() : layarDetail();
  pasangPanduan(); S.kilau = null;
}
function keDaftar() { Object.assign(S, { layar:'daftar', aktif:null, pilih:null, draf:null, ubah:false, hasil:null, galatEjaan:false, galatJudul:'', aturBuka:false }); gambar(); window.scrollTo({ top:0 }); }
function buka(kode, pilih = null, tab = 'pasal') { Object.assign(S, { layar:'detail', aktif:kode, pilih, tab, draf:null, ubah:false, hasil:null, galatEjaan:false, galatJudul:'', aturBuka:false }); gambar(); window.scrollTo({ top:0 }); }
function pilihItem(id) { Object.assign(S, { pilih:id, tab:'pasal', draf:null, ubah:false, galatJudul:'' }); gambar(); }
function tandaiUbah() {
  if (S.ubah) return; S.ubah = true;
  const st = $('#statusSimpan'); if (st) { st.classList.add('belum'); st.innerHTML = `${ik('seru', 14)} Belum disimpan`; }
  ['#simpanPasal', '#batalPasal'].forEach(s => { const b = $(s); if (b) b.disabled = false; });
}
/* jaga perubahan belum disimpan dengan IDDS Modal (HE-MINUTA-04) */
function jagaPerubahan(lanjut) {
  if (!S.ubah) { lanjut(); return; }
  simpanDraf(); const it = item(), nama = it ? (it.tipe === 'PASAL' ? `Pasal ${nomorPasal(m().naskah, it)}` : it.judul) : 'pasal';
  dialog({ judul:'Simpan perubahan dulu?', isi:`<p>Perubahan pada <b>${esc(nama)}</b> belum disimpan. Jika Anda lanjut tanpa menyimpan, perubahan tersebut akan hilang.${usulan('HE-MINUTA-04')}</p>`, konfirmasi:true,
    tombol:[['Batal','tertiary',null],['Buang Perubahan','secondary',() => { S.draf = null; S.ubah = false; lanjut(); }],['Simpan & Lanjutkan','primary',() => { if (simpanPasal() === false) return false; lanjut(); }, true]] });
}
function simpanPasal() {
  simpanDraf(); const it = item(), d = S.draf; if (!it || !d) return;
  if (!d.judul.trim()) { S.galatJudul = 'Judul wajib diisi.'; gambar(); $('#judulPasal')?.focus(); return false; }
  Object.assign(it, { judul:d.judul.trim(), isi:d.isi, tampil:d.tampil });
  S.draf = null; S.ubah = false; S.galatJudul = ''; gambar(); toast('Pasal disimpan.', 'positive');
}

/* ---------------- interaksi ---------------- */
const H = $('#halaman');
H.addEventListener('input', e => {
  const t = e.target;

H.addEventListener('change', e => {

H.addEventListener('mousedown', e => { if (e.target.closest('.btn-alat, .menu-lain button, .opsi-var')) e.preventDefault(); });
/* IDDS Toggle "Tampilkan kode variabel" */

  const tk = t.closest('[data-tabk]'); if (tk) { const k = tk.dataset.tabk; if (k !== S.tab) jagaPerubahan(() => { S.tab = k; S.draf = null; S.ubah = false; S.aturBuka = false; gambar(); }); return; }
  if (t.closest('#preview')) { jagaPerubahan(pratinjau); return; }
  if (t.closest('#cekEjaan')) { cekEjaan(); return; }
  if (t.closest('#beritahu')) { beritahu(); return; }
  if (t.closest('[data-tutup-ejaan]')) { S.hasil = null; S.galatEjaan = false; gambar(); return; }
  const bp = t.closest('[data-buka-pasal]'); if (bp) { const id = +bp.dataset.bukaPasal; jagaPerubahan(() => { pilihItem(id); $('#editor')?.scrollIntoView({ block:'center', behavior:'smooth' }); }); return; }
  const cm = t.closest('[data-cmd]'); if (cm) { jalankan(cm.dataset.cmd); return; }
  if (t.closest('#tombolVar')) { togglePop('var'); return; }
  if (t.closest('#tombolLain')) { togglePop('lain'); return; }
  const ov = t.closest('[data-sisip]'); if (ov) { sisipVar(ov.dataset.sisip); return; }
  if (t.closest('#simpanPasal')) { simpanPasal(); return; }
  if (t.closest('#batalPasal')) { S.draf = null; S.ubah = false; S.galatJudul = ''; gambar(); toast('Perubahan dibatalkan.'); return; }
  if (t.closest('#aturBuka')) { S.aturBuka = true; gambar(); return; }
  if (t.closest('#aturBatal')) { S.aturBuka = false; gambar(); return; }
  if (t.closest('#aturStandar')) { m().atur = { ...STANDAR }; S.aturBuka = false; gambar(); toast('Pengaturan dikembalikan ke standar akta PPAT.', 'positive'); return; }
  if (t.closest('#aturSimpan')) { const a = m().atur; H.querySelectorAll('[data-atur]').forEach(i => { a[i.dataset.atur] = i.value.trim().replace(',', '.') || a[i.dataset.atur]; }); a.footer = !!$('#aFooter')?.checked; S.aturBuka = false; gambar(); toast('Pengaturan dokumen disimpan untuk akta ini.', 'positive'); return; }
});
document.addEventListener('click', e => { if ($('#wadahPop') && $('#wadahPop').innerHTML && !e.target.closest('#wadahPop, #tombolVar, #tombolLain')) tutupPop(); });

/* bilah alat */
let rentang = null;
document.addEventListener('selectionchange', () => {
  const ed = $('#editor'), s = getSelection(); if (!ed || !s.rangeCount || !ed.contains(s.getRangeAt(0).commonAncestorContainer)) return;
  /* kursor tidak boleh berada di dalam label variabel (tidak dapat disunting) → pindahkan ke sesudah label */
  const dlm = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement).closest('.var-chip');
  if (dlm && s.isCollapsed) { const r = document.createRange(); r.setStartAfter(dlm); r.collapse(true); s.removeAllRanges(); s.addRange(r); return; }
  rentang = s.getRangeAt(0).cloneRange();
});
function pulihkanKursor() {
  const ed = $('#editor'); ed.focus(); const s = getSelection(); s.removeAllRanges();
  if (rentang && ed.contains(rentang.commonAncestorContainer)) s.addRange(rentang);
  else { const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); s.addRange(r); }
}
function jalankan(cmd) {
  tutupPop(); pulihkanKursor();
  if (cmd.startsWith('x:')) { toast('Alat ini tetap ada seperti di live; tidak disimulasikan di prototipe.'); return; }
  if (cmd === 'h2' || cmd === 'h3') document.execCommand('formatBlock', false, cmd); else document.execCommand(cmd, false, null);
  tandaiUbah();
}
let popAktif = null;
function tutupPop() { popAktif = null; const w = $('#wadahPop'); if (w) w.innerHTML = ''; ['#tombolVar', '#tombolLain'].forEach(s => $(s)?.setAttribute('aria-expanded', 'false')); }
function togglePop(j) {
  if (popAktif === j) { tutupPop(); return; }
  tutupPop(); popAktif = j; $(j === 'var' ? '#tombolVar' : '#tombolLain').setAttribute('aria-expanded', 'true');
  if (j === 'lain') { $('#wadahPop').innerHTML = `<div class="ina-action-dropdown pop-wadah"><div class="ina-action-dropdown__menu ina-action-dropdown__menu--visible menu-lain" role="menu" aria-label="Alat lainnya">${LAIN.map(x => x === '-' ? '<div class="ina-action-dropdown__divider" role="separator"></div>' : `<button type="button" class="ina-action-dropdown__item" role="menuitem" data-cmd="${x[0]}"><span class="ina-action-dropdown__item-content">${x[1]}</span></button>`).join('')}</div></div>`; return; }
  S.cariVar = ''; segarVar(); $('#cariVar').focus();
}
function segarVar() {
  const q = (S.cariVar || '').toLowerCase();
  const isi = VAR.map(([g, a]) => [g, a.filter(([k, l, c]) => !q || (k + l + c + g).toLowerCase().includes(q))]).filter(([, a]) => a.length);
  const w = $('#wadahPop'); if (!w) return;
  /* struktur IDDS Select Dropdown: __panel > __search > __options > __option */
  w.innerHTML = `<div class="ina-select-dropdown pop-wadah"><div class="ina-select-dropdown__panel panel-var" role="dialog" aria-label="Sisipkan variabel">
    <div class="kepala-var"><b>Sisipkan variabel</b><p>Variabel adalah isian otomatis. Saat pratinjau dan PDF dibuat, variabel diganti dengan data dari permohonan ini, misalnya nama penjual.</p></div>
    <div class="ina-select-dropdown__search"><input id="cariVar" type="search" class="ina-select-dropdown__search-input" placeholder="Cari: nama, saksi, harga…" aria-label="Cari variabel" value="${esc(S.cariVar || '')}" autocomplete="off"></div>
    <div class="ina-select-dropdown__options" role="listbox">${isi.length ? isi.map(([g, a]) => `<div class="grup-var" role="presentation">${g}</div>${a.map(([k, l, c]) => `<button type="button" class="ina-select-dropdown__option opsi-var" role="option" data-sisip="${k}"><span class="ina-select-dropdown__option-content"><span class="ina-select-dropdown__option-label">${l}</span><span class="c">Contoh: ${esc(c)}</span></span><code>{{${k}}}</code></button>`).join('')}`).join('') : '<div class="ina-select-dropdown__empty">Variabel tidak ditemukan.</div>'}</div></div></div>`;
}
function sisipVar(k) {
  tutupPop(); pulihkanKursor();
  const s = getSelection(), r = s.getRangeAt(0); r.deleteContents();
  const tmp = document.createElement('span'); tmp.innerHTML = chip(k); const n = tmp.firstChild, spasi = document.createTextNode(' ');
  r.insertNode(spasi); r.insertNode(n); r.setStartAfter(spasi); r.collapse(true); s.removeAllRanges(); s.addRange(r);
  tandaiUbah(); toast(`Variabel "${VMAP.get(k).l}" disisipkan.`, 'positive', 2000);
}

/* pasal: tambah, geser, hapus */
function tambahItem(tipe) {
  const it = { id:++idBaru, tipe, judul:tipe === 'PASAL' ? 'Pasal Baru' : 'Catatan Baru', tampil:true, isi:'' };
  m().naskah.push(it); S.kilau = it.id; pilihItem(it.id);
  $('#daftarPasal .aktif')?.scrollIntoView({ block:'nearest' });
  toast(`${tipe === 'PASAL' ? 'Pasal' : 'Catatan'} baru ditambahkan di akhir daftar. Isi judul dan isinya, lalu simpan.`, 'positive');
}
function geser(id, arah) {
  const n = m().naskah, i = n.findIndex(x => x.id === id), j = i + arah; if (j < 0 || j >= n.length) return;
  [n[i], n[j]] = [n[j], n[i]]; S.kilau = id; gambar();
}
function hapusItem(id) {
  const x = m(), it = x && x.naskah.find(y => y.id === id); if (!it) return;
  const ps = it.tipe === 'PASAL', no = ps ? nomorPasal(x.naskah, it) : 0;
  const nama = ps && it.judul !== `Pasal ${no}` ? `Pasal ${no} · ${it.judul}` : it.judul;
  dialog({ judul:`Hapus ${ps ? 'pasal' : 'catatan'}?`, isi:`<p>Hapus <b>${esc(nama)}</b> dari minuta akta? Tindakan ini tidak dapat dibatalkan.</p>${ps && no < x.naskah.filter(y => y.tipe === 'PASAL').length ? '<p>Nomor pasal sesudahnya akan bergeser naik satu.</p>' : ''}`, bahaya:true, konfirmasi:true,
    tombol:[['Batal','secondary',null],['Hapus','primary',() => {
      x.naskah = x.naskah.filter(y => y.id !== id);
      if (S.pilih === id) Object.assign(S, { pilih:null, draf:null, ubah:false });
      gambar();
      toast(`${esc(nama)} dihapus.`, 'positive', 5000, ps ? 'Nomor pasal lain sudah disesuaikan.' : '');
    }]] });
}

/* tombol atas */
function tunggu(id, ms, lalu) { S.memuat = id; gambar(); setTimeout(() => { S.memuat = ''; lalu(); }, ms); }
const TYPO = [['pembelli', 'pembeli'], ['menerangkn', 'menerangkan'], ['dihadapan', 'di hadapan']];
function cekEjaan() {
  jagaPerubahan(() => tunggu('cekEjaan', 900, () => {
    if (!S.ejaanAktif) { S.hasil = null; S.galatEjaan = true; gambar(); $('#hasilEjaan')?.scrollIntoView({ block:'center', behavior:'smooth' }); return; }
    const n = m().naskah, h = [];
    n.forEach(it => TYPO.forEach(([s, b]) => { if (new RegExp(`\\b${s}\\b`).test(it.isi)) h.push({ id:it.id, bagian:it.tipe === 'PASAL' ? `Pasal ${nomorPasal(n, it)}` : it.judul, salah:s, benar:b }); }));
    S.galatEjaan = false; S.hasil = h; gambar(); toast(h.length ? `${h.length} temuan ejaan.` : 'Tidak ada salah ketik yang ditemukan.', 'positive');
  }));
}
function beritahu() { jagaPerubahan(() => tunggu('beritahu', 800, () => { gambar(); toast('PPAT sudah diberitahu bahwa minuta siap difinalisasi.', 'positive'); })); }
function pratinjau() {
  const n = m().naskah;
  const isi = n.map(it => `${it.tampil ? `<h5>${esc(it.tipe === 'PASAL' ? `Pasal ${nomorPasal(n, it)}` : it.judul)}</h5>` : ''}${it.isi.replace(RE_VAR, (x, k) => VMAP.has(k) ? `<span class="isi-var">${esc(VMAP.get(k).c)}</span>` : `<span class="isi-var galat" title="Variabel tidak dikenal">{{${esc(k)}}}</span>`)}`).join('');
  dialog({ judul:`Pratinjau Akta · ${m().kode}`, lebar:true, isi:`<p>Bagian berlatar hijau adalah data yang terisi otomatis dari permohonan. Bagian kuning adalah variabel yang tidak dikenal.</p><div class="pratinjau"><div class="kertas">${isi}</div></div>`, tombol:[['Tutup','secondary',null],['Unduh PDF','primary',() => toast('Unduh PDF tidak disimulasikan di prototipe.')]] });
}

/* ---------------- tombol Bantuan di judul halaman (HE-UMUM-02) ---------------- */
function pasangPanduan() {
  const h = document.querySelector('#halaman h1'); if (!h || h.parentElement.classList.contains('judul-kiri')) return;
  const w = document.createElement('div'); w.className = 'judul-halaman';
  const kiri = document.createElement('div'); kiri.className = 'judul-kiri';
  const sub = h.nextElementSibling && h.nextElementSibling.classList.contains('sub') ? h.nextElementSibling : null;
  h.before(w); w.append(kiri); kiri.append(h); if (sub) kiri.append(sub);
  w.insertAdjacentHTML('beforeend', `<button type="button" class="ina-button ina-button--secondary ina-button--md ditandai" id="bukaBantuan" aria-label="Bantuan untuk halaman ini"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>Bantuan</span></button>`);
}
document.addEventListener('click', e => { if (e.target.closest('#bukaBantuan')) bukaBantuan(); });

/* ---------------- IDDS Drawer (Bantuan, HE-UMUM-02) ---------------- */

/* ---------------- IDDS Modal & Toast ---------------- */
function dialog({ judul, isi, tombol: tb, lebar, kunciUtama, bahaya, konfirmasi }) {
  const L = $('#lapisan');
  /* konfirmasi = varian IDDS Modal Confirmation (hapus, perubahan belum disimpan) */
  L.innerHTML = `<div class="ina-modal"><div class="ina-modal__backdrop" data-i="-1"></div><div class="ina-modal__container">
    <div class="ina-modal__dialog ina-modal__dialog--size-${lebar ? 'lg' : 'md'} ${konfirmasi ? 'ina-modal-confirmation' : ''}" role="${konfirmasi ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgJudul">
      <div class="ina-modal__header"><h2 class="ina-modal__title" id="dlgJudul">${judul}</h2><button type="button" class="ina-modal__close-button" aria-label="Tutup dialog" data-i="-1">${ik('x', 22)}</button></div>
      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md" data-i="${i}" ${bahaya && i === tb.length - 1 ? 'style="background:var(--ina-negative-600);border-color:var(--ina-negative-600)"' : ''}>${t}</button>`).join('')}</div></div></div></div>`;
  L.querySelector('.ina-modal__footer .ina-button:last-child').focus();
  L.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i;
    if (i < 0) { L.innerHTML = ''; return; }
    const [, , fn, tahan] = tb[i];
    L.innerHTML = '';
    const r = fn ? fn() : undefined;
    if (tahan && r === false) { /* dialog sudah ditutup; galat ditampilkan di layar */ }
  };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisan').innerHTML) $('#lapisan').innerHTML = ''; });
let tt;
function toast(teks, state = 'default', ms = 3000, ket = '') {
  $('#toastWadah').innerHTML = `<div class="ina-toast ina-toast--state-${state} ina-toast--style-solid ina-toast--visible" role="status"><div class="ina-toast__icon">${ik(state === 'positive' ? 'centang' : 'info', 20)}</div>
    <div class="ina-toast__content"><div class="ina-toast__text-area"><p class="ina-toast__title">${teks}</p>${ket ? `<p class="ina-toast__description">${ket}</p>` : ''}</div></div><button class="ina-toast__close-button" aria-label="Tutup notifikasi" data-tutup-toast>${ik('x', 16)}</button></div>`;
  clearTimeout(tt); tt = setTimeout(() => $('#toastWadah').innerHTML = '', ms);
}
$('#toastWadah').addEventListener('click', e => { if (e.target.closest('[data-tutup-toast]')) $('#toastWadah').innerHTML = ''; });

/* ---------------- Bantuan (HE-UMUM-02) ---------------- */
const faq = (i, q, a) => `<div class="ina-accordion"><button type="button" class="ina-accordion__toggle" aria-expanded="false" aria-controls="faq-${i}"><div class="ina-accordion__title">${q}</div><div class="ina-accordion__toggler"><svg class="ina-accordion__icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></button><div id="faq-${i}" class="ina-accordion__content"><div class="ina-accordion__body"><p>${a}</p></div></div></div>`;
function bukaBantuan() {
  drawer({ judul:'Bantuan Penyusunan Akta', isi:`
    <p>Panduan singkat menyusun naskah minuta akta sebelum difinalisasi oleh PPAT.</p>
    <ol class="bantu-langkah">
      <li><b>Buka minuta</b> berstatus Penyusunan dari daftar.</li>
      <li><b>Pilih pasal atau catatan</b> di panel kiri, lalu sunting judul dan isinya.</li>
      <li><b>Sisipkan variabel</b> untuk data yang terisi otomatis, misalnya nama penjual atau harga.</li>
      <li><b>Simpan</b> setiap pasal yang diubah.</li>
      <li><b>Cek Ejaan</b> dan <b>Pratinjau Akta</b> untuk memeriksa hasil akhir.</li>
      <li><b>Beritahu PPAT</b> bahwa minuta siap difinalisasi.</li>
    </ol>
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${faq(1, 'Apa beda pasal dan catatan?', 'Pasal diberi nomor otomatis sesuai urutannya. Catatan adalah bagian tanpa nomor, seperti pembukaan akta, para pihak, objek, para saksi, dan penutup.')}
    ${faq(2, 'Apa itu variabel?', 'Variabel adalah isian otomatis, misalnya "Nama Lengkap Penjual". Di editor variabel tampil sebagai label hijau. Saat pratinjau dan PDF dibuat, label diganti dengan data dari permohonan. Label kuning berarti variabel tidak dikenal dan tidak akan terisi.')}
    ${faq(3, 'Mengapa Cek Ejaan tidak dapat digunakan?', 'Fitur Cek Ejaan perlu diaktifkan oleh admin sistem. Selama belum aktif, Anda tetap dapat menyunting dan menyimpan pasal seperti biasa.')}
    ${faq(4, 'Apakah pasal yang terhapus bisa dikembalikan?', 'Tidak. Tambahkan kembali lewat tombol Tambah Pasal, lalu isi ulang judul dan isinya. Nomor pasal lain menyesuaikan secara otomatis.')}
    ${faq(5, 'Siapa yang memfinalisasi akta?', 'PPAT. Asisten menyusun naskah, lalu menekan Beritahu PPAT. PPAT memeriksa, mengisi nomor dan tanggal akta, kemudian memfinalisasi. Setelah final, pasal tidak dapat diubah.')}
    <h4 class="bantu-sub">Kontak dukungan ${usulan('HE-UMUM-02')}</h4>

}

/* ---------------- daftar perubahan ---------------- */
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar perubahan Penyusunan Akta', lebar:true,
    isi:`<p>Usulan disusun dari laporan Heuristic Evaluation INA Digital, halaman 25–27 (skor halaman 47,1), beserta gambar buktinya. Fitur dan alur live tetap; yang diubah adalah kejelasan istilah, kepadatan editor, panduan, dan umpan balik. Daftar yang sama ada di spreadsheet Backlog-HE-EPPAT-Peruri.xlsx.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup','secondary',null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => {
    const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]);
  });
});
function lihat(u) {
  S.ubah = false; S.draf = null;
  if (u.ke === 'bantuan') { if (S.layar !== 'detail') buka('ORD-CONTOH-004'); bukaBantuan(); return; }
  if (u.ke === 'editor') buka('ORD-CONTOH-004', 4);
  if (u.ke === 'variabel') { buka('ORD-CONTOH-004', 2); togglePop('var'); }
  if (u.ke === 'pengaturan') buka('ORD-CONTOH-004', null, 'atur');
  if (u.ke === 'ejaan-galat') { setEjaan(false); buka('ORD-CONTOH-004', 4); cekEjaan(); return; }
  if (u.ke === 'hapus') { const ps = MINUTA.find(x => x.kode === 'ORD-CONTOH-004').naskah.filter(x => x.tipe === 'PASAL').pop(); if (!ps) { buka('ORD-CONTOH-004'); return; } buka('ORD-CONTOH-004', ps.id); hapusItem(ps.id); return; }
  const el = u.sorot && $(u.sorot);
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}
function setEjaan(aktif) { S.ejaanAktif = aktif; document.querySelectorAll('[data-ejaan]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.ejaan === 'aktif') === aktif))); }
document.querySelectorAll('[data-ejaan]').forEach(b => b.addEventListener('click', () => { setEjaan(b.dataset.ejaan === 'aktif'); S.hasil = null; S.galatEjaan = false; if (S.layar === 'detail') gambar(); toast(S.ejaanAktif ? 'Simulasi: Cek Ejaan aktif.' : 'Simulasi: Cek Ejaan belum diaktifkan admin.'); }));
$('#aturUlang').addEventListener('click', () => { MINUTA = contoh(); S.ubah = false; S.draf = null; S.cari = ''; S.filter = ''; keDaftar(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
window.addEventListener('beforeunload', e => { if (S.ubah) { e.preventDefault(); e.returnValue = ''; } });
gambar();
})();
</script>
