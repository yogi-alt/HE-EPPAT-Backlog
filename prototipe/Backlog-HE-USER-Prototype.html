<!doctype html>
<html lang="id" data-brand="eppat" data-theme="light">
<head>
<!-- ===== Pilihan tema prototipe (tema-proto.html, disisipkan rakit-idds.js ke setiap prototipe ber-IDDS) =====
     Alat diskusi internal: membandingkan tiga tema yang dikonfirmasi Peruri (penyedia IDDS):
       E-PPAT  → <html data-brand="eppat">  (brand kustom, brand-eppat-idds/eppat.css)
       INAgov  → <html data-brand="inagov"> (brand bawaan IDDS @idds/styles)
       Default → tanpa data-brand            (warna netral bawaan IDDS)
     Pilihan disimpan di localStorage "eppat-tema-proto" sehingga ikut terbawa saat berpindah prototipe.
     Bagian KEPALA (style + skrip awal) disisipkan tepat setelah <head> agar tema terpasang sebelum halaman tergambar;
     bagian BADAN (skrip pil di protobar) disisipkan sebelum </body>. -->
<style id="tema-proto-css">
/* Token kustom E-PPAT (bukan token IDDS) untuk tema INAgov & Default: kerangka memakai warna netral IDDS,
   menu aktif memakai warna utama brand aktif, kartu kantor memakai latar netral terang (bukan emas E-PPAT). */
html:not([data-brand='eppat']){
  --ina-eppat-sidebar-bg: var(--ina-neutral-900);
  --ina-eppat-sidebar-hover: var(--ina-neutral-700);
  --ina-eppat-sidebar-active: var(--ina-primary-500);
  --ina-eppat-sidebar-content: rgba(255, 255, 255, 0.8);
  --ina-eppat-office-card: var(--ina-neutral-50);
  --ina-eppat-stroke-brand: var(--ina-stroke-primary);
  --ina-eppat-surface-cream: var(--ina-primary-50);
  --eppat-sidebar-icon: var(--ina-eppat-sidebar-content);
  --eppat-sidebar-active-icon: #ffffff;
}
/* Penyesuaian kontras WCAG 2.2 AA yang sama dengan eppat.css (bukan warna brand) agar tetap berlaku di tema lain */
html:not([data-brand='eppat']) .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__label,
html:not([data-brand='eppat']) .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__icon-wrapper { color: var(--ina-content-secondary); }
html:not([data-brand='eppat']) .ina-text-field__required,
html:not([data-brand='eppat']) .ina-text-area__required,
html:not([data-brand='eppat']) .ina-select-dropdown__required,
html:not([data-brand='eppat']) .ina-password-input__required,
html:not([data-brand='eppat']) .ina-input-search__asterisk { color: var(--ina-negative-600); }
html:not([data-brand='eppat']) .ina-select-dropdown__trigger-text--placeholder,
html:not([data-brand='eppat']) .ina-date-picker__trigger-text--placeholder { color: var(--ina-content-secondary) !important; }
html:not([data-brand='eppat']) .ina-alert--caution .ina-alert__title { color: var(--ina-warning-600); }
html:not([data-brand='eppat']) .ina-alert--info .ina-alert__title { color: var(--ina-guide-600); }
html:not([data-brand='eppat']) .ina-alert--critical .ina-alert__title { color: var(--ina-negative-600); }
html:not([data-brand='eppat']) .ina-one-time-password__helper-text--error,
html:not([data-brand='eppat']) .ina-text-area__helper-text--error,
html:not([data-brand='eppat']) .ina-phone-input__helper-text--error,
html:not([data-brand='eppat']) .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--error,
html:not([data-brand='eppat']) .ina-file-upload__file-error,
html:not([data-brand='eppat']) .ina-file-upload__file--error .ina-file-upload__file-name,
html:not([data-brand='eppat']) .ina-file-upload__error-message,
html:not([data-brand='eppat']) .ina-password-input__status-message--error,
html:not([data-brand='eppat']) .ina-password-input .ina-password-input__status-area .ina-password-input__status-message.ina-password-input__status-message--error,
html:not([data-brand='eppat']) .ina-password-input__character-count--error { color: var(--ina-negative-600); }
html:not([data-brand='eppat']) .ina-file-upload__error-message:empty { display: none; }
html:not([data-brand='eppat']) .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--warning,
html:not([data-brand='eppat']) .ina-text-area__helper-text--warning,
html:not([data-brand='eppat']) .ina-password-input__status-message--warning,
html:not([data-brand='eppat']) .ina-password-input__character-count--warning { color: var(--ina-warning-600); }
html:not([data-brand='eppat']) .ina-password-input__status-message--success { color: var(--ina-content-positive); }
/* INAgov: IDDS Badge soft "brand" memakai primary-primary #196BCD di atas primary-100 (3,6:1) → primary-600 #0A489F (keluarga warna sama) */
[data-brand='inagov'] .ina-badge--soft.ina-badge--brand { color: var(--ina-primary-600); }
/* pil tema di protobar */
.protobar .tema-proto{display:inline-flex;gap:4px;flex-wrap:wrap}
/* INAgov & Default: tanpa latar bergambar khas E-PPAT (gradasi + watermark IPPAT); latar polos netral IDDS */
html:not([data-brand='eppat']) .content,html:not([data-brand='eppat']) main.tn{background-image:none!important;background-color:var(--ina-background-secondary)!important}
</style>
<script id="tema-proto-awal">
(() => {
  let t = 'eppat';
  try { t = localStorage.getItem('eppat-tema-proto') || 'eppat'; } catch (e) {}
  const h = document.documentElement;
  if (t === 'inagov') h.setAttribute('data-brand', 'inagov');
  else if (t === 'default') h.removeAttribute('data-brand');
  else h.setAttribute('data-brand', 'eppat');
})();
</script>

<!-- Brand mode E-PPAT (brand-eppat-idds/eppat.css) -->
<style id="brand-eppat">
/**
 * E-PPAT Brand Theme untuk INA Digital Design System (IDDS)
 * --------------------------------------------------------------------------
 * Format mengikuti brand bawaan IDDS (@idds/styles: [data-brand='inagov'], 'panrb', dll.).
 * Hanya token brand (primary, secondary, hover) yang diganti; warna netral, sentimen
 * (positive/negative/warning/guide), tipografi, spacing, dan komponen tetap milik IDDS.
 *
 * Pemakaian:
 *   1. import '@idds/react/index.css'            (atau @idds/styles/dist/index.css)
 *   2. import './eppat.css'                       (berkas ini, SETELAH CSS IDDS)
 *   3. document.documentElement.setAttribute('data-brand', 'eppat')
 *      — atau setCustomTheme(eppatTheme) dari eppat-theme.ts (tanpa dukungan mode gelap)
 *
 * Sumber warna: tema aktif E-PPAT (CMS › Setting Theme) di dev-app.eppat.id, dibaca 23 Okt 2026:
 *   --eppat-brand-rgb 61 107 94 (#3D6B5E), --eppat-brand-hover-rgb 52 93 82 (#345D52),
 *   --eppat-sidebar-bg #2C3C42, --eppat-sidebar-hover #3A4D54, --eppat-line-sand-rgb 210 221 217,
 *   --eppat-paper-cream-rgb 238 243 241, --eppat-paper-vanilla-rgb 245 248 247, kartu kantor #DAC999.
 * Kontras (WCAG 2.2): teks putih di atas primary-500 #3D6B5E = 6,06:1 (AA); hover #345D52 = 7,41:1;
 *   primary-400 #4E7C6F = 4,73:1 (dipakai sebagai warna utama mode gelap).
 */

/* E-PPAT Theme - Pejabat Pembuat Akta Tanah */
[data-brand='eppat'] {
  /* Primary Colors - Hijau E-PPAT */
  --ina-primary-25: #f5f8f7;
  --ina-primary-50: #eef3f1;
  --ina-primary-100: #dde5e2;
  --ina-primary-200: #c2d3cc;
  --ina-primary-300: #9db8ae;
  --ina-primary-400: #4e7c6f;
  --ina-primary-500: #3d6b5e;
  --ina-primary-600: #345d52;
  --ina-primary-700: #2a4b42;
  --ina-primary-800: #1d3530;
  --ina-primary-900: #0f1c19;
  --ina-primary-primary: #3d6b5e;

  /* Secondary Colors - Emas kartu kantor E-PPAT */
  --ina-secondary-25: #fcfbf6;
  --ina-secondary-50: #f8f4e7;
  --ina-secondary-100: #f0e8cc;
  --ina-secondary-200: #e6dab2;
  --ina-secondary-300: #dac999;
  --ina-secondary-400: #c7b077;
  --ina-secondary-500: #ae9358;
  --ina-secondary-600: #8c7444;
  --ina-secondary-700: #6a5733;
  --ina-secondary-800: #483b23;
  --ina-secondary-900: #272013;

  /* Accent Colors (legacy IDDS, disamakan dengan secondary) */
  --ina-accent-100: #fcfbf6 !important;
  --ina-accent-200: #f8f4e7 !important;
  --ina-accent-300: #f0e8cc !important;
  --ina-accent-400: #e6dab2 !important;
  --ina-accent-500: #dac999 !important;
  --ina-accent-600: #ae9358 !important;
  --ina-accent-700: #6a5733 !important;

  /* Interactive Colors */
  --ina-brand-primary: #3d6b5e;
  --ina-brand-hover: #345d52 !important;
  --ina-neutral-hover: var(--ina-neutral-100) !important;

  /* Brand-specific colors (seperti --ina-bgn-brand-primary pada brand BGN) */
  --ina-eppat-sidebar-bg: #2c3c42;
  --ina-eppat-sidebar-hover: #3a4d54;
  --ina-eppat-sidebar-active: var(--ina-primary-500);
  --ina-eppat-sidebar-content: rgba(255, 255, 255, 0.8);
  --ina-eppat-office-card: var(--ina-secondary-300);
  --ina-eppat-stroke-brand: #d2ddd9;
  --ina-eppat-surface-cream: var(--ina-primary-50);
}

/* Aksen komponen mengikuti brand E-PPAT.
   IDDS memakai biru "guide" atau hitam untuk elemen penunjuk berikut; di E-PPAT diganti hijau brand.
   Warna status (positive/negative/warning/info pada Alert, Badge, Toast) TIDAK diubah. */
[data-brand='eppat'] .ina-button.ina-button--link { color: var(--ina-primary-500) !important; }
[data-brand='eppat'] .ina-button--link:hover:not(:disabled),
[data-brand='eppat'] .ina-button--link:focus:not(:disabled) { color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-stepper__item--active .ina-stepper__icon-wrapper {
  border-color: var(--ina-primary-500); color: var(--ina-primary-500); background-color: var(--ina-primary-50);
}
[data-brand='eppat'] .ina-stepper__item--active .ina-stepper__label { color: var(--ina-primary-500); }
[data-brand='eppat'] .ina-stepper__item--completed .ina-stepper__icon-wrapper {
  border-color: var(--ina-primary-500); color: #fff; background-color: var(--ina-primary-500);
}
[data-brand='eppat'] .ina-stepper__item--completed .ina-stepper__label { color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-stepper__separator--completed { background-color: var(--ina-primary-500); }
[data-brand='eppat'] .ina-checkbox__box--checked {
  background-color: var(--ina-primary-500); border-color: var(--ina-primary-500);
  box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 2px var(--ina-primary-500);
}
[data-brand='eppat'] .ina-pagination__page-button--active { border-color: var(--ina-primary-500); color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-breadcrumb__link--active { color: var(--ina-primary-600); }

/* Penyesuaian kontras (WCAG 2.2 AA, minimal 4,5:1 untuk teks biasa).
   Warna bawaan IDDS berikut di bawah standar pada latar terang; diganti dengan corak lebih gelap
   dari keluarga warna yang SAMA sehingga arti warna tidak berubah. */
[data-brand='eppat'] .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__label,
[data-brand='eppat'] .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__icon-wrapper {
  color: var(--ina-content-secondary);                  /* #a3a3a3 2,5:1 → #525252 7,8:1 */
}
[data-brand='eppat'] .ina-text-field__required,
[data-brand='eppat'] .ina-text-area__required,
[data-brand='eppat'] .ina-select-dropdown__required,
[data-brand='eppat'] .ina-password-input__required,
[data-brand='eppat'] .ina-input-search__asterisk { color: var(--ina-negative-600); }      /* #f02d2d 4,1:1 → #d50b0b */
[data-brand='eppat'] .ina-select-dropdown__trigger-text--placeholder,
[data-brand='eppat'] .ina-date-picker__trigger-text--placeholder { color: var(--ina-content-secondary) !important; } /* IDDS memakai !important */
[data-brand='eppat'] .ina-alert--caution .ina-alert__title { color: var(--ina-warning-600); } /* #eebb04 1,7:1 → #855f00 */
[data-brand='eppat'] .ina-alert--info .ina-alert__title { color: var(--ina-guide-600); }
[data-brand='eppat'] .ina-alert--critical .ina-alert__title { color: var(--ina-negative-600); } /* #f02d2d 3,6:1 di atas latar alert → #d50b0b */
/* teks galat isian (#f02d2d 4,1:1 → negative-600 #d50b0b) */
[data-brand='eppat'] .ina-one-time-password__helper-text--error,
[data-brand='eppat'] .ina-text-area__helper-text--error,
[data-brand='eppat'] .ina-phone-input__helper-text--error,
[data-brand='eppat'] .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--error,
[data-brand='eppat'] .ina-file-upload__file-error,
[data-brand='eppat'] .ina-file-upload__file--error .ina-file-upload__file-name,
[data-brand='eppat'] .ina-file-upload__error-message { color: var(--ina-negative-600); }
[data-brand='eppat'] .ina-file-upload__error-message:empty { display: none; }
[data-brand='eppat'] .ina-password-input__status-message--error,
[data-brand='eppat'] .ina-password-input .ina-password-input__status-area .ina-password-input__status-message.ina-password-input__status-message--error,
[data-brand='eppat'] .ina-password-input__character-count--error { color: var(--ina-negative-600); }
/* teks peringatan isian (#eebb04 1,8:1 → warning-600) */
[data-brand='eppat'] .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--warning,
[data-brand='eppat'] .ina-text-area__helper-text--warning,
[data-brand='eppat'] .ina-password-input__status-message--warning,
[data-brand='eppat'] .ina-password-input__character-count--warning { color: var(--ina-warning-600); }
[data-brand='eppat'] .ina-password-input__status-message--success { color: var(--ina-content-positive); }

/* E-PPAT Dark Mode Overrides */
[data-theme='dark'][data-brand='eppat'] {
  --ina-primary-primary: var(--ina-primary-400);
  --ina-brand-hover: var(--ina-primary-500) !important;
  --ina-neutral-hover: var(--ina-neutral-800) !important;
  --ina-eppat-sidebar-bg: #141c1f;
  --ina-eppat-sidebar-hover: #22302d;
  --ina-eppat-sidebar-active: var(--ina-primary-400);
  --ina-eppat-stroke-brand: #2a3a36;
  --ina-eppat-surface-cream: #18211f;
}

<style id="kerangka-css">
/* ===== Order AJB — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 23–24 (HE-ORDER-01…05)
   Kerangka & teks mengikuti layar live Peruri (dilihat 23 Okt 2026, akun Asisten). ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ina-content-primary);background:var(--ina-background-secondary);-webkit-font-smoothing:antialiased}

/* protobar (khusus prototipe) */
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#0f1a17;color:#E6EDEA;font-size:12px;position:relative;z-index:60}
.protobar a{color:#E6EDEA;text-decoration:none;border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:500 11px Inter,sans-serif}
.protobar b{color:#fff}
.protobar .sep{opacity:.6}
.protobar button.pil{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
.protobar button.pil[aria-pressed="true"]{background:#3D6B5E;border-color:#3D6B5E;color:#fff}
.protobar .kanan{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
.protobar .utama{background:#3D6B5E!important;border-color:#3D6B5E!important;color:#fff!important;font-weight:600!important}
.tag-usulan{display:none!important;align-items:center;font:600 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.penanda .tag-usulan{display:inline-flex!important}
body.penanda .ditandai{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px;border-radius:10px}
.sorot{outline:3px solid #2563EB!important;outline-offset:4px;border-radius:12px}

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:currentColor}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu color family dengan teks menunya (aturan warna IDDS: teks & ikon dari family yang sama) — token tetap dapat diatur dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:var(--ina-eppat-sidebar-content);--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}

.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item:hover svg,.sidebar .items a.nav-item:focus-visible svg{color:#fff}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}

.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}

/* daftar order */
.daftar-atas{display:flex;justify-content:flex-end;margin-top:20px}
.saring{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end;margin-top:16px}
.saring .ina-text-field__label{display:block}
.saring .cari-wadah .ina-input-search{width:100%;margin-top:6px} /* IDDS Input Search, sama dengan Minuta & Verifikasi */
.tabel-wadah{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tabel-gulir{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tabel-wadah .ina-table{border:0;border-radius:0}
table.tb td{vertical-align:middle}
table.tb td .kd{font-weight:600;color:var(--ina-primary-primary);cursor:pointer}
table.tb td .kc{font-size:12px;color:var(--ina-content-secondary)}
table.tb tr.klik{cursor:pointer}
table.tb tr.klik:hover td{background:var(--ina-primary-25)}
.aksi-baris{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kosong{padding:28px;text-align:center;color:var(--ina-content-secondary)}
.halaman{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ina-stroke-primary);font-size:13px;color:var(--ina-content-secondary)}
.halaman > span{white-space:nowrap}
[data-merah]{color:var(--ina-negative-600)!important}
.tb .ina-table__cell,.tb .ina-table__header-cell{padding:12px 16px}
.tb .ina-table__cell{white-space:normal}
.lengkap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lengkap.ok{color:var(--ina-content-positive)}
.lengkap.kurang{color:var(--ina-content-secondary)}
.lengkap svg{flex:none}

/* detail order */
.det-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kepala .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);margin-top:12px}
.det-kepala h2{margin:2px 0 0;font:600 20px/28px Inter,sans-serif}
.status-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px 28px}
.status-kartu .ina-stepper{align-items:flex-start;min-height:92px;padding:4px 64px 0}
.status-kartu .ina-stepper__separator{align-self:flex-start;margin-top:11px}
.status-kartu .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.status-kaki{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ina-stroke-primary);margin-top:8px;padding-top:16px}
.status-kaki p{margin:0;font-size:14px;color:var(--ina-content-secondary)}
.status-kaki p b{color:var(--ina-content-primary)}
.status-kaki .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-kaki .alasan{font-size:12.5px;color:var(--ina-content-secondary)}
.syarat{margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.syarat h4{margin:0 0 10px;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syarat h4 .hit{font-weight:500;color:var(--ina-content-secondary)}
.syarat ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.syarat li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.syarat li .ik{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none}
.syarat li.ok .ik{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.syarat li.kurang .ik{background:var(--ina-warning-100);color:var(--ina-warning-600)}
.syarat li.ok span.t{color:var(--ina-content-secondary)}
.syarat li .ina-button{padding:0;height:auto;min-height:0}
.syarat-alert{margin-top:16px}
.syarat-alert .ina-alert__description{display:flex;flex-direction:column;gap:10px}
.syarat-daftar{display:flex;flex-wrap:wrap;gap:8px 16px}
.syarat-item{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-badge{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-button{padding:0 4px}
.langkah-berikut{color:var(--ina-content-primary)}
.info-baris{margin-top:16px}
.info-baris .ina-alert__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
.info-baris .ina-alert__text-section{flex:1;min-width:220px}

.tab-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tab-kartu > .ina-tab-horizontal{padding:0 12px;border-bottom:1px solid var(--ina-stroke-primary)}
.tab-kartu .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center}
.tab-kartu .tanda{font:600 11px Inter,sans-serif;border-radius:999px;padding:1px 7px}
.tab-kartu .tanda.ok{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.tab-kartu .tanda.kurang{background:var(--ina-warning-100);color:var(--ina-warning-700)}
.tab-kartu .tanda.netral{background:var(--ina-neutral-100);color:var(--ina-content-secondary)}
.tab-isi{padding:20px}
.tab-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tab-bar p{margin:0;font-size:13px;color:var(--ina-content-secondary)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-field textarea.ina-text-field__input{min-height:80px;resize:vertical;padding:0}
.f-kaki{display:flex;justify-content:flex-end;margin-top:16px}
.tb .nm{font-weight:500}
.tb .sub2{font-size:12px;color:var(--ina-content-secondary)}
.kunci{margin-bottom:16px}

/* dialog */
.ina-modal__body p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary)}
.seg button{border:0;border-radius:7px;background:transparent;padding:7px 14px;font:500 14px Inter,sans-serif;color:var(--ina-content-secondary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ina-primary-primary);color:#fff}
.fld{margin-bottom:16px}
.fld > .ina-text-field__label{display:flex;align-items:center;gap:6px}
.select-wadah{position:relative;display:block;width:100%}
.select-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:0;max-height:240px}
.cari-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.1);padding:4px;max-height:220px;overflow:auto}
.cari-panel button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.cari-panel button:hover{background:var(--ina-background-tertiary)}
.cari-panel small{display:block;font-size:12px;color:var(--ina-content-secondary)}
.kartu-pihak{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px;background:var(--ina-background-secondary);font-size:13.5px}
.kartu-pihak b{display:block;font-size:14px;margin-bottom:6px}
.kartu-pihak dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.kartu-pihak dt{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu-pihak dd{margin:0}
.belum-ada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ina-primary-25);border:1px solid var(--ina-primary-100);font-size:13px}
.ringkas-kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:12px 0 14px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas-kv dt{color:var(--ina-content-secondary)}
.ringkas-kv dd{margin:0;font-weight:500}
.cek-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;cursor:pointer}

.daftar-ubah{display:flex;flex-direction:column;gap:10px}
.daftar-ubah .it{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px}
.daftar-ubah .it .a{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daftar-ubah .it code{font:600 11.5px ui-monospace,Menlo,monospace;color:#2563EB}
.daftar-ubah .it b{font-size:14px}
.daftar-ubah .it p{margin:6px 0 4px;font-size:13px;line-height:19px;color:var(--ina-content-primary)}
.daftar-ubah .it .lama{font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.bantu-langkah{margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.bantu-langkah li{margin-bottom:6px}
.bantu-sub{margin:18px 0 8px;font:600 14px Inter,sans-serif;display:flex;align-items:center}
.bantu-faq{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.bantu-faq summary{cursor:pointer;font-weight:500}
.bantu-faq p{margin:8px 0 0!important}
.bantu-kontak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bantu-kontak div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.bantu-kontak b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.bantu-kontak span{font-size:14px}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.toast-wadah{position:fixed;bottom:24px;right:24px;z-index:100;max-width:calc(100vw - 32px)}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--ina-stroke-secondary);color:var(--ina-content-secondary);font:600 10px Inter,sans-serif;cursor:help;background:transparent;padding:0}
.ina-tooltip__bubble{max-width:260px;white-space:normal}

@media (max-width:1024px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,26,23,.45);z-index:35;opacity:0;pointer-events:none;transition:.22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .syarat ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  header.top{padding:0 16px}
  .user .txt,#bukaBantuan span{display:none}
  .page{padding:20px 16px 40px}
  h1{font-size:23px;line-height:32px}
  .saring{grid-template-columns:1fr}
  .f-grid,.syarat ul,.kartu-pihak dl,.bantu-kontak{grid-template-columns:1fr}
  .status-kartu{padding:18px 16px}
  .status-kartu .stepper-h{display:none}
  .status-kartu .stepper-v{display:flex!important;padding:4px 0}
  .ringkas-kv{grid-template-columns:1fr;gap:2px}
  .protobar .kanan{margin-left:0}
  table.tb thead{display:none}
  table.tb tr{display:block;border-top:1px solid var(--ina-stroke-primary);padding:8px 0}
  table.tb td{display:block;border:0;padding:4px 16px}
  .aksi-baris{justify-content:flex-start}
}
.status-kartu .stepper-v{display:none}
.status-kartu .stepper-v .ina-stepper__label small{display:inline;margin:0 0 0 8px}
.status-kartu .stepper-v .ina-stepper__separator{min-height:24px;height:24px}
</style>
<style id="user-css">
/* ===== Daftar User (Super Admin) — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital (skor 79,5; rincian di UX Metric Lab, Highlight #9) (HE-USER-01…04, HE-UMUM-03)
   Kerangka, kolom, menu aksi, dialog, dan teks mengikuti kode live Peruri. Data contoh sama dengan prototipe Order AJB, Verifikasi, dan E-Akta Wizard. ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45;font-weight:400;text-transform:none;letter-spacing:0}
.istilah{border-bottom:1px dashed currentColor;cursor:help}
.ina-modal-confirmation{max-width:560px}
.ingat{margin-top:20px}
.ingat .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.ingat .ina-alert__text-section{flex:1;min-width:240px}

/* alat daftar (live: status, peran, jumlah, cari, Tambah User) */
.alat{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px}
.alat .kiri,.alat .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alat .jumlah{font-size:13px;color:var(--ina-content-secondary)}
.alat .ina-input-search{width:240px}
.pilih-wadah{position:relative}
.pilih-wadah .ina-select-dropdown__trigger{min-width:160px}
.pilih-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:auto;min-width:180px;z-index:20}
/* aksi massal (HE-USER-02) */
.massal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 16px;border-radius:12px;background:var(--ina-primary-50,#eaf2ef);border:1px solid var(--ina-primary-200,#cfe3dc);font-size:14px}
.massal b{margin-right:auto}
td.cek-sel,th.cek-sel{width:44px}
.ina-checkbox.sel{display:inline-flex;cursor:pointer}
.nm-user{font-weight:600;color:var(--ina-primary-primary)}
.kd-user{font:11px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}
.sel-email{font-size:13px;color:var(--ina-content-secondary)}
.aksi-wadah{position:relative;display:inline-block}
.aksi-wadah .ina-action-dropdown__menu{position:absolute;right:0;left:auto;top:calc(100% + 4px);min-width:190px;z-index:30;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.aksi-wadah .ikon-aksi{width:32px;height:32px;padding:0;justify-content:center}
tr.dipilih td{background:var(--ina-primary-25,#f4faf7)}
.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}

/* formulir */
.f-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.f-baris{margin-top:16px}
.ina-text-field select.ina-text-field__input{appearance:auto;background:transparent;border:0;width:100%;height:100%;font:inherit;font-size:14px;color:inherit;outline:0}
.terkunci-isi{padding:10px 12px;border:1px solid var(--ina-stroke-primary);border-radius:8px;background:var(--ina-background-secondary);font-size:14px;color:var(--ina-content-secondary)}
.syarat-pw{list-style:none;margin:8px 0 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 16px}
.syarat-pw li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ina-content-secondary)}
.syarat-pw .tanda{width:16px;height:16px;border-radius:999px;border:1.5px solid var(--ina-stroke-secondary);display:grid;place-items:center;flex:none}
.syarat-pw li.ok{color:var(--ina-content-positive)}
.syarat-pw li.ok .tanda{border-color:var(--ina-content-positive);background:var(--ina-positive-100)}
.pw-atas{display:flex;justify-content:flex-end;margin-top:6px}
.ringkas{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:12px 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas dt{color:var(--ina-content-secondary)}
.ringkas dd{margin:0;font-weight:500}
.pw-sementara{display:flex;align-items:center;gap:10px;margin-top:8px}
.pw-sementara code{flex:1;padding:10px 12px;border:1px solid var(--ina-stroke-primary);border-radius:8px;background:#fff;font:600 15px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);word-break:break-all}
.daftar-nama{margin:8px 0 0;padding:10px 14px 10px 32px;border-radius:10px;background:var(--ina-background-secondary);font-size:14px;line-height:24px}
.daftar-nama small{color:var(--ina-content-secondary)}
.modal-gap>*+*{margin-top:12px}
/* impor (HE-UMUM-03) */
.langkah-impor{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pratinjau{max-height:260px;overflow:auto;border:1px solid var(--ina-stroke-primary);border-radius:10px;margin-top:12px}
.pratinjau table{width:100%;border-collapse:collapse;font-size:13px}
.pratinjau th,.pratinjau td{padding:8px 10px;border-bottom:1px solid var(--ina-stroke-primary);text-align:left;vertical-align:top}
.pratinjau th{background:var(--ina-background-secondary);font-weight:600}
.pratinjau tr.galat td{background:var(--ina-negative-50,#fff1f1)}
.pratinjau td small{display:block;color:var(--ina-negative-600,#c81e1e)}

@media (max-width:760px){
  .alat .ina-input-search{width:100%}
  .alat .kanan,.alat .kiri{width:100%}
  .f-grid3,.f-grid2{grid-template-columns:1fr}
  .ringkas{grid-template-columns:1fr;gap:2px}
  .ringkas dd{margin-bottom:6px}
  .ina-button-group{overflow-x:auto;max-width:100%}
}
</style>
</head>

function acakPw() {
  const set = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%&*?'], semua = set.join('');

  return a.sort(() => Math.random() - .5).join('');
}
function setPw(pesan, jenis) {

  setPw(v && ok.every(Boolean) ? 'Kata sandi sudah memenuhi semua syarat.' : 'Sampaikan kata sandi ini ke pengguna. Pengguna dapat menggantinya sendiri di menu Akun Saya.', v && ok.every(Boolean) ? 'success' : '');

function simpanUser(mode, u) {
  const v = id => ($('#' + id)?.value ?? '').trim(); let ada = false;
  if (v('uDepan').length < 2) { galat('uDepan', 'Nama depan minimal 2 karakter.'); ada = true; }
  if (mode === 'create') {
    if (!/^\S+@\S+\.\S+$/.test(v('uEmail'))) { galat('uEmail', 'Format email tidak valid. Contoh: nama@contoh.id'); ada = true; }
    else if (USER.some(x => x.email === v('uEmail').toLowerCase())) { galat('uEmail', 'Email ini sudah terdaftar. Gunakan email lain.'); ada = true; }
    if (!SYARAT_PW.every(([, uji]) => uji($('#uPw').value))) { setPw('Kata sandi belum memenuhi semua syarat di bawah.', 'error'); ada = true; }
    if (!v('uPeran')) { galat('uPeran', 'Pilih peran pengguna.'); ada = true; }

function konfirmMassal(ke) {

      ${lewat.length ? `<p class="sel-email" style="margin-top:10px">${lewat.length} pengguna dilewati karena statusnya sudah ${STATUS[ke][0]}: ${lewat.map(u => esc(u.nama)).join(', ')}.</p>` : ''}`,
    tombol:[['Batal', 'secondary', null], [`${tangguh ? 'Tangguhkan' : 'Aktifkan'} ${ubah.length} Pengguna`, 'primary', () => { ubah.forEach(u => { u.status = ke; }); S.pilih.clear(); gambar(); toast(`${ubah.length} pengguna ${tangguh ? 'ditangguhkan' : 'diaktifkan'}.`, 'positive', 4000, lewat.length ? `${lewat.length} pengguna dilewati karena statusnya sudah sesuai.` : ''); }]] });

  const L = $('#lapisan');

      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md" data-i="${i}">${t}</button>`).join('')}</div></div></div></div>`;
  L.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i; if (i < 0) { L.innerHTML = ''; return; }
    const [, , fn, tahan] = tb[i]; if (tahan) { fn && fn(); return; }

  };
}

.notif-kepala{flex:none;padding:14px 16px 10px;border-bottom:1px solid var(--ina-stroke-primary,#e3e7e6)}
.notif-baris{display:flex;align-items:center;justify-content:space-between;gap:8px}

.notif-saring{margin-top:10px}
.notif-saring .ina-button-group{width:100%}
.notif-saring .ina-button-group__button{flex:1}
.notif-isi{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.notif-daftar{list-style:none;margin:0;padding:0}
.notif-daftar>li+li{border-top:1px solid var(--ina-stroke-primary,#e3e7e6)}
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;color:inherit;text-decoration:none;position:relative}
a.notif-item{cursor:pointer}
a.notif-item:hover{background:var(--ina-background-secondary,#f5f7f6)}
a.notif-item:focus-visible{outline:2px solid var(--ina-primary-500,#3D6B5E);outline-offset:-2px}
.notif-item.belum{background:var(--ina-primary-25,#f5f8f7)}
a.notif-item.belum:hover{background:var(--ina-primary-50,#eaf1ef)}
.notif-ikon{flex:none;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--ina-primary-50,#eaf1ef);color:var(--ina-primary-primary,#1f4d40)}
.notif-ikon svg{width:16px;height:16px}
.notif-teks{flex:1;min-width:0}
.notif-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notif-waktu{font-size:12px;line-height:16px;color:var(--ina-content-secondary,#5c6663)}
.notif-t{display:block;margin-top:4px;font:600 13.5px/19px Inter,system-ui,sans-serif;color:var(--ina-content-primary,#1f1f1f)}
.notif-b{display:block;margin-top:2px;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary,#5c6663)}
.notif-tandai{margin-top:8px}
.notif-kanan{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px;color:var(--ina-content-tertiary,#8a9390)}
.notif-titik{width:8px;height:8px;border-radius:999px;background:var(--ina-primary-primary,#1f4d40)}
.notif-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.notif-status{padding:28px 16px;text-align:center;font-size:13.5px;line-height:20px;color:var(--ina-content-secondary,#5c6663)}
.notif-status svg{display:block;margin:0 auto 8px;color:var(--ina-content-tertiary,#8a9390)}
.notif-rangka{list-style:none;margin:0;padding:4px 0}
.notif-rangka li{display:flex;gap:12px;padding:12px 16px}
.notif-rangka i{display:block;border-radius:8px;background:var(--ina-background-secondary,#eef1f0);animation:notif-denyut 1.2s ease-in-out infinite}
.notif-rangka .b1{width:36px;height:36px;border-radius:999px;flex:none}
.notif-rangka .b2{height:10px;margin-top:6px}
@keyframes notif-denyut{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.notif-rangka i{animation:none}}
.notif-galat{padding:16px}
.notif-galat .ina-alert__content{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.notif-kaki{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--ina-stroke-primary,#e3e7e6);font-size:12px;line-height:16px;color:var(--ina-content-secondary,#5c6663)}
.notif-kaki .tag-usulan{margin-left:0}
@media (max-width:760px){
  .notif-panel{position:fixed;left:0;right:0;width:auto;max-width:none;border-radius:0 0 16px 16px;border-left:0;border-right:0;max-height:calc(100vh - var(--notif-atas,72px) - 8px)}
}
</style>
<script id="notif-bersama">
(() => {
  if (window.__notifBersama) return;
  window.__notifBersama = true;

  const KUNCI = 'eppat-notif-dibaca';
  const MENIT = 60000, JAM = 60 * MENIT;
  const sekarang = Date.now();

  /* ikon garis 24×24 (currentColor) */
  const IK = {
    order: '<path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" />',
    verif: '<path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M9 12l2 2l4 -4" />',
    ttd: '<path d="M3 17c3.333 -3.333 5 -6 5 -8c0 -3 -1 -3 -2 -3s-2.032 1.085 -2 3c.034 2.048 1.658 4.877 2.5 6c1.5 2 2.5 2.5 3.5 1l2 -3c.333 2.667 1.333 4 3 4c.53 0 2.639 -2 3 -2c.517 0 1.517 .667 3 2" />',
    akta: '<path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" /><path d="M9 15l2 2l4 -4" />',
    salinan: '<path d="M15 3v4a1 1 0 0 0 1 1h4" /><path d="M18 17h-7a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h4l5 5v7a2 2 0 0 1 -2 2z" /><path d="M16 17v2a2 2 0 0 1 -2 2h-7a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h2" />',
    sistem: '<path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" />',
    lonceng: '<path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" />',
    chevron: '<path d="M9 6l6 6l-6 6" />',
    cek: '<path d="M5 12l5 5l10 -10" />'
  };
  const ik = (n, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${IK[n]}</svg>`;

  /* jenis notifikasi: label singkat, ikon, varian badge IDDS */
  const JENIS = {
    order: ['Permohonan baru', 'order', 'brand'],
    verifikasi: ['Verifikasi', 'verif', 'warning'],
    giliran: ['Giliran tanda tangan', 'ttd', 'info'],
    ttd_selesai: ['Tanda tangan selesai', 'ttd', 'success'],
    akta: ['Akta selesai', 'akta', 'success'],
    salinan: ['Salinan dibuka', 'salinan', 'neutral'],
    sistem: ['Sistem', 'sistem', 'neutral'],
    kantor: ['PPAT baru', 'order', 'brand'],
    keamanan: ['Keamanan', 'sistem', 'warning'],
    paket: ['Paket', 'sistem', 'info'],
    template: ['Template akta', 'akta', 'success']
  };

  /* contoh data: Klien (para pihak) hanya menerima notifikasi tentang akta dan akunnya sendiri */
  const KLIEN = /Peran:\s*Klien/.test((document.querySelector('.protobar') || {}).textContent || '');
  const DATA_KLIEN = [
    { id: 'k4', jenis: 'giliran', judul: 'Giliran Anda menandatangani akta', isi: 'Akta Jual Beli ORD-CONTOH-007 menunggu tanda tangan elektronik Anda.', lalu: 3 * MENIT, baca: false, ke: 'Backlog-HE-EAWK-Prototype.html' },
    { id: 'k3', jenis: 'sistem', judul: 'Lengkapi registrasi sertifikat elektronik', isi: 'Selesaikan eKYC di portal Peruri agar Anda dapat menandatangani akta.', lalu: 2 * JAM, baca: false, ke: 'Backlog-HE-CA-Prototype.html' },
    { id: 'k2', jenis: 'ttd_selesai', judul: 'Semua pihak sudah menandatangani', isi: 'Akta Jual Beli ORD-CONTOH-005 sudah ditandatangani semua pihak dan sedang difinalisasi kantor PPAT.', lalu: 30 * JAM, baca: true, ke: 'Backlog-HE-EAWK-Prototype.html' },
    { id: 'k1', jenis: 'akta', judul: 'Salinan akta dikirim ke email Anda', isi: 'Buka tautan di email untuk mengunduh salinan akta ORD-CONTOH-005. Tautan berlaku 7 hari.', lalu: 50 * JAM, baca: true, ke: '' }
  ].map(d => Object.assign({}, d, { waktu: sekarang - d.lalu }));

  /* contoh data bersama staf kantor (netral; sama untuk semua prototipe staf) */
  const DATA_STAF = [
    { id: 'n8', jenis: 'giliran', judul: 'Giliran Anda menandatangani akta', isi: 'Akta Jual Beli ORD-CONTOH-009 menunggu tanda tangan elektronik Anda.', lalu: 20 * 1000, baca: false, ke: 'Backlog-HE-EAW-Prototype.html' },
    { id: 'n7', jenis: 'order', judul: 'Permohonan baru ORD-CONTOH-014', isi: 'Asisten Contoh membuat permohonan Akta Jual Beli untuk Contoh Penjual Satu.', lalu: 5 * MENIT, baca: false, ke: 'Backlog-HE-ORDER-Prototype.html' },
    { id: 'n6', jenis: 'verifikasi', judul: 'Berkas ORD-CONTOH-012 perlu diverifikasi', isi: 'Contoh Penjual Satu mengunggah KTP dan sertipikat. Periksa berkas sebelum akta disusun.', lalu: 42 * MENIT, baca: false, ke: 'Backlog-HE-VERIF-Prototype.html' },
    { id: 'n5', jenis: 'sistem', judul: 'Pemeliharaan sistem terjadwal', isi: 'E-PPAT tidak dapat diakses pada Sabtu, 31 Oktober 2026, pukul 22.00–23.00 WIB.', lalu: 2 * JAM, baca: false, ke: '' },
    { id: 'n4', jenis: 'sistem', judul: 'Pendaftaran TERA kantor diproses Peruri', isi: 'Peruri sedang memeriksa data TERA kantor Anda. Hasilnya akan dikirim lewat notifikasi dan email.', lalu: 3 * JAM, baca: true, ke: 'Backlog-HE-TERA-Prototype.html' },
    { id: 'n3', jenis: 'akta', judul: 'Akta ORD-CONTOH-005 selesai', isi: 'Akta sudah difinalisasi. Unggah scan akta, lalu kirim salinannya di menu Salinan Akta.', lalu: 7 * JAM, baca: true, ke: 'Backlog-IDDS-TN-EPPAT-Prototype.html#salinan' },
    { id: 'n2', jenis: 'salinan', judul: 'Salinan akta ORD-CONTOH-005 dibuka', isi: 'Contoh Penjual Satu membuka tautan salinan akta.', lalu: 26 * JAM, baca: true, ke: 'Backlog-IDDS-TN-EPPAT-Prototype.html#salinan' },
    { id: 'n1', jenis: 'sistem', judul: 'Layanan e-Meterai belum aktif', isi: 'Aktifkan e-Meterai agar akta dapat dibubuhi meterai elektronik.', lalu: 50 * JAM, baca: true, ke: 'Backlog-IDDS-TN-EPPAT-Prototype.html#emeterai' }
  ].map(d => Object.assign({}, d, { waktu: sekarang - d.lalu }));
  /* Admin Platform: notifikasi tingkat platform (bukan notifikasi kantor) */
  const PLATFORM = /Peran:\s*Admin Platform/.test((document.querySelector('.protobar') || {}).textContent || '');
  const DATA_PLATFORM = [
    { id: 'p4', jenis: 'kantor', judul: 'Kantor PPAT baru terdaftar', isi: 'Kantor PPAT Contoh Dua selesai onboarding dengan paket Enterprise.', lalu: 15 * MENIT, baca: false, ke: 'Backlog-IDDS-PL-MONITORING-Prototype.html#ppat' },
    { id: 'p3', jenis: 'keamanan', judul: 'Gagal masuk berulang', isi: 'Ada 5 percobaan masuk gagal dari akun yang sama di Kantor PPAT Contoh Tiga dalam 10 menit.', lalu: 1 * JAM, baca: false, ke: 'Backlog-IDDS-PL-MONITORING-Prototype.html#log' },
    { id: 'p2', jenis: 'paket', judul: 'Masa berlaku paket segera habis', isi: '12 kantor PPAT berpaket Gratis akan habis masa berlakunya dalam 7 hari.', lalu: 5 * JAM, baca: true, ke: 'Backlog-IDDS-PL-MONITORING-Prototype.html#ppat' },
    { id: 'p1', jenis: 'template', judul: 'Template akta diperbarui', isi: 'Template Akta Jual Beli versi terbaru sudah dipakai semua kantor PPAT.', lalu: 30 * JAM, baca: true, ke: 'Backlog-IDDS-PL-AKTA-Prototype.html#jenis' }
  ].map(d => Object.assign({}, d, { waktu: sekarang - d.lalu }));
  const DATA = PLATFORM ? DATA_PLATFORM : KLIEN ? DATA_KLIEN : DATA_STAF;

  /* penyimpanan status dibaca (aman bila localStorage tidak tersedia) */
  let simpanan = {};
  try { simpanan = JSON.parse(localStorage.getItem(KUNCI) || '{}') || {}; } catch (e) { simpanan = {}; }
  const simpan = () => { try { localStorage.setItem(KUNCI, JSON.stringify(simpanan)); } catch (e) { /* tanpa storage tetap jalan */ } };
  const dibaca = d => d.baca || simpanan[d.id] === 1;
  const tandai = id => { simpanan[id] = 1; simpan(); };
  const jumlahBelum = () => DATA.filter(d => !dibaca(d)).length;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const waktuRelatif = t => {
    const s = Date.now() - t;
    if (s < MENIT) return 'Baru saja';
    if (s < JAM) return Math.floor(s / MENIT) + ' menit lalu';
    if (s < 24 * JAM) return Math.floor(s / JAM) + ' jam lalu';
    try { return new Date(t).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, ''); }
    catch (e) { return new Date(t).toDateString(); }
  };

  let gagalSimulasi = false;
  try { gagalSimulasi = new URLSearchParams(location.search).get('notifgagal') === '1'; } catch (e) { /* abaikan */ }

  const mulai = () => {
    const bel = document.querySelector('header.top button[aria-label="Notifikasi"]');
    if (!bel || bel.hasAttribute('data-notif')) return;
    bel.setAttribute('data-notif', '1');

    /* jangkar: bungkus tombol lonceng agar panel tepat di bawahnya dan urutan Tab alami */
    const jangkar = document.createElement('span');
    jangkar.className = 'notif-jangkar';
    bel.parentNode.insertBefore(jangkar, bel);
    jangkar.appendChild(bel);

    const lencana = document.createElement('span');
    lencana.className = 'notif-lencana';
    lencana.setAttribute('aria-hidden', 'true');
    jangkar.appendChild(lencana);

    const panel = document.createElement('div');
    panel.className = 'notif-panel';
    panel.id = 'notifPanel';
    panel.hidden = true;
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'false');
    panel.setAttribute('aria-labelledby', 'notifJudul');
    panel.innerHTML = `
      <div class="notif-kepala">
        <div class="notif-baris">
          <div>
            <h2 class="notif-judul" id="notifJudul" tabindex="-1">Notifikasi</h2>
            <p class="notif-jumlah" id="notifJumlah" aria-live="polite"></p>
          </div>
          <button type="button" class="ina-button ina-button--tertiary ina-button--sm" id="notifSemua" hidden><span>Tandai Semua Dibaca</span></button>
        </div>
        <div class="notif-saring">
          <div class="ina-button-group" role="group" aria-label="Saring notifikasi">
            <button type="button" class="ina-button-group__button" data-saring="semua"><span class="ina-button-group__button-content">Semua</span></button>
            <button type="button" class="ina-button-group__button" data-saring="belum"><span class="ina-button-group__button-content">Belum dibaca</span></button>
          </div>
        </div>
      </div>
      <div class="notif-isi" id="notifIsi"></div>
      <div class="notif-kaki"><span>Notifikasi diperbarui otomatis setiap menit.</span><span class="tag-usulan">penyesuaian · IDDS-TN-39</span></div>`;
    jangkar.appendChild(panel);

    bel.setAttribute('aria-haspopup', 'dialog');
    bel.setAttribute('aria-expanded', 'false');
    bel.setAttribute('aria-controls', panel.id);
    bel.setAttribute('title', 'Notifikasi');

    const isi = panel.querySelector('#notifIsi');
    const elJumlah = panel.querySelector('#notifJumlah');
    const tSemua = panel.querySelector('#notifSemua');
    const judul = panel.querySelector('#notifJudul');

    let saring = 'semua';
    let kondisi = 'baru'; // baru | muat | galat | siap

    const perbaruiBel = () => {
      const n = jumlahBelum();
      lencana.textContent = n > 9 ? '9+' : String(n);
      lencana.hidden = n === 0;
      bel.setAttribute('aria-label', n ? `Notifikasi, ${n} belum dibaca` : 'Notifikasi, tidak ada yang belum dibaca');
      elJumlah.textContent = n ? `${n} belum dibaca` : 'Semua sudah dibaca';
      tSemua.hidden = n === 0 || kondisi !== 'siap';
    };

    const itemHtml = d => {
      const [label, ikon, varian] = JENIS[d.jenis] || JENIS.sistem;
      const belum = !dibaca(d);
      const meta = `<span class="notif-meta"><span class="ina-badge ina-badge--soft ina-badge--${varian} ina-badge--sm ina-badge--rounded-full">${esc(label)}</span><span class="notif-waktu">${esc(waktuRelatif(d.waktu))}</span></span>`;
      const teks = `<span class="notif-teks">${meta}<span class="notif-t">${esc(d.judul)}</span><span class="notif-b">${esc(d.isi)}</span>${belum ? '<span class="notif-vh">Belum dibaca.</span>' : ''}`;
      const titik = belum ? '<span class="notif-titik" aria-hidden="true"></span>' : '';
      if (d.ke) {
        return `<li><a class="notif-item${belum ? ' belum' : ''}" href="${esc(d.ke)}" data-notif-id="${esc(d.id)}"><span class="notif-ikon" aria-hidden="true">${ik(ikon)}</span>${teks}</span><span class="notif-kanan">${titik}${ik('chevron', 16)}</span></a></li>`;
      }
      const tombol = belum ? `<button type="button" class="ina-button ina-button--secondary ina-button--sm notif-tandai" data-tandai="${esc(d.id)}"><span>Tandai dibaca</span></button>` : '';
      return `<li><div class="notif-item${belum ? ' belum' : ''}"><span class="notif-ikon" aria-hidden="true">${ik(ikon)}</span>${teks}${tombol}</span><span class="notif-kanan">${titik}</span></div></li>`;
    };

    const render = () => {
      perbaruiBel();
      panel.querySelectorAll('[data-saring]').forEach(b => {
        const on = b.dataset.saring === saring;
        b.classList.toggle('ina-button-group__button--selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      if (kondisi === 'muat') {
        isi.innerHTML = `<p class="notif-vh" role="status">Memuat notifikasi…</p><ul class="notif-rangka" aria-hidden="true">${'<li><i class="b1"></i><span style="flex:1"><i class="b2" style="width:40%"></i><i class="b2" style="width:85%"></i><i class="b2" style="width:65%"></i></span></li>'.repeat(3)}</ul><p class="notif-status" style="padding-top:4px" aria-hidden="true">Memuat notifikasi…</p>`;
        return;
      }
      if (kondisi === 'galat') {
        isi.innerHTML = `<div class="notif-galat"><div class="ina-alert ina-alert--critical" role="alert"><div class="ina-alert__content"><div class="ina-alert__text-section"><div class="ina-alert__title">Notifikasi gagal dimuat.</div><div class="ina-alert__description">Periksa koneksi Anda, lalu coba lagi.</div></div><button type="button" class="ina-button ina-button--secondary ina-button--sm" id="notifUlang"><span>Coba Lagi</span></button></div></div></div>`;
        return;
      }
      const daftar = DATA.filter(d => saring === 'semua' || !dibaca(d));
      if (!daftar.length) {
        isi.innerHTML = `<div class="notif-status">${ik('lonceng', 24)}${saring === 'belum' ? 'Tidak ada notifikasi yang belum dibaca.' : 'Belum ada notifikasi.'}</div>`;
        return;
      }
      isi.innerHTML = `<ul class="notif-daftar">${daftar.map(itemHtml).join('')}</ul>`;
    };

    const muat = () => {
      kondisi = 'muat';
      render();
      setTimeout(() => {
        if (gagalSimulasi) { gagalSimulasi = false; kondisi = 'galat'; } // gagal sekali, "Coba Lagi" berhasil
        else kondisi = 'siap';
        render();
      }, 300);
    };

    const atur = () => {
      if (panel.hidden) return;
      if (window.matchMedia && window.matchMedia('(max-width:760px)').matches) {
        const r = bel.getBoundingClientRect();
        const atas = Math.max(0, Math.round(r.bottom + 8));
        panel.style.top = atas + 'px';
        panel.style.setProperty('--notif-atas', atas + 'px');
      } else {
        panel.style.top = '';
        panel.style.removeProperty('--notif-atas');
      }
    };

    const buka = () => {
      panel.hidden = false;
      bel.setAttribute('aria-expanded', 'true');
      atur();
      if (kondisi === 'baru') muat(); else render();
      judul.focus();
    };
    const tutup = (kembali) => {
      if (panel.hidden) return;
      panel.hidden = true;
      bel.setAttribute('aria-expanded', 'false');
      if (kembali) bel.focus();
    };

    bel.addEventListener('click', e => { e.preventDefault(); panel.hidden ? buka() : tutup(false); });

    panel.addEventListener('click', e => {
      const sar = e.target.closest('[data-saring]');
      if (sar) { saring = sar.dataset.saring; render(); return; }
      if (e.target.closest('#notifSemua')) {
        DATA.forEach(d => { simpanan[d.id] = 1; });
        simpan(); render(); judul.focus(); return;
      }
      if (e.target.closest('#notifUlang')) { muat(); judul.focus(); return; }
      const tnd = e.target.closest('[data-tandai]');
      if (tnd) { tandai(tnd.dataset.tandai); render(); judul.focus(); return; }
      const a = e.target.closest('a[data-notif-id]');
      if (a) { tandai(a.dataset.notifId); perbaruiBel(); tutup(false); /* lanjut navigasi bawaan tautan */ }
    });

    document.addEventListener('keydown', e => {
      if ((e.key === 'Escape' || e.key === 'Esc') && !panel.hidden) { e.stopPropagation(); tutup(true); }
    }, true);
    document.addEventListener('click', e => {
      if (!panel.hidden && !jangkar.contains(e.target)) tutup(false);
    }, true);
    jangkar.addEventListener('focusout', e => {
      if (!panel.hidden && e.relatedTarget && !jangkar.contains(e.relatedTarget)) tutup(false);
    });
    window.addEventListener('resize', atur);
    window.addEventListener('scroll', atur, { passive: true });

    /* live: polling 60 dtk — di prototipe hanya memperbarui waktu relatif & jumlah */
    setInterval(() => { if (kondisi === 'siap' && !panel.hidden) render(); else perbaruiBel(); }, 60000);
    /* status dibaca dari tab/prototipe lain */
    window.addEventListener('storage', e => {
      if (e.key !== KUNCI) return;
      try { simpanan = JSON.parse(e.newValue || '{}') || {}; } catch (er) { simpanan = {}; }
      if (!panel.hidden && kondisi === 'siap') render(); else perbaruiBel();
    });

    perbaruiBel();
  };

  try {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
    else mulai();
  } catch (e) { /* jangan pernah memecah halaman */ }
})();
</script>

<!-- ===== Sidebar pola IDDS (sidebar-idds.html, disisipkan rakit-idds.js ke setiap prototipe bersidebar) =====
     Struktur mengikuti pola Sidebar IDDS (design.inadigital.go.id/pattern/sidebar): label grup kecil sentence case + chevron,
     item ikon + label (default/hover/terpilih), kartu profil pengguna di bawah, kategori Expand/Collapse, laci di layar sempit.
     WARNA TETAP brand E-PPAT (--ina-eppat-sidebar-*, --eppat-sidebar-icon, --eppat-sidebar-active-icon). Kartu profil kantor tetap. -->
<style id="sidebar-idds-css">
/* label grup: kecil, sentence case, rata kiri, chevron tepat setelah label */
.sidebar .grp{padding:16px 8px 6px;font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.72)}
.sidebar .grp > svg{display:none}
.sidebar .grp > span:not(.chev){flex:0 1 auto}
.sidebar .grp .chev{margin-left:0;color:currentColor}
.sidebar .grp .chev svg{color:currentColor;width:12px;height:12px}
.sidebar .grp:hover{color:#fff}
.sidebar .grp:focus-visible,.sidebar a.nav-item:focus-visible,.sidebar .nav-induk:focus-visible,.sb-ciut-btn:focus-visible,.sb-profil-btn:focus-visible{outline:2px solid #fff;outline-offset:-2px;border-radius:8px}
.side-ob .grp-lbl{margin:16px 8px 6px;font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.72)}
/* item menu: ikon + label */
.sidebar .items a.nav-item{min-height:40px;align-items:center;padding:8px 10px}
.sidebar .items a.nav-item.nav-anak{padding-left:10px}
.sidebar .items a.nav-item.nav-anak svg{width:16px;height:16px}
.sidebar .items a.nav-item > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* kepala sidebar: logo + tombol ciut */
.sidebar .brand{gap:8px}
.sidebar .brand img{flex:none}
.sb-ciut-btn{margin-left:auto;flex:none;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.8);cursor:pointer}
.sb-ciut-btn:hover{background:var(--ina-eppat-sidebar-hover);color:#fff}
.sb-ciut-btn svg{width:18px;height:18px}
/* kartu profil pengguna (bawah) */
.sb-profil{flex:none;margin-top:auto;position:sticky;bottom:0;z-index:1;margin-left:-16px;margin-right:-16px;padding:12px 16px 0;background:var(--ina-eppat-sidebar-bg);border-top:1px solid rgba(255,255,255,.1)}
.sb-profil-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;color:#fff;text-align:left;font:inherit}
button.sb-profil-btn{cursor:pointer}
button.sb-profil-btn:hover{background:var(--ina-eppat-sidebar-hover)}
.sb-ava{flex:none;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--ina-primary-500);color:#fff;font:600 12px Inter,sans-serif}
.sb-teks{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-nama{font:600 13px/18px Inter,sans-serif;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-peran{font:400 12px/16px Inter,sans-serif;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-profil-btn .sb-pilih{flex:none;display:grid;color:rgba(255,255,255,.75)}
.sidebar .sidefoot,.side-ob .versi{margin-top:0;border-top:0;padding:4px 8px 12px;font-size:11px;color:rgba(255,255,255,.72)}
/* tooltip mode Collapse */
#sbTip{position:fixed;z-index:200;pointer-events:none;background:#1f2a2e;color:#fff;font:500 12px/16px Inter,sans-serif;padding:6px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap}
#sbTip[hidden]{display:none}
.sb-sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
@media (max-width:1024px){ .sb-ciut-btn{display:none} }
/* kategori Collapse (ikon saja) — hanya layar lebar; layar sempit tetap laci */
@media (min-width:1025px){
  .sidebar{transition:width .18s}
  .sidebar.sb-ciut{width:72px;padding:0 12px;overflow-x:hidden}
  .sidebar.sb-ciut .brand{flex-direction:column;justify-content:center;height:auto;padding:14px 0 10px;gap:8px}
  .sidebar.sb-ciut .brand img{width:34px;height:44px;object-fit:cover;object-position:left center}
  .sidebar.sb-ciut .sb-ciut-btn{margin:0}
  .sidebar.sb-ciut .kantor,.sidebar.sb-ciut .grp,.sidebar.sb-ciut .grp-lbl,.sidebar.sb-ciut .sidefoot,.sidebar.sb-ciut .versi,.sidebar.sb-ciut .sb-teks,.sidebar.sb-ciut .sb-pilih,.sidebar.sb-ciut .tag-usulan{display:none!important}
  .sidebar.sb-ciut .items,.sidebar.sb-ciut .items[hidden]{display:flex!important}
  .sidebar.sb-ciut #nav > .items + .items,.sidebar.sb-ciut #nav > .grp + .items:not(:first-of-type),.sidebar.sb-ciut nav > .items ~ .items{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
  .sidebar.sb-ciut .items a.nav-item,.sidebar.sb-ciut .items button.nav-induk{justify-content:center;padding:10px 0;gap:0}
  .sidebar.sb-ciut .items a.nav-item svg{width:18px;height:18px}
  .sidebar.sb-ciut .sb-profil-btn{justify-content:center;padding:8px 0}
  .sidebar.sb-ciut .sb-profil{margin-left:-12px;margin-right:-12px;padding:12px 12px 12px}
}
</style>
<script id="sidebar-idds-js">
(() => {
  const KUNCI = 'eppat-sidebar-ciut';
  const baca = () => { try { return localStorage.getItem(KUNCI) === '1'; } catch (e) { return false; } };
  const tulis = v => { try { localStorage.setItem(KUNCI, v ? '1' : '0'); } catch (e) {} };
  const SVG = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IK_CIUT = '<path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" /><path d="M9 4v16" /><path d="M15 10l-2 2l2 2" />';
  const IK_BENTANG = '<path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" /><path d="M9 4v16" /><path d="M14 10l2 2l-2 2" />';
  const IK_PILIH = '<path d="M8 9l4 -4l4 4" /><path d="M16 15l-4 4l-4 -4" />';
  const daftar = [...document.querySelectorAll('aside.sidebar')];
  if (!daftar.length) return;
  let ciut = baca();
  const tip = document.createElement('div'); tip.id = 'sbTip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true; document.body.appendChild(tip);

  daftar.forEach((sb, n) => {
    if (sb.dataset.sbIdds) return; sb.dataset.sbIdds = '1';
    if (!sb.id) sb.id = 'sidebar-' + n;
    /* tombol ciut di kepala sidebar */
    const brand = sb.querySelector('.brand');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'sb-ciut-btn'; btn.setAttribute('aria-controls', sb.id);
    if (brand) brand.appendChild(btn); else sb.prepend(btn);
    /* kartu profil pengguna: nama & peran dari kepala halaman (satu sumber) */
    const app = sb.closest('.app') || document;
    const kepala = app.querySelector('header .user');
    if (kepala) {
      const pemicu = kepala.querySelector('.user-tombol') || (kepala.matches('[aria-haspopup], [role="button"]') ? kepala : null);
      const wadah = document.createElement('div'); wadah.className = 'sb-profil';
      const el = document.createElement(pemicu ? 'button' : 'div');
      el.className = 'sb-profil-btn';
      if (pemicu) { el.type = 'button'; el.setAttribute('aria-haspopup', 'menu'); }
      wadah.appendChild(el);
      const kaki = sb.querySelector(':scope > .sidefoot, :scope > .versi');
      sb.appendChild(wadah); if (kaki) wadah.appendChild(kaki); /* versi aplikasi tetap kecil di bawah kartu */
      const isi = () => {
        const nama = (kepala.querySelector('.uname') || {}).textContent || '', peran = (kepala.querySelector('.urole') || {}).textContent || '';
        const ava = (kepala.querySelector('.ava') || {}).textContent || nama.trim().charAt(0);
        el.innerHTML = `<span class="sb-ava" aria-hidden="true">${ava.trim()}</span><span class="sb-teks"><span class="sb-nama">${nama.trim()}</span><span class="sb-peran">${peran.trim()}</span></span>${pemicu ? `<span class="sb-pilih">${SVG(IK_PILIH).replace('<svg', '<svg width="16" height="16"')}</span>` : ''}`;
        el.dataset.tip = nama.trim();
        if (pemicu) el.setAttribute('aria-label', `Menu akun ${nama.trim()}, ${peran.trim()}`);
      };
      isi();
      new MutationObserver(isi).observe(kepala.querySelector('.txt') || kepala, { subtree: true, characterData: true, childList: true });
      if (pemicu) el.addEventListener('click', e => {
        e.stopPropagation(); /* jangan ditutup oleh penangan "klik di luar menu" */
        sb.classList.remove('open'); const scrim = app.querySelector('.scrim'); if (scrim) scrim.classList.remove('on');
        pemicu.click(); if (pemicu === kepala) pemicu.focus();
      });
    }
  });

  const terap = () => {
    daftar.forEach(sb => {
      sb.classList.toggle('sb-ciut', ciut);
      const b = sb.querySelector('.sb-ciut-btn');
      b.setAttribute('aria-expanded', String(!ciut));
      b.setAttribute('aria-label', ciut ? 'Bentangkan menu samping' : 'Ciutkan menu samping');
      b.innerHTML = SVG(ciut ? IK_BENTANG : IK_CIUT);
      b.dataset.tip = ciut ? 'Bentangkan menu' : 'Ciutkan menu';
    });
    labelSr();
  };
  /* mode ciut: label disembunyikan secara visual saja (tetap dibacakan pembaca layar) */
  const labelSr = () => daftar.forEach(sb => sb.querySelectorAll('a.nav-item > span, .nav-induk > span:not(.chev)').forEach(s => s.classList.toggle('sb-sr', ciut && matchMedia('(min-width:1025px)').matches)));
  daftar.forEach(sb => new MutationObserver(() => { if (ciut) labelSr(); }).observe(sb, { childList: true, subtree: true }));
  matchMedia('(min-width:1025px)').addEventListener('change', labelSr);
  document.addEventListener('click', e => {
    const b = e.target.closest('.sb-ciut-btn'); if (!b) return;
    ciut = !ciut; tulis(ciut); tip.hidden = true; terap(); b.focus();
  });
  /* tooltip: label menu saat ciut */
  const tampil = el => {
    const sb = el.closest('.sidebar'); if (!sb || !sb.classList.contains('sb-ciut') || !matchMedia('(min-width:1025px)').matches) return;
    const teks = el.dataset.tip || el.getAttribute('aria-label') || (el.querySelector(':scope > span:not(.chev)') || el).textContent.trim(); if (!teks) return;
    tip.textContent = teks; tip.hidden = false;
    const r = el.getBoundingClientRect(); tip.style.left = (r.right + 8) + 'px'; tip.style.top = (r.top + r.height / 2 - tip.offsetHeight / 2) + 'px';
  };
  const SEL = '.sidebar a.nav-item, .sidebar .nav-induk, .sidebar .sb-profil-btn, .sidebar .sb-ciut-btn';
  document.addEventListener('mouseover', e => { const el = e.target.closest(SEL); if (el) tampil(el); else tip.hidden = true; });
  document.addEventListener('focusin', e => { const el = e.target.closest(SEL); if (el) tampil(el); else tip.hidden = true; });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') tip.hidden = true; });
  document.addEventListener('scroll', () => { tip.hidden = true; }, true);
  terap();
})();
</script>

<!-- ===== Tooltip aman (tooltip-aman.html, disisipkan rakit-idds.js ke setiap prototipe yang memakai IDDS Tooltip) =====
     Kotak tooltip tidak boleh terpotong tepi layar atau wadah ber-overflow: saat tampil, kotak ditempatkan fixed
     di atas pemicu (atau di bawah bila ruang atas kurang) dan digeser agar tetap berada di dalam layar. -->
<style id="tooltip-aman-css">
.ina-tooltip__content.tt-aman{position:fixed!important;transform:none!important;margin:0!important;z-index:2000;width:max-content!important;max-width:calc(100vw - 16px)!important}
.ina-tooltip__content.tt-aman .ina-tooltip__bubble::before,.ina-tooltip__content.tt-aman .ina-tooltip__bubble::after,.ina-tooltip__content.tt-aman::before,.ina-tooltip__content.tt-aman::after{display:none!important}
</style>
<script id="tooltip-aman-js">
(() => {
  const JARAK = 8, TEPI = 8;
  const pos = (c, k, v) => c.style.setProperty(k, v, 'important');
  const atur = tip => {
    const c = tip.querySelector(':scope > .ina-tooltip__content'); if (!c) return;
    requestAnimationFrame(() => {
      if (getComputedStyle(c).display === 'none') return;
      // lepas dari wadah dulu, ukur ukuran aslinya, lalu tempatkan di dalam layar
      c.classList.add('tt-aman'); pos(c, 'left', '0px'); pos(c, 'top', '0px'); pos(c, 'right', 'auto'); pos(c, 'bottom', 'auto');
      const r = c.getBoundingClientRect(); if (!r.width) return;
      const t = tip.getBoundingClientRect(), W = document.documentElement.clientWidth, H = innerHeight;
      let left = t.left + t.width / 2 - r.width / 2; left = Math.max(TEPI, Math.min(left, W - r.width - TEPI));
      let top = t.top - r.height - JARAK; if (top < TEPI) top = Math.min(t.bottom + JARAK, H - r.height - TEPI);
      pos(c, 'left', left + 'px'); pos(c, 'top', Math.max(TEPI, top) + 'px');
    });
  };  const pasang = e => { const tip = e.target.closest && e.target.closest('.ina-tooltip'); if (tip) atur(tip); };
  document.addEventListener('mouseover', pasang); document.addEventListener('focusin', pasang);
  window.addEventListener('scroll', () => document.querySelectorAll('.ina-tooltip__content.tt-aman').forEach(c => { const tip = c.closest('.ina-tooltip'); if (tip && (tip.matches(':hover') || tip.matches(':focus-within'))) atur(tip); }), true);
})();
</script>

<script id="tema-proto-js">
(() => {
  const KUNCI = 'eppat-tema-proto';
  const TEMA = [['eppat', 'E-PPAT'], ['inagov', 'INAgov'], ['default', 'Default']];
  const baca = () => { try { const v = localStorage.getItem(KUNCI); return TEMA.some(x => x[0] === v) ? v : 'eppat'; } catch (e) { return 'eppat'; } };
  const tulis = v => { try { localStorage.setItem(KUNCI, v); } catch (e) {} };
  const terap = v => {
    const h = document.documentElement;
    if (v === 'default') h.removeAttribute('data-brand'); else h.setAttribute('data-brand', v);
    document.querySelectorAll('.tema-proto [data-tema-proto]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.temaProto === v)));
  };
  /* pil hanya di protobar utama (bukan bilah simulasi) */
  const bar = document.querySelector('.protobar:not(.protobar-sim)');
  if (bar && !bar.querySelector('.tema-proto')) {
    const frag = document.createElement('span'); frag.style.display = 'contents';
    frag.innerHTML = `<span class="sep">&bull;</span><span id="temaProtoLbl">Tema:</span><span class="tema-proto" role="group" aria-labelledby="temaProtoLbl">${TEMA.map(([k, l]) => `<button type="button" class="pil" data-tema-proto="${k}" aria-pressed="false">${l}</button>`).join('')}</span>`;
    const kanan = bar.querySelector(':scope > .kanan');
    if (kanan) bar.insertBefore(frag, kanan); else bar.appendChild(frag);
    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-tema-proto]'); if (!b) return;
      const v = b.dataset.temaProto; tulis(v); terap(v); b.focus();
    });
  }
  terap(baca());
  /* tema dipilih di tab lain → samakan */
  window.addEventListener('storage', e => { if (e.key === KUNCI) terap(baca()); });
})();
</script>
