<style id="brand-eppat">
/**
 * E-PPAT Brand Theme untuk INA Digital Design System (IDDS)
 * --------------------------------------------------------------------------
 * Format mengikuti brand bawaan IDDS (@idds/styles: [data-brand='inagov'], 'panrb', dll.).
 * Hanya token brand (primary, secondary, hover) yang diganti; warna netral, sentimen
 * (positive/negative/warning/guide), tipografi, spacing, dan komponen tetap milik IDDS.
 *
 * Pemakaian:
 *   1. import '@idds/react/index.css'            (atau @idds/styles/dist/index.css)
 *   2. import './eppat.css'                       (berkas ini, SETELAH CSS IDDS)
 *   3. document.documentElement.setAttribute('data-brand', 'eppat')
 *      — atau setCustomTheme(eppatTheme) dari eppat-theme.ts (tanpa dukungan mode gelap)
 *
 * Sumber warna: tema aktif E-PPAT (CMS › Setting Theme) di dev-app.eppat.id, dibaca 23 Okt 2026:
 *   --eppat-brand-rgb 61 107 94 (#3D6B5E), --eppat-brand-hover-rgb 52 93 82 (#345D52),
 *   --eppat-sidebar-bg #2C3C42, --eppat-sidebar-hover #3A4D54, --eppat-line-sand-rgb 210 221 217,
 *   --eppat-paper-cream-rgb 238 243 241, --eppat-paper-vanilla-rgb 245 248 247, kartu kantor #DAC999.
 * Kontras (WCAG 2.2): teks putih di atas primary-500 #3D6B5E = 6,06:1 (AA); hover #345D52 = 7,41:1;
 *   primary-400 #4E7C6F = 4,73:1 (dipakai sebagai warna utama mode gelap).
 */

/* E-PPAT Theme - Pejabat Pembuat Akta Tanah */
[data-brand='eppat'] {
  /* Primary Colors - Hijau E-PPAT */
  --ina-primary-25: #f5f8f7;
  --ina-primary-50: #eef3f1;
  --ina-primary-100: #dde5e2;
  --ina-primary-200: #c2d3cc;
  --ina-primary-300: #9db8ae;
  --ina-primary-400: #4e7c6f;
  --ina-primary-500: #3d6b5e;
  --ina-primary-600: #345d52;
  --ina-primary-700: #2a4b42;
  --ina-primary-800: #1d3530;
  --ina-primary-900: #0f1c19;
  --ina-primary-primary: #3d6b5e;

  /* Secondary Colors - Emas kartu kantor E-PPAT */
  --ina-secondary-25: #fcfbf6;
  --ina-secondary-50: #f8f4e7;
  --ina-secondary-100: #f0e8cc;
  --ina-secondary-200: #e6dab2;
  --ina-secondary-300: #dac999;
  --ina-secondary-400: #c7b077;
  --ina-secondary-500: #ae9358;
  --ina-secondary-600: #8c7444;
  --ina-secondary-700: #6a5733;
  --ina-secondary-800: #483b23;
  --ina-secondary-900: #272013;

  /* Accent Colors (legacy IDDS, disamakan dengan secondary) */
  --ina-accent-100: #fcfbf6 !important;
  --ina-accent-200: #f8f4e7 !important;
  --ina-accent-300: #f0e8cc !important;
  --ina-accent-400: #e6dab2 !important;
  --ina-accent-500: #dac999 !important;
  --ina-accent-600: #ae9358 !important;
  --ina-accent-700: #6a5733 !important;

  /* Interactive Colors */
  --ina-brand-primary: #3d6b5e;
  --ina-brand-hover: #345d52 !important;
  --ina-neutral-hover: var(--ina-neutral-100) !important;

  /* Brand-specific colors (seperti --ina-bgn-brand-primary pada brand BGN) */
  --ina-eppat-sidebar-bg: #2c3c42;
  --ina-eppat-sidebar-hover: #3a4d54;
  --ina-eppat-sidebar-active: var(--ina-primary-500);
  --ina-eppat-sidebar-content: rgba(255, 255, 255, 0.8);
  --ina-eppat-office-card: var(--ina-secondary-300);
  --ina-eppat-stroke-brand: #d2ddd9;
  --ina-eppat-surface-cream: var(--ina-primary-50);
}

/* Aksen komponen mengikuti brand E-PPAT.
   IDDS memakai biru "guide" atau hitam untuk elemen penunjuk berikut; di E-PPAT diganti hijau brand.
   Warna status (positive/negative/warning/info pada Alert, Badge, Toast) TIDAK diubah. */
[data-brand='eppat'] .ina-button.ina-button--link { color: var(--ina-primary-500) !important; }
[data-brand='eppat'] .ina-button--link:hover:not(:disabled),
[data-brand='eppat'] .ina-button--link:focus:not(:disabled) { color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-stepper__item--active .ina-stepper__icon-wrapper {
  border-color: var(--ina-primary-500); color: var(--ina-primary-500); background-color: var(--ina-primary-50);
}
[data-brand='eppat'] .ina-stepper__item--active .ina-stepper__label { color: var(--ina-primary-500); }
[data-brand='eppat'] .ina-stepper__item--completed .ina-stepper__icon-wrapper {
  border-color: var(--ina-primary-500); color: #fff; background-color: var(--ina-primary-500);
}
[data-brand='eppat'] .ina-stepper__item--completed .ina-stepper__label { color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-stepper__separator--completed { background-color: var(--ina-primary-500); }
[data-brand='eppat'] .ina-checkbox__box--checked {
  background-color: var(--ina-primary-500); border-color: var(--ina-primary-500);
  box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 2px var(--ina-primary-500);
}
[data-brand='eppat'] .ina-pagination__page-button--active { border-color: var(--ina-primary-500); color: var(--ina-primary-600); }
[data-brand='eppat'] .ina-breadcrumb__link--active { color: var(--ina-primary-600); }

/* Penyesuaian kontras (WCAG 2.2 AA, minimal 4,5:1 untuk teks biasa).
   Warna bawaan IDDS berikut di bawah standar pada latar terang; diganti dengan corak lebih gelap
   dari keluarga warna yang SAMA sehingga arti warna tidak berubah. */
[data-brand='eppat'] .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__label,
[data-brand='eppat'] .ina-stepper__item:not(.ina-stepper__item--active):not(.ina-stepper__item--completed):not(.ina-stepper__item--error) .ina-stepper__icon-wrapper {
  color: var(--ina-content-secondary);                  /* #a3a3a3 2,5:1 → #525252 7,8:1 */
}
[data-brand='eppat'] .ina-text-field__required,
[data-brand='eppat'] .ina-text-area__required,
[data-brand='eppat'] .ina-select-dropdown__required,
[data-brand='eppat'] .ina-password-input__required,
[data-brand='eppat'] .ina-input-search__asterisk { color: var(--ina-negative-600); }      /* #f02d2d 4,1:1 → #d50b0b */
[data-brand='eppat'] .ina-select-dropdown__trigger-text--placeholder,
[data-brand='eppat'] .ina-date-picker__trigger-text--placeholder { color: var(--ina-content-secondary) !important; } /* IDDS memakai !important */
[data-brand='eppat'] .ina-alert--caution .ina-alert__title { color: var(--ina-warning-600); } /* #eebb04 1,7:1 → #855f00 */
[data-brand='eppat'] .ina-alert--info .ina-alert__title { color: var(--ina-guide-600); }
[data-brand='eppat'] .ina-alert--critical .ina-alert__title { color: var(--ina-negative-600); } /* #f02d2d 3,6:1 di atas latar alert → #d50b0b */
/* teks galat isian (#f02d2d 4,1:1 → negative-600 #d50b0b) */
[data-brand='eppat'] .ina-one-time-password__helper-text--error,
[data-brand='eppat'] .ina-text-area__helper-text--error,
[data-brand='eppat'] .ina-phone-input__helper-text--error,
[data-brand='eppat'] .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--error,
[data-brand='eppat'] .ina-file-upload__file-error,
[data-brand='eppat'] .ina-file-upload__file--error .ina-file-upload__file-name,
[data-brand='eppat'] .ina-file-upload__error-message { color: var(--ina-negative-600); }
[data-brand='eppat'] .ina-file-upload__error-message:empty { display: none; }
[data-brand='eppat'] .ina-password-input__status-message--error,
[data-brand='eppat'] .ina-password-input .ina-password-input__status-area .ina-password-input__status-message.ina-password-input__status-message--error,
[data-brand='eppat'] .ina-password-input__character-count--error { color: var(--ina-negative-600); }
/* teks peringatan isian (#eebb04 1,8:1 → warning-600) */
[data-brand='eppat'] .ina-text-field .ina-text-field__helper-text.ina-text-field__helper-text--warning,
[data-brand='eppat'] .ina-text-area__helper-text--warning,
[data-brand='eppat'] .ina-password-input__status-message--warning,
[data-brand='eppat'] .ina-password-input__character-count--warning { color: var(--ina-warning-600); }
[data-brand='eppat'] .ina-password-input__status-message--success { color: var(--ina-content-positive); }

/* E-PPAT Dark Mode Overrides */
[data-theme='dark'][data-brand='eppat'] {
  --ina-primary-primary: var(--ina-primary-400);
  --ina-brand-hover: var(--ina-primary-500) !important;
  --ina-neutral-hover: var(--ina-neutral-800) !important;
  --ina-eppat-sidebar-bg: #141c1f;
  --ina-eppat-sidebar-hover: #22302d;
  --ina-eppat-sidebar-active: var(--ina-primary-400);
  --ina-eppat-stroke-brand: #2a3a36;
  --ina-eppat-surface-cream: #18211f;
}


/* Bantuan dalam IDDS Drawer + Accordion */
.ina-drawer__content .bantu-langkah{margin:4px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.ina-drawer__content .bantu-langkah li{margin-bottom:8px}
.ina-drawer__content > p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.ina-drawer__content .bantu-sub{margin:20px 0 8px}
.ina-drawer__content .bantu-kontak{grid-template-columns:1fr}
.ina-drawer__content .ina-accordion{border-bottom:1px solid var(--ina-stroke-primary)}
.ina-drawer__content .ina-accordion__body p{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}

.judul-halaman{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.judul-halaman .judul-kiri{min-width:0}
</style>
<style id="kerangka-css">
/* ===== Order AJB — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 23–24 (HE-ORDER-01…05)
   Kerangka & teks mengikuti layar live Peruri (dilihat 23 Okt 2026, akun Asisten). ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ina-content-primary);background:var(--ina-background-secondary);-webkit-font-smoothing:antialiased}

/* protobar (khusus prototipe) */
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#0f1a17;color:#E6EDEA;font-size:12px;position:relative;z-index:60}
.protobar a{color:#E6EDEA;text-decoration:none;border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:500 11px Inter,sans-serif}
.protobar b{color:#fff}
.protobar .sep{opacity:.35}
.protobar button.pil{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
.protobar button.pil[aria-pressed="true"]{background:#3D6B5E;border-color:#3D6B5E;color:#fff}
.protobar .kanan{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
.protobar .utama{background:#3D6B5E!important;border-color:#3D6B5E!important;color:#fff!important;font-weight:600!important}
.tag-usulan{display:none!important;align-items:center;font:600 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.penanda .tag-usulan{display:inline-flex!important}
body.penanda .ditandai{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px;border-radius:10px}
.sorot{outline:3px solid #2563EB!important;outline-offset:4px;border-radius:12px}

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:var(--eppat-sidebar-icon)}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu warna (pola backlog Perdana Niaga) — nanti dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:#C2BB4B;--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.ava{width:32px;height:32px;font:600 12px Inter,sans-serif;background:var(--ina-primary-primary)!important;color:#fff!important;border-color:var(--ina-primary-primary)!important}
.uname{display:block;font:600 12px/14px Inter,sans-serif;color:var(--ina-primary-primary)}

.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}

/* daftar order */
.daftar-atas{display:flex;justify-content:flex-end;margin-top:20px}
.saring{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end;margin-top:16px}
.saring .ina-text-field__label{display:block}
.saring .cari-wadah .ina-input-search{width:100%;margin-top:6px} /* IDDS Input Search, sama dengan Minuta & Verifikasi */
.tabel-wadah{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tabel-gulir{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tabel-wadah .ina-table{border:0;border-radius:0}
table.tb td{vertical-align:middle}
table.tb td .kd{font-weight:600;color:var(--ina-primary-primary);cursor:pointer}
table.tb td .kc{font-size:12px;color:var(--ina-content-secondary)}
table.tb tr.klik{cursor:pointer}
table.tb tr.klik:hover td{background:var(--ina-primary-25)}
.aksi-baris{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kosong{padding:28px;text-align:center;color:var(--ina-content-secondary)}
.halaman{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ina-stroke-primary);font-size:13px;color:var(--ina-content-secondary)}
.halaman > span{white-space:nowrap}
[data-merah]{color:var(--ina-negative-600)!important}
.tb .ina-table__cell,.tb .ina-table__header-cell{padding:12px 16px}
.tb .ina-table__cell{white-space:normal}
.lengkap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lengkap.ok{color:var(--ina-content-positive)}
.lengkap.kurang{color:var(--ina-content-secondary)}
.lengkap svg{flex:none}

/* detail order */
.det-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kepala .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);margin-top:12px}
.det-kepala h2{margin:2px 0 0;font:600 20px/28px Inter,sans-serif}
.status-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px 28px}
.status-kartu .ina-stepper{align-items:flex-start;min-height:92px;padding:4px 64px 0}
.status-kartu .ina-stepper__separator{align-self:flex-start;margin-top:11px}
.status-kartu .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.status-kaki{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ina-stroke-primary);margin-top:8px;padding-top:16px}
.status-kaki p{margin:0;font-size:14px;color:var(--ina-content-secondary)}
.status-kaki p b{color:var(--ina-content-primary)}
.status-kaki .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-kaki .alasan{font-size:12.5px;color:var(--ina-content-secondary)}
.syarat{margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.syarat h4{margin:0 0 10px;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syarat h4 .hit{font-weight:500;color:var(--ina-content-secondary)}
.syarat ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.syarat li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.syarat li .ik{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none}
.syarat li.ok .ik{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.syarat li.kurang .ik{background:var(--ina-warning-100);color:var(--ina-warning-600)}
.syarat li.ok span.t{color:var(--ina-content-secondary)}
.syarat li .ina-button{padding:0;height:auto;min-height:0}
.syarat-alert{margin-top:16px}
.syarat-alert .ina-alert__description{display:flex;flex-direction:column;gap:10px}
.syarat-daftar{display:flex;flex-wrap:wrap;gap:8px 16px}
.syarat-item{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-badge{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-button{padding:0 4px}
.langkah-berikut{color:var(--ina-content-primary)}
.info-baris{margin-top:16px}
.info-baris .ina-alert__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
.info-baris .ina-alert__text-section{flex:1;min-width:220px}

.tab-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tab-kartu > .ina-tab-horizontal{padding:0 12px;border-bottom:1px solid var(--ina-stroke-primary)}
.tab-kartu .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center}
.tab-kartu .tanda{font:600 11px Inter,sans-serif;border-radius:999px;padding:1px 7px}
.tab-kartu .tanda.ok{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.tab-kartu .tanda.kurang{background:var(--ina-warning-100);color:var(--ina-warning-700)}
.tab-kartu .tanda.netral{background:var(--ina-neutral-100);color:var(--ina-content-secondary)}
.tab-isi{padding:20px}
.tab-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tab-bar p{margin:0;font-size:13px;color:var(--ina-content-secondary)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-field textarea.ina-text-field__input{min-height:80px;resize:vertical;padding:0}
.f-kaki{display:flex;justify-content:flex-end;margin-top:16px}
.tb .nm{font-weight:500}
.tb .sub2{font-size:12px;color:var(--ina-content-secondary)}
.kunci{margin-bottom:16px}

/* dialog */
.ina-modal__body p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary)}
.seg button{border:0;border-radius:7px;background:transparent;padding:7px 14px;font:500 14px Inter,sans-serif;color:var(--ina-content-secondary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ina-primary-primary);color:#fff}
.fld{margin-bottom:16px}
.fld > .ina-text-field__label{display:flex;align-items:center;gap:6px}
.select-wadah{position:relative;display:block;width:100%}
.select-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:0;max-height:240px}
.cari-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.1);padding:4px;max-height:220px;overflow:auto}
.cari-panel button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.cari-panel button:hover{background:var(--ina-background-tertiary)}
.cari-panel small{display:block;font-size:12px;color:var(--ina-content-secondary)}
.kartu-pihak{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px;background:var(--ina-background-secondary);font-size:13.5px}
.kartu-pihak b{display:block;font-size:14px;margin-bottom:6px}
.kartu-pihak dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.kartu-pihak dt{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu-pihak dd{margin:0}
.belum-ada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ina-primary-25);border:1px solid var(--ina-primary-100);font-size:13px}
.ringkas-kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:12px 0 14px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas-kv dt{color:var(--ina-content-secondary)}
.ringkas-kv dd{margin:0;font-weight:500}
.cek-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;cursor:pointer}

.daftar-ubah{display:flex;flex-direction:column;gap:10px}
.daftar-ubah .it{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px}
.daftar-ubah .it .a{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daftar-ubah .it code{font:600 11.5px ui-monospace,Menlo,monospace;color:#2563EB}
.daftar-ubah .it b{font-size:14px}
.daftar-ubah .it p{margin:6px 0 4px;font-size:13px;line-height:19px;color:var(--ina-content-primary)}
.daftar-ubah .it .lama{font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.bantu-langkah{margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.bantu-langkah li{margin-bottom:6px}
.bantu-sub{margin:18px 0 8px;font:600 14px Inter,sans-serif;display:flex;align-items:center}
.bantu-faq{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.bantu-faq summary{cursor:pointer;font-weight:500}
.bantu-faq p{margin:8px 0 0!important}
.bantu-kontak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bantu-kontak div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.bantu-kontak b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.bantu-kontak span{font-size:14px}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.toast-wadah{position:fixed;bottom:24px;right:24px;z-index:100;max-width:calc(100vw - 32px)}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--ina-stroke-secondary);color:var(--ina-content-secondary);font:600 10px Inter,sans-serif;cursor:help;background:transparent;padding:0}
.ina-tooltip__bubble{max-width:260px;white-space:normal}

@media (max-width:1024px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,26,23,.45);z-index:35;opacity:0;pointer-events:none;transition:.22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .syarat ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  header.top{padding:0 16px}
  .user .txt,#bukaBantuan span{display:none}
  .page{padding:20px 16px 40px}
  h1{font-size:23px;line-height:32px}
  .saring{grid-template-columns:1fr}
  .f-grid,.syarat ul,.kartu-pihak dl,.bantu-kontak{grid-template-columns:1fr}
  .status-kartu{padding:18px 16px}
  .status-kartu .stepper-h{display:none}
  .status-kartu .stepper-v{display:flex!important;padding:4px 0}
  .ringkas-kv{grid-template-columns:1fr;gap:2px}
  .protobar .kanan{margin-left:0}
  table.tb thead{display:none}
  table.tb tr{display:block;border-top:1px solid var(--ina-stroke-primary);padding:8px 0}
  table.tb td{display:block;border:0;padding:4px 16px}
  .aksi-baris{justify-content:flex-start}
}
.status-kartu .stepper-v{display:none}
.status-kartu .stepper-v .ina-stepper__label small{display:inline;margin:0 0 0 8px}
.status-kartu .stepper-v .ina-stepper__separator{min-height:24px;height:24px}

<style id="verif-css">
/* ===== Verifikasi Akta (Asisten/PPAT) — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital (skor 54,5; rincian di UX Metric Lab, Highlight #5) (HE-VERIF-01…05)
   Kerangka, tab, isian, dan teks mengikuti layar & kode live Peruri (dilihat 23 Okt 2026). Data contoh sama dengan prototipe Order AJB. ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45}
.istilah{border-bottom:1px dashed currentColor;cursor:help}
.ina-modal-confirmation{max-width:560px}

/* daftar */
.saring-v{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.saring-v .ina-input-search{flex:1;width:auto;min-width:220px}
.urut-wadah{position:relative}
.urut-wadah .ina-select-dropdown__trigger{min-width:230px}
.urut-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:auto;right:0;min-width:240px;z-index:20}
.ringkas-saring{margin-top:10px;font-size:13px;color:var(--ina-content-secondary)}
.tunggu{display:flex;flex-direction:column;gap:2px}
.tunggu small{font-size:12px;color:var(--ina-content-secondary)}
.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}

/* detail */
.det-atas{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-atas .meta{font-size:14px;color:var(--ina-content-secondary)}
.det-judul{margin:12px 0 0;font:500 22px/30px Inter,sans-serif;color:var(--ina-primary-primary)}
.det-sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.info-tunggu{margin-top:16px}
.info-tunggu .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.info-tunggu .ina-alert__text-section{flex:1;min-width:240px}
.tab-verif{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:12px;padding:0 8px}
.tab-verif .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center;justify-content:center}
.kartu.ina-card{display:block;width:100%;max-width:none;margin-top:16px;padding:24px;border-radius:16px}
.kartu .ina-card__content{padding:0;display:block}
.kartu-kepala{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.kartu-kepala .ikon-bulat{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--ina-primary-50);color:var(--ina-primary-600);flex:none}
.kartu-kepala h2{margin:0;font:600 19px/28px Inter,sans-serif;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kartu-kepala p{margin:4px 0 0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.kartu-kepala .kanan{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kartu-kepala .kanan small{font-size:12px;color:var(--ina-content-secondary)}
.daftar-pihak{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.daftar-pihak li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:12px}
.daftar-pihak .nm{font-weight:600;font-size:15px}
.daftar-pihak .peran{font-size:12px;color:var(--ina-content-secondary);letter-spacing:.5px}
.daftar-pihak .kanan{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daftar-pihak .solusi{flex-basis:100%;margin:0;font-size:13px;color:var(--ina-content-secondary)}
.daftar-pihak li.perlu{border-color:var(--ina-warning-300,#f5c451);background:var(--ina-warning-50,#fffbeb)}
.cek{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.objek{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px;margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;font-size:14px}
.objek dt{font-size:12px;color:var(--ina-content-secondary)}
.objek dd{margin:2px 0 0;font-weight:500}
.objek .lebar{grid-column:1/-1}
.periksa{margin:16px 0 0;padding:12px 16px 12px 34px;border-radius:12px;background:var(--ina-background-secondary);font-size:14px;line-height:24px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-area{margin-top:16px}
.hitung{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--ina-background-secondary)}
.hitung span{display:block;font-size:12px;color:var(--ina-content-secondary)}
.hitung b{display:block;font-size:18px;color:var(--ina-primary-primary);margin-top:2px}
.hitung small{display:block;font-size:12px;color:var(--ina-content-secondary);margin-top:2px}
.banding{margin-top:12px}
.kartu-kaki{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.kartu-kaki .ket{margin-right:auto;font-size:13px;color:var(--ina-content-secondary)}
.selesai-semua{margin-top:16px}
.selesai-semua .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.selesai-semua .ina-alert__text-section{flex:1;min-width:240px}
.ringkas{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:12px 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas dt{color:var(--ina-content-secondary)}
.ringkas dd{margin:0;font-weight:500}
.ina-text-field__prefix-text{font-size:14px;color:var(--ina-content-secondary);padding-right:6px}

@media (max-width:760px){
  .tab-verif .ina-tab-horizontal__tab span.lbl{font-size:13px}
  .kartu.ina-card{padding:18px 16px}
  .objek{grid-template-columns:1fr 1fr}
  .f-grid,.hitung{grid-template-columns:1fr}
  .ringkas{grid-template-columns:1fr;gap:2px}
  .ringkas dd{margin-bottom:6px}
  .saring-v .ina-button-group{width:100%;overflow-x:auto}
  .urut-wadah,.urut-wadah .ina-select-dropdown__trigger{width:100%}
  .kartu-kepala .kanan{margin-left:0;align-items:flex-start}
}
</style>
</head>

function terbilang(n) {
  n = Math.floor(n);
  if (n < 12) return SATUAN[n];
  if (n < 20) return terbilang(n - 10) + ' belas';
  if (n < 100) return terbilang(Math.floor(n / 10)) + ' puluh' + (n % 10 ? ' ' + terbilang(n % 10) : '');
  if (n < 200) return 'seratus' + (n - 100 ? ' ' + terbilang(n - 100) : '');
  if (n < 1000) return terbilang(Math.floor(n / 100)) + ' ratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
  if (n < 2000) return 'seribu' + (n - 1000 ? ' ' + terbilang(n - 1000) : '');
  if (n < 1e6) return terbilang(Math.floor(n / 1000)) + ' ribu' + (n % 1000 ? ' ' + terbilang(n % 1000) : '');
  if (n < 1e9) return terbilang(Math.floor(n / 1e6)) + ' juta' + (n % 1e6 ? ' ' + terbilang(n % 1e6) : '');
  if (n < 1e12) return terbilang(Math.floor(n / 1e9)) + ' miliar' + (n % 1e9 ? ' ' + terbilang(n % 1e9) : '');
  return terbilang(Math.floor(n / 1e12)) + ' triliun' + (n % 1e12 ? ' ' + terbilang(n % 1e12) : '');
}

const tgl = d => new Intl.DateTimeFormat('id-ID', { day:'numeric', month:'short', year:'numeric' }).format(d);
const lama = x => Math.round((HARI_INI - x.siap) / 864e5);
const jml = x => Object.values(x.v).filter(Boolean).length;
const pihakOk = p => p.akun ? p.ca === 'active' : p.manual;
/* status bagian, label live: verified = Terverifikasi, failed = Belum lengkap, lainnya = Belum diverifikasi */
function statusPihak(x) { if (x.v.pihak) return 'ok'; if (!x.dicek) return 'belum'; return 'gagal'; }
const LBL = { ok:['Terverifikasi', 'success'], gagal:['Perlu dicek', 'warning'], belum:['Belum diverifikasi', 'neutral'] };
const statusBagian = (x, k) => k === 'pihak' ? statusPihak(x) : x.v[k] ? 'ok' : 'belum';

/* ---------------- keadaan ---------------- */
const S = { layar:'daftar', aktif:null, tab:'pihak', cari:'', grup:'', urut:'lama', urutBuka:false, memuat:'' };
const o = () => DATA.find(x => x.kode === S.aktif);

/* ---------------- sidebar (menu live Asisten Peruri, sama dengan prototipe Order AJB) ---------------- */
const NAV = [ /* sidebar seragam semua prototipe staf (sidebar-seragam.js) */
  { g:'Layanan', ik:'tb_stack_2', m:[['Permohonan AJB','tb_file_text']] },
  { g:'Akta', ik:'tb_feather', m:[['Dashboard Akta','tb_layout_dashboard'],['Verifikasi Berkas','tb_circle_check','verif'],['Penyusunan Akta','tb_file_pencil'],['Penandatanganan Akta','tb_signature'],['Salinan Akta','tb_files']] },
  { g:'Pengaturan Kantor', ik:'tb_adjustments_horizontal', m:[['Profil Kantor','tb_building'],['Daftar Pengguna','tb_users'],['Peran & Izin','tb_shield_lock'],['Log Aktivitas','tb_history'],['Aktivasi e-Meterai','tb_rubber_stamp']] },
  { g:'Pengaturan Aplikasi', ik:'tb_settings', m:[['Dashboard Sistem','tb_gauge'],['Pengaturan','tb_settings']] },
  { g:'Konten Situs', ik:'tb_layout_cards', m:[['Halaman Depan','tb_home'],['Tema Tampilan','tb_palette'],['Master Konten','tb_database'],['Artikel & Halaman','tb_article'],['Pustaka Media','tb_photo']] }
];
const grupBuka = new Set([0, 1, 2, 3, 4]);
function gambarNav() {
  $('#nav').innerHTML = NAV.map((g, i) => `
    <button class="grp" data-grp="${i}" aria-expanded="${grupBuka.has(i)}">${ik(g.ik, 14)}<span>${g.g}</span><span class="chev">${ik('chev', 12)}</span></button>
    <div class="items" ${grupBuka.has(i) ? '' : 'hidden'}>${g.m.map(([t, ic, ke]) => `<a href="#" class="ina-button ina-button--link ina-button--md nav-item ${ke ? 'on' : ''}" data-ke="${ke || ''}" data-nama="${t}">${ik(ic)}<span>${t}</span></a>`).join('')}</div>`).join('');
}
const PROTO = { 'Permohonan AJB':'Backlog-HE-ORDER-Prototype.html', 'Dashboard Akta':'Backlog-IDDS-TN-EPPAT-Prototype.html#dashboard', 'Penyusunan Akta':'Backlog-HE-MINUTA-Prototype.html', 'Penandatanganan Akta':'Backlog-HE-EAW-Prototype.html', 'Salinan Akta':'Backlog-IDDS-TN-EPPAT-Prototype.html#salinan', 'Profil Kantor':'Backlog-IDDS-TN-EPPAT-Prototype.html#profil', 'Daftar Pengguna':'Backlog-HE-USER-Prototype.html', 'Peran & Izin':'Backlog-IDDS-TN-SYSTEM-Prototype.html#peran', 'Log Aktivitas':'Backlog-IDDS-TN-SYSTEM-Prototype.html#logs', 'Aktivasi e-Meterai':'Backlog-IDDS-TN-EPPAT-Prototype.html#emeterai', 'Dashboard Sistem':'Backlog-IDDS-TN-SYSTEM-Prototype.html#dasbor', 'Pengaturan':'Backlog-IDDS-TN-SYSTEM-Prototype.html#pengaturan', 'Halaman Depan':'Backlog-IDDS-TN-CMS-Prototype.html#landing', 'Tema Tampilan':'Backlog-IDDS-TN-CMS-Prototype.html#tema', 'Master Konten':'Backlog-IDDS-TN-CMS-Prototype.html#master', 'Artikel & Halaman':'Backlog-IDDS-TN-CMS-Prototype.html#posts', 'Pustaka Media':'Backlog-IDDS-TN-CMS-Prototype.html#media' }; /* menu → prototipe */
$('#nav').addEventListener('click', e => {
  const g = e.target.closest('.grp'); if (g) { const i = +g.dataset.grp; grupBuka.has(i) ? grupBuka.delete(i) : grupBuka.add(i); gambarNav(); return; }
  const a = e.target.closest('a'); if (!a) return; e.preventDefault();
  if (!a.dataset.ke) { const nm = a.textContent.trim(); if (PROTO[nm]) { location.href = PROTO[nm]; return; } toast(`Menu ${nm} belum memiliki prototipe.`); return; }
  keDaftar();
});

/* ---------------- layar daftar (seperti live) ---------------- */
const remah = () => `<nav class="ina-breadcrumb" aria-label="Breadcrumb"><ol class="ina-breadcrumb__list"><li class="ina-breadcrumb__item"><a href="#" class="ina-breadcrumb__link" data-ke-daftar><span class="ina-breadcrumb__text">Akta</span></a><span class="ina-breadcrumb__separator" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></li><li class="ina-breadcrumb__item"><span class="ina-breadcrumb__link ina-breadcrumb__link--active"><span class="ina-breadcrumb__text">Verifikasi</span></span></li></ol></nav>`;
const cari = (id, ph, v, label) => `<div class="ina-input-search"><div class="ina-input-search__wrapper"><span class="ina-input-search__search-icon">${ik('cari', 20)}</span><input id="${id}" class="ina-input-search__input" type="search" placeholder="${ph}" aria-label="${label}" value="${esc(v)}" autocomplete="off"></div></div>`;
const URUT = [['lama', 'Paling lama menunggu'], ['baru', 'Terbaru masuk']];
const grupDari = x => jml(x) === 0 ? 'belum' : jml(x) < 3 ? 'sebagian' : 'lengkap';
function lencanaProgres(x) { const n = jml(x); return badge(`${n}/3 terverifikasi`, n >= 3 ? 'success' : n > 0 ? 'info' : 'neutral', 'sm'); }
function layarDaftar() {
  const q = S.cari.trim().toLowerCase();
  const rows = DATA.filter(x => (!S.grup || grupDari(x) === S.grup) && (!q || `${x.kode} ${x.klien}`.toLowerCase().includes(q)))
    .sort((a, b) => S.urut === 'baru' ? b.siap - a.siap : a.siap - b.siap);
  const n = g => DATA.filter(x => !g || grupDari(x) === g).length;
  const grp = [['', 'Semua'], ['belum', 'Belum dimulai'], ['sebagian', 'Sebagian'], ['lengkap', 'Lengkap']];
  return `${remah()}<h1>Verifikasi Berkas</h1><p class="sub">Pilih permohonan berstatus Siap untuk memeriksa data para pihak, objek tanah, dan harga sebelum minuta disusun.</p>
    <div class="saring-v ditandai" id="saringVerif">
      ${cari('cariVerif', 'Cari kode / klien…', S.cari, 'Cari order')}
      <div class="ina-button-group" role="group" aria-label="Saring kemajuan verifikasi">${grp.map(([v, t]) => `<button type="button" class="ina-button-group__button ${v === S.grup ? 'ina-button-group__button--selected' : ''}" aria-pressed="${v === S.grup}" data-grup="${v}"><span class="ina-button-group__button-content">${t} (${n(v)})</span></button>`).join('')}</div>
      <div class="ina-select-dropdown urut-wadah"><button type="button" class="ina-select-dropdown__trigger ina-select-dropdown__trigger--size-md" id="urutTombol" aria-haspopup="listbox" aria-expanded="${S.urutBuka}" aria-label="Urutkan daftar"><span class="ina-select-dropdown__trigger-text ina-select-dropdown__trigger-text--selected">Urutkan: ${URUT.find(u => u[0] === S.urut)[1]}</span>${ik('bawah')}</button>
        ${S.urutBuka ? `<div class="ina-select-dropdown__panel"><div class="ina-select-dropdown__options" role="listbox">${URUT.map(([v, t]) => `<button type="button" role="option" aria-selected="${v === S.urut}" class="ina-select-dropdown__option ${v === S.urut ? 'ina-select-dropdown__option--selected-single' : ''}" data-urut="${v}">${t}</button>`).join('')}</div></div>` : ''}</div>
      ${usulan('HE-VERIF-04')}
    </div>
    <p class="ringkas-saring" aria-live="polite">Menampilkan ${rows.length} dari ${DATA.length} order${S.grup || S.cari ? '' : ` · ${DATA.filter(x => jml(x) < 3 && lama(x) > BATAS_HARI).length} permohonan menunggu lebih dari ${BATAS_HARI} hari`}.</p>
    <div class="tabel-wadah"><div class="tabel-gulir"><div class="ina-table"><table class="ina-table__container tb">
      <thead class="ina-table__header"><tr><th class="ina-table__header-cell">Kode</th><th class="ina-table__header-cell">Jenis Akta</th><th class="ina-table__header-cell">Klien</th><th class="ina-table__header-cell">Verifikasi</th><th class="ina-table__header-cell">Menunggu ${usulan('HE-VERIF-02')}</th><th class="ina-table__header-cell">Dibuat</th><th class="ina-table__header-cell"></th></tr></thead>
      <tbody class="ina-table__body">${rows.length ? rows.map(x => { const t = lama(x), telat = jml(x) < 3 && t > BATAS_HARI;
        return `<tr class="ina-table__row ina-table__row--clickable klik" data-buka="${x.kode}">
        <td class="ina-table__cell"><span class="kd">${x.kode}</span></td><td class="ina-table__cell">Akta Jual Beli</td><td class="ina-table__cell">${esc(x.klien)}</td>
        <td class="ina-table__cell">${lencanaProgres(x)}</td>
        <td class="ina-table__cell"><div class="tunggu">${jml(x) >= 3 ? '<span>—</span><small>Selesai diverifikasi</small>' : `<span>${t} hari ${telat ? badge(`Lewat ${BATAS_HARI} hari`, 'warning', 'sm') : ''}</span><small>Siap sejak ${tgl(x.siap)}</small>`}</div></td>
        <td class="ina-table__cell">${tgl(x.dibuat)}</td>
        <td class="ina-table__cell" style="text-align:right">${tombol(jml(x) >= 3 ? 'Lihat' : 'Verifikasi', jml(x) >= 3 ? 'secondary' : 'primary', 'sm', `data-buka="${x.kode}"`, ik('tameng', 14))}</td></tr>`; }).join('')
        : `<tr><td colspan="7" class="ina-table__empty-cell kosong">Tidak ada permohonan yang cocok.<div style="margin-top:10px">${tombol('Hapus pencarian dan saringan', 'secondary', 'sm', 'data-reset-saring')}</div></td></tr>`}</tbody></table></div></div>
      <div class="halaman"><span>Menampilkan 1–${rows.length} dari ${rows.length}</span><div class="ina-pagination"><div class="ina-pagination__nav-container"><div class="ina-pagination__page-info">Halaman 1 dari 1</div><div class="ina-pagination__nav-buttons"><button type="button" class="ina-pagination__nav-button ina-pagination__nav-button--disabled" disabled aria-label="Sebelumnya">${ik('kiri', 16)}</button><button type="button" class="ina-pagination__page-button ina-pagination__page-button--active">1</button><button type="button" class="ina-pagination__nav-button ina-pagination__nav-button--disabled" disabled aria-label="Berikutnya">${ik('chev', 16)}</button></div></div></div></div>
    </div>`;
}

/* ---------------- layar detail ---------------- */
const TAB = [['pihak', 'Para Pihak', 'users'], ['objek', 'Objek Tanah', 'tanah'], ['harga', 'Harga Tanah', 'uang']];
function layarDetail() {
  const x = o(), n = jml(x), t = lama(x);
  const info = n >= 3 ? `<div class="selesai-semua ditandai" id="selesaiSemua">${alert('success', 'Ketiga verifikasi selesai', `Permohonan ${x.kode} siap masuk tahap penyusunan minuta. Pindahkan status permohonan ke <b>Penyusunan</b> di menu Permohonan AJB.${usulan('HE-VERIF-05')}`, tombol('Buka Permohonan AJB', 'primary', 'sm', 'data-ke-order', ik('panah', 14)))}</div>`
    : `<div class="info-tunggu ditandai" id="infoTunggu">${alert(t > BATAS_HARI ? 'caution' : 'info', t > BATAS_HARI ? `Menunggu verifikasi ${t} hari` : `${3 - n} bagian lagi sebelum penyusunan`, `Permohonan berstatus Siap sejak ${tgl(x.siap)}${t > BATAS_HARI ? `, lebih dari batas ${est(BATAS_HARI + ' hari')}` : ''}. Penyusunan minuta baru dapat dimulai setelah para pihak, objek tanah, dan harga terverifikasi.${usulan('HE-VERIF-02')}`)}</div>`;
  return `${remah()}<h1>Verifikasi Berkas</h1><p class="sub">Periksa data para pihak, objek tanah, dan harga, lalu tandai setiap bagian yang sudah sesuai.</p>
    <div class="det-atas">${tombol('Kembali', 'secondary', 'sm', 'id="kembali"', ik('kiri', 14))}<span class="meta">${x.kode} · Akta Jual Beli · ${esc(x.klien)}</span></div>
    ${info}
    <div class="tab-verif ina-tab-horizontal ina-tab-horizontal--full-width ina-tab-horizontal--use-brand-color ditandai" id="tabVerif"><div class="ina-tab-horizontal__container ina-tab-horizontal__container--full-width" role="tablist">${TAB.map(([k, l, ic]) => { const [bl, bj] = LBL[statusBagian(x, k)];
      return `<button type="button" role="tab" data-tab="${k}" aria-selected="${S.tab === k}" class="ina-tab-horizontal__tab ina-tab-horizontal__tab--size-md ina-tab-horizontal__tab--variant-outline ina-tab-horizontal__tab--full-width ${S.tab === k ? 'ina-tab-horizontal__tab--selected' : ''}">${ik(ic, 16)}<span class="lbl">${l}</span>${badge(bl, bj, 'sm')}</button>`; }).join('')}</div></div>
    ${S.tab === 'pihak' ? tabPihak(x) : S.tab === 'objek' ? tabObjek(x) : tabHarga(x)}`;
}
const kepala = (ikon, judul, status, ket, kanan = '') => `<div class="kartu-kepala"><span class="ikon-bulat">${ik(ikon, 20)}</span><div style="flex:1;min-width:0"><h2>${judul} ${badge(...LBL[status], 'sm')}</h2><p>${ket}</p></div>${kanan}</div>`;
function tabPihak(x) {
  const st = statusPihak(x);
  const kanan = `<div class="kanan">${tombol('Cek CA Semua Pihak', 'primary', 'sm', `id="cekCa" ${S.memuat ? 'disabled' : ''}`, S.memuat === 'ca' ? spinner : ik('kilau', 14))}<small>${x.dicek ? `Terakhir dicek ${x.dicek}` : 'Belum pernah dicek'}</small></div>`;
  const isi = !x.dicek ? `<p class="periksa" style="padding-left:16px">Klik "Cek CA Semua Pihak" untuk memuat status tiap pihak.</p>`
    : `<ul class="daftar-pihak ditandai" id="daftarPihak">${x.pihak.map((p, i) => { const ok = pihakOk(p), c = CA[p.ca];
      return `<li class="${ok ? '' : 'perlu'}"><span class="nm">${esc(p.nama)}</span><span class="peran">${p.tipe}</span>
        ${p.akun ? denganTip(badge(c.l, c.b, 'sm'), ISTILAH.CA) : `<label class="ina-checkbox cek" for="manual${i}"><input type="checkbox" id="manual${i}" class="ina-checkbox__input peer" data-manual="${i}" ${p.manual ? 'checked' : ''}><div class="ina-checkbox__box ina-checkbox__box--${p.manual ? 'checked' : 'unchecked'}">${p.manual ? ik('centang', 12) : ''}</div><div class="ina-checkbox__content"><span class="ina-checkbox__label">${istilah('Verifikasi manual', 'MANUAL')} (tanpa CA)</span></div></label>`}
        <span class="kanan">${ok ? badge(`${ik('centang', 12)} Terverifikasi`, 'success', 'sm') : badge(p.akun ? 'CA belum aktif' : 'Belum diperiksa', 'warning', 'sm')}</span>
        ${ok ? '' : `<p class="solusi">${ik('info', 13)} ${p.akun ? SOLUSI[p.ca] : 'Pihak tidak punya akun E-PPAT. Periksa KTP asli pihak, lalu centang Verifikasi manual.'}${usulan('HE-VERIF-01')}</p>`}</li>`; }).join('')}</ul>`;
  return `<section class="ina-card ina-card--variant-basic kartu"><div class="ina-card__content">
    ${kepala('users', 'Verifikasi Para Pihak', st, `Pihak dengan ${istilah('sertifikat elektronik (CA)', 'CA')} aktif otomatis terverifikasi oleh Peruri.`, kanan)}
    ${isi}</div></section>`;
}
function tabObjek(x) {
  const st = statusBagian(x, 'objek'), ob = x.objek;
  return `<section class="ina-card ina-card--variant-basic kartu"><div class="ina-card__content">
    ${kepala('tanah', 'Verifikasi Objek Tanah', st, 'Konfirmasi data objek secara manual (integrasi BPN menyusul).')}
    ${ob.length ? ob.map(b => `<dl class="objek"><div><dt>Hak</dt><dd>${b.hak}</dd></div><div><dt>No. Sertifikat</dt><dd>${b.sertifikat}</dd></div><div><dt>${istilah('NIB', 'NIB')}</dt><dd>${b.nib}</dd></div><div><dt>Luas</dt><dd>${b.luas} m²</dd></div><div class="lebar"><dt>Lokasi</dt><dd>${esc(b.lokasi)}</dd></div></dl>`).join('') : alert('critical', '', 'Belum ada objek tanah di permohonan ini. Tambahkan objek di menu Permohonan AJB.')}
    <div class="ina-text-area" id="f-catObjek"><label class="ina-text-area__label" for="catObjek">Catatan Verifikasi <span class="opsional" style="font-weight:400;color:var(--ina-content-secondary)">(opsional)</span></label><div class="ina-text-area__wrapper ina-text-area__wrapper--status-neutral"><textarea id="catObjek" class="ina-text-area__input" rows="3" placeholder="Mis. sertifikat asli dicek, tidak ada sengketa/blokir." ${st === 'ok' ? 'disabled' : ''}>${esc(x.catObjek)}</textarea></div></div>
    <div class="kartu-kaki">${st === 'ok' ? `<span class="ket">${ik('centang', 14)} Objek tanah sudah terverifikasi.</span>` : `<span class="ket">Anda akan diminta mengonfirmasi hasil pemeriksaan.</span>${tombol('Tandai Terverifikasi', 'primary', 'md', `id="verifObjek" ${ob.length && !S.memuat ? '' : 'disabled'}`, S.memuat === 'objek' ? spinner : ik('centang', 16))}`}</div>
  </div></section>`;
}
function tabHarga(x) {
  const st = statusBagian(x, 'harga'), kunci = st === 'ok' ? 'disabled' : '';
  const nilai = x.njop && x.luas ? x.njop * x.luas : null;
  const banding = nilai == null ? '' : x.harga >= nilai ? alert('success', '', `Harga jual ${rp(x.harga)} sama dengan atau di atas nilai NJOP. Harga wajar.`)
    : alert('caution', 'Harga jual di bawah NJOP', `Harga jual ${rp(x.harga)} lebih rendah ${rp(nilai - x.harga)} dari nilai NJOP. Tulis alasannya di catatan sebelum memverifikasi.${usulan('HE-VERIF-03')}`);
  return `<section class="ina-card ina-card--variant-basic kartu"><div class="ina-card__content">
    ${kepala('uang', 'Verifikasi Harga Tanah (NJOP)', st, `Bandingkan harga jual di permohonan dengan nilai ${istilah('NJOP', 'NJOP')} dari SPPT PBB tahun berjalan.`)}
    <div class="f-grid">
      <div class="ina-text-field" id="f-njop"><label class="ina-text-field__label" for="njop">NJOP per m²<span class="ina-text-field__required">*</span></label>
        <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><span class="ina-text-field__prefix-text">Rp</span><input id="njop" class="ina-text-field__input" inputmode="numeric" placeholder="0" value="${x.njop ? Number(x.njop).toLocaleString('id-ID') : ''}" ${kunci}></div>
        <div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text" id="h-njop" data-bantu="Lihat SPPT PBB tahun berjalan.">${x.njop ? terbilang(x.njop) + ' rupiah' : 'Lihat SPPT PBB tahun berjalan.'}</div></div></div>
      <div class="ina-text-field" id="f-luas"><label class="ina-text-field__label" for="luas">Luas Tanah (m²)<span class="ina-text-field__required">*</span></label>
        <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><input id="luas" class="ina-text-field__input" inputmode="numeric" value="${x.luas ?? ''}" ${kunci}></div>
        <div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text" id="h-luas" data-bantu="Terisi dari data objek tanah.">Terisi dari data objek tanah.</div></div></div>
    </div>
    <div class="hitung"><div><span>Nilai NJOP (NJOP × luas)</span><b id="nilaiNjop">${rp(nilai)}</b><small id="nilaiTerbilang">${nilai ? terbilang(nilai) + ' rupiah' : 'Isi NJOP per m² dan luas tanah.'}</small></div><div><span>Harga Jual (dari permohonan)</span><b>${rp(x.harga)}</b><small>${terbilang(x.harga)} rupiah</small></div></div>
    <div class="banding" id="banding">${banding}</div>
    <div class="ina-text-area" id="f-catHarga"><label class="ina-text-area__label" for="catHarga">Catatan<span id="wajibCat">${nilai != null && x.harga < nilai ? '<span class="ina-text-field__required">*</span>' : ' <span style="font-weight:400;color:var(--ina-content-secondary)">(opsional)</span>'}</span></label><div class="ina-text-area__wrapper ina-text-area__wrapper--status-neutral"><textarea id="catHarga" class="ina-text-area__input" rows="2" placeholder="Mis. NJOP sesuai SPPT PBB tahun berjalan." ${kunci}>${esc(x.catHarga)}</textarea></div><div class="ina-text-field__helper-text" id="h-catHarga" data-bantu=""></div></div>
    <div class="kartu-kaki">${st === 'ok' ? `<span class="ket">${ik('centang', 14)} Harga tanah sudah terverifikasi.</span>` : tombol('Simpan & Verifikasi', 'primary', 'md', `id="verifHarga" ${S.memuat ? 'disabled' : ''}`, S.memuat === 'harga' ? spinner : ik('centang', 16))}</div>
  </div></section>`;
}

/* ---------------- gambar & navigasi ---------------- */
function gambar() { gambarNav(); $('#halaman').innerHTML = S.layar === 'daftar' ? layarDaftar() : layarDetail(); pasangPanduan(); }
function keDaftar() { Object.assign(S, { layar:'daftar', aktif:null, urutBuka:false }); gambar(); window.scrollTo({ top:0 }); }
function buka(kode, tab) {
  const x = DATA.find(y => y.kode === kode);
  /* tab pertama yang belum selesai dibuka otomatis (HE-VERIF-05) */
  Object.assign(S, { layar:'detail', aktif:kode, tab:tab || ['pihak', 'objek', 'harga'].find(k => !x.v[k]) || 'pihak' });
  gambar(); window.scrollTo({ top:0 });
}
const BERIKUT = { pihak:'objek', objek:'harga', harga:null };
const NAMA = { pihak:'Para pihak', objek:'Objek tanah', harga:'Harga tanah' };
function selesaiBagian(x, k) {
  x.v[k] = true; const lanjut = ['pihak', 'objek', 'harga'].find(b => !x.v[b]);
  if (lanjut) { S.tab = lanjut; gambar(); toast(`${NAMA[k]} terverifikasi.`, 'positive', 3500, `Lanjutkan ke ${NAMA[lanjut].toLowerCase()} (${jml(x)} dari 3 selesai).`); }
  else { gambar(); toast(`${NAMA[k]} terverifikasi.`, 'positive', 4000, 'Ketiga verifikasi selesai. Permohonan siap penyusunan.'); $('#selesaiSemua')?.scrollIntoView({ block:'center', behavior:'smooth' }); }
}
function tunggu(id, ms, lalu) { S.memuat = id; gambar(); setTimeout(() => { S.memuat = ''; lalu(); }, ms); }

/* ---------------- interaksi ---------------- */
const H = $('#halaman');
H.addEventListener('input', e => {
  if (e.target.id === 'cariVerif') { S.cari = e.target.value; const pos = e.target.selectionStart; gambar(); const i = $('#cariVerif'); i.focus(); i.setSelectionRange(pos, pos); return; }
  const x = o(); if (!x) return;
  if (e.target.id === 'catObjek') x.catObjek = e.target.value;
  if (e.target.id === 'catHarga') { x.catHarga = e.target.value; bersih('catHarga'); }
  if (e.target.id === 'njop' || e.target.id === 'luas') {
    const angka = e.target.value.replace(/\D/g, '');
    if (e.target.id === 'njop') { x.njop = angka ? +angka : null; e.target.value = angka ? (+angka).toLocaleString('id-ID') : ''; $('#h-njop').textContent = x.njop ? terbilang(x.njop) + ' rupiah' : $('#h-njop').dataset.bantu; }
    else { x.luas = angka ? +angka : null; e.target.value = angka; }
    bersih(e.target.id); segarHitung(x);
  }
});
function segarHitung(x) {
  const nilai = x.njop && x.luas ? x.njop * x.luas : null;
  $('#nilaiNjop').textContent = rp(nilai); $('#nilaiTerbilang').textContent = nilai ? terbilang(nilai) + ' rupiah' : 'Isi NJOP per m² dan luas tanah.';
  $('#banding').innerHTML = nilai == null ? '' : x.harga >= nilai ? alert('success', '', `Harga jual ${rp(x.harga)} sama dengan atau di atas nilai NJOP. Harga wajar.`)
    : alert('caution', 'Harga jual di bawah NJOP', `Harga jual ${rp(x.harga)} lebih rendah ${rp(nilai - x.harga)} dari nilai NJOP. Tulis alasannya di catatan sebelum memverifikasi.${usulan('HE-VERIF-03')}`);
  $('#wajibCat').innerHTML = nilai != null && x.harga < nilai ? '<span class="ina-text-field__required">*</span>' : ' <span style="font-weight:400;color:var(--ina-content-secondary)">(opsional)</span>';
}
function galat(id, pesan) {
  const f = $('#f-' + id), w = f.querySelector('.ina-text-field__wrapper, .ina-text-area__wrapper'), h = $('#h-' + id);
  w.classList.add(w.classList.contains('ina-text-area__wrapper') ? 'ina-text-area__wrapper--status-error' : 'ina-text-field__wrapper--status-error');
  h.textContent = pesan; h.classList.add('ina-text-field__helper-text--error');
}
function bersih(id) {
  const f = $('#f-' + id); if (!f) return; const w = f.querySelector('.ina-text-field__wrapper, .ina-text-area__wrapper'), h = $('#h-' + id);
  w.classList.remove('ina-text-field__wrapper--status-error', 'ina-text-area__wrapper--status-error'); if (h) h.classList.remove('ina-text-field__helper-text--error');
  if (h && h.classList && id !== 'njop') h.textContent = h.dataset.bantu || '';
}
H.addEventListener('change', e => {
  const m = e.target.closest('[data-manual]'); if (!m) return;
  const x = o(), p = x.pihak[+m.dataset.manual];
  if (!m.checked) { p.manual = false; x.v.pihak = false; gambar(); return; }
  m.checked = false;
  dialog({ judul:'Verifikasi pihak secara manual?', konfirmasi:true, kunciUtama:'#setuju',
    isi:`<p><b>${esc(p.nama)}</b> (${p.tipe}) tidak punya akun E-PPAT, sehingga identitasnya tidak diperiksa Peruri. Verifikasi manual berarti Anda menyatakan sudah memeriksa identitas pihak secara langsung.${usulan('HE-VERIF-03')}</p>
      ${pernyataan('Saya sudah mencocokkan KTP asli pihak dengan data di permohonan.')}`,
    tombol:[['Batal','secondary',null],['Verifikasi Manual','primary',() => { p.manual = true; gambar(); toast(`${p.nama} diverifikasi manual. Tekan Cek CA Semua Pihak untuk memperbarui status.`, 'positive', 4000); }]] });
});
H.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-ke-daftar]')) { e.preventDefault(); keDaftar(); return; }
  if (t.closest('[data-ke-order]')) { location.href = 'Backlog-HE-ORDER-Prototype.html'; return; }
  const gr = t.closest('[data-grup]'); if (gr) { S.grup = gr.dataset.grup; gambar(); return; }
  if (t.closest('#urutTombol')) { S.urutBuka = !S.urutBuka; gambar(); return; }
  const ur = t.closest('[data-urut]'); if (ur) { S.urut = ur.dataset.urut; S.urutBuka = false; gambar(); return; }
  if (t.closest('[data-reset-saring]')) { S.cari = ''; S.grup = ''; gambar(); return; }
  const b = t.closest('[data-buka]'); if (b) { buka(b.dataset.buka); return; }
  if (t.closest('#kembali')) { keDaftar(); return; }
  const tb = t.closest('[data-tab]'); if (tb) { S.tab = tb.dataset.tab; gambar(); return; }
  if (t.closest('#cekCa')) { cekCa(); return; }
  if (t.closest('#verifObjek')) { konfirmObjek(); return; }
  if (t.closest('#verifHarga')) { konfirmHarga(); return; }
});
document.addEventListener('click', e => { if (S.urutBuka && !e.target.closest('.urut-wadah')) { S.urutBuka = false; gambar(); } });

/* ---------------- verifikasi (live) + konfirmasi (HE-VERIF-03) ---------------- */
function cekCa() {
  const x = o();
  tunggu('ca', 800, () => {
    x.dicek = '26 Okt 2026, ' + new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }).replace(':', '.');
    const semua = x.pihak.every(pihakOk);
    if (semua && !x.v.pihak) { selesaiBagian(x, 'pihak'); return; }
    gambar();
    const kurang = x.pihak.filter(p => !pihakOk(p)).length;
    toast('Verifikasi para pihak diperbarui.', kurang ? 'default' : 'positive', 4000, kurang ? `${kurang} pihak belum terverifikasi. Lihat keterangan di setiap pihak.` : '');
  });
}
const ringkas = rows => `<dl class="ringkas">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const pernyataan = t => `<label class="ina-checkbox cek" for="setuju" style="margin-top:12px"><input type="checkbox" id="setuju" class="ina-checkbox__input peer"><div class="ina-checkbox__box ina-checkbox__box--unchecked"></div><div class="ina-checkbox__content"><span class="ina-checkbox__label">${t}</span></div></label>`;
function konfirmObjek() {
  const x = o(), b = x.objek[0];
  dialog({ judul:'Tandai objek tanah terverifikasi?', konfirmasi:true, kunciUtama:'#setuju',
    isi:`<p>Status objek tanah akan berubah menjadi <b>Terverifikasi</b> dan dihitung sebagai syarat penyusunan. Pastikan Anda sudah memeriksa hal berikut:${usulan('HE-VERIF-03')}</p>
      <ol class="periksa"><li>Sertifikat asli sesuai dengan data di permohonan.</li><li>Tidak ada blokir atau sengketa atas tanah.</li><li>Luas dan lokasi sesuai dengan sertifikat.</li></ol>
      ${ringkas([['Objek', `${b.hak} No. ${b.sertifikat}`], ['NIB', b.nib], ['Luas', `${b.luas} m²`], ['Catatan', x.catObjek ? esc(x.catObjek) : '—']])}
      ${pernyataan('Saya sudah memeriksa ketiga hal di atas.')}`,
    tombol:[['Batal','secondary',null],['Tandai Terverifikasi','primary',() => tunggu('objek', 700, () => selesaiBagian(x, 'objek'))]] });
}
function konfirmHarga() {
  const x = o(); let ada = false;
  if (!x.njop) { galat('njop', 'NJOP per m² wajib diisi. Lihat SPPT PBB tahun berjalan.'); ada = true; }
  if (!x.luas) { galat('luas', 'Luas tanah wajib diisi.'); ada = true; }
  const nilai = x.njop && x.luas ? x.njop * x.luas : null;
  if (nilai != null && x.harga < nilai && !x.catHarga.trim()) { galat('catHarga', 'Harga jual di bawah NJOP. Tulis alasannya, mis. "Sesuai kesepakatan para pihak; bea dihitung dari NJOP."'); ada = true; }
  if (ada) { $('#halaman .ina-text-field__wrapper--status-error, #halaman .ina-text-area__wrapper--status-error')?.querySelector('input, textarea')?.focus(); return; }
  dialog({ judul:'Simpan dan verifikasi harga tanah?', konfirmasi:true,
    isi:`<p>Status harga tanah akan berubah menjadi <b>Terverifikasi</b> dan dihitung sebagai syarat penyusunan.${usulan('HE-VERIF-03')}</p>
      ${ringkas([['NJOP per m²', rp(x.njop)], ['Luas', `${x.luas} m²`], ['Nilai NJOP', rp(nilai)], ['Harga jual', rp(x.harga)], ['Catatan', x.catHarga ? esc(x.catHarga) : '—']])}
      ${x.harga < nilai ? alert('caution', '', 'Harga jual di bawah NJOP. Alasan sudah dicatat.') : ''}`,
    tombol:[['Batal','secondary',null],['Simpan & Verifikasi','primary',() => tunggu('harga', 700, () => selesaiBagian(x, 'harga'))]] });
}

function pasangPanduan() {
  const h = document.querySelector('#halaman h1'); if (!h || h.parentElement.classList.contains('judul-kiri')) return;
  const w = document.createElement('div'); w.className = 'judul-halaman';
  const kiri = document.createElement('div'); kiri.className = 'judul-kiri';
  const sub = h.nextElementSibling && h.nextElementSibling.classList.contains('sub') ? h.nextElementSibling : null;
  h.before(w); w.append(kiri); kiri.append(h); if (sub) kiri.append(sub);

function dialog({ judul, isi, tombol: tb, lebar, kunciUtama, konfirmasi }) {
  const L = $('#lapisan');
  L.innerHTML = `<div class="ina-modal"><div class="ina-modal__backdrop" data-i="-1"></div><div class="ina-modal__container">
    <div class="ina-modal__dialog ina-modal__dialog--size-${lebar ? 'lg' : 'md'} ${konfirmasi ? 'ina-modal-confirmation' : ''}" role="${konfirmasi ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgJudul">
      <div class="ina-modal__header"><h2 class="ina-modal__title" id="dlgJudul">${judul}</h2><button type="button" class="ina-modal__close-button" aria-label="Tutup dialog" data-i="-1">${ik('x', 22)}</button></div>
      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md" data-i="${i}">${t}</button>`).join('')}</div></div></div></div>`;
  const utama = L.querySelector('.ina-modal__footer .ina-button:last-child');
  if (kunciUtama) { utama.disabled = true; const cb = L.querySelector(kunciUtama); cb.addEventListener('change', e => { utama.disabled = !e.target.checked; const bx = cb.nextElementSibling; bx.classList.toggle('ina-checkbox__box--checked', e.target.checked); bx.classList.toggle('ina-checkbox__box--unchecked', !e.target.checked); bx.innerHTML = e.target.checked ? ik('centang', 12) : ''; }); }
  else utama.focus();
  L.onclick = e => { const b = e.target.closest('[data-i]'); if (!b || b.disabled) return; const i = +b.dataset.i; L.innerHTML = ''; if (i >= 0 && tb[i][2]) tb[i][2](); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisan').innerHTML) $('#lapisan').innerHTML = ''; });
let tt;
function toast(teks, state = 'default', ms = 3000, ket = '') {
  $('#toastWadah').innerHTML = `<div class="ina-toast ina-toast--state-${state} ina-toast--style-solid ina-toast--visible" role="status"><div class="ina-toast__icon">${ik(state === 'positive' ? 'centang' : 'info', 20)}</div>
    <div class="ina-toast__content"><div class="ina-toast__text-area"><p class="ina-toast__title">${teks}</p>${ket ? `<p class="ina-toast__description">${ket}</p>` : ''}</div></div><button class="ina-toast__close-button" aria-label="Tutup notifikasi" data-tutup-toast>${ik('x', 16)}</button></div>`;

}
$('#toastWadah').addEventListener('click', e => { if (e.target.closest('[data-tutup-toast]')) $('#toastWadah').innerHTML = ''; });

const faq = (i, q, a) => `<div class="ina-accordion"><button type="button" class="ina-accordion__toggle" aria-expanded="false" aria-controls="faq-${i}"><div class="ina-accordion__title">${q}</div><div class="ina-accordion__toggler"><svg class="ina-accordion__icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></button><div id="faq-${i}" class="ina-accordion__content"><div class="ina-accordion__body"><p>${a}</p></div></div></div>`;
function bukaBantuan() {
  drawer({ judul:'Bantuan Verifikasi Berkas', isi:`
    <p>Permohonan berstatus Siap masuk ke halaman ini. Penyusunan minuta baru dapat dimulai setelah tiga bagian berikut terverifikasi.</p>
    <ol class="bantu-langkah">
      <li><b>Para Pihak:</b> tekan "Cek CA Semua Pihak". Pihak dengan sertifikat elektronik (CA) aktif otomatis terverifikasi. Pihak tanpa akun diverifikasi manual setelah KTP aslinya diperiksa.</li>
      <li><b>Objek Tanah:</b> cocokkan sertifikat asli dengan data permohonan, pastikan tidak ada blokir atau sengketa, lalu tandai terverifikasi.</li>
      <li><b>Harga Tanah:</b> isi NJOP per m² dari SPPT PBB tahun berjalan, bandingkan dengan harga jual, lalu simpan.</li>
    </ol>
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${faq(1, 'Pihak berstatus "CA Diproses" atau "CA belum aktif"', 'Pihak belum menyelesaikan registrasi CA di Peruri. Minta pihak menyelesaikan eKYC, lalu tekan "Cek CA Semua Pihak" lagi untuk memperbarui status.')}
    ${faq(2, 'Pihak tidak punya akun E-PPAT', 'Periksa KTP asli pihak secara langsung, lalu centang "Verifikasi manual". Pihak tanpa akun tidak dapat menandatangani secara elektronik sampai memiliki akun dan CA aktif.')}
    ${faq(3, 'Dari mana nilai NJOP diambil?', 'Dari SPPT PBB tahun berjalan untuk objek tanah tersebut. Isi nilai NJOP bumi per meter persegi.')}
    ${faq(4, 'Harga jual lebih rendah dari NJOP', 'Verifikasi tetap dapat disimpan, tetapi alasannya wajib ditulis di catatan, misalnya kesepakatan para pihak.')}
    ${faq(5, 'Saya salah memverifikasi', 'Verifikasi yang sudah disimpan tidak dapat diubah dari halaman ini. Segera beri tahu PPAT sebelum penyusunan minuta dimulai. Karena itu, periksa ringkasan di dialog konfirmasi sebelum menyimpan.')}
    <h4 class="bantu-sub">Kontak dukungan ${usulan('HE-UMUM-02')}</h4>
    <div class="bantu-kontak"><div><b>Email</b><span>${est('bantuan@contoh.id')}</span></div><div><b>Telepon / WhatsApp</b><span>${est('0800-0000-0000')}</span></div><div><b>Jam layanan</b><span>${est('Senin–Jumat, 08.00–17.00 WIB')}</span></div></div>` });
}

function lihat(u) {
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  if (u.ke === 'daftar') keDaftar();
  if (u.ke === 'tunggu') buka('ORD-CONTOH-010');
  if (u.ke === 'pihak-010') { const x = DATA.find(y => y.kode === 'ORD-CONTOH-010'); if (!x.dicek) x.dicek = '26 Okt 2026, 08.30'; buka('ORD-CONTOH-010', 'pihak'); }

  if (u.ke === 'harga-011') buka('ORD-CONTOH-011', 'harga');
  const el = u.sorot && $(u.sorot);
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}
