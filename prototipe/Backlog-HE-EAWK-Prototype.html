<!-- ===== Pilihan tema prototipe (tema-proto.html, disisipkan rakit-idds.js ke setiap prototipe ber-IDDS) =====
     Alat diskusi internal: membandingkan tiga tema yang dikonfirmasi Peruri (penyedia IDDS):
       E-PPAT  → <html data-brand="eppat">  (brand kustom, brand-eppat-idds/eppat.css)
       INAgov  → <html data-brand="inagov"> (brand bawaan IDDS @idds/styles)
       Default → tanpa data-brand            (warna netral bawaan IDDS)
     Pilihan disimpan di localStorage "eppat-tema-proto" sehingga ikut terbawa saat berpindah prototipe.
     Bagian KEPALA (style + skrip awal) disisipkan tepat setelah <head> agar tema terpasang sebelum halaman tergambar;
     bagian BADAN (skrip pil di protobar) disisipkan sebelum </body>. -->

<script id="tema-proto-awal">
(() => {
  let t = 'eppat';
  try { t = localStorage.getItem('eppat-tema-proto') || 'eppat'; } catch (e) {}
  const h = document.documentElement;
  if (t === 'inagov') h.setAttribute('data-brand', 'inagov');
  else if (t === 'default') h.removeAttribute('data-brand');
  else h.setAttribute('data-brand', 'eppat');
})();
</script>

<script id="sesi-kepala-js">try { window.SESI_PROTO = JSON.parse(localStorage.getItem('eppat-sesi')); var t = JSON.parse(localStorage.getItem('eppat-trial')) || {}; if (window.SESI_PROTO && window.SESI_PROTO.paket === 'trial') { if (t.nama) window.SESI_PROTO.nama = t.nama; if (t.email) window.SESI_PROTO.email = t.email; } window.PAKET_TRIAL = window.SESI_PROTO && window.SESI_PROTO.paket === 'trial' && !(t.db && t.db.ent) ? { batas:!!t.batas, pengguna:5, transaksi:10, upgrade:'Backlog-HE-TRIAL-Prototype.html#berlangganan' } : null; } catch (e) { window.SESI_PROTO = null; window.PAKET_TRIAL = null; }</script>
<script id="ajb-bersama-js">
/* Satu perjalanan Permohonan AJB lintas prototipe: Verifikasi Berkas, Penyusunan Akta, dan Penandatanganan Akta dibuka dari stepper,
   menyimpan statusnya di sini, lalu Kembali ke stepper order yang sama. Alamat tujuan: <berkas>#order=KODE[&peran=ppat]. */
window.AJB = (() => {
  const KUNCI_SPESIMEN = 'eppat-spesimen', KUNCI_DAFTAR = 'eppat-daftar';
  const bacaDaftar = () => { try { return JSON.parse(localStorage.getItem(KUNCI_DAFTAR)) || {}; } catch (e) { return {}; } };
  const ubahDaftar = (k, v) => { const d = bacaDaftar(); d[k] = v; try { localStorage.setItem(KUNCI_DAFTAR, JSON.stringify(d)); } catch (e) { /* lihat tulis() */ } };
  const bacaSpesimen = () => { try { return JSON.parse(localStorage.getItem(KUNCI_SPESIMEN)) || {}; } catch (e) { return {}; } };
  const tulisSpesimen = d => { try { localStorage.setItem(KUNCI_SPESIMEN, JSON.stringify(d)); } catch (e) { /* lihat tulis() */ } };
  const KUNCI = 'eppat-ajb-v3', ORDER = 'Backlog-HE-ORDER-Prototype.html';
  const HAL = { verif:'Backlog-HE-VERIF-Prototype.html', susun:'Backlog-HE-MINUTA-V2-Prototype.html', ttd:'Backlog-HE-EAW-Prototype.html' };
  const semua = () => { try { return JSON.parse(localStorage.getItem(KUNCI)) || {}; } catch (e) { return {}; } };
  const tulis = d => { try { localStorage.setItem(KUNCI, JSON.stringify(d)); } catch (e) { /* peramban menolak penyimpanan: prototipe tetap berjalan */ } };
  const param = k => (location.hash.match(new RegExp(`[#&]${k}=([^&]+)`)) || [])[1] || '';
  return {
    semua, kode:() => param('order'), peran:() => param('peran'),
    ambil:k => semua()[k] || {},
    simpan:(k, isi) => { const d = semua(); d[k] = { ...d[k], ...isi }; tulis(d); },
    buang:k => { const d = semua(); delete d[k]; tulis(d); },
    hapus:() => { try { localStorage.removeItem(KUNCI); } catch (e) { /* lihat tulis() */ } },
    spesimen:email => bacaSpesimen()[email] || '',
    simpanSpesimen:(email, gbr) => { const d = bacaSpesimen(); if (gbr) d[email] = gbr; else delete d[email]; tulisSpesimen(d); },
    /* status pendaftaran: CA per pengguna, TERA per kantor; dipakai notifikasi di semua halaman */
    caStatus:email => bacaDaftar()['ca:' + email] || '', simpanCa:(email, k) => ubahDaftar('ca:' + email, k),
    teraStatus:() => bacaDaftar().tera || '', simpanTera:k => ubahDaftar('tera', k),
    alamat:(hal, kode, peran) => `${HAL[hal]}#order=${kode}${peran ? '&peran=' + peran : ''}`,
    keStepper:kode => { location.href = kode ? `${ORDER}#order=${kode}` : ORDER; }
  };
})();
</script>

<style id="brand-eppat">
/**
 * E-PPAT Brand Theme untuk INA Digital Design System (IDDS)
 * --------------------------------------------------------------------------
 * Format mengikuti brand bawaan IDDS (@idds/styles: [data-brand='inagov'], 'panrb', dll.).
 * Hanya token brand (primary, secondary, hover) yang diganti; warna netral, sentimen
 * (positive/negative/warning/guide), tipografi, spacing, dan komponen tetap milik IDDS.
 *
 * Pemakaian:
 *   1. import '@idds/react/index.css'            (atau @idds/styles/dist/index.css)
 *   2. import './eppat.css'                       (berkas ini, SETELAH CSS IDDS)
 *   3. document.documentElement.setAttribute('data-brand', 'eppat')
 *      — atau setCustomTheme(eppatTheme) dari eppat-theme.ts (tanpa dukungan mode gelap)
 *
 * Sumber warna: tema aktif E-PPAT (CMS › Setting Theme) di dev-app.eppat.id, dibaca 23 Okt 2026:
 *   --eppat-brand-rgb 61 107 94 (#3D6B5E), --eppat-brand-hover-rgb 52 93 82 (#345D52),
 *   --eppat-sidebar-bg #2C3C42, --eppat-sidebar-hover #3A4D54, --eppat-line-sand-rgb 210 221 217,
 *   --eppat-paper-cream-rgb 238 243 241, --eppat-paper-vanilla-rgb 245 248 247, kartu kantor #DAC999.
 * Kontras (WCAG 2.2): teks putih di atas primary-500 #3D6B5E = 6,06:1 (AA); hover #345D52 = 7,41:1;
 *   primary-400 #4E7C6F = 4,73:1 (dipakai sebagai warna utama mode gelap).
 */

/* E-PPAT Theme - Pejabat Pembuat Akta Tanah */
[data-brand='eppat'] {
  /* Primary Colors - Hijau E-PPAT */
  --ina-primary-25: #f5f8f7;
  --ina-primary-50: #eef3f1;
  --ina-primary-100: #dde5e2;
  --ina-primary-200: #c2d3cc;
  --ina-primary-300: #9db8ae;
  --ina-primary-400: #4e7c6f;
  --ina-primary-500: #3d6b5e;
  --ina-primary-600: #345d52;
  --ina-primary-700: #2a4b42;
  --ina-primary-800: #1d3530;
  --ina-primary-900: #0f1c19;
  --ina-primary-primary: #3d6b5e;

  /* Secondary Colors - Emas kartu kantor E-PPAT */
  --ina-secondary-25: #fcfbf6;
  --ina-secondary-50: #f8f4e7;
  --ina-secondary-100: #f0e8cc;
  --ina-secondary-200: #e6dab2;
  --ina-secondary-300: #dac999;

  --ina-secondary-500: #ae9358;
  --ina-secondary-600: #8c7444;
  --ina-secondary-700: #6a5733;
  --ina-secondary-800: #483b23;
  --ina-secondary-900: #272013;

  /* Accent Colors (legacy IDDS, disamakan dengan secondary) */
  --ina-accent-100: #fcfbf6 !important;
  --ina-accent-200: #f8f4e7 !important;
  --ina-accent-300: #f0e8cc !important;
  --ina-accent-400: #e6dab2 !important;
  --ina-accent-500: #dac999 !important;

  /* Interactive Colors */
  --ina-brand-primary: #3d6b5e;
  --ina-brand-hover: #345d52 !important;
  --ina-neutral-hover: var(--ina-neutral-100) !important;

  /* Brand-specific colors (seperti --ina-bgn-brand-primary pada brand BGN) */

  --ina-eppat-surface-cream: var(--ina-primary-50);
}

/* Aksen komponen mengikuti brand E-PPAT.
   IDDS memakai biru "guide" atau hitam untuk elemen penunjuk berikut; di E-PPAT diganti hijau brand.
   Warna status (positive/negative/warning/info pada Alert, Badge, Toast) TIDAK diubah. */

/* Penyesuaian kontras (WCAG 2.2 AA, minimal 4,5:1 untuk teks biasa).
   Warna bawaan IDDS berikut di bawah standar pada latar terang; diganti dengan corak lebih gelap
   dari keluarga warna yang SAMA sehingga arti warna tidak berubah. */

<style id="kerangka-css">
/* ===== Order AJB — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 23–24 (HE-ORDER-01…05)
   Kerangka & teks mengikuti layar live Peruri (dilihat 23 Okt 2026, akun Asisten). ===== */

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:currentColor}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu color family dengan teks menunya (aturan warna IDDS: teks & ikon dari family yang sama) — token tetap dapat diatur dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:var(--ina-eppat-sidebar-content);--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item:hover svg,.sidebar .items a.nav-item:focus-visible svg{color:#fff}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.ava{width:32px;height:32px;font:600 12px Inter,sans-serif;background:var(--ina-primary-primary)!important;color:#fff!important;border-color:var(--ina-primary-primary)!important}
.uname{display:block;font:600 12px/14px Inter,sans-serif;color:var(--ina-primary-primary)}
.urole{font:400 10px Inter,sans-serif;color:var(--ina-content-secondary);letter-spacing:1.4px;text-transform:uppercase}

.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}

/* daftar order */
.daftar-atas{display:flex;justify-content:flex-end;margin-top:20px}
.saring{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end;margin-top:16px}
.saring .ina-text-field__label{display:block}
.saring .cari-wadah .ina-input-search{width:100%;margin-top:6px} /* IDDS Input Search, sama dengan Minuta & Verifikasi */
.tabel-wadah{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tabel-gulir{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tabel-wadah .ina-table{border:0;border-radius:0}
table.tb td{vertical-align:middle}
table.tb td .kd{font-weight:600;color:var(--ina-primary-primary);cursor:pointer}
table.tb td .kc{font-size:12px;color:var(--ina-content-secondary)}
table.tb tr.klik{cursor:pointer}
table.tb tr.klik:hover td{background:var(--ina-primary-25)}
.aksi-baris{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kuota-trial{align-self:center;margin-right:12px;font-size:14px;color:var(--ina-content-secondary)}
#lapisanBatas .ina-button{text-decoration:none}
.aksi-baris:has(.aksi-wadah){flex-wrap:nowrap;align-items:center}
.aksi-wadah{position:relative;display:inline-block}
.aksi-wadah .ina-action-dropdown__menu{position:fixed;min-width:150px;z-index:60;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.aksi-wadah .ina-action-dropdown__menu[hidden]{display:none}
.aksi-wadah .ikon-aksi{width:32px;height:32px;padding:0;justify-content:center}
.aksi-wadah [data-hapus-pihak]{color:var(--ina-negative-600)}
.tb:has(#kolStatusAkun) th,.tb:has(#kolStatusAkun) td{padding-left:12px;padding-right:12px}
.kosong{padding:28px;text-align:center;color:var(--ina-content-secondary)}
.halaman{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ina-stroke-primary);font-size:13px;color:var(--ina-content-secondary)}
.halaman > span{white-space:nowrap}
[data-merah]{color:var(--ina-negative-600)!important}
.tb .ina-table__cell,.tb .ina-table__header-cell{padding:12px 16px}
.tb .ina-table__cell{white-space:normal}
.lengkap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lengkap.ok{color:var(--ina-content-positive)}
.lengkap.kurang{color:var(--ina-content-secondary)}
.lengkap svg{flex:none}

/* detail order */
.det-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kepala .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);margin-top:12px}
.det-kepala h2{margin:2px 0 0;font:600 20px/28px Inter,sans-serif}
.status-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px 28px}
.gulir-tahap{overflow-x:auto;padding-bottom:4px}
.status-kartu .stepper-h.ina-stepper{display:flex;align-items:flex-start;width:100%;min-width:1000px;min-height:0;padding:4px 0 12px}
.stepper-h .ina-stepper__item{flex-direction:column;align-items:center;gap:6px;height:auto;max-height:none;flex:0 0 auto;width:160px;padding:0}
.stepper-h .ina-stepper__label{position:static;transform:none;white-space:normal;text-align:center;max-width:160px;margin:0;font-size:13px;line-height:18px}
.stepper-h .ina-stepper__icon-wrapper{position:relative;z-index:1}
.status-kartu .stepper-h .ina-stepper__separator{align-self:flex-start;flex:1 1 auto;min-width:6px;margin:11px -68px 0;width:auto}
.status-kartu .stepper-v.ina-stepper{height:auto;min-height:0}
.status-kartu .stepper-v.ina-stepper .ina-stepper__item{height:auto;max-height:none;min-height:0;flex:none;align-items:flex-start}
.status-kartu .stepper-v .ina-stepper__label{position:static;transform:none;white-space:normal;max-width:none}
.status-kartu .ina-stepper__item--active .ina-stepper__label > span:first-child,.status-kartu .ina-stepper__item--completed .ina-stepper__label > span:first-child{font-weight:600;color:var(--ina-content-primary)}
.tahap-status,.tahap-perkiraan{display:block;margin-top:6px}
.tahap-perkiraan .ina-badge{display:inline-flex;align-items:center;gap:6px}
.status-kartu .ina-stepper__label small.tahap-waktu{margin-top:4px;font-size:11.5px}
.waktu-baris{display:block;margin:2px 0 8px}
.waktu-baris .ina-badge{display:inline-flex;align-items:center;gap:6px}
.status-kartu .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.status-kaki{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ina-stroke-primary);margin-top:8px;padding-top:16px}
.status-kaki p{margin:0;font-size:14px;color:var(--ina-content-secondary)}
.status-kaki p b{color:var(--ina-content-primary)}
.status-kaki .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-kaki .alasan{font-size:12.5px;color:var(--ina-content-secondary)}
.syarat{margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.syarat h4{margin:0 0 10px;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syarat h4 .hit{font-weight:500;color:var(--ina-content-secondary)}
.syarat ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.syarat li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.syarat li .ik{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none}
.syarat li.ok .ik{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.syarat li.kurang .ik{background:var(--ina-warning-100);color:var(--ina-warning-600)}
.syarat li.ok span.t{color:var(--ina-content-secondary)}
.syarat li .ina-button{padding:0;height:auto;min-height:0}
.syarat-alert{margin-top:16px}
.syarat-alert .ina-alert__description{display:flex;flex-direction:column;gap:10px}
.syarat-daftar{display:flex;flex-wrap:wrap;gap:8px 16px}
.syarat-item{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-badge{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-button{padding:0 4px}

.berikut .langkah-ttd .ina-stepper__item--active .ina-stepper__label > span{color:var(--ina-primary-primary)}
.langkah-ttd .ina-stepper__label{white-space:normal;text-align:left;max-width:none;font-size:14px;line-height:20px}
.langkah-ttd .ina-stepper__label small{display:block;margin-top:2px;font-size:12.5px;line-height:18px;font-weight:400;color:var(--ina-content-secondary)}
.berikut .langkah-ttd .ina-button{width:auto;margin-top:6px}
.berikut .ina-alert{margin:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:10px 0 0;font-size:13.5px}
.kv dt{color:var(--ina-content-secondary)}
.kv dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.kd-info{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary)}
.urutan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.urutan li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;font-size:14px}
.urutan li.saya{background:var(--ina-background-secondary)}
.urutan .nm{min-width:0}
.urutan .ina-badge{flex:none;white-space:nowrap}
.urutan .no{font-size:12px;color:var(--ina-content-secondary);margin-right:4px}
.urutan .anda{font-size:12px;color:var(--ina-primary-primary)}
.urutan .peran{margin-left:4px;font-size:12px;color:var(--ina-content-secondary)}
.kontak{display:flex;flex-direction:column;gap:8px}
.kontak .ina-button{width:100%;justify-content:flex-start;text-decoration:none}
.ket-kecil{margin:8px 0 0;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}

/* dialog OTP (HE-EAWK-05, sama dengan prototipe E-Akta Wizard PPAT) */
.otp-isi{text-align:center}
.otp-isi .surel{margin:0 0 4px;font-size:14px;color:var(--ina-content-secondary)}
.otp-isi .ina-one-time-password{align-items:center;padding:4px 0}
.otp-isi .ina-one-time-password__container{justify-content:center;margin:12px 0 8px}
.otp-waktu.ina-badge{display:inline-flex;align-items:center;gap:6px;margin:4px 0 6px;font-weight:600}
.otp-ulang{margin-top:8px;font-size:13.5px;color:var(--ina-content-secondary)}
.otp-catat{margin:12px 0 0;font-size:13px;color:var(--ina-content-secondary)}
.ringkas{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:12px 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas dt{color:var(--ina-content-secondary)}
.ringkas dd{margin:0;font-weight:500}
.cek{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;cursor:pointer}
/* ikon ? bertooltip untuk istilah (pola bersama) */
.tanya-btn{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;margin-left:4px;border:0;border-radius:50%;background:transparent;color:var(--ina-content-secondary);cursor:help;vertical-align:middle}.tanya-btn:hover,.tanya-btn:focus-visible{color:var(--ina-primary-500);outline:2px solid var(--ina-primary-500);outline-offset:1px}
.tanya:focus-within .ina-tooltip__content{visibility:visible;opacity:1}
.tanya .tanya-btn svg{color:inherit}
.tanya .ina-tooltip__bubble{font-weight:400;font-size:12px;letter-spacing:normal;text-transform:none;color:var(--ina-white,#fff)}

@media (max-width:1180px){ .ruang{grid-template-columns:1fr} .panel{order:-1} .kanvas{max-height:none} }
@media (max-width:760px){
  .tiga-langkah{grid-template-columns:1fr}
  .item-akta.ina-card{flex-direction:column;align-items:flex-start}
  .urutan .nm{white-space:normal}
  .saring-k .ina-button-group{width:100%;overflow-x:auto}
  .urut-wadah,.urut-wadah .ina-select-dropdown__trigger{width:100%}
  .kanvas{padding:10px}
  .halaman-pdf{font-size:9px}
  .halaman-pdf h3{font-size:13px}
  .kv,.ringkas{grid-template-columns:1fr;gap:2px}
  .kv dd{text-align:left;margin-bottom:6px}
  .ringkas dd{margin-bottom:6px}
  .otp-isi .ina-one-time-password__input{width:40px;height:40px;margin:2px}
  .otp-isi .ina-one-time-password__container{gap:6px;min-width:0}
  .penampil-bar b{width:100%}
}
.daftar-ubah .sumber-ubah{margin:2px 0 6px;font-size:12.5px;color:var(--ina-content-secondary)}.daftar-ubah .sumber-ubah b{color:var(--ina-content-primary)}.daftar-ubah .kelompok-ubah{margin:20px 0 2px;font:600 15px/22px Inter,sans-serif;color:var(--ina-content-primary)}.daftar-ubah .ket-kelompok{margin:0 0 8px;font-size:13px;color:var(--ina-content-secondary)}

const JHAL = 8;
const ST = {
  MENUNGGU_TERA:{ l:'Menunggu stempel PPAT', b:'neutral', hint:'Kantor PPAT belum membubuhkan stempel elektronik.', grup:'menunggu' },
  MENUNGGU_GILIRAN:{ l:'Menunggu giliran', b:'info', hint:'Pihak sebelum Anda belum menandatangani.', grup:'menunggu' },
  GILIRAN_ANDA:{ l:'Giliran Anda', b:'warning', hint:'Silakan tanda tangani sekarang.', grup:'perlu' },
  OTP_TERKIRIM:{ l:'OTP terkirim', b:'warning', hint:'Masukkan kode OTP untuk menandatangani.', grup:'perlu' },
  SUDAH_TTD:{ l:'Sudah Anda tanda tangani', b:'success', hint:'Menunggu pihak lain.', grup:'menunggu' },
  SELESAI:{ l:'Selesai', b:'success', hint:'Semua pihak telah menandatangani.', grup:'selesai' }
};
const PERAN = { PENJUAL:'Pihak Pertama', PEMBELI:'Pihak Kedua', SAKSI:'Saksi', PPAT:'PPAT' };
function akta(kode, peran, state, tgl, urut, opsi = {}) {
  const lain = { PENJUAL:'Contoh Penjual Dua', PEMBELI:'Contoh Pembeli Dua', SAKSI:'Contoh Saksi Dua' };
  const susunan = ['PENJUAL', 'PEMBELI', 'SAKSI', 'PPAT'];
  const urutan = susunan.map((p, i) => ({ seq:i, nama:p === peran ? 'Contoh Klien Satu' : p === 'PPAT' ? 'PPAT Contoh Satu' : lain[p], peran:p, saya:p === peran, status:'MENUNGGU' }));
  const saya = urutan.find(s => s.saya);
  const selesai = { MENUNGGU_TERA:-1, MENUNGGU_GILIRAN:saya.seq - 1, GILIRAN_ANDA:saya.seq, OTP_TERKIRIM:saya.seq, SUDAH_TTD:saya.seq + 1, SELESAI:4 }[state];
  urutan.forEach(s => { if (s.seq < selesai) s.status = 'SIGNED'; });
  if (state === 'MENUNGGU_GILIRAN') urutan[saya.seq - 1].status = 'MENUNGGU';
  if (state === 'OTP_TERKIRIM') saya.status = 'OTP_SENT';
  return { kode, peran, state, tgl, urut, hal:opsi.hal === undefined ? JHAL : opsi.hal, alasan:opsi.alasan || '', otpHabis:opsi.otpSisa ? Date.now() + opsi.otpSisa * 1000 : null, urutan };
}

      : `<div class="kosong-akta">${ik('cari', 32)}<b>Tidak ada akta yang cocok.</b>Ubah kata kunci atau pilih saringan "Semua".<div style="margin-top:12px">${tombol('Hapus pencarian dan saringan','secondary', 'sm', 'data-reset-saring')}</div></div>`}`;

function isiHalaman(h) {

}
const POS = { PENJUAL:[8, 56], PEMBELI:[54, 56], SAKSI:[8, 74], PPAT:[54, 74] };
function penampil(x) {

      ${x.hal === S.hal ? `<div class="penanda ttd ${jadi ? 'jadi' : ''} ${S.kilau ? 'kilau' : ''}" style="left:${px}%;top:${py}%" title="${jadi ? 'Sudah ditandatangani' : 'Posisi tanda tangan Anda, ditentukan Kantor PPAT'}">${!jadi && bisaTtd(x) ? `<span class="sini">Tanda tangan Anda di sini</span>` : ''}<span>${jadi ? 'Ditandatangani' : 'Contoh Klien Satu'}</span><small>${x.peran}</small></div>` : ''}

}
/* kartu "Langkah berikutnya" (HE-EAWK-03) */
function kartuBerikut(x) {
  const st = ST[x.state], s = sayaDi(x), kepala = t => `<div class="eyebrow2">Langkah berikutnya${usulan('HE-EAWK-03')}</div><h4>${t}</h4>`;
  const bungkus = isi => `<div class="ina-card ina-card--variant-basic berikut ditandai" id="kartuBerikut"><div class="ina-card__content">${isi}</div></div>`;
  if (x.state === 'GILIRAN_ANDA' && !x.hal) return bungkus(`${kepala('Menunggu Kantor PPAT')}${alert('caution', 'Posisi tanda tangan belum ditentukan', `${esc(x.alasan)} Anda dapat menandatangani setelah kantor menempatkannya. Hubungi kantor melalui kontak di bawah.`)}`);
  if (bisaTtd(x) && !caAktif()) return bungkus(`${kepala('Daftarkan sertifikat elektronik')}${alert('caution', 'Sertifikat elektronik belum aktif', `Anda perlu ${istilah('sertifikat elektronik (CA)', 'CA')} aktif sebelum menandatangani akta ini.`)}<a class="ina-button ina-button--primary ina-button--md" id="keCa" style="margin-top:12px;text-decoration:none" href="Backlog-HE-CA-Prototype.html#ca">Buka Registrasi CA</a>`);
  if (bisaTtd(x) && !spesimenAda()) return bungkus(`${kepala('Masukkan spesimen terlebih dahulu')}${alert('caution', 'Spesimen tanda tangan belum ada', `Sertifikat elektronik Anda sudah aktif, tetapi Anda perlu memasukkan ${istilah('spesimen', 'SPESIMEN')} tanda tangan sebelum menandatangani akta ini.${usulan('HE-EAWK-08')}`)}<a class="ina-button ina-button--primary ina-button--md" id="keSpesimen" style="margin-top:12px;text-decoration:none" href="Backlog-HE-CA-Prototype.html#spesimen=${x.kode}">${ik('pena', 16)}Masukkan Spesimen</a>`);
  if (bisaTtd(x)) {
    const otp = x.state === 'OTP_TERKIRIM', habis = otp && x.otpHabis <= Date.now();
    const L = [
      { t:'Periksa isi akta', k:`Baca seluruh ${JHAL} halaman. Tanda tangan Anda ada di halaman ${x.hal}.`, ok:otp, ekstra:S.hal !== x.hal ? tombol(`Lihat halaman ${x.hal}`, 'secondary', 'sm', `data-lompat="${x.hal}" data-sorot`, ik('target', 14)) : '' },
      { t:`Kirim kode ${istilah('OTP', 'OTP')}`, k:otp ? (habis ? 'Kode sudah kedaluwarsa. Kirim ulang untuk mendapatkan kode baru.' : `Terkirim ke ${samar(EMAIL)} pukul ${jamId(x.otpHabis - 900000)}. Berlaku sampai ${jamId(x.otpHabis)}.`) : `Peruri mengirim kode 6 digit ke ${samar(EMAIL)}.`, ok:otp && !habis },
      { t:'Masukkan kode dan tanda tangani', k:`${istilah('Tanda tangan elektronik', 'TTE')} dibubuhkan dengan ${istilah('sertifikat elektronik (CA)', 'CA')} Anda dan tidak dapat dibatalkan.`, ok:false }
    ];
    const kini = otp && !habis ? 2 : 1;
    /* IDDS Stepper vertikal (sama dengan stepper prototipe E-Akta Wizard PPAT) */
    const stepper = `<div class="ina-stepper ina-stepper--vertical langkah-ttd" aria-label="Langkah tanda tangan">${L.map((l, i) => {
      const kls = l.ok ? 'completed' : i === kini ? 'active' : '';
      return `${i ? `<div class="ina-stepper__separator ${L[i - 1].ok ? 'ina-stepper__separator--completed' : ''}"></div>` : ''}<div class="ina-stepper__item ${kls ? 'ina-stepper__item--' + kls : ''}" aria-current="${i === kini ? 'step' : 'false'}">
        <div class="ina-stepper__icon-wrapper">${l.ok ? `<svg class="ina-stepper__check-icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" fill="none"><path d="M5 12l5 5l10 -10"/></svg>` : `<span class="ina-stepper__step-number">${i + 1}</span>`}</div>
        <div class="ina-stepper__label"><span>${l.t}</span><small>${l.k}</small>${l.ekstra || ''}</div></div>`; }).join('')}</div>`;
    const tb =otp && !habis ? tombol('Masukkan OTP & Tanda Tangani', 'primary', 'md', `id="aksiOtp" ${S.memuat ? 'disabled' : ''}`, ik('kunciOtp', 16)) + tombol('Kirim ulang OTP', 'secondary', 'md', `id="aksiKirim" ${S.memuat ? 'disabled' : ''}`, S.memuat === 'kirim' ? spinner : ik('surat', 16))
      : tombol(otp ? 'Kirim ulang OTP' : 'Kirim OTP', 'primary', 'md', `id="aksiKirim" ${S.memuat ? 'disabled' : ''}`, S.memuat === 'kirim' ? spinner : ik('surat', 16));
    return bungkus(`${kepala(otp && !habis ? 'Masukkan kode OTP' : 'Tanda tangani akta ini')}
      ${stepper}${tb}`);
  }
  if (x.state === 'MENUNGGU_GILIRAN') { const sb = x.urutan[s.seq - 1];
    return bungkus(`${kepala('Menunggu giliran Anda')}${alert('info', '', `<b>${esc(sb.nama)}</b> (${PERAN[sb.peran]}) belum menandatangani. Anda akan menerima notifikasi saat giliran Anda tiba. Sambil menunggu, Anda dapat membaca isi akta.`)}`); }
  if (x.state === 'MENUNGGU_TERA') return bungkus(`${kepala('Menunggu stempel PPAT')}${alert('neutral', '', `Kantor PPAT belum membubuhkan stempel elektronik (${istilah('TERA', 'TERA')}). Akta dapat dibaca dan ditandatangani setelah stempel dibubuhkan.`)}`);
  if (x.state === 'SUDAH_TTD') { const g = x.urutan.find(u => u.status !== 'SIGNED');
    return bungkus(`${kepala('Tidak ada tindakan untuk Anda')}${alert('success', 'Tanda tangan Anda tercatat', `Menunggu pihak lain.${g ? ` Giliran saat ini: <b>${esc(g.nama)}</b>${g.peran === 'PPAT' ? '' : ` (${PERAN[g.peran]})`}.` : ''}`)}`); }
  return bungkus(`${kepala('Akta selesai')}${alert('success', '', 'Semua pihak telah menandatangani akta ini. Tidak ada tindakan lagi untuk Anda.')}`);
}
function kartuInfo(x) {

/* label live "Tertanda tangan" / "Sedang tanda tangan" dibakukan, sama dengan prototipe E-Akta Wizard PPAT */
const STATUS_URUT = s => s.status === 'SIGNED' ? ['Sudah menandatangani', 'success'] : s.status === 'OTP_SENT' ? ['Sedang menandatangani', 'warning'] : ['Menunggu', 'neutral'];
function kartuUrutan(x) {

function kartuKontak() {

/* ---------------- gambar & navigasi ---------------- */
function gambar() { gambarNav(); gambarMenu(); $('#halaman').innerHTML = S.layar === 'daftar' ? layarDaftar() : layarDetail(); pasangPanduan(); S.kilau = false; }
function keDaftar() { Object.assign(S, { layar:'daftar', aktif:null, urutBuka:false }); gambar(); window.scrollTo({ top:0 }); }
/* buka akta: penampil langsung ke halaman tanda tangan Anda (HE-EAWK-02) */
function buka(kode) {
  const x = AKTA.find(y => y.kode === kode);
  Object.assign(S, { layar:'detail', aktif:kode, zoom:100, hal:x.hal && x.state !== 'MENUNGGU_TERA' ? x.hal : 1, kilau:!!(x.hal && bisaTtd(x)) });

}
function keHal(h, sorot) { S.hal = Math.max(1, Math.min(JHAL, h)); S.kilau = !!sorot; gambar(); $('#lembar')?.scrollIntoView({ block:'nearest', behavior:'smooth' }); }

/* ---------------- interaksi ---------------- */
const H = $('#halaman');
H.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-lompat], [data-buka]')) { e.preventDefault(); e.target.click(); }
  if (e.target.id === 'inHal' && e.key === 'Enter') keHal(+e.target.value || 1);
});
H.addEventListener('change', e => { if (e.target.id === 'inHal') keHal(+e.target.value || 1); });
H.addEventListener('input', e => {
  if (e.target.id !== 'cariAkta') return;
  S.cari = e.target.value; const pos = e.target.selectionStart; gambar(); const i = $('#cariAkta'); i.focus(); i.setSelectionRange(pos, pos);
});
H.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-ke-daftar]')) { e.preventDefault(); keDaftar(); return; }
  if (t.closest('[data-tutup-panduan]')) { S.panduan = false; try { localStorage.setItem('eawk-panduan-tutup', '1'); } catch (er) {} gambar(); toast('Panduan ditutup. Anda dapat membukanya lagi lewat tombol Bantuan.'); return; }
  if (t.closest('[data-bantuan]')) { bukaBantuan(); return; }
  const gr = t.closest('[data-grup]'); if (gr) { S.grup = gr.dataset.grup; gambar(); return; }
  if (t.closest('#urutTombol')) { S.urutBuka = !S.urutBuka; gambar(); return; }
  const ur = t.closest('[data-urut]'); if (ur) { S.urut = ur.dataset.urut; S.urutBuka = false; gambar(); return; }
  if (t.closest('[data-reset-saring]')) { S.cari = ''; S.grup = ''; gambar(); return; }
  const b = t.closest('[data-buka]'); if (b) { buka(b.dataset.buka); return; }
  if (t.closest('#kembali')) { keDaftar(); return; }
  const lp = t.closest('[data-lompat]'); if (lp) { keHal(+lp.dataset.lompat, lp.hasAttribute('data-sorot')); return; }
  const hl = t.closest('[data-hal]'); if (hl && !hl.disabled) { keHal(+hl.dataset.hal); return; }
  const zm = t.closest('[data-zoom]'); if (zm) { S.zoom = Math.max(60, Math.min(160, S.zoom + +zm.dataset.zoom)); gambar(); return; }
  if (t.closest('#aksiKirim')) { o().state === 'OTP_TERKIRIM' ? kirimOtp(true) : konfirmTtd(); return; }
  if (t.closest('#aksiOtp')) { bukaOtp(); return; }
});
document.addEventListener('click', e => { if (S.urutBuka && !e.target.closest('.urut-wadah')) { S.urutBuka = false; gambar(); } });

/* ---------------- konfirmasi sebelum tanda tangan (HE-EAWK-04) ---------------- */
const ringkas = rows => `<dl class="ringkas">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const pernyataan = t => `<label class="ina-checkbox cek" for="setuju"><input type="checkbox" id="setuju" class="ina-checkbox__input peer"><div class="ina-checkbox__box ina-checkbox__box--unchecked"></div><div class="ina-checkbox__content"><span class="ina-checkbox__label">${t}</span></div></label>`;

      ${ringkas([['Akta', `${x.kode} · Akta Jual Beli`], ['Peran Anda', `${PERAN[x.peran]} · urutan ${s.seq + 1}`], [`Posisi${tanya('Posisi tanda tangan', 'Posisi menunjukkan tempat tanda tangan Anda di dokumen. Kantor PPAT menentukan posisi ini.')}`, `Halaman ${x.hal} dari ${JHAL}`], ['Kode OTP dikirim ke', samar(EMAIL)]])}
      ${pernyataan('Saya sudah membaca isi akta dan setuju menandatanganinya.')}`,

    } });

/* ---------------- dialog OTP dengan masa berlaku (HE-EAWK-05, sama dengan prototipe E-Akta Wizard PPAT) ---------------- */
let OTP = null;
function dialogOtp({ judul, email, ket, tombolOk, selesai, sisa = 900, catatan = '', kirimUlang }) {

        <div class="ina-one-time-password__helper-text" id="otpPesan" aria-live="polite"></div></div>
      <div class="ina-badge ina-badge--soft ina-badge--brand ina-badge--md ina-badge--rounded-full otp-waktu" id="otpWaktu" aria-live="off">${ik('jam', 14)} <span>Kode berlaku 15:00</span></div>
      <div class="otp-ulang" id="otpUlang"></div>${catatan ? `<p class="otp-catat">${catatan}</p>` : ''}${usulan('HE-EAWK-05')}</div>`,
    tombol:[['Batal','secondary',null],[tombolOk,'primary',() => verifikasi(), true]], tanpaFokusUtama:true });
  const L = $('#lapisan'), kotak = [...L.querySelectorAll('[data-otp]')];
  kotak[0].focus();
  kotak.forEach((k, i) => {
    k.addEventListener('input', () => { k.value = k.value.replace(/\D/g, '').slice(-1); if (k.value && kotak[i + 1]) kotak[i + 1].focus(); OTP.galat = ''; segarOtp(); });
    k.addEventListener('keydown', e => { if (e.key === 'Backspace' && !k.value && kotak[i - 1]) kotak[i - 1].focus(); if (e.key === 'Enter') L.querySelector('.ina-modal__footer .ina-button:last-child').click(); });
    k.addEventListener('paste', e => { const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!d) return; e.preventDefault(); d.split('').forEach((c, j) => { if (kotak[j]) kotak[j].value = c; }); kotak[Math.min(d.length, 5)].focus(); segarOtp(); });
  });
  L.addEventListener('click', e => { if (e.target.closest('#kirimUlang')) { OTP.sisa = 15 * 60; OTP.ulang = 60; OTP.coba = 3; OTP.galat = ''; kotak.forEach(k => k.value = ''); kotak[0].focus(); kirimUlang && kirimUlang(); toast('Kode OTP baru sudah dikirim.', 'positive'); segarOtp(); } });
  segarOtp();
  clearInterval(OTP.t); OTP.t = setInterval(() => { if (!$('#otpWaktu')) { clearInterval(OTP.t); return; } OTP.sisa = Math.max(0, OTP.sisa - 1); OTP.ulang = Math.max(0, OTP.ulang - 1); segarOtp(); }, 1000);
  function kode() { return kotak.map(k => k.value).join(''); }
  function verifikasi() {
    if (OTP.sisa <= 0) return false;
    const c = kode(); if (c.length < 6) { OTP.galat = 'Masukkan 6 digit kode OTP.'; segarOtp(); return false; }
    if (c === '000000') { OTP.coba--; OTP.galat = OTP.coba > 0 ? `Kode salah. Periksa kembali kode di email Anda. Sisa percobaan: ${OTP.coba}.` : 'Kode salah 3 kali. Kirim ulang kode untuk mencoba lagi.'; kotak.forEach(k => k.value = ''); kotak[0].focus(); segarOtp(); return false; }
    clearInterval(OTP.t); $('#lapisan').innerHTML = ''; const f = OTP.selesai; OTP = null; tunggu('otp', 600, f); return true;
  }
}
function segarOtp() {
  if (!OTP || !$('#otpWaktu')) return;
  const m = Math.floor(OTP.sisa / 60), d = String(OTP.sisa % 60).padStart(2, '0'), habis = OTP.sisa <= 0;
  const w = $('#otpWaktu'); w.className = `ina-badge ina-badge--soft ina-badge--${habis ? 'error' : OTP.sisa < 120 ? 'warning' : 'brand'} ina-badge--md ina-badge--rounded-full otp-waktu`;
  w.querySelector('span').textContent = habis ? 'Waktu habis' : `Kode berlaku ${m}:${d}`;
  const ps = $('#otpPesan'), galat = habis ? 'Kode sudah kedaluwarsa. Klik "Kirim ulang kode" untuk mendapatkan kode baru.' : OTP.galat;
  ps.textContent = galat || 'Masukkan 6 digit kode dari email. Kode berlaku 15 menit.';
  ps.classList.toggle('ina-one-time-password__helper-text--error', !!galat);
  document.querySelectorAll('[data-otp]').forEach(k => { k.classList.toggle('ina-one-time-password__input--error', !!galat); k.disabled = habis || OTP.coba <= 0; });
  const u = $('#otpUlang'); const bisa = OTP.ulang <= 0 || habis || OTP.coba <= 0;
  u.innerHTML = `Tidak menerima kode? ${bisa ? tombol('Kirim ulang kode', 'link', 'sm', 'id="kirimUlang"') : `<span>Kirim ulang dalam ${Math.floor(OTP.ulang / 60)}:${String(OTP.ulang % 60).padStart(2, '0')}</span>`}`;
  const ok = document.querySelector('#lapisan .ina-modal__footer .ina-button:last-child'); if (ok) ok.disabled = habis || OTP.coba <= 0;
}
$('#simKedaluwarsa').addEventListener('click', () => { if (!OTP) { toast('Buka dialog OTP terlebih dahulu (mis. ORD-CONTOH-022 → Masukkan OTP & Tanda Tangani).'); return; } OTP.sisa = 0; segarOtp(); });

function dialog({ judul, isi, tombol: tb, lebar, kunciUtama, konfirmasi, tanpaFokusUtama }) {
  const L = $('#lapisan');
  L.innerHTML = `<div class="ina-modal"><div class="ina-modal__backdrop" data-i="-1"></div><div class="ina-modal__container">
    <div class="ina-modal__dialog ina-modal__dialog--size-${lebar ? 'lg' : 'md'} ${konfirmasi ? 'ina-modal-confirmation' : ''}" role="${konfirmasi ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgJudul">
      <div class="ina-modal__header"><h2 class="ina-modal__title" id="dlgJudul">${judul}</h2><button type="button" class="ina-modal__close-button" aria-label="Tutup dialog" data-i="-1">${ik('x', 22)}</button></div>
      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md" data-i="${i}">${t}</button>`).join('')}</div></div></div></div>`;
  const utama = L.querySelector('.ina-modal__footer .ina-button:last-child');
  if (kunciUtama) { utama.disabled = true; const cb = L.querySelector(kunciUtama); cb.addEventListener('change', e => { utama.disabled = !e.target.checked; const bx = cb.nextElementSibling; bx.classList.toggle('ina-checkbox__box--checked', e.target.checked); bx.classList.toggle('ina-checkbox__box--unchecked', !e.target.checked); bx.innerHTML = e.target.checked ? ik('centang', 12) : ''; }); }
  else if (!tanpaFokusUtama) utama.focus();
  L.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i;
    if (i < 0) { L.innerHTML = ''; return; }
    const [, , fn, tahan] = tb[i];
    if (tahan) { fn && fn(); return; }
    L.innerHTML = ''; fn && fn();
  };
}

}

const faq = (i, q, a) => `<div class="ina-accordion"><button type="button" class="ina-accordion__toggle" aria-expanded="false" aria-controls="faq-${i}"><div class="ina-accordion__title">${q}</div><div class="ina-accordion__toggler"><svg class="ina-accordion__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6" /></svg></div></button><div id="faq-${i}" class="ina-accordion__content"><div class="ina-accordion__body"><p>${a}</p></div></div></div>`;
function bukaBantuan() {
  drawer({ judul:'Bantuan Penandatanganan Akta', isi:`

      <li><b>Periksa isi akta.</b> PDF terbuka langsung di halaman tanda tangan Anda. Baca seluruh halaman sebelum menandatangani.</li>
      <li><b>Kirim OTP.</b> Peruri mengirim kode 6 digit ke email Anda. Kode berlaku 15 menit.</li>

    ${faq(1, 'Apa itu tanda tangan elektronik?', 'Tanda tangan pada dokumen digital yang dibuat dengan sertifikat elektronik (CA) dari Peruri. Sertifikat ini membuktikan bahwa tanda tangan benar-benar milik Anda.')}
    ${faq(2, 'Mengapa tombol tanda tangan belum aktif?', 'Tanda tangan dilakukan berurutan. Tombol aktif setelah pihak sebelum Anda menandatangani dan Kantor PPAT sudah membubuhkan stempel serta menempatkan posisi tanda tangan Anda.')}
    ${faq(3, 'Kode OTP tidak masuk atau sudah kedaluwarsa', 'Periksa folder spam atau promosi di email Anda. Kode berlaku 15 menit. Jika belum masuk atau sudah kedaluwarsa, klik "Kirim ulang kode" di dialog OTP (aktif setelah 60 detik).')}
    ${faq(4, 'Saya salah menandatangani atau isi akta keliru', 'Tanda tangan yang sudah dibubuhkan tidak dapat dibatalkan dari akun Anda. Segera hubungi Kantor PPAT; kantor dapat menyusun ulang proses tanda tangan bila diperlukan.')}
    ${faq(5, 'Posisi tanda tangan saya belum ditentukan', 'Posisi tanda tangan ditentukan oleh Kantor PPAT. Hubungi kantor melalui kontak di bawah agar posisi segera ditempatkan.')}

function lihat(u) {
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  if (u.ke === 'daftar') keDaftar();
  if (u.ke === 'panduan') { S.panduan = true; try { localStorage.removeItem('eawk-panduan-tutup'); } catch (e) {} keDaftar(); }
  if (u.ke === 'giliran') buka('ORD-CONTOH-021');
  if (u.ke === 'spesimen') { aturSimTtd('aktif'); buka('ORD-CONTOH-021'); }
  if (u.ke === 'konfirm') { buka('ORD-CONTOH-021'); konfirmTtd(); return; }
  if (u.ke === 'otp') { buka('ORD-CONTOH-022'); bukaOtp(); return; }
  if (u.ke === 'tanpa-posisi') buka('ORD-CONTOH-023');

}

.notif-kanan{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px;color:var(--ina-content-tertiary,#8a9390)}
.notif-titik{width:8px;height:8px;border-radius:999px;background:var(--ina-primary-primary,#1f4d40)}
.notif-vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.notif-status{padding:28px 16px;text-align:center;font-size:13.5px;line-height:20px;color:var(--ina-content-secondary,#5c6663)}
.notif-status svg{display:block;margin:0 auto 8px;color:var(--ina-content-tertiary,#8a9390)}
.notif-rangka{list-style:none;margin:0;padding:4px 0}
.notif-rangka li{display:flex;gap:12px;padding:12px 16px}
.notif-rangka i{display:block;border-radius:8px;background:var(--ina-background-secondary,#eef1f0);animation:notif-denyut 1.2s ease-in-out infinite}
.notif-rangka .b1{width:36px;height:36px;border-radius:999px;flex:none}
.notif-rangka .b2{height:10px;margin-top:6px}
@keyframes notif-denyut{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.notif-rangka i{animation:none}}
.notif-galat{padding:16px}
.notif-galat .ina-alert__content{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.notif-kaki{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--ina-stroke-primary,#e3e7e6);font-size:12px;line-height:16px;color:var(--ina-content-secondary,#5c6663)}
.notif-kaki .tag-usulan{margin-left:0}
@media (max-width:760px){
  .notif-panel{position:fixed;left:0;right:0;width:auto;max-width:none;border-radius:0 0 16px 16px;border-left:0;border-right:0;max-height:calc(100vh - var(--notif-atas,72px) - 8px)}
}
</style>
<script id="notif-bersama">
(() => {
  if (window.__notifBersama) return;
  window.__notifBersama = true;

  const KUNCI = 'eppat-notif-dibaca';
  const MENIT = 60000, JAM = 60 * MENIT;
  const sekarang = Date.now();

  /* ikon garis 24×24 (currentColor) */
  const IK = {
    order: '<path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" /><path d="M9 12l.01 0" /><path d="M13 12l2 0" /><path d="M9 16l.01 0" /><path d="M13 16l2 0" />',
    verif: '<path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M9 12l2 2l4 -4" />',
    ttd: '<path d="M3 17c3.333 -3.333 5 -6 5 -8c0 -3 -1 -3 -2 -3s-2.032 1.085 -2 3c.034 2.048 1.658 4.877 2.5 6c1.5 2 2.5 2.5 3.5 1l2 -3c.333 2.667 1.333 4 3 4c.53 0 2.639 -2 3 -2c.517 0 1.517 .667 3 2" />',
    akta: '<path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" /><path d="M9 15l2 2l4 -4" />',
    salinan: '<path d="M15 3v4a1 1 0 0 0 1 1h4" /><path d="M18 17h-7a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h4l5 5v7a2 2 0 0 1 -2 2z" /><path d="M16 17v2a2 2 0 0 1 -2 2h-7a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h2" />',
    sistem: '<path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" />',
    lonceng: '<path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" />',
    chevron: '<path d="M9 6l6 6l-6 6" />',
    cek: '<path d="M5 12l5 5l10 -10" />'
  };
  const ik = (n, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${IK[n]}</svg>`;

  /* jenis notifikasi: label singkat, ikon, varian badge IDDS */
  const JENIS = {
    order: ['Permohonan baru', 'order', 'brand'],
    verifikasi: ['Verifikasi', 'verif', 'warning'],
    giliran: ['Giliran tanda tangan', 'ttd', 'info'],
    ttd_selesai: ['Tanda tangan selesai', 'ttd', 'success'],
    akta: ['Akta selesai', 'akta', 'success'],
    salinan: ['Salinan dibuka', 'salinan', 'neutral'],
    sistem: ['Sistem', 'sistem', 'neutral'],
    kantor: ['PPAT baru', 'order', 'brand'],
    keamanan: ['Keamanan', 'sistem', 'warning'],
    paket: ['Paket', 'sistem', 'info'],
    template: ['Template akta', 'akta', 'success']
  };

  /* contoh data: Klien (para pihak) hanya menerima notifikasi tentang akta dan akunnya sendiri */
  const KLIEN = /Peran:\s*Klien/.test((document.querySelector('.protobar') || {}).textContent || '');
  const DATA_KLIEN = [
    { id: 'k4', jenis: 'giliran', judul: 'Giliran Anda menandatangani akta', isi: 'Akta Jual Beli ORD-CONTOH-007 menunggu tanda tangan elektronik Anda.', lalu: 3 * MENIT, baca: false, ke: 'Backlog-HE-EAWK-Prototype.html' },
    { id: 'k3', jenis: 'sistem', judul: 'Lengkapi registrasi sertifikat elektronik', isi: 'Selesaikan eKYC di portal Peruri agar Anda dapat menandatangani akta.', lalu: 2 * JAM, baca: false, ke: 'Backlog-HE-CA-Prototype.html' },
    { id: 'k2', jenis: 'ttd_selesai', judul: 'Semua pihak sudah menandatangani', isi: 'Akta Jual Beli ORD-CONTOH-005 sudah ditandatangani semua pihak dan sedang difinalisasi kantor PPAT.', lalu: 30 * JAM, baca: true, ke: 'Backlog-HE-EAWK-Prototype.html' },
    { id: 'k1', jenis: 'akta', judul: 'Salinan akta dikirim ke email Anda', isi: 'Buka tautan di email untuk mengunduh salinan akta ORD-CONTOH-005. Tautan berlaku 7 hari.', lalu: 50 * JAM, baca: true, ke: '' }
  ].map(d => Object.assign({}, d, { waktu: sekarang - d.lalu }));

  /* contoh data bersama staf kantor (netral; sama untuk semua prototipe staf) */
  const DATA_STAF = [
    { id: 'n8', jenis: 'giliran', judul: 'Giliran Anda menandatangani akta', isi: 'Akta Jual Beli ORD-CONTOH-009 menunggu tanda tangan elektronik Anda.', lalu: 20 * 1000, baca: false, ke: 'Backlog-HE-ORDER-Prototype.html#order=ORD-CONTOH-009' },
    { id: 'n7', jenis: 'order', judul: 'Permohonan baru ORD-CONTOH-014', isi: 'Asisten Contoh membuat permohonan Akta Jual Beli untuk Contoh Penjual Satu.', lalu: 5 * MENIT, baca: false, ke: 'Backlog-HE-ORDER-Prototype.html' },
    { id: 'n6', jenis: 'verifikasi', judul: 'Berkas ORD-CONTOH-012 perlu diverifikasi', isi: 'Contoh Penjual Satu mengunggah KTP dan sertipikat. Periksa berkas sebelum akta disusun.', lalu: 42 * MENIT, baca: false, ke: 'Backlog-HE-ORDER-Prototype.html#order=ORD-CONTOH-012' },
    { id: 'n5', jenis: 'sistem', judul: 'Pemeliharaan sistem terjadwal', isi: 'E-PPAT tidak dapat diakses pada Sabtu, 31 Oktober 2026, pukul 22.00–23.00 WIB.', lalu: 2 * JAM, baca: false, ke: '' },
    { id: 'n4', jenis: 'sistem', judul: 'Pendaftaran TERA kantor diproses Peruri', isi: 'Peruri sedang memeriksa data TERA kantor Anda. Hasilnya akan dikirim lewat notifikasi dan email.', lalu: 3 * JAM, baca: true, ke: 'Backlog-HE-TERA-Prototype.html#registrasi' },
    { id: 'n3', jenis: 'akta', judul: 'Akta ORD-CONTOH-005 selesai', isi: 'Akta sudah difinalisasi. Unggah scan akta, lalu kirim salinannya di menu Salinan Akta.', lalu: 7 * JAM, baca: true, ke: 'Backlog-IDDS-TN-EPPAT-Prototype.html#salinan' },
    { id: 'n2', jenis: 'salinan', judul: 'Salinan akta ORD-CONTOH-005 dibuka', isi: 'Contoh Penjual Satu membuka tautan salinan akta.', lalu: 26 * JAM, baca: true, ke: 'Backlog-IDDS-TN-EPPAT-Prototype.html#salinan' },
    { id: 'n1', jenis: 'sistem', judul: 'Layanan e-Meterai belum aktif', isi: 'Aktifkan e-Meterai agar akta dapat dibubuhi meterai elektronik.', lalu: 50 * JAM, baca: true, ke: 'Backlog-IDDS-TN-EPPAT-Prototype.html#emeterai' }
  ].map(d => Object.assign({}, d, { waktu: sekarang - d.lalu }));
  /* Admin Platform: notifikasi tingkat platform (bukan notifikasi kantor) */
  const PLATFORM = /Peran:\s*Admin Platform/.test((document.querySelector('.protobar') || {}).textContent || '');
  const DATA_PLATFORM = [
    { id: 'p4', jenis: 'kantor', judul: 'Kantor PPAT baru terdaftar', isi: 'Kantor PPAT Contoh Dua selesai onboarding dengan paket Enterprise.', lalu: 15 * MENIT, baca: false, ke: 'Backlog-IDDS-PL-MONITORING-Prototype.html#ppat' },
    { id: 'p3', jenis: 'keamanan', judul: 'Gagal masuk berulang', isi: 'Ada 5 percobaan masuk gagal dari akun yang sama di Kantor PPAT Contoh Tiga dalam 10 menit.', lalu: 1 * JAM, baca: false, ke: 'Backlog-IDDS-PL-MONITORING-Prototype.html#log' },
    { id: 'p2', jenis: 'paket', judul: 'Masa berlaku paket segera habis', isi: '12 kantor PPAT berpaket Gratis akan habis masa berlakunya dalam 7 hari.', lalu: 5 * JAM, baca: true, ke: 'Backlog-IDDS-PL-MONITORING-Prototype.html#ppat' },
    { id: 'p1', jenis: 'template', judul: 'Template akta diperbarui', isi: 'Template Akta Jual Beli versi terbaru sudah dipakai semua kantor PPAT.', lalu: 30 * JAM, baca: true, ke: 'Backlog-IDDS-PL-AKTA-Prototype.html#jenis' }
  ].map(d => Object.assign({}, d, { waktu: sekarang - d.lalu }));
  const DATA = PLATFORM ? DATA_PLATFORM : KLIEN ? DATA_KLIEN : DATA_STAF;

  /* penyimpanan status dibaca (aman bila localStorage tidak tersedia) */
  let simpanan = {};
  try { simpanan = JSON.parse(localStorage.getItem(KUNCI) || '{}') || {}; } catch (e) { simpanan = {}; }
  const simpan = () => { try { localStorage.setItem(KUNCI, JSON.stringify(simpanan)); } catch (e) { /* tanpa storage tetap jalan */ } };
  const dibaca = d => d.baca || simpanan[d.id] === 1;
  const tandai = id => { simpanan[id] = 1; simpan(); };
  const jumlahBelum = () => DATA.filter(d => !dibaca(d)).length;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const waktuRelatif = t => {
    const s = Date.now() - t;
    if (s < MENIT) return 'Baru saja';
    if (s < JAM) return Math.floor(s / MENIT) + ' menit lalu';
    if (s < 24 * JAM) return Math.floor(s / JAM) + ' jam lalu';
    try { return new Date(t).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, ''); }
    catch (e) { return new Date(t).toDateString(); }
  };

  let gagalSimulasi = false;
  try { gagalSimulasi = new URLSearchParams(location.search).get('notifgagal') === '1'; } catch (e) { /* abaikan */ }

  const mulai = () => {
    const bel = document.querySelector('header.top button[aria-label="Notifikasi"]');
    if (!bel || bel.hasAttribute('data-notif')) return;
    bel.setAttribute('data-notif', '1');

    /* jangkar: bungkus tombol lonceng agar panel tepat di bawahnya dan urutan Tab alami */
    const jangkar = document.createElement('span');
    jangkar.className = 'notif-jangkar';
    bel.parentNode.insertBefore(jangkar, bel);
    jangkar.appendChild(bel);

    const lencana = document.createElement('span');
    lencana.className = 'notif-lencana';
    lencana.setAttribute('aria-hidden', 'true');
    jangkar.appendChild(lencana);

    const panel = document.createElement('div');
    panel.className = 'notif-panel';
    panel.id = 'notifPanel';
    panel.hidden = true;
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'false');
    panel.setAttribute('aria-labelledby', 'notifJudul');
    panel.innerHTML = `
      <div class="notif-kepala">
        <div class="notif-baris">
          <div>
            <h2 class="notif-judul" id="notifJudul" tabindex="-1">Notifikasi</h2>
            <p class="notif-jumlah" id="notifJumlah" aria-live="polite"></p>
          </div>
          <button type="button" class="ina-button ina-button--tertiary ina-button--sm" id="notifSemua" hidden><span>Tandai Semua Dibaca</span></button>
        </div>
        <div class="notif-saring">
          <div class="ina-button-group" role="group" aria-label="Saring notifikasi">
            <button type="button" class="ina-button-group__button" data-saring="semua"><span class="ina-button-group__button-content">Semua</span></button>
            <button type="button" class="ina-button-group__button" data-saring="belum"><span class="ina-button-group__button-content">Belum dibaca</span></button>
          </div>
        </div>
      </div>
      <div class="notif-isi" id="notifIsi"></div>
      <div class="notif-kaki"><span>Notifikasi diperbarui otomatis setiap menit.</span><span class="tag-usulan">penyesuaian · IDDS-TN-39</span></div>`;
    jangkar.appendChild(panel);

    bel.setAttribute('aria-haspopup', 'dialog');
    bel.setAttribute('aria-expanded', 'false');
    bel.setAttribute('aria-controls', panel.id);
    bel.setAttribute('title', 'Notifikasi');

    const isi = panel.querySelector('#notifIsi');
    const elJumlah = panel.querySelector('#notifJumlah');
    const tSemua = panel.querySelector('#notifSemua');
    const judul = panel.querySelector('#notifJudul');

    let saring = 'semua';
    let kondisi = 'baru'; // baru | muat | galat | siap

    const perbaruiBel = () => {
      const n = jumlahBelum();
      lencana.textContent = n > 9 ? '9+' : String(n);
      lencana.hidden = n === 0;
      bel.setAttribute('aria-label', n ? `Notifikasi, ${n} belum dibaca` : 'Notifikasi, tidak ada yang belum dibaca');
      elJumlah.textContent = n ? `${n} belum dibaca` : 'Semua sudah dibaca';
      tSemua.hidden = n === 0 || kondisi !== 'siap';
    };

    const itemHtml = d => {
      const [label, ikon, varian] = JENIS[d.jenis] || JENIS.sistem;
      const belum = !dibaca(d);
      const meta = `<span class="notif-meta"><span class="ina-badge ina-badge--soft ina-badge--${varian} ina-badge--sm ina-badge--rounded-full">${esc(label)}</span><span class="notif-waktu">${esc(waktuRelatif(d.waktu))}</span></span>`;
      const teks = `<span class="notif-teks">${meta}<span class="notif-t">${esc(d.judul)}</span><span class="notif-b">${esc(d.isi)}</span>${belum ? '<span class="notif-vh">Belum dibaca.</span>' : ''}`;
      const titik = belum ? '<span class="notif-titik" aria-hidden="true"></span>' : '';
      if (d.ke) {
        return `<li><a class="notif-item${belum ? ' belum' : ''}" href="${esc(d.ke)}" data-notif-id="${esc(d.id)}"><span class="notif-ikon" aria-hidden="true">${ik(ikon)}</span>${teks}</span><span class="notif-kanan">${titik}${ik('chevron', 16)}</span></a></li>`;
      }
      const tombol = belum ? `<button type="button" class="ina-button ina-button--secondary ina-button--sm notif-tandai" data-tandai="${esc(d.id)}"><span>Tandai dibaca</span></button>` : '';
      return `<li><div class="notif-item${belum ? ' belum' : ''}"><span class="notif-ikon" aria-hidden="true">${ik(ikon)}</span>${teks}${tombol}</span><span class="notif-kanan">${titik}</span></div></li>`;
    };

    const render = () => {
      perbaruiBel();
      panel.querySelectorAll('[data-saring]').forEach(b => {
        const on = b.dataset.saring === saring;
        b.classList.toggle('ina-button-group__button--selected', on);
        b.setAttribute('aria-pressed', String(on));
      });
      if (kondisi === 'muat') {
        isi.innerHTML = `<p class="notif-vh" role="status">Memuat notifikasi…</p><ul class="notif-rangka" aria-hidden="true">${'<li><i class="b1"></i><span style="flex:1"><i class="b2" style="width:40%"></i><i class="b2" style="width:85%"></i><i class="b2" style="width:65%"></i></span></li>'.repeat(3)}</ul><p class="notif-status" style="padding-top:4px" aria-hidden="true">Memuat notifikasi…</p>`;
        return;
      }
      if (kondisi === 'galat') {
        isi.innerHTML = `<div class="notif-galat"><div class="ina-alert ina-alert--critical" role="alert"><div class="ina-alert__content"><div class="ina-alert__text-section"><div class="ina-alert__title">Notifikasi gagal dimuat.</div><div class="ina-alert__description">Periksa koneksi Anda, lalu coba lagi.</div></div><button type="button" class="ina-button ina-button--secondary ina-button--sm" id="notifUlang"><span>Coba Lagi</span></button></div></div></div>`;
        return;
      }
      const daftar = DATA.filter(d => saring === 'semua' || !dibaca(d));
      if (!daftar.length) {
        isi.innerHTML = `<div class="notif-status">${ik('lonceng', 24)}${saring === 'belum' ? 'Tidak ada notifikasi yang belum dibaca.' : 'Belum ada notifikasi.'}</div>`;
        return;
      }
      isi.innerHTML = `<ul class="notif-daftar">${daftar.map(itemHtml).join('')}</ul>`;
    };

    const muat = () => {
      kondisi = 'muat';
      render();
      setTimeout(() => {
        if (gagalSimulasi) { gagalSimulasi = false; kondisi = 'galat'; } // gagal sekali, "Coba Lagi" berhasil
        else kondisi = 'siap';
        render();
      }, 300);
    };

    const atur = () => {
      if (panel.hidden) return;
      if (window.matchMedia && window.matchMedia('(max-width:760px)').matches) {
        const r = bel.getBoundingClientRect();
        const atas = Math.max(0, Math.round(r.bottom + 8));
        panel.style.top = atas + 'px';
        panel.style.setProperty('--notif-atas', atas + 'px');
      } else {
        panel.style.top = '';
        panel.style.removeProperty('--notif-atas');
      }
    };

    const buka = () => {
      panel.hidden = false;
      bel.setAttribute('aria-expanded', 'true');
      atur();
      if (kondisi === 'baru') muat(); else render();
      judul.focus();
    };
    const tutup = (kembali) => {
      if (panel.hidden) return;
      panel.hidden = true;
      bel.setAttribute('aria-expanded', 'false');
      if (kembali) bel.focus();
    };

    bel.addEventListener('click', e => { e.preventDefault(); panel.hidden ? buka() : tutup(false); });

    panel.addEventListener('click', e => {
      const sar = e.target.closest('[data-saring]');
      if (sar) { saring = sar.dataset.saring; render(); return; }
      if (e.target.closest('#notifSemua')) {
        DATA.forEach(d => { simpanan[d.id] = 1; });
        simpan(); render(); judul.focus(); return;
      }
      if (e.target.closest('#notifUlang')) { muat(); judul.focus(); return; }
      const tnd = e.target.closest('[data-tandai]');
      if (tnd) { tandai(tnd.dataset.tandai); render(); judul.focus(); return; }
      const a = e.target.closest('a[data-notif-id]');
      if (a) { tandai(a.dataset.notifId); perbaruiBel(); tutup(false); /* lanjut navigasi bawaan tautan */ }
    });

    document.addEventListener('keydown', e => {
      if ((e.key === 'Escape' || e.key === 'Esc') && !panel.hidden) { e.stopPropagation(); tutup(true); }
    }, true);
    document.addEventListener('click', e => {
      if (!panel.hidden && !jangkar.contains(e.target)) tutup(false);
    }, true);
    jangkar.addEventListener('focusout', e => {
      if (!panel.hidden && e.relatedTarget && !jangkar.contains(e.relatedTarget)) tutup(false);
    });
    window.addEventListener('resize', atur);
    window.addEventListener('scroll', atur, { passive: true });

    /* live: polling 60 dtk — di prototipe hanya memperbarui waktu relatif & jumlah */
    setInterval(() => { if (kondisi === 'siap' && !panel.hidden) render(); else perbaruiBel(); }, 60000);
    /* status dibaca dari tab/prototipe lain */
    window.addEventListener('storage', e => {
      if (e.key !== KUNCI) return;
      try { simpanan = JSON.parse(e.newValue || '{}') || {}; } catch (er) { simpanan = {}; }
      if (!panel.hidden && kondisi === 'siap') render(); else perbaruiBel();
    });

    perbaruiBel();
  };

  try {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
    else mulai();
  } catch (e) { /* jangan pernah memecah halaman */ }
})();
</script>

<!-- ===== Sesi bersama (sesi-bersama.html, disisipkan rakit-idds.js ke prototipe tenant) =====
     Masuk simulasi per peran, menu profil (Akun Saya, Ganti Peran, Keluar), menu sidebar per peran, dan penjaga halaman.
     Tanpa sesi, prototipe tampil seperti biasa, sehingga tautan langsung dari daftar prototipe tetap berjalan.
     Menu per peran mengikuti live (dilihat 20 Okt 2026 dengan akun tiap peran); aturan Super Admin dan Super Admin + PPAT mengikuti masukan Peruri. -->
<style id="sesi-bersama-css">
.sesi-sembunyi{display:none!important}
.ingat,#bannerCa,.sesi-tanpa-daftar [data-akun="ca"],.sesi-tanpa-daftar [data-tab="ca"]{display:none!important}
#notifDaftar{display:grid;gap:8px;padding:24px 32px 0}
#notifDaftar:empty{display:none}
#notifDaftar:not(:empty) + .page{padding-top:16px}
#notifDaftar .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
#notifDaftar .ina-alert__text-section{flex:1;min-width:240px}
#notifDaftar .notif-aksi{display:flex;align-items:center;gap:8px}
#notifDaftar .ina-button{text-decoration:none}
@media (max-width:760px){ #notifDaftar{padding:16px 16px 0} }
.protobar .sesi-pilih{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 8px;border-radius:999px;cursor:pointer}
.protobar .sesi-pilih option{color:#1f2a2e;background:#fff}
#menuSesi .ina-action-dropdown__menu{position:absolute;top:calc(100% + 6px);right:0;left:auto;min-width:260px;z-index:60;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.user .ina-action-dropdown__item{text-decoration:none}
.user .ina-action-dropdown__item:hover{text-decoration:none}
.user .ina-action-dropdown__divider{height:1px;margin:4px 0;padding:0;background:var(--ina-stroke-primary)}
#profilMenu{min-width:260px}
.user.sesi-pemicu{cursor:pointer}
.user.sesi-pemicu:hover{background:var(--ina-background-secondary)}
.user.sesi-pemicu:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.sesi-tolak{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:64px 16px 24px;background:var(--ina-background-secondary)}
.sesi-tolak-kartu{width:100%;max-width:440px;padding:28px;border:1px solid var(--ina-stroke-primary);border-radius:16px;background:var(--ina-background-primary,#fff)}
.sesi-tolak-kartu h2{margin:0 0 8px;font-size:20px;line-height:28px;font-weight:600;color:var(--ina-content-primary)}
.sesi-tolak-kartu p{margin:0 0 16px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.sesi-tolak-aksi{display:flex;flex-wrap:wrap;gap:12px}
#lencanaTrial{flex:none;white-space:nowrap}
#spandukTrial{padding:24px 32px 0}
#spandukTrial + .page{padding-top:16px}
#spandukTrial .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
#spandukTrial .ina-alert__text-section{flex:1;min-width:240px}
#spandukTrial .spanduk-aksi{display:flex;align-items:center;gap:8px}
#spandukTrial .ina-button{text-decoration:none}
.sb-trial{padding:0 0 8px}
.sb-trial .ina-button{width:100%;justify-content:center;text-decoration:none}
.sidebar.sb-ciut .sb-trial-teks{display:none}
@media (max-width:760px){ #spandukTrial{padding:16px 16px 0} #lencanaTrial .lt-opsi{display:none} }
