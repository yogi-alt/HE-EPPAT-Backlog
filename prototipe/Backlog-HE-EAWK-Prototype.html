  if (!sesi && !['HE-CA', 'HE-EAWK'].includes(berkas)) {
    const a = AKUN.find(x => x.kunci === kini); sesiTampil = dataSesi(a);
    if (halamanPpat && pemicu) [['.uname', a.nama], ['.urole', a.label], ['.ava', a.nama.charAt(0)]].forEach(([s, t]) => { const el = pemicu.querySelector(s); if (el) el.textContent = t; });
    document.body.classList.toggle('sesi-tanpa-daftar', !!sesiTampil.tanpaDaftar);
    document.body.classList.toggle('sesi-tanpa-ingat', !izin(sesiTampil, 'Aktivasi e-Meterai'));
    const n = $('#nav'), saringTampil = () => n.querySelectorAll('a.nav-item').forEach(x => x.classList.toggle('sesi-sembunyi', !izin(sesiTampil, x.textContent.trim())));
    if (n) { saringTampil(); new MutationObserver(saringTampil).observe(n, { childList:true }); }
  }
  const pilihPeran = `<span id="sesiPeran"><label for="sesiPilih">Peran:</label> <select id="sesiPilih" class="sesi-pilih">${AKUN.map(a => `<option value="${a.kunci}" ${a.kunci === kini ? 'selected' : ''}>${a.label}</option>`).join('')}</select></span>`;
  if (labelPeran) labelPeran.outerHTML = pilihPeran;
  else { const judul = $('.protobar b'); if (judul) judul.insertAdjacentHTML('afterend', `<span class="sep">&bull;</span>${pilihPeran}`); }
  const pilih = $('#sesiPilih');
  if (pilih) pilih.addEventListener('change', () => { const s = dataSesi(AKUN.find(a => a.kunci === pilih.value)); simpan(s); if (halamanBoleh(s)) location.reload(); else location.href = LANDAS[s.aktif]; });

  /* menu profil untuk halaman yang belum memilikinya */
  const milikSendiri = pemicu && pemicu.id === 'user' ? pemicu : null;
  if (pemicu && !milikSendiri) {
    pemicu.classList.add('sesi-pemicu', 'ina-action-dropdown');
    pemicu.setAttribute('role', 'button'); pemicu.setAttribute('tabindex', '0'); pemicu.setAttribute('aria-haspopup', 'menu'); pemicu.setAttribute('aria-expanded', 'false');
    pemicu.insertAdjacentHTML('beforeend', '<div id="menuSesi"></div>');
    const wadah = $('#menuSesi');
    const atur = buka => {
      pemicu.setAttribute('aria-expanded', String(buka));
      wadah.innerHTML = buka ? `<div class="ina-action-dropdown__menu ina-action-dropdown__menu--visible" role="menu">
        <button type="button" class="ina-action-dropdown__item" role="menuitem" data-sesi-href="${AKUN_SAYA}"><span class="ina-action-dropdown__item-icon">${svg(I_AKUN)}</span><span class="ina-action-dropdown__item-content">Akun Saya</span></button>
        <div class="ina-action-dropdown__divider" role="separator"></div>
        <button type="button" class="ina-action-dropdown__item" role="menuitem" data-sesi-keluar><span class="ina-action-dropdown__item-icon">${svg(I_KELUAR)}</span><span class="ina-action-dropdown__item-content">Keluar</span></button></div>` : '';
    };
    pemicu.addEventListener('click', e => { e.stopPropagation(); atur(!wadah.innerHTML); });
    pemicu.addEventListener('keydown', e => { if (e.target === pemicu && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); atur(!wadah.innerHTML); } });
    document.addEventListener('click', () => { if (wadah.innerHTML) atur(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && wadah.innerHTML) atur(false); });
  }

  /* notifikasi pendaftaran: satu sumber untuk semua halaman dan peran; Super Admin tanpa PPAT tidak mendapatkannya */
  const tampil = sesiTampil || dataSesi(AKUN.find(a => a.kunci === kini));
  const TEKS_CA = { kurang:'Sertifikat elektronik (CA) Anda belum terdaftar. Daftarkan sekarang agar Anda dapat menandatangani akta secara elektronik.',
    siap:'Sertifikat elektronik (CA) Anda belum terdaftar. Data Anda sudah lengkap dan siap diajukan ke Peruri.',
    ekyc:'Registrasi CA Anda menunggu verifikasi identitas (eKYC) di portal Peruri.',
    periksa:'Peruri sedang memeriksa registrasi CA Anda.',
    kedaluwarsa:'Sertifikat elektronik (CA) Anda sudah kedaluwarsa. Ajukan registrasi ulang agar Anda dapat menandatangani akta.' };
  const I_TUTUP = '<path d="M18 6l-12 12" /><path d="M6 6l12 12" />';
  const ditutup = k => { try { return sessionStorage.getItem('eppat-notif-' + k) === '1'; } catch (e) { return false; } };
  const konten = $('.content');
  if (konten) konten.insertAdjacentHTML('afterbegin', '<div id="notifDaftar"></div>');
  window.segarNotif = () => {
    const w = $('#notifDaftar'); if (!w) return;
    const ca = TEKS_CA[window.AJB.caStatus(tampil.email) || tampil.ca], teraBelum = ['', 'belum', 'rejected'].includes(window.AJB.teraStatus());
    const isi = tampil.tanpaDaftar || tampil.aktif === 'ROLE_ADMIN' && !tampil.peran.includes('ROLE_PPAT') ? [] : [
      ca && ['ca', ca, 'Buka Registrasi CA', REG_CA],
      tampil.peran.includes('ROLE_PPAT') && teraBelum && ['tera', 'Stempel Elektronik (TERA) kantor Anda belum didaftarkan. Lengkapi data pendaftaran TERA agar akta bisa distempel elektronik.', 'Daftar TERA', 'Backlog-HE-TERA-Prototype.html#registrasi']
    ].filter(x => x && !ditutup(x[0]));
    w.innerHTML = isi.map(([k, teks, aksi, href]) => `<div class="ina-alert ina-alert--caution" role="status"><div class="ina-alert__content"><div class="ina-alert__text-section"><div class="ina-alert__description">${teks}</div></div><div class="notif-aksi"><a class="ina-button ina-button--primary ina-button--sm" href="${href}" data-notif-daftar="${k}">${aksi}</a><button type="button" class="ina-alert__close-button" aria-label="Tutup notifikasi" data-tutup-notif="${k}">${svg(I_TUTUP)}</button></div></div></div>`).join('');
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-tutup-notif]'); if (b) { try { sessionStorage.setItem('eppat-notif-' + b.dataset.tutupNotif, '1'); } catch (x) { /* peramban menolak penyimpanan */ } window.segarNotif(); return; }
    const a = e.target.closest('[data-notif-daftar]'); if (a && window.bukaDaftar && window.bukaDaftar(a.dataset.notifDaftar)) e.preventDefault();
  });
  window.segarNotif();

  if (!sesi) return;

  /* sidebar per peran */
  const nav = $('#nav'), boleh = t => izin(sesi, t);
  const lengkap = () => MENU.map(([g, m]) => { const isi = m.filter(([t]) => boleh(t)); return isi.length ? `<button class="grp" aria-expanded="true"><span>${g}</span></button>
    <div class="items">${isi.map(([t, k, h]) => `<a href="#" class="ina-button ina-button--link ina-button--md nav-item" data-sesi-href="${h}">${svg(IKON[k] || '')}<span>${t}</span></a>`).join('')}</div>` : ''; }).join('');
  const saring = () => {
    if (!nav) return;
    if (['HE-CA', 'HE-EAWK'].includes(berkas) && sesi.aktif !== 'ROLE_KLIEN') { if (!nav.querySelector('[data-sesi-href]')) nav.innerHTML = lengkap(); return; }
    if (['HE-ORDER', 'HE-TUGAS'].includes(berkas) && sesi.aktif === 'ROLE_KLIEN' && !nav.querySelector('[data-sesi-href]')) [...nav.querySelectorAll('.items')].find(w => w.textContent.includes('Permohonan AJB')).insertAdjacentHTML('beforeend', `<a href="#" class="ina-button ina-button--link ina-button--md nav-item" data-sesi-href="Backlog-HE-EAWK-Prototype.html">${svg(IKON.signature || '')}<span>Penandatanganan Akta</span></a>`);
    nav.querySelectorAll('a.nav-item').forEach(a => a.classList.toggle('sesi-sembunyi', !boleh(a.textContent.trim())));
    nav.querySelectorAll('.items').forEach(w => {
      const kosong = !w.querySelector('a.nav-item:not(.sesi-sembunyi)'); w.classList.toggle('sesi-sembunyi', kosong);
      const g = w.previousElementSibling; if (g && g.classList.contains('grp')) g.classList.toggle('sesi-sembunyi', kosong);
    });
  };
  if (nav) { saring(); new MutationObserver(saring).observe(nav, { childList:true }); }

  /* paket Trial: spanduk, tombol di bawah menu, dan peta perjalanan di bilah prototipe (HE-TRIAL-03, -09) */
  if (sesi.paket === 'trial') {
    const t = bacaTrial(), ent = sudahEnt(), konten = $('.content'), I_PANAH = '<path d="M5 12l14 0" /><path d="M13 18l6 -6" /><path d="M13 6l6 6" />', I_X = '<path d="M18 6l-12 12" /><path d="M6 6l12 12" />';
    const bar = $('.protobar .kanan') || $('.protobar');
    const tutup = '<button type="button" class="ina-button ina-button--tertiary ina-button--sm" data-tutup-spanduk aria-label="Tutup pesan">' + svg(I_X) + '</button>';
    const spanduk = (j, id, isi, aksi) => konten && konten.insertAdjacentHTML('afterbegin', `<div id="spandukTrial" data-kunci="${id}"><div class="ina-alert ina-alert--${j}" role="status"><div class="ina-alert__content"><div class="ina-alert__text-section"><div class="ina-alert__description">${isi}</div></div><div class="spanduk-aksi">${aksi}${tutup}</div></div></div></div>`);
    const ditutup = k => { try { return sessionStorage.getItem(k) === '1'; } catch (e) { return false; } };
    if (ent) {
      if (!t.kabarEnt) { spanduk('success', 'kabar', '<b>Paket Enterprise aktif.</b> Batas paket Trial sudah terbuka. Data dan pengguna Anda tetap ada.', ''); simpanTrial({ ...t, kabarEnt:true }); }
      if (bar) bar.insertAdjacentHTML('afterbegin', '<span>Perjalanan: langkah 18 dari 19, Trial sudah menjadi Enterprise.</span>');
    } else {
      const sisa = t.db && t.db.trial ? Math.max(0, Math.ceil((t.db.trial.akhir - t.db.trial.mulai - (Date.now() - t.db.trial.nyata)) / 864e5)) : 30;
      const ke = (uk, lbl) => `<a class="ina-button ina-button--primary ina-button--${uk}" href="${HAL_UPGRADE}">${lbl}</a>`;
      const kepala = $('header .spacer'), lencana = `<span class="ina-badge ina-badge--soft ina-badge--info ina-badge--sm ina-badge--rounded-full" id="lencanaTrial"><span><span class="lt-opsi">Paket </span>Trial<span class="lt-opsi"> · sisa ${sisa} hari</span></span></span>`;
      if (kepala) kepala.insertAdjacentHTML('afterend', lencana); else if (pemicu) pemicu.insertAdjacentHTML('beforebegin', lencana);
      if (!ditutup('eppat-trial-spanduk')) spanduk('caution', 'eppat-trial-spanduk', `<b>Paket Trial, sisa ${sisa} hari.</b> Semua menu dapat dibuka. Tanda tangan dan stempel elektronik aktif setelah upgrade ke Enterprise.`, ke('sm', 'Mulai Berlangganan'));
      /* di atas kartu profil yang menempel di bawah, agar tombol selalu terlihat walaupun menu panjang */
      const pasangTombol = () => setTimeout(() => { const w = $('.sb-profil'); if (w && !w.querySelector('.sb-trial')) w.insertAdjacentHTML('afterbegin', `<div class="sb-trial"><a class="ina-button ina-button--primary ina-button--md" href="${HAL_UPGRADE}" aria-label="Mulai Berlangganan">${svg(I_PANAH)}<span class="sb-trial-teks">Mulai Berlangganan</span></a></div>`); });
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pasangTombol); else pasangTombol();
      if (bar) bar.insertAdjacentHTML('afterbegin', `<span>Perjalanan: langkah 9 dari 19, coba menu lalu tekan Mulai Berlangganan.</span><button class="pil" id="simBatas" aria-pressed="${!!t.batas}" title="Mengisi kuota pengguna dan transaksi Trial sampai penuh">Batas paket: ${t.batas ? 'tercapai' : 'belum tercapai'}</button>`);
      const b = $('#simBatas'); if (b) b.addEventListener('click', () => { simpanTrial({ ...bacaTrial(), batas:!t.batas }); location.reload(); });
    }
    document.addEventListener('click', e => { if (!e.target.closest('[data-tutup-spanduk]')) return; const w = $('#spandukTrial'); try { sessionStorage.setItem(w.dataset.kunci, '1'); } catch (x) { /* lihat simpan() */ } w.remove(); });
  }

  /* Klien memakai halaman tanda tangan miliknya */
  if (berkas === 'HE-EAW' && sesi.aktif === 'ROLE_KLIEN') { location.replace(LANDAS.ROLE_KLIEN); return; }

  /* penjaga halaman */
  if (!halamanBoleh(sesi)) {
    document.body.insertAdjacentHTML('beforeend', `<div class="sesi-tolak" role="alert"><div class="sesi-tolak-kartu"><h2>Halaman tidak tersedia</h2><p>Peran ${sesi.label} tidak memiliki akses ke halaman ini.</p>
      <div class="sesi-tolak-aksi"><a class="ina-button ina-button--primary ina-button--md" href="${LANDAS[sesi.aktif]}">Ke Halaman Utama</a><button type="button" class="ina-button ina-button--secondary ina-button--md" data-sesi-keluar>Keluar</button></div></div></div>`);
  }
})();
</script>

<!-- ===== Sidebar pola IDDS (sidebar-idds.html, disisipkan rakit-idds.js ke setiap prototipe bersidebar) =====
     Struktur mengikuti pola Sidebar IDDS (design.inadigital.go.id/pattern/sidebar): label grup kecil sentence case + chevron,
     item ikon + label (default/hover/terpilih), kartu profil pengguna di bawah, kategori Expand/Collapse, laci di layar sempit.
     WARNA TETAP brand E-PPAT (--ina-eppat-sidebar-*, --eppat-sidebar-icon, --eppat-sidebar-active-icon). Kartu profil kantor tetap. -->
<style id="sidebar-idds-css">
/* label grup: kecil, sentence case, rata kiri, chevron tepat setelah label */
.sidebar .grp{padding:16px 8px 6px;font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.72)}
.sidebar .grp > svg{display:none}
.sidebar .grp:has(> span:first-of-type:empty){display:none} /* grup tanpa judul: Tugas Saya */
.sidebar .grp > span:not(.chev){flex:0 1 auto}
.sidebar .grp .chev{margin-left:0;color:currentColor}
.sidebar .grp .chev svg{color:currentColor;width:12px;height:12px}
.sidebar .grp:hover{color:#fff}
.sidebar .grp:focus-visible,.sidebar a.nav-item:focus-visible,.sidebar .nav-induk:focus-visible,.sb-ciut-btn:focus-visible,.sb-profil-btn:focus-visible{outline:2px solid #fff;outline-offset:-2px;border-radius:8px}
.side-ob .grp-lbl{margin:16px 8px 6px;font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.72)}
/* item menu: ikon + label */
.sidebar .items a.nav-item{min-height:40px;align-items:center;padding:8px 10px}
.sidebar .items a.nav-item.nav-anak{padding-left:10px}
.sidebar .items a.nav-item.nav-anak svg{width:16px;height:16px}
.sidebar .items a.nav-item > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* kepala sidebar: logo + tombol ciut */
.sidebar .brand{gap:8px}
.sidebar .brand img{flex:none}
.sb-ciut-btn{margin-left:auto;flex:none;display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.8);cursor:pointer}
.sb-ciut-btn:hover{background:var(--ina-eppat-sidebar-hover);color:#fff}
.sb-ciut-btn svg{width:18px;height:18px}
/* kartu profil pengguna (bawah) */
.sb-profil{flex:none;margin-top:auto;position:sticky;bottom:0;z-index:1;margin-left:-16px;margin-right:-16px;padding:12px 16px 0;background:var(--ina-eppat-sidebar-bg);border-top:1px solid rgba(255,255,255,.1)}
.sb-profil-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;color:#fff;text-align:left;font:inherit}
button.sb-profil-btn{cursor:pointer}
button.sb-profil-btn:hover{background:var(--ina-eppat-sidebar-hover)}
.sb-ava{flex:none;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--ina-primary-500);color:#fff;font:600 12px Inter,sans-serif}
.sb-teks{flex:1;min-width:0;display:flex;flex-direction:column}
.sb-nama{font:600 13px/18px Inter,sans-serif;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-peran{font:400 12px/16px Inter,sans-serif;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-profil-btn .sb-pilih{flex:none;display:grid;color:rgba(255,255,255,.75)}
.sidebar .sidefoot,.side-ob .versi{margin-top:0;border-top:0;padding:4px 8px 12px;font-size:11px;color:rgba(255,255,255,.72)}
/* tooltip mode Collapse */
#sbTip{position:fixed;z-index:200;pointer-events:none;background:#1f2a2e;color:#fff;font:500 12px/16px Inter,sans-serif;padding:6px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.2);white-space:nowrap}
#sbTip[hidden]{display:none}
.sb-sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
@media (max-width:1024px){ .sb-ciut-btn{display:none} }
/* satu kendali per ukuran layar: layar lebar = tombol ciut di kepala sidebar; layar sempit = tombol menu (burger) di header membuka laci */
@media (min-width:1025px){ #burger,#burgerP{display:none!important} }
/* kategori Collapse (ikon saja) — hanya layar lebar; layar sempit tetap laci */
@media (min-width:1025px){
  .sidebar{transition:width .18s}
  .sidebar.sb-ciut{width:72px;padding:0 12px;overflow-x:hidden}
  .sidebar.sb-ciut .brand{flex-direction:column;justify-content:center;height:auto;padding:14px 0 10px;gap:8px}
  .sidebar.sb-ciut .brand img{width:34px;height:44px;object-fit:cover;object-position:left center}
  .sidebar.sb-ciut .sb-ciut-btn{margin:0}
  .sidebar.sb-ciut .kantor,.sidebar.sb-ciut .grp,.sidebar.sb-ciut .grp-lbl,.sidebar.sb-ciut .sidefoot,.sidebar.sb-ciut .versi,.sidebar.sb-ciut .sb-teks,.sidebar.sb-ciut .sb-pilih,.sidebar.sb-ciut .tag-usulan{display:none!important}
  .sidebar.sb-ciut .items,.sidebar.sb-ciut .items[hidden]{display:flex!important}
  .sidebar.sb-ciut #nav > .items + .items,.sidebar.sb-ciut #nav > .grp + .items:not(:first-of-type),.sidebar.sb-ciut nav > .items ~ .items{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)}
  .sidebar.sb-ciut .items a.nav-item,.sidebar.sb-ciut .items button.nav-induk{justify-content:center;padding:10px 0;gap:0}
  .sidebar.sb-ciut .items a.nav-item svg{width:18px;height:18px}
  .sidebar.sb-ciut .sb-profil-btn{justify-content:center;padding:8px 0}
  .sidebar.sb-ciut .sb-profil{margin-left:-12px;margin-right:-12px;padding:12px 12px 12px}
}
</style>
<script id="sidebar-idds-js">
(() => {
  const KUNCI = 'eppat-sidebar-ciut';
  const baca = () => { try { return localStorage.getItem(KUNCI) === '1'; } catch (e) { return false; } };
  const tulis = v => { try { localStorage.setItem(KUNCI, v ? '1' : '0'); } catch (e) {} };
  const SVG = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IK_CIUT = '<path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" /><path d="M9 4v16" /><path d="M15 10l-2 2l2 2" />';
  const IK_BENTANG = '<path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z" /><path d="M9 4v16" /><path d="M14 10l2 2l-2 2" />';
  const IK_PILIH = '<path d="M8 9l4 -4l4 4" /><path d="M16 15l-4 4l-4 -4" />';
  const daftar = [...document.querySelectorAll('aside.sidebar')];
  if (!daftar.length) return;
  let ciut = baca();
  const tip = document.createElement('div'); tip.id = 'sbTip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true; document.body.appendChild(tip);

  daftar.forEach((sb, n) => {
    if (sb.dataset.sbIdds) return; sb.dataset.sbIdds = '1';
    if (!sb.id) sb.id = 'sidebar-' + n;
    /* tombol ciut di kepala sidebar */
    const brand = sb.querySelector('.brand');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'sb-ciut-btn'; btn.setAttribute('aria-controls', sb.id);
    if (brand) brand.appendChild(btn); else sb.prepend(btn);
    /* kartu profil pengguna: nama & peran dari kepala halaman (satu sumber) */
    const app = sb.closest('.app') || document;
    const kepala = app.querySelector('header .user');
    if (kepala) {
      const pemicu = kepala.querySelector('.user-tombol') || (kepala.matches('[aria-haspopup], [role="button"]') ? kepala : null);
      const wadah = document.createElement('div'); wadah.className = 'sb-profil';
      const el = document.createElement(pemicu ? 'button' : 'div');
      el.className = 'sb-profil-btn';
      if (pemicu) { el.type = 'button'; el.setAttribute('aria-haspopup', 'menu'); }
      wadah.appendChild(el);
      const kaki = sb.querySelector(':scope > .sidefoot, :scope > .versi');
      sb.appendChild(wadah); if (kaki) wadah.appendChild(kaki); /* versi aplikasi tetap kecil di bawah kartu */
      const isi = () => {
        const nama = (kepala.querySelector('.uname') || {}).textContent || '', peran = (kepala.querySelector('.urole') || {}).textContent || '';
        const ava = (kepala.querySelector('.ava') || {}).textContent || nama.trim().charAt(0);
        el.innerHTML = `<span class="sb-ava" aria-hidden="true">${ava.trim()}</span><span class="sb-teks"><span class="sb-nama">${nama.trim()}</span><span class="sb-peran">${peran.trim()}</span></span>${pemicu ? `<span class="sb-pilih">${SVG(IK_PILIH).replace('<svg', '<svg width="16" height="16"')}</span>` : ''}`;
        el.dataset.tip = nama.trim();
        if (pemicu) el.setAttribute('aria-label', `Menu akun ${nama.trim()}, ${peran.trim()}`);
      };
      isi();
      new MutationObserver(isi).observe(kepala.querySelector('.txt') || kepala, { subtree: true, characterData: true, childList: true });
      if (pemicu) el.addEventListener('click', e => {
        e.stopPropagation(); /* jangan ditutup oleh penangan "klik di luar menu" */
        sb.classList.remove('open'); const scrim = app.querySelector('.scrim'); if (scrim) scrim.classList.remove('on');
        pemicu.click(); if (pemicu === kepala) pemicu.focus();
      });
    }
  });

  const terap = () => {
    daftar.forEach(sb => {
      sb.classList.toggle('sb-ciut', ciut);
      const b = sb.querySelector('.sb-ciut-btn');
      b.setAttribute('aria-expanded', String(!ciut));
      b.setAttribute('aria-label', ciut ? 'Bentangkan menu samping' : 'Ciutkan menu samping');
      b.innerHTML = SVG(ciut ? IK_BENTANG : IK_CIUT);
      b.dataset.tip = ciut ? 'Bentangkan menu' : 'Ciutkan menu';
    });
    labelSr();
  };
  /* mode ciut: label disembunyikan secara visual saja (tetap dibacakan pembaca layar) */
  const labelSr = () => daftar.forEach(sb => sb.querySelectorAll('a.nav-item > span, .nav-induk > span:not(.chev)').forEach(s => s.classList.toggle('sb-sr', ciut && matchMedia('(min-width:1025px)').matches)));
  daftar.forEach(sb => new MutationObserver(() => { if (ciut) labelSr(); }).observe(sb, { childList: true, subtree: true }));
  matchMedia('(min-width:1025px)').addEventListener('change', labelSr);
  document.addEventListener('click', e => {
    const b = e.target.closest('.sb-ciut-btn'); if (!b) return;
    ciut = !ciut; tulis(ciut); tip.hidden = true; terap(); b.focus();
  });
  /* ciut sementara dari halaman (mis. editor Penyusunan Akta v2): tidak menimpa pilihan tersimpan; null = kembali ke pilihan pengguna */
  window.sidebarIdds = { ciutSementara: v => { ciut = v == null ? baca() : !!v; terap(); } };
  /* tooltip: label menu saat ciut */
  const tampil = el => {
    const sb = el.closest('.sidebar'); if (!sb || !sb.classList.contains('sb-ciut') || !matchMedia('(min-width:1025px)').matches) return;
    const teks = el.dataset.tip || el.getAttribute('aria-label') || (el.querySelector(':scope > span:not(.chev)') || el).textContent.trim(); if (!teks) return;
    tip.textContent = teks; tip.hidden = false;
    const r = el.getBoundingClientRect(); tip.style.left = (r.right + 8) + 'px'; tip.style.top = (r.top + r.height / 2 - tip.offsetHeight / 2) + 'px';
  };
  const SEL = '.sidebar a.nav-item, .sidebar .nav-induk, .sidebar .sb-profil-btn, .sidebar .sb-ciut-btn';
  document.addEventListener('mouseover', e => { const el = e.target.closest(SEL); if (el) tampil(el); else tip.hidden = true; });
  document.addEventListener('focusin', e => { const el = e.target.closest(SEL); if (el) tampil(el); else tip.hidden = true; });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') tip.hidden = true; });
  document.addEventListener('scroll', () => { tip.hidden = true; }, true);
  terap();
})();
</script>

<!-- ===== Tooltip aman (tooltip-aman.html, disisipkan rakit-idds.js ke setiap prototipe yang memakai IDDS Tooltip) =====
     Kotak tooltip tidak boleh terpotong tepi layar atau wadah ber-overflow: saat tampil, kotak ditempatkan fixed
     di atas pemicu (atau di bawah bila ruang atas kurang) dan digeser agar tetap berada di dalam layar. -->
<style id="tooltip-aman-css">
.ina-tooltip__content.tt-aman{position:fixed!important;transform:none!important;margin:0!important;z-index:2000;width:max-content!important;max-width:calc(100vw - 16px)!important}
.ina-tooltip__content.tt-aman .ina-tooltip__bubble::before,.ina-tooltip__content.tt-aman .ina-tooltip__bubble::after,.ina-tooltip__content.tt-aman::before,.ina-tooltip__content.tt-aman::after{display:none!important}
</style>
<script id="tooltip-aman-js">
(() => {
  const JARAK = 8, TEPI = 8;
  const pos = (c, k, v) => c.style.setProperty(k, v, 'important');
  const atur = tip => {
    const c = tip.querySelector(':scope > .ina-tooltip__content'); if (!c) return;
    requestAnimationFrame(() => {
      if (getComputedStyle(c).display === 'none') return;
      // lepas dari wadah dulu, ukur ukuran aslinya, lalu tempatkan di dalam layar
      c.classList.add('tt-aman'); pos(c, 'left', '0px'); pos(c, 'top', '0px'); pos(c, 'right', 'auto'); pos(c, 'bottom', 'auto');
      const r = c.getBoundingClientRect(); if (!r.width) return;
      const t = tip.getBoundingClientRect(), W = document.documentElement.clientWidth, H = innerHeight;
      let left = t.left + t.width / 2 - r.width / 2; left = Math.max(TEPI, Math.min(left, W - r.width - TEPI));
      let top = t.top - r.height - JARAK; if (top < TEPI) top = Math.min(t.bottom + JARAK, H - r.height - TEPI);
      pos(c, 'left', left + 'px'); pos(c, 'top', Math.max(TEPI, top) + 'px');
    });
  };  const pasang = e => { const tip = e.target.closest && e.target.closest('.ina-tooltip'); if (tip) atur(tip); };
  document.addEventListener('mouseover', pasang); document.addEventListener('focusin', pasang);
  window.addEventListener('scroll', () => document.querySelectorAll('.ina-tooltip__content.tt-aman').forEach(c => { const tip = c.closest('.ina-tooltip'); if (tip && (tip.matches(':hover') || tip.matches(':focus-within'))) atur(tip); }), true);
})();
</script>

<!-- ===== Sorot bersama (sorot-bersama.html, disisipkan rakit-idds.js ke prototipe yang punya "Lihat di layar") =====
     Setiap klik "Lihat di layar" di Daftar perubahan/penyesuaian selalu memberi lingkaran biru yang berkedip beberapa detik
     pada bagian yang dimaksud. Lingkaran berupa lapisan tersendiri (#sorotCincin) yang mengikuti posisi sasaran, jadi tidak
     terpotong wadah, tidak bentrok dengan animasi komponen, dan tetap ada walau layar digambar ulang.
     Urutan sasaran: dialog/laci yang terbuka (kecuali sasaran ada di dalamnya) → elemen sorot milik usulan →
     elemen yang sudah disorot prototipe → isi halaman. -->
<style id="sorot-bersama-css">
@keyframes sorotKedip{0%,100%{border-color:#2563EB;box-shadow:0 0 0 6px rgba(37,99,235,.22)}50%{border-color:rgba(37,99,235,.15);box-shadow:0 0 0 0 rgba(37,99,235,0)}}
#sorotCincin{position:fixed;z-index:2147483000;pointer-events:none;border:3px solid #2563EB;border-radius:14px;animation:sorotKedip .8s ease-in-out 5}
@media (prefers-reduced-motion:reduce){#sorotCincin{animation:none}}
</style>
<script id="sorot-bersama-js">
(() => {
  const DURASI = 4000, JARAK = 6;
  /* sasaran sorot per usulan, urut sama dengan tombol "Lihat di layar" (dibaca dari daftar usulan di halaman) */
  const sumber = [...document.scripts].map(s => s.textContent).join('\n');
  const SOROT = [...sumber.matchAll(/\{ kode:'[A-Z0-9-]+', judul:'[^']*'[\s\S]*?sorot:(null|'[^']*')/g)].map(m => m[1] === 'null' ? null : m[1].slice(1, -1));
  const tampak = el => !!el && el.isConnected && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const cari = s => { try { return s ? document.querySelector(s) : null; } catch (x) { return null; } };
  const lapisan = () => [...document.querySelectorAll('.ina-modal__dialog, .ina-drawer__panel')].filter(tampak).pop();
  let cincin = null, sasaran = null, pemilih = null, selesai = 0, raf = 0, urut = 0;
  const lepas = () => { cancelAnimationFrame(raf); if (cincin) cincin.remove(); if (sasaran) sasaran.classList.remove('sorot-kedip'); cincin = sasaran = pemilih = null; };
  const ikuti = () => {
    if (!cincin) return;
    if (Date.now() > selesai) { lepas(); return; }
    if (!tampak(sasaran) && pemilih) { const b = cari(pemilih); if (tampak(b)) { sasaran = b; b.classList.add('sorot-kedip'); } }
    if (tampak(sasaran)) {
      const r = sasaran.getBoundingClientRect();
      const x1 = Math.max(3, r.left - JARAK), y1 = Math.max(3, r.top - JARAK), x2 = Math.min(innerWidth - 3, r.right + JARAK), y2 = Math.min(innerHeight - 3, r.bottom + JARAK); /* tetap di dalam layar */
      Object.assign(cincin.style, { display:'block', left:x1 + 'px', top:y1 + 'px', width:Math.max(0, x2 - x1) + 'px', height:Math.max(0, y2 - y1) + 'px' });
    } else cincin.style.display = 'none';
    raf = requestAnimationFrame(ikuti);
  };
  const pasang = (el, sel) => {
    lepas();
    sasaran = el; pemilih = sel || null; selesai = Date.now() + DURASI;
    el.scrollIntoView({ block:'center', behavior:'smooth' });
    el.classList.add('sorot-kedip');
    cincin = document.createElement('div'); cincin.id = 'sorotCincin'; cincin.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cincin); ikuti();
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.textContent.trim() !== 'Lihat di layar') return;
    const semua = [...document.querySelectorAll('button')].filter(x => x.textContent.trim() === 'Lihat di layar');
    const sel = semua.length === SOROT.length ? SOROT[semua.indexOf(b)] : null, ke = ++urut, mulai = Date.now();
    lepas();
    const coba = () => {
      if (ke !== urut) return;
      const lap = lapisan(), t = cari(sel), habis = Date.now() - mulai > (sel ? 1600 : 900);
      if (tampak(t) && !(lap && !lap.contains(t))) { pasang(t, sel); return; }
      if (lap && (!t || !lap.contains(t) || habis)) { pasang(lap); return; }
      if (!habis) { setTimeout(coba, 150); return; }
      const lain = [...document.querySelectorAll('.sorot, .kedip')].find(tampak)
        || ['#halamanApp', '#halaman', 'main .content', 'main', '.content'].map(cari).find(tampak);
      if (lain) pasang(lain);
    };
    setTimeout(coba, 450);
  }, true);
})();
</script>

<!-- ===== Kabar bersama (kabar-bersama.html, disisipkan rakit-idds.js ke prototipe yang punya #toastWadah) =====
     Pesan hasil tindakan pengguna ("Email verifikasi dikirim ulang.", "Perubahan disimpan.", …) tidak lagi muncul sebagai
     toast di kanan bawah, tetapi sebagai IDDS Alert di bagian atas kartu tempat tombol diklik, agar tidak terlewat.
     Urutan wadah: kartu/dialog/laci tempat tombol diklik → kartu yang sama setelah layar digambar ulang → dialog/laci
     yang terbuka → kartu utama halaman → atas isi halaman.
     Pesan milik kontrol prototipe (protobar, Daftar perubahan, "Lihat di layar", teks yang menyebut "prototipe") tetap toast. -->
<style id="kabar-bersama-css">
.kabar-sisip{text-align:left;flex:none;width:100%;grid-column:1/-1;box-sizing:border-box;margin:0 0 16px}
.kabar-sisip .ina-alert__content{flex:1;min-width:0}
.kabar-sisip .ina-alert__description{margin:2px 0 0}
</style>
<script id="kabar-bersama-js">
(() => {
  const wadah = document.getElementById('toastWadah');
  if (!wadah) return;
  const KARTU = '.ina-modal__body, .ina-drawer__content, .ina-card__content, .ob-kartu, .ina-card, section, .builder, .kartu, .panel';
  const META = '.protobar, .daftar-ubah, [data-lihat], #notif-bersama';
  const LUAR = '.sidebar, .topbar, .ob-nav, header, nav';
  const IKON = {
    success:'<path d="M5 12l5 5l10 -10" />',
    info:'<path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" />'
  };
  const svg = (p, s) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const tampak = el => !!el && el.isConnected && el.getClientRects().length > 0;
  let asal = null, jejak = null;
  /* catat tombol yang terakhir dipakai beserta kartunya, untuk menemukan kartu yang sama bila layar digambar ulang */
  const catat = e => {
    asal = e.target instanceof Element ? e.target : null;
    const k = asal && !asal.closest(LUAR) ? asal.closest(KARTU) : null;
    if (!k) { jejak = null; return; }
    const pemilih = k.id ? '#' + CSS.escape(k.id) : k.tagName.toLowerCase() + (k.classList[0] ? '.' + CSS.escape(k.classList[0]) : '');
    jejak = { pemilih, ke:[...document.querySelectorAll(pemilih)].indexOf(k) };
  };
  document.addEventListener('pointerdown', catat, true);
  document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') catat(e); }, true);
  const isiKartu = k => (k.classList.contains('ina-card') && k.querySelector(':scope > .ina-card__content')) || k;
  function cariWadah() {
    if (asal && asal.isConnected && !asal.closest(LUAR)) { const k = asal.closest(KARTU); if (tampak(k)) return isiKartu(k); }
    if (jejak) { const k = document.querySelectorAll(jejak.pemilih)[jejak.ke]; if (tampak(k)) return isiKartu(k); }
    const lap = [...document.querySelectorAll('.ina-modal__body, .ina-drawer__content')].filter(tampak).pop();
    if (lap) return lap;
    const utama = document.querySelector('#halaman .ob-kartu');
    if (tampak(utama)) return utama;
    return [document.getElementById('halamanApp'), document.getElementById('halaman'), document.querySelector('main')].find(tampak) || null;
  }
  function sisipkan() {
    const t = wadah.querySelector('.ina-toast');
    if (!t) return;
    const judul = (t.querySelector('.ina-toast__title') || {}).textContent || '';
    const desk = (t.querySelector('.ina-toast__description') || {}).textContent || '';
    const meta = (asal && asal.isConnected && asal.closest(META)) || /prototipe/i.test(judul + ' ' + desk);
    const tujuan = meta ? null : cariWadah();
    if (!tujuan) return; /* tetap toast */
    const jenis = t.className.includes('state-positive') ? 'success' : 'info';
    document.querySelectorAll('.kabar-sisip').forEach(x => x.remove());
    /* wadah grid atau flex sebaris: alert di atas kartu (bukan di dalam) agar tidak ikut meregang/terjepit */
    const gaya = getComputedStyle(tujuan), luar = gaya.display.includes('grid') || (gaya.display.includes('flex') && !gaya.flexDirection.startsWith('column') && gaya.flexWrap === 'nowrap');
    tujuan.insertAdjacentHTML(luar ? 'beforebegin' : 'afterbegin', `<div class="ina-alert ina-alert--${jenis} kabar-sisip" role="status"><span class="ina-alert__icon">${svg(IKON[jenis], 20)}</span>
      <div class="ina-alert__content"><div class="ina-alert__text-section"><div class="ina-alert__title">${judul.replace(/</g, '&lt;')}</div>${desk ? `<div class="ina-alert__description">${desk.replace(/</g, '&lt;')}</div>` : ''}</div></div>
      <button type="button" class="ina-alert__close-button" aria-label="Tutup pesan">${svg('<path d="M18 6l-12 12" /><path d="M6 6l12 12" />', 16)}</button></div>`);
    wadah.innerHTML = '';
    const a = document.querySelector('.kabar-sisip'), r = a.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) a.scrollIntoView({ block:'nearest', behavior:'smooth' });
  }
  /* tunggu satu giliran: beberapa prototipe menambah keterangan ke toast sesudah toast dibuat */
  let antre = 0;
  new MutationObserver(() => { clearTimeout(antre); antre = setTimeout(sisipkan, 0); }).observe(wadah, { childList:true, subtree:true });
  document.addEventListener('click', e => { const b = e.target.closest('.kabar-sisip .ina-alert__close-button'); if (b) b.closest('.kabar-sisip').remove(); });
})();
</script>

<script id="tema-proto-js">
(() => {
  const KUNCI = 'eppat-tema-proto';
  const TEMA = [['eppat', 'E-PPAT'], ['inagov', 'INAgov'], ['default', 'Default']];
  const baca = () => { try { const v = localStorage.getItem(KUNCI); return TEMA.some(x => x[0] === v) ? v : 'eppat'; } catch (e) { return 'eppat'; } };
  const tulis = v => { try { localStorage.setItem(KUNCI, v); } catch (e) {} };
  const terap = v => {
    const h = document.documentElement;
    if (v === 'default') h.removeAttribute('data-brand'); else h.setAttribute('data-brand', v);
    document.querySelectorAll('.tema-proto [data-tema-proto]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.temaProto === v)));
  };
  /* pil hanya di protobar utama (bukan bilah simulasi) */
  const bar = document.querySelector('.protobar:not(.protobar-sim)');
  if (bar && !bar.querySelector('.tema-proto')) {
    const frag = document.createElement('span'); frag.style.display = 'contents';
    frag.innerHTML = `<span class="sep">&bull;</span><span id="temaProtoLbl">Tema:</span><span class="tema-proto" role="group" aria-labelledby="temaProtoLbl">${TEMA.map(([k, l]) => `<button type="button" class="pil" data-tema-proto="${k}" aria-pressed="false">${l}</button>`).join('')}</span>`;
    const kanan = bar.querySelector(':scope > .kanan');
    if (kanan) bar.insertBefore(frag, kanan); else bar.appendChild(frag);
    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-tema-proto]'); if (!b) return;
      const v = b.dataset.temaProto; tulis(v); terap(v); b.focus();
    });
  }
  terap(baca());
  /* tema dipilih di tab lain → samakan */
  window.addEventListener('storage', e => { if (e.key === KUNCI) terap(baca()); });
})();
</script>
</body>
</html>
