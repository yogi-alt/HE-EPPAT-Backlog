<style id="pl-monitoring-css">
/* ===== Platform · Monitoring (Admin Platform): Dasbor, Daftar PPAT, Paket Langganan, Log Aktivitas — penyesuaian IDDS (IDDS-PL-11…20)
   Menu ini tidak dinilai HE. Isi, kolom, dan perilaku mengikuti kode live dev-app.eppat.id/platform;
   yang disesuaikan hanya komponen (IDDS + brand E-PPAT), kejujuran label, bahasa, status sistem, dan Bantuan per halaman. ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45;font-weight:400;text-transform:none;letter-spacing:0}
.ina-modal-confirmation{max-width:560px}
.modal-gap>*+*{margin-top:12px}
.eb{font:600 11px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ina-content-secondary)}
.blok{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}
.blok h2{margin:6px 0 4px;font:500 20px/28px Inter,sans-serif;color:var(--ina-primary-primary)}
.blok .ket{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.blok-atas{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* kepala: menu pengguna (IDDS Action Dropdown) */
.user-tombol{display:flex;align-items:center;gap:10px;padding:4px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;color:inherit}
.user-tombol:hover{background:var(--ina-background-secondary)}
.user-tombol:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.user-tombol .chev-u{color:var(--ina-content-secondary);display:grid}
.user .ina-action-dropdown__menu{position:absolute;right:0;left:auto;top:calc(100% + 6px);min-width:220px;z-index:30;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.user a.ina-action-dropdown__item{text-decoration:none;color:inherit}
.user .menu-kepala{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.user .menu-kepala b{font:600 14px Inter,sans-serif;color:var(--ina-primary-primary)}
.user .menu-kepala span{font-size:12px;color:var(--ina-content-secondary)}

/* Dasbor */
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}
.kpi > div{position:relative;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:20px}
.kpi small{display:block;max-width:72%;font:600 11px/16px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kpi i{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:999px;background:var(--ina-primary-50);display:grid;place-items:center;color:var(--ina-primary-primary)}
.kpi i svg{width:15px;height:15px}
.kpi b{display:block;margin-top:18px;font:400 30px Inter,sans-serif;color:var(--ina-primary-primary)}
.kpi span{font-size:12.5px;color:var(--ina-content-secondary)}
.dua-kartu{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.kartu-st{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:18px 20px}
.kartu-st .bulat{width:46px;height:46px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--ina-primary-50);color:var(--ina-primary-primary)}
.kartu-st .bulat.sehat{background:var(--ina-positive-100,#dcf5e5);color:var(--ina-content-positive)}
.kartu-st .bulat.periksa{background:var(--ina-neutral-100,#eee);color:var(--ina-content-secondary)}
.kartu-st .isi{flex:1;min-width:160px}
.kartu-st .nilai{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font:600 16px Inter,sans-serif;color:var(--ina-primary-primary)}
.kartu-st .nilai.besar{font:600 24px Inter,sans-serif}
.kartu-st .kt{display:block;margin-top:2px;font-size:12.5px;color:var(--ina-content-secondary)}
.dasbor-dua{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;margin-top:24px}
.dasbor-dua .blok{margin:0}
.akt{list-style:none;margin:12px 0 0;padding:0;font-size:14px}
.akt li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--ina-stroke-primary)}
.akt li:first-child{border-top:0}
.akt .titik{width:8px;height:8px;border-radius:999px;background:var(--ina-primary-primary);margin-top:7px;flex:none}
.akt .titik.gagal{background:var(--ina-negative-600,#d50b0b)}
.akt .baris1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.akt b{font-weight:600;color:var(--ina-primary-primary)}
.akt .baris2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.akt .wkt{font-size:12px;color:var(--ina-content-secondary)}
.teramai{list-style:none;margin:12px 0 0;padding:0}
.teramai li + li{margin-top:4px}
.teramai a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-radius:10px;text-decoration:none;color:inherit}
.teramai a:hover{background:var(--ina-primary-25,#f5f8f7)}
.teramai a:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:1px}
.teramai .nm{display:block;font:600 14px Inter,sans-serif;color:var(--ina-primary-primary)}
.teramai .sl{display:block;font:12px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}
.teramai .ina-badge{flex:none}
.lihat-semua{margin-top:12px}

/* tabel & saringan */
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}
.info-pl{margin-top:20px}
.info-pl .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.info-pl .ina-alert__text-section{flex:1;min-width:240px}
.info-pl .aksi-info{display:flex;gap:8px;flex-wrap:wrap}
.saring-pl{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px}
.saring-pl .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--ina-content-primary)}
.saring-pl .ina-input-search{width:320px}
.saring-pl .jumlah{margin-left:auto;align-self:center;font-size:13px;color:var(--ina-content-secondary)}
.pilih-wadah{position:relative}
.pilih-wadah .ina-select-dropdown__trigger{min-width:250px}
.pilih-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:auto;min-width:260px;max-height:300px;overflow:auto;z-index:20}
.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}
.halaman{flex-wrap:wrap}
.tb th .tip-kol{display:inline-flex;align-items:center;gap:4px}
.nilai-batas{display:inline-flex;align-items:center;gap:4px}

@media (max-width:1200px){ .kpi{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1024px){ .dasbor-dua{grid-template-columns:1fr} }
@media (max-width:760px){
  .kpi,.dua-kartu{grid-template-columns:1fr}
  .saring-pl > div,.saring-pl .ina-input-search,.pilih-wadah,.pilih-wadah .ina-select-dropdown__trigger{width:100%;min-width:0}
  .pilih-wadah .ina-select-dropdown__panel{min-width:0;right:0}
  .saring-pl .jumlah{margin-left:0}
  .user-tombol .chev-u{display:none}
  .halaman > span{white-space:normal}
}
.bantu-istilah{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:8px 0 4px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:13.5px;line-height:20px}
.bantu-istilah dt{font-weight:600}
.bantu-istilah dd{margin:0;color:var(--ina-content-secondary)}
ol.bantu-langkah{padding-left:22px}
@media (max-width:760px){ .bantu-istilah{grid-template-columns:1fr} .bantu-istilah dd{margin-bottom:6px} }
</style>
</head>

<script>
(() => {
/* ---------------- ikon & util (sama dengan prototipe Tenant · System) ---------------- */
const I = {
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  log:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  palet:'<circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><path d="M12 2a10 10 0 0 0 0 20c1 0 1.7-.8 1.7-1.7 0-1 .8-1.7 1.7-1.7H17a5 5 0 0 0 5-5C22 6 17.5 2 12 2z"/>',
  daftar:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  gedung:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M8 10h.01M16 10h.01M12 10h.01"/>',
  bintang:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/>',
  stempel:'<path d="M9 3h6v4l-1 5h-4L9 7z"/><path d="M4 16a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2H4z"/><path d="M4 21h16"/>',
  monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  tameng:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  peringatan:'<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  keluar:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  luar:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/>',
  ulang:'<path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/>',
  panah:'<path d="M5 12h14M13 6l6 6-6 6"/>', kiri:'<path d="M15 18l-6-6 6-6"/>', x:'<path d="M18 6L6 18M6 6l12 12"/>', info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  centang:'<path d="M20 6L9 17l-5-5"/>', chev:'<path d="M9 18l6-6-6-6"/>', bawah:'<path d="M6 9l6 6 6-6"/>',
  cari:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', jam:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>', naik:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>'
};
const ik = (n, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usulan = kode => `<span class="tag-usulan">penyesuaian &middot; ${kode}</span>`;
const badge = (t, j, uk = 'md', atr = '', kls = '') => `<span class="ina-badge ina-badge--soft ina-badge--${j} ina-badge--${uk} ina-badge--rounded-full ${kls}" ${atr}>${t}</span>`;
const tombol = (t, h = 'primary', uk = 'md', atr = '', ikon = '') => { let k = ''; atr = atr.replace(/class="([^"]*)"/, (m, c) => { k = ' ' + c; return ''; }); return `<button type="button" class="ina-button ina-button--${h} ina-button--${uk}${k}" ${atr}>${ikon}${t}</button>`; };
const alert = (j, judul, isi, ekstra = '') => `<div class="ina-alert ina-alert--${j}" role="status"><div class="ina-alert__content"><div class="ina-alert__text-section">${judul ? `<div class="ina-alert__title">${judul}</div>` : ''}<div class="ina-alert__description">${isi}</div></div>${ekstra}</div></div>`;
const est = t => `<span class="isi-tim" title="Data contoh. Ganti dengan data resmi dari tim E-PPAT.">${t}</span>`;
const denganTip = (isi, t, letak = 'top') => `<span class="ina-tooltip ina-tooltip--placement-${letak}">${isi}<span class="ina-tooltip__content"><span class="ina-tooltip__bubble">${t}</span></span></span>`;
const cariIsian = (id, ph, v, label) => `<div class="ina-input-search"><div class="ina-input-search__wrapper"><span class="ina-input-search__search-icon">${ik('cari', 20)}</span><input id="${id}" class="ina-input-search__input" type="search" placeholder="${ph}" aria-label="${label}" value="${esc(v)}" autocomplete="off"></div></div>`;
const remah = t => `<nav class="ina-breadcrumb" aria-label="Breadcrumb"><ol class="ina-breadcrumb__list"><li class="ina-breadcrumb__item"><a href="#dasbor" class="ina-breadcrumb__link"><span class="ina-breadcrumb__text">Monitoring</span></a><span class="ina-breadcrumb__separator" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></li><li class="ina-breadcrumb__item"><span class="ina-breadcrumb__link ina-breadcrumb__link--active" aria-current="page"><span class="ina-breadcrumb__text">${t}</span></span></li></ol></nav>`;

/* ---------------- daftar penyesuaian ---------------- */
const UBAH = [
  { kode:'IDDS-PL-11', judul:'Dasbor: kartu ringkasan memakai IDDS Card',
    isi:'Empat kartu ringkasan (Total PPAT, PPAT Aktif, PPAT Ditangguhkan, Total Pengguna) memakai IDDS Card dengan ikon garis. Keterangan kartu memakai bahasa biasa: "Kantor PPAT terdaftar", "Berstatus aktif", "Berstatus ditangguhkan", dan "Di semua kantor PPAT". Kartu PPAT Baru (30 hari) menyebut periode hitungnya.',
    lama:'Keterangan kartu memakai kode dan istilah teknis: "Tenant terdaftar", "Status ACTIVE", "Status SUSPENDED".', ke:'dasbor', sorot:'#kpi' },
  { kode:'IDDS-PL-12', judul:'Dasbor: status sistem dengan waktu pemeriksaan',
    isi:'Kartu Status Sistem menampilkan hasil dengan ikon dan teks ("Sehat" atau "Terganggu"), komponen yang diperiksa ("Basis data & Redis"), dan waktu pemeriksaan terakhir. Tombol "Periksa Ulang" menjalankan pemeriksaan lagi dan menampilkan "Memeriksa…" selama berjalan. Perubahan status diumumkan ke pembaca layar (aria-live).',
    lama:'Status hanya diperiksa sekali saat halaman dibuka, tanpa waktu pemeriksaan dan tanpa cara memeriksa ulang. Status buruk berlabel "Degraded".', ke:'dasbor', sorot:'#kartuStatus' },
  { kode:'IDDS-PL-13', judul:'Dasbor: aktivitas dan PPAT teramai dapat ditindaklanjuti',
    isi:'Aktivitas lintas-PPAT memakai nama aktivitas yang sama dengan Log Aktivitas (misalnya "Masuk", "Unduh dokumen akta"). Aktivitas gagal diberi IDDS Badge "Gagal", bukan hanya titik merah. Kantor PPAT ditampilkan dengan IDDS Badge berisi alamatnya. Tombol "Lihat Semua" membuka Log Aktivitas. Setiap kantor di "PPAT teramai" dapat diklik untuk membuka Daftar PPAT dengan pencarian kantor tersebut.',
    lama:'Aktivitas tampil sebagai kode sistem (LOGIN, DRAFT_DOWNLOAD, TOKEN_REFRESH). Aktivitas gagal dan berhasil hanya dibedakan dengan warna titik. Daftar "Top by user" tidak dapat diklik.', ke:'dasbor', sorot:'#aktLintas' },
  { kode:'IDDS-PL-14', judul:'Daftar PPAT: subjudul yang tepat dan rujukan ke aplikasi Onboarding',
    isi:'Subjudul menyebut apa yang benar-benar dapat dilakukan: "Lihat dan cari kantor PPAT yang terdaftar di E-PPAT." Judul ganda dihapus. IDDS Alert menjelaskan bahwa kantor PPAT baru, perubahan paket, dan admin kantor diatur di aplikasi Onboarding (konsol operator). Alert itu memuat tombol "Buka Onboarding" dan tautan ke Pengaturan Global, tempat alamat Onboarding diatur.',
    lama:'Subjudul berbunyi "Kelola kantor PPAT (tenant)", padahal halaman hanya dapat dibaca. Paragraf di bawahnya merujuk "server onboarding" tanpa tautan.', ke:'ppat', sorot:'#infoPpat' },
  { kode:'IDDS-PL-15', judul:'Daftar PPAT: tabel, lencana, pencarian, dan halaman IDDS',
    isi:'Tabel memakai IDDS Table. Nama kantor ditulis tebal dengan alamat /t/… di bawahnya. Lencana dibuat konsisten: Paket memakai nama paket ("Enterprise", "Gratis"), Status memakai "Aktif" (hijau) dan "Ditangguhkan" (kuning), dan Registrasi memakai "Dibuka" (hijau) dan "Ditutup" (abu-abu). Masa berlaku yang lewat diberi lencana "Kedaluwarsa". Pencarian memakai IDDS Input Search berlabel "Cari PPAT", dan jumlah kantor yang tampil ada di kanannya. Hasil kosong menawarkan "Hapus Pencarian". Navigasi memakai IDDS Pagination (20 per halaman). Saringan status dan paket tidak ditambahkan karena API live belum menyediakannya.',
    lama:'Paket tampil sebagai kode mentah ("ENTERPRISE", "FREE"). Ejaan "Kadaluarsa" tidak baku. Navigasi "‹ Sebelumnya · Hal 1/51 · Berikutnya ›" berupa tombol polos.', ke:'ppat', sorot:'#tabelPpat' },

const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const jam = d => `${String(d.getHours()).padStart(2, '0')}.${String(d.getMinutes()).padStart(2, '0')}`;

const tglJam = w => { const d = new Date(w); return `${tglPendek(w)}, ${jam(d)}`; };

const hariLalu = n => { const d = new Date(SEKARANG); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };

function paginasi(jenis, hal, n) {

  return `<div class="halaman"><span>Menampilkan ${a}–${b} dari ${n}</span><nav class="ina-pagination" aria-label="Navigasi halaman"><div class="ina-pagination__nav-container"><div class="ina-pagination__page-info">Halaman ${hal} dari ${jh}</div><div class="ina-pagination__nav-buttons">

    <button type="button" class="ina-pagination__nav-button ${hal < jh ? '' : 'ina-pagination__nav-button--disabled'}" ${hal < jh ? `data-hal="${jenis}:${hal + 1}"` : 'disabled'} aria-label="Halaman berikutnya">${ik('chev', 16)}</button></div></div></nav></div>`;
}

/* Select Dropdown: panah atas/bawah, Enter/Spasi, Esc */
H.addEventListener('keydown', e => {
  const w = e.target.closest('[data-dd]'); if (!w) return;
  const nm = w.dataset.dd, opsi = [...w.querySelectorAll('[role=option]')];

    e.preventDefault();
    if (S.buka !== nm) { bukaDd(nm); return; }
    const i = opsi.indexOf(document.activeElement), n = opsi.length;
    opsi[i < 0 ? 0 : (e.key === 'ArrowDown' ? Math.min(n - 1, i + 1) : Math.max(0, i - 1))]?.focus(); return;
  }
  const op = e.target.closest('[role=option]');
  if (op && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pilihOpsi(nm, op.dataset.v); }

      ['Bagaimana menangguhkan atau mengaktifkan kantor PPAT?', 'Tidak dari sini. Status kantor diatur di aplikasi Onboarding (konsol operator).'],
      ['Apa arti aktivitas bertanda Gagal?', 'Aktivitas tidak berhasil, misalnya kata sandi salah saat masuk. Beberapa kegagalan berturut-turut dari akun yang sama perlu diperiksa di Log Aktivitas.'],
      ['Bagaimana melihat semua aktivitas?', 'Klik "Lihat Semua" untuk membuka Log Aktivitas. Di sana Anda dapat menyaring per kantor PPAT dan jenis aktivitas.'],
      ['Bisakah saya membuka data kantor dari daftar Pengguna terbanyak?', 'Ya. Klik nama kantor untuk membuka Daftar PPAT yang langsung mencari kantor tersebut.'],
      ['Mengapa angka belum berubah?', 'Angka dimuat saat halaman dibuka. Muat ulang halaman untuk melihat data terbaru.']])}
    ${kontak()}` }),
  ppat:() => ({ judul:'Bantuan Daftar PPAT', isi:`<p>Daftar PPAT menampilkan semua kantor PPAT yang terdaftar di E-PPAT beserta paket, masa berlaku, dan statusnya. Halaman ini hanya untuk melihat data.</p>
    <h4 class="bantu-sub">Langkah mencari kantor</h4>
    ${lgkh(['Ketik nama kantor atau alamatnya (mis. <b>ppat-contoh-satu</b>) di kotak <b>Cari PPAT</b>.', 'Hasil langsung tersaring. Pindah halaman di bawah tabel bila hasilnya lebih dari 20.', 'Klik <b>Hapus Pencarian</b> bila tidak ada hasil.'])}
    <h4 class="bantu-sub">Arti kolom</h4>
    ${istilah([['Paket', 'Paket langganan kantor. Rincian batasnya ada di Paket Langganan.'], ['Masa Berlaku', 'Tanggal paket berakhir. "Tanpa batas" berarti tidak ada tanggal akhir. Lencana Kedaluwarsa berarti tanggalnya sudah lewat.'], ['Status', 'Aktif: kantor dapat dipakai. Ditangguhkan: pengguna kantor tidak dapat masuk.'], ['Registrasi', 'Dibuka: calon pengguna dapat mendaftar sendiri ke kantor itu. Ditutup: akun hanya dibuat admin kantor.'], ['Dibuat', 'Tanggal kantor didaftarkan.']])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('p', [
      ['Bagaimana menambah kantor PPAT baru?', 'Kantor PPAT baru dibuat lewat aplikasi Onboarding (konsol operator), bukan dari halaman ini. Klik "Buka Onboarding".'],
      ['Bagaimana mengganti paket atau memperpanjang masa berlaku?', 'Lewat aplikasi Onboarding. Setelah diubah di sana, data di halaman ini ikut berubah.'],
      ['Di mana alamat aplikasi Onboarding diatur?', 'Di Sistem › Pengaturan Global, tab Umum, isian URL aplikasi Onboarding.'],
      ['Apa yang terjadi bila masa berlaku sudah lewat?', 'Kantor diberi lencana Kedaluwarsa dan dapat ditangguhkan sampai paketnya diperpanjang di Onboarding.'],
      ['Bisakah menyaring berdasarkan status atau paket?', 'Belum. Saat ini hanya tersedia pencarian nama dan alamat kantor.'],
      ['Bagaimana membuka aplikasi kantor tertentu?', 'Tambahkan alamat yang tertulis di bawah nama kantor, misalnya /t/ppat-contoh-satu, di belakang alamat E-PPAT. Anda perlu akun di kantor itu untuk masuk.'],
      ['Mengapa kantor yang saya cari tidak muncul?', 'Periksa ejaan nama atau alamatnya. Pencarian tidak membedakan huruf besar dan kecil.']])}
    ${kontak()}` }),
  paket:() => ({ judul:'Bantuan Paket Langganan', isi:`<p>Paket Langganan menampilkan katalog paket beserta batas pemakaiannya. Katalog ini hanya untuk dilihat; paket dibuat dan diubah di aplikasi Onboarding.</p>
    <h4 class="bantu-sub">Arti kolom</h4>
    ${istilah([['Kode', 'Kode paket yang dipakai sistem, mis. FREE atau ENTERPRISE.'], ['Maks. Order', 'Jumlah order akta paling banyak untuk satu kantor.'], ['Maks. Pengguna', 'Jumlah akun paling banyak di satu kantor.'], ['Masa Berlaku', 'Lama paket berlaku sejak diaktifkan.'], ['Registrasi CA', 'Aktif: kantor dapat mendaftarkan sertifikat elektronik (CA) Peruri untuk tanda tangan elektronik.'], ['Status', 'Aktif: paket dapat dipilih kantor. Nonaktif: paket tidak ditawarkan lagi.']])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('k', [
      ['Apa arti "Tanpa batas"?', 'Paket tidak membatasi jumlah atau waktu untuk kolom tersebut.'],
      ['Bagaimana mengubah batas sebuah paket?', 'Lewat aplikasi Onboarding (konsol operator). Klik "Buka Onboarding".'],
      ['Apa beda kolom Registrasi CA dan Status?', 'Registrasi CA menunjukkan fitur sertifikat elektronik di paket itu. Status menunjukkan apakah paket itu masih ditawarkan.'],
      ['Apa yang terjadi pada kantor yang memakai paket Nonaktif?', 'Kantor tetap memakai paketnya sampai masa berlaku habis. Paket nonaktif hanya tidak dapat dipilih kantor baru.'],
      ['Apa itu CA?', 'CA (Certificate Authority) adalah sertifikat elektronik dari Peruri. Sertifikat ini diperlukan untuk menandatangani akta secara elektronik.'],
      ['Di mana melihat paket yang dipakai sebuah kantor?', 'Di Daftar PPAT, kolom Paket.']])}
    ${kontak()}` }),
  log:() => ({ judul:'Bantuan Log Aktivitas', isi:`<p>Log Aktivitas mencatat aktivitas di semua kantor PPAT dan aktivitas admin platform, misalnya masuk, keluar, dan unduh dokumen akta.</p>
    <h4 class="bantu-sub">Langkah mencari</h4>
    ${lgkh(['Pilih kantor di saringan <b>PPAT</b>, atau biarkan <b>Semua PPAT</b>.', 'Pilih <b>Jenis aktivitas</b>, misalnya Gagal masuk.', 'Pindah halaman di bawah tabel untuk aktivitas yang lebih lama.', 'Klik <b>Hapus Saringan</b> untuk kembali ke semua aktivitas.'])}
    <h4 class="bantu-sub">Arti aktivitas</h4>
    ${istilah([['Masuk / Keluar', 'Pengguna masuk atau keluar dari aplikasi.'], ['Gagal masuk', 'Percobaan masuk ditolak, mis. kata sandi salah.'], ['Sesi diperpanjang', 'Sistem memperpanjang sesi masuk pengguna secara otomatis.'], ['Ganti kata sandi', 'Pengguna mengganti kata sandinya.'], ['Pratinjau draf', 'Pengguna membuka pratinjau draf akta.'], ['Unduh dokumen akta', 'Pengguna mengunduh dokumen akta.']])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('l', [
      ['Apa arti PPAT "Platform"?', 'Aktivitas dilakukan oleh admin platform, bukan oleh pengguna kantor PPAT.'],
      ['Mengapa kolom IP kosong (—)?', 'Beberapa aktivitas, misalnya pratinjau dan unduh draf, tidak mencatat alamat IP.'],
      ['Apa itu kolom IP?', 'Alamat jaringan perangkat yang dipakai saat aktivitas terjadi. Gunakan untuk menelusuri akses yang mencurigakan.'],
      ['Mengapa jenis aktivitas di saringan hanya lima?', 'Saringan saat ini mencakup aktivitas masuk dan keamanan akun. Aktivitas lain tetap tampil di tabel bila saringan jenis aktivitas tidak dipilih.'],
      ['Bagaimana menelusuri banyak Gagal masuk?', 'Pilih Jenis aktivitas "Gagal masuk", lalu lihat Aktor dan IP. Bila percobaan berulang dari IP yang sama, hubungi admin kantor terkait.'],
      ['Bisakah log diubah, dihapus, atau diunduh?', 'Tidak. Log hanya dapat dibaca agar riwayat tetap utuh. Bila butuh salinan log, hubungi dukungan.']])}
    ${kontak()}` })
};
function bukaBantuan() { drawer(BANTUAN[S.layar]()); }

/* ---------------- protobar & daftar penyesuaian ---------------- */
$('#bukaUbah').textContent = `Daftar penyesuaian (${UBAH.length})`;
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar penyesuaian menu Monitoring', lebar:true,
    isi:`<p>Menu Monitoring di area platform tidak dinilai dalam laporan Heuristic Evaluation. Isi, kolom, dan perilaku mengikuti kode live dev-app.eppat.id/platform; yang disesuaikan adalah komponen IDDS dengan brand E-PPAT, kejujuran label, bahasa, status sistem, dan Bantuan per halaman. Data di prototipe ini adalah data contoh.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup', 'secondary', null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => { const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]); });
});
function lihat(u) {
  const sorot = () => { const el = u.sorot && $(u.sorot); if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); } };
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  pindah(u.ke, sorot);
}
$('#aturUlang').addEventListener('click', () => { PPAT = contohPpat(); LOG = contohLog(); const l = S.layar; S = S0(); S.layar = l; gambar(); gambarMenu(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
const awal = (location.hash || '').slice(1); if (RENDER[awal]) S.layar = awal;
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RENDER[h] && h !== S.layar) pindah(h); });
gambar();
})();
</script>
</body>
