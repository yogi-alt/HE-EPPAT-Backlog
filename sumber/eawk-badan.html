<style id="eawk-css">
/* ===== E-Akta Wizard (Klien) — komponen IDDS + brand E-PPAT (HE-UMUM-01)

.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45}

.panduan-awal.ina-card{display:block;width:100%;max-width:none;margin-top:16px;padding:20px 22px;border-radius:16px;border:1px solid var(--ina-primary-200,#cfe3dc);background:var(--ina-primary-25,#f4faf7)}

.panduan-awal .atas{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

.tiga-langkah li{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);font-size:14px;line-height:20px}
.tiga-langkah .no{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;background:var(--ina-primary-600);color:#fff;font:600 13px Inter,sans-serif;flex:none}
.tiga-langkah b{display:block;margin-bottom:2px}
.tiga-langkah small{color:var(--ina-content-secondary);font-size:13px}
.panduan-awal .kaki{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* daftar akta (seperti live) + cari & saring (HE-EAWK-01) */
.pengantar{margin-top:16px;font-size:14px;color:var(--ina-content-secondary)}
.saring-k{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap}
.saring-k .ina-input-search{flex:1;width:auto;min-width:220px}
.urut-wadah{position:relative}
.urut-wadah .ina-select-dropdown__trigger{min-width:200px}
.urut-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:auto;right:0;min-width:220px;z-index:20}
.daftar-akta{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.item-akta.ina-card{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:none;padding:14px 18px;border-radius:14px;cursor:pointer;text-align:left}
.item-akta .isi{flex:1;align-items:flex-start}
.item-akta:hover{border-color:var(--ina-primary-400)}
.item-akta:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.item-akta .isi{min-width:0;display:flex;flex-direction:column;gap:2px}
.item-akta .baris1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item-akta .kd{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary)}
.item-akta .jenis{font-size:14px;color:var(--ina-content-primary)}
.item-akta .hint{font-size:13px;color:var(--ina-content-secondary)}
.item-akta .tgl{font-size:12.5px;color:var(--ina-content-secondary);display:inline-flex;align-items:center;gap:4px}
.item-akta .aksi{flex:none;font:600 13px Inter,sans-serif;color:var(--ina-primary-primary);display:inline-flex;align-items:center;gap:4px}

.ringkas-saring{margin-top:10px;font-size:13px;color:var(--ina-content-secondary)}
.kosong-akta{margin-top:12px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:40px 24px;text-align:center;color:var(--ina-content-secondary)}
.kosong-akta svg{color:var(--ina-stroke-secondary);display:block;margin:0 auto 10px}
.kosong-akta b{display:block;color:var(--ina-content-primary);margin-bottom:4px}

/* ruang kerja detail (sama dengan prototipe E-Akta Wizard PPAT) */
.kembali{margin-top:16px}
.ruang{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;margin-top:12px;align-items:start}
.penampil{background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden;min-width:0}
.penampil-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--ina-primary-600);color:#fff}
.penampil-bar b{font-size:14px;margin-right:auto}
.penampil-bar .ina-button{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.25)!important;color:#fff!important}
.penampil-bar .ina-button:disabled{opacity:.45}
.penampil-bar .hal{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.penampil-bar .hal .ina-text-field__input{color:var(--ina-content-primary);background:transparent}
.penampil-bar .zoom{font-size:13px;min-width:42px;text-align:center}
.hal-field{width:56px}
.hal-field .ina-text-field__wrapper{height:32px;min-height:0;padding:0 6px}
.hal-field .ina-text-field__input{text-align:center;font-size:13px}
.lompat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--ina-stroke-primary);background:var(--ina-primary-25);font-size:13px}

.lompat .ina-badge:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.kanvas{background:#4b5157;padding:24px;max-height:78vh;overflow:auto}
.halaman-pdf{position:relative;margin:0 auto;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35);aspect-ratio:21.5/33;font:13px/2 "Courier New",Courier,monospace;color:#111;padding:9% 8% 8% 22%;overflow:hidden}
.halaman-pdf h3{margin:28% 0 0;text-align:center;font:700 18px/1.8 "Courier New",monospace;letter-spacing:2px}
.halaman-pdf p{margin:0 0 4px;text-align:left}
.halaman-pdf .ttd-blok{display:grid;grid-template-columns:1fr 1fr;gap:18% 10%;margin-top:14%;text-align:center}

.penanda.jadi{border-style:solid;background:#eff6ff}

.penanda.kilau{animation:kilau 1.6s ease 2}

.panel .ina-card{display:block;width:100%;max-width:none;padding:16px}
.panel .ina-card__content{padding:0;display:block}
.panel h4{margin:0 0 8px;font:600 15px Inter,sans-serif;display:flex;align-items:center;gap:8px;color:var(--ina-content-primary)}

.berikut{border:2px solid var(--ina-primary-500)!important}

.berikut .langkah-ttd .ina-stepper__item--completed:not(:last-child)::after{background:var(--ina-primary-500)}
.berikut .langkah-ttd .ina-stepper__label > span{font-weight:600;color:var(--ina-content-primary)}
.berikut .langkah-ttd .ina-stepper__item--active .ina-stepper__label > span{color:var(--ina-primary-primary)}
.langkah-ttd .ina-stepper__label{white-space:normal;text-align:left;max-width:none;font-size:14px;line-height:20px}
.langkah-ttd .ina-stepper__label small{display:block;margin-top:2px;font-size:12.5px;line-height:18px;font-weight:400;color:var(--ina-content-secondary)}
.berikut .langkah-ttd .ina-button{width:auto;margin-top:6px}

.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:10px 0 0;font-size:13.5px}
.kv dt{color:var(--ina-content-secondary)}
.kv dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.kd-info{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary)}
.urutan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.urutan li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;font-size:14px}
.urutan li.saya{background:var(--ina-background-secondary)}
.urutan .nm{min-width:0}
.urutan .ina-badge{flex:none;white-space:nowrap}
.urutan .no{font-size:12px;color:var(--ina-content-secondary);margin-right:4px}
.urutan .anda{font-size:12px;color:var(--ina-primary-primary)}
.urutan .peran{margin-left:4px;font-size:12px;color:var(--ina-content-secondary)}
.kontak{display:flex;flex-direction:column;gap:8px}
.kontak .ina-button{width:100%;justify-content:flex-start;text-decoration:none}
.ket-kecil{margin:8px 0 0;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}

/* dialog OTP (HE-EAWK-05, sama dengan prototipe E-Akta Wizard PPAT) */
.otp-isi{text-align:center}
.otp-isi .surel{margin:0 0 4px;font-size:14px;color:var(--ina-content-secondary)}
.otp-isi .ina-one-time-password{align-items:center;padding:4px 0}
.otp-isi .ina-one-time-password__container{justify-content:center;margin:12px 0 8px}
.otp-waktu.ina-badge{display:inline-flex;align-items:center;gap:6px;margin:4px 0 6px;font-weight:600}
.otp-ulang{margin-top:8px;font-size:13.5px;color:var(--ina-content-secondary)}
.otp-catat{margin:12px 0 0;font-size:13px;color:var(--ina-content-secondary)}
.ringkas{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:12px 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas dt{color:var(--ina-content-secondary)}
.ringkas dd{margin:0;font-weight:500}
.cek{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px;cursor:pointer}

@media (max-width:1180px){ .ruang{grid-template-columns:1fr} .panel{order:-1} .kanvas{max-height:none} }
@media (max-width:760px){
  .tiga-langkah{grid-template-columns:1fr}
  .item-akta.ina-card{flex-direction:column;align-items:flex-start}

  .kanvas{padding:10px}
  .halaman-pdf{font-size:9px}
  .halaman-pdf h3{font-size:13px}
  .kv,.ringkas{grid-template-columns:1fr;gap:2px}
  .kv dd{text-align:left;margin-bottom:6px}
  .ringkas dd{margin-bottom:6px}
  .otp-isi .ina-one-time-password__input{width:40px;height:40px;margin:2px}
  .otp-isi .ina-one-time-password__container{gap:6px;min-width:0}
  .penampil-bar b{width:100%}
}

const ST = {
  MENUNGGU_TERA:{ l:'Menunggu stempel PPAT', b:'neutral', hint:'Kantor PPAT belum membubuhkan stempel elektronik.', grup:'menunggu' },
  MENUNGGU_GILIRAN:{ l:'Menunggu giliran', b:'info', hint:'Pihak sebelum Anda belum menandatangani.', grup:'menunggu' },
  GILIRAN_ANDA:{ l:'Giliran Anda', b:'warning', hint:'Silakan tanda tangani sekarang.', grup:'perlu' },
  OTP_TERKIRIM:{ l:'OTP terkirim', b:'warning', hint:'Masukkan kode OTP untuk menandatangani.', grup:'perlu' },
  SUDAH_TTD:{ l:'Sudah Anda tanda tangani', b:'success', hint:'Menunggu pihak lain.', grup:'menunggu' },
  SELESAI:{ l:'Selesai', b:'success', hint:'Semua pihak telah menandatangani.', grup:'selesai' }
};
const PERAN = { PENJUAL:'Penjual', PEMBELI:'Pembeli', SAKSI:'Saksi', PPAT:'PPAT' };
function akta(kode, peran, state, tgl, urut, opsi = {}) {
  const lain = { PENJUAL:'Contoh Penjual Dua', PEMBELI:'Contoh Pembeli Dua', SAKSI:'Contoh Saksi Dua' };
  const susunan = ['PENJUAL', 'PEMBELI', 'SAKSI', 'PPAT'];
  const urutan = susunan.map((p, i) => ({ seq:i, nama:p === peran ? 'Contoh Klien Satu' : p === 'PPAT' ? 'PPAT Contoh Satu' : lain[p], peran:p, saya:p === peran, status:'MENUNGGU' }));
  const saya = urutan.find(s => s.saya);
  const selesai = { MENUNGGU_TERA:-1, MENUNGGU_GILIRAN:saya.seq - 1, GILIRAN_ANDA:saya.seq, OTP_TERKIRIM:saya.seq, SUDAH_TTD:saya.seq + 1, SELESAI:4 }[state];
  urutan.forEach(s => { if (s.seq < selesai) s.status = 'SIGNED'; });
  if (state === 'MENUNGGU_GILIRAN') urutan[saya.seq - 1].status = 'MENUNGGU';
  if (state === 'OTP_TERKIRIM') saya.status = 'OTP_SENT';
  return { kode, peran, state, tgl, urut, hal:opsi.hal === undefined ? JHAL : opsi.hal, alasan:opsi.alasan || '', otpHabis:opsi.otpSisa ? Date.now() + opsi.otpSisa * 1000 : null, urutan };
}

  if (x.state === 'MENUNGGU_TERA') return `<div class="dok-belum">${ik('kunci', 28)}<b>Dokumen belum siap ditandatangani</b>Menunggu Kantor PPAT membubuhkan stempel elektronik (${istilah('TERA', 'TERA')}).</div>`;
  const s = sayaDi(x), jadi = s.status === 'SIGNED', [px, py] = POS[x.peran];
  const pintas = [x.hal ? badge(`Tanda tangan Anda · Hal. ${x.hal}`, 'info', 'sm', `data-lompat="${x.hal}" data-sorot role="button" tabindex="0"`) : '', badge('Halaman pertama', 'neutral', 'sm', 'data-lompat="1" role="button" tabindex="0"'), badge('Halaman terakhir', 'neutral', 'sm', `data-lompat="${JHAL}" role="button" tabindex="0"`)].join('');
  return `<section class="penampil">
    <div class="penampil-bar"><b>PDF Dokumen</b>
      ${tombol('Sebelumnya', 'secondary', 'sm', `data-hal="${S.hal - 1}" ${S.hal <= 1 ? 'disabled' : ''} aria-label="Halaman sebelumnya"`, ik('kiri', 14))}
      <span class="hal">Hal. <span class="ina-text-field hal-field"><span class="ina-text-field__wrapper ina-text-field__wrapper--size-sm"><input id="inHal" class="ina-text-field__input" inputmode="numeric" value="${S.hal}" aria-label="Nomor halaman"></span></span> dari ${JHAL}</span>
      ${tombol('Berikutnya', 'secondary', 'sm', `data-hal="${S.hal + 1}" ${S.hal >= JHAL ? 'disabled' : ''} aria-label="Halaman berikutnya"`)}
      ${tombol('', 'secondary', 'sm', `data-zoom="-10" aria-label="Perkecil"`, ik('minus', 14))}<span class="zoom">${S.zoom}%</span>${tombol('', 'secondary', 'sm', `data-zoom="10" aria-label="Perbesar"`, ik('tambah', 14))}
    </div>
    <div class="lompat ditandai" id="barisLompat"><span>${ik('target', 14)} Lompat ke:</span>${pintas}${usulan('HE-EAWK-02')}</div>
    <div class="kanvas"><div class="halaman-pdf" id="lembar" style="width:${Math.round(5.2 * S.zoom)}px;max-width:100%">${isiHalaman(S.hal)}
      ${x.hal === S.hal ? `<div class="penanda ttd ${jadi ? 'jadi' : ''} ${S.kilau ? 'kilau' : ''}" style="left:${px}%;top:${py}%" title="${jadi ? 'Sudah ditandatangani' : 'Posisi tanda tangan Anda, ditentukan Kantor PPAT'}">${!jadi && bisaTtd(x) ? `<span class="sini">Tanda tangan Anda di sini</span>` : ''}<span>${jadi ? 'Ditandatangani' : 'Contoh Klien Satu'}</span><small>${x.peran}</small></div>` : ''}
    </div></div>
  </section>`;
}
/* kartu "Langkah berikutnya" (HE-EAWK-03) */
function kartuBerikut(x) {
  const st = ST[x.state], s = sayaDi(x), kepala = t => `<div class="eyebrow2">Langkah berikutnya${usulan('HE-EAWK-03')}</div><h4>${t}</h4>`;
  const bungkus = isi => `<div class="ina-card ina-card--variant-basic berikut ditandai" id="kartuBerikut"><div class="ina-card__content">${isi}</div></div>`;
  if (x.state === 'GILIRAN_ANDA' && !x.hal) return bungkus(`${kepala('Menunggu Kantor PPAT')}${alert('caution', 'Posisi tanda tangan belum ditentukan', `${esc(x.alasan)} Anda dapat menandatangani setelah kantor menempatkannya. Hubungi kantor melalui kontak di bawah.`)}`);
  if (bisaTtd(x)) {
    const otp = x.state === 'OTP_TERKIRIM', habis = otp && x.otpHabis <= Date.now();
    const L = [
      { t:'Periksa isi akta', k:`Baca seluruh ${JHAL} halaman. Tanda tangan Anda ada di halaman ${x.hal}.`, ok:otp, ekstra:S.hal !== x.hal ? tombol(`Lihat halaman ${x.hal}`, 'secondary', 'sm', `data-lompat="${x.hal}" data-sorot`, ik('target', 14)) : '' },
      { t:`Kirim kode ${istilah('OTP', 'OTP')}`, k:otp ? (habis ? 'Kode sudah kedaluwarsa. Kirim ulang untuk mendapatkan kode baru.' : `Terkirim ke ${samar(EMAIL)} pukul ${jamId(x.otpHabis - 900000)}. Berlaku sampai ${jamId(x.otpHabis)}.`) : `Peruri mengirim kode 6 digit ke ${samar(EMAIL)}.`, ok:otp && !habis },
      { t:'Masukkan kode dan tanda tangani', k:`${istilah('Tanda tangan elektronik', 'TTE')} dibubuhkan dengan ${istilah('sertifikat elektronik (CA)', 'CA')} Anda dan tidak dapat dibatalkan.`, ok:false }
    ];
    const kini = otp && !habis ? 2 : 1;
    /* IDDS Stepper vertikal (sama dengan stepper prototipe E-Akta Wizard PPAT) */
    const stepper = `<div class="ina-stepper ina-stepper--vertical langkah-ttd" aria-label="Langkah tanda tangan">${L.map((l, i) => {
      const kls = l.ok ? 'completed' : i === kini ? 'active' : '';
      return `${i ? `<div class="ina-stepper__separator ${L[i - 1].ok ? 'ina-stepper__separator--completed' : ''}"></div>` : ''}<div class="ina-stepper__item ${kls ? 'ina-stepper__item--' + kls : ''}" aria-current="${i === kini ? 'step' : 'false'}">
        <div class="ina-stepper__icon-wrapper">${l.ok ? `<svg class="ina-stepper__check-icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" fill="none"><path d="M5 12l5 5l10 -10"/></svg>` : `<span class="ina-stepper__step-number">${i + 1}</span>`}</div>
        <div class="ina-stepper__label"><span>${l.t}</span><small>${l.k}</small>${l.ekstra || ''}</div></div>`; }).join('')}</div>`;
    const tb =otp && !habis ? tombol('Masukkan OTP & Tanda Tangani', 'primary', 'md', `id="aksiOtp" ${S.memuat ? 'disabled' : ''}`, ik('kunciOtp', 16)) + tombol('Kirim ulang OTP', 'secondary', 'md', `id="aksiKirim" ${S.memuat ? 'disabled' : ''}`, S.memuat === 'kirim' ? spinner : ik('surat', 16))
      : tombol(otp ? 'Kirim ulang OTP' : 'Kirim OTP', 'primary', 'md', `id="aksiKirim" ${S.memuat ? 'disabled' : ''}`, S.memuat === 'kirim' ? spinner : ik('surat', 16));
    return bungkus(`${kepala(otp && !habis ? 'Masukkan kode OTP' : 'Tanda tangani akta ini')}
      ${stepper}${tb}`);
  }
  if (x.state === 'MENUNGGU_GILIRAN') { const sb = x.urutan[s.seq - 1];
    return bungkus(`${kepala('Menunggu giliran Anda')}${alert('info', '', `<b>${esc(sb.nama)}</b> (${PERAN[sb.peran]}) belum menandatangani. Anda akan menerima notifikasi saat giliran Anda tiba. Sambil menunggu, Anda dapat membaca isi akta.`)}`); }
  if (x.state === 'MENUNGGU_TERA') return bungkus(`${kepala('Menunggu stempel PPAT')}${alert('neutral', '', `Kantor PPAT belum membubuhkan stempel elektronik (${istilah('TERA', 'TERA')}). Akta dapat dibaca dan ditandatangani setelah stempel dibubuhkan.`)}`);
  if (x.state === 'SUDAH_TTD') { const g = x.urutan.find(u => u.status !== 'SIGNED');
    return bungkus(`${kepala('Tidak ada tindakan untuk Anda')}${alert('success', 'Tanda tangan Anda tercatat', `Menunggu pihak lain.${g ? ` Giliran saat ini: <b>${esc(g.nama)}</b>${g.peran === 'PPAT' ? '' : ` (${PERAN[g.peran]})`}.` : ''}`)}`); }
  return bungkus(`${kepala('Akta selesai')}${alert('success', '', 'Semua pihak telah menandatangani akta ini. Tidak ada tindakan lagi untuk Anda.')}`);
}
function kartuInfo(x) {

  return `<div class="ina-card ina-card--variant-basic"><div class="ina-card__content">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="kd-info">${x.kode}</span>${badge(st.l, st.b, 'sm')}</div>
    <div style="margin-top:4px;font-size:14px">Akta Jual Beli</div>

/* label live "Tertanda tangan" / "Sedang tanda tangan" dibakukan, sama dengan prototipe E-Akta Wizard PPAT */
const STATUS_URUT = s => s.status === 'SIGNED' ? ['Sudah menandatangani', 'success'] : s.status === 'OTP_SENT' ? ['Sedang menandatangani', 'warning'] : ['Menunggu', 'neutral'];

}
const EMAIL = 'klien1@contoh.id';
function layarDetail() {
  const x = o();
  return `${remah()}<h1>Penandatanganan Akta</h1><p class="sub">Periksa akta Anda, lalu tanda tangani secara elektronik saat giliran Anda tiba.</p>

/* ---------------- gambar & navigasi ---------------- */
function gambar() { gambarNav(); gambarMenu(); $('#halaman').innerHTML = S.layar === 'daftar' ? layarDaftar() : layarDetail(); pasangPanduan(); S.kilau = false; }
function keDaftar() { Object.assign(S, { layar:'daftar', aktif:null, urutBuka:false }); gambar(); window.scrollTo({ top:0 }); }
/* buka akta: penampil langsung ke halaman tanda tangan Anda (HE-EAWK-02) */
function buka(kode) {
  const x = AKTA.find(y => y.kode === kode);
  Object.assign(S, { layar:'detail', aktif:kode, zoom:100, hal:x.hal && x.state !== 'MENUNGGU_TERA' ? x.hal : 1, kilau:!!(x.hal && bisaTtd(x)) });
  gambar(); window.scrollTo({ top:0 });
}
function keHal(h, sorot) { S.hal = Math.max(1, Math.min(JHAL, h)); S.kilau = !!sorot; gambar(); $('#lembar')?.scrollIntoView({ block:'nearest', behavior:'smooth' }); }

/* ---------------- interaksi ---------------- */
const H = $('#halaman');
H.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-lompat], [data-buka]')) { e.preventDefault(); e.target.click(); }
  if (e.target.id === 'inHal' && e.key === 'Enter') keHal(+e.target.value || 1);
});
H.addEventListener('change', e => { if (e.target.id === 'inHal') keHal(+e.target.value || 1); });
H.addEventListener('input', e => {
  if (e.target.id !== 'cariAkta') return;
  S.cari = e.target.value; const pos = e.target.selectionStart; gambar(); const i = $('#cariAkta'); i.focus(); i.setSelectionRange(pos, pos);
});
H.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-ke-daftar]')) { e.preventDefault(); keDaftar(); return; }
  if (t.closest('[data-tutup-panduan]')) { S.panduan = false; try { localStorage.setItem('eawk-panduan-tutup', '1'); } catch (er) {} gambar(); toast('Panduan ditutup. Anda dapat membukanya lagi lewat tombol Bantuan.'); return; }
  if (t.closest('[data-bantuan]')) { bukaBantuan(); return; }
  const gr = t.closest('[data-grup]'); if (gr) { S.grup = gr.dataset.grup; gambar(); return; }
  if (t.closest('#urutTombol')) { S.urutBuka = !S.urutBuka; gambar(); return; }
  const ur = t.closest('[data-urut]'); if (ur) { S.urut = ur.dataset.urut; S.urutBuka = false; gambar(); return; }
  if (t.closest('[data-reset-saring]')) { S.cari = ''; S.grup = ''; gambar(); return; }
  const b = t.closest('[data-buka]'); if (b) { buka(b.dataset.buka); return; }
  if (t.closest('#kembali')) { keDaftar(); return; }
  const lp = t.closest('[data-lompat]'); if (lp) { keHal(+lp.dataset.lompat, lp.hasAttribute('data-sorot')); return; }
  const hl = t.closest('[data-hal]'); if (hl && !hl.disabled) { keHal(+hl.dataset.hal); return; }
  const zm = t.closest('[data-zoom]'); if (zm) { S.zoom = Math.max(60, Math.min(160, S.zoom + +zm.dataset.zoom)); gambar(); return; }
  if (t.closest('#aksiKirim')) { o().state === 'OTP_TERKIRIM' ? kirimOtp(true) : konfirmTtd(); return; }
  if (t.closest('#aksiOtp')) { bukaOtp(); return; }
});
document.addEventListener('click', e => { if (S.urutBuka && !e.target.closest('.urut-wadah')) { S.urutBuka = false; gambar(); } });

/* ---------------- konfirmasi sebelum tanda tangan (HE-EAWK-04) ---------------- */
const ringkas = rows => `<dl class="ringkas">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const pernyataan = t => `<label class="ina-checkbox cek" for="setuju"><input type="checkbox" id="setuju" class="ina-checkbox__input peer"><div class="ina-checkbox__box ina-checkbox__box--unchecked"></div><div class="ina-checkbox__content"><span class="ina-checkbox__label">${t}</span></div></label>`;
function konfirmTtd() {
  const x = o(), s = sayaDi(x);
  dialog({ judul:'Tanda tangani akta ini?', konfirmasi:true, kunciUtama:'#setuju',
    isi:`<p>Tanda tangan elektronik Anda akan dibubuhkan pada akta berikut dengan sertifikat elektronik (CA) Anda. Tanda tangan yang sudah dibubuhkan <b>tidak dapat dibatalkan</b> dan berlaku sah secara hukum.${usulan('HE-EAWK-04')}</p>
      ${ringkas([['Akta', `${x.kode} · Akta Jual Beli`], ['Peran Anda', `${PERAN[x.peran]} · urutan ${s.seq + 1}`], ['Posisi', `Halaman ${x.hal} dari ${JHAL}`], ['Kode OTP dikirim ke', samar(EMAIL)]])}
      ${pernyataan('Saya sudah membaca isi akta dan setuju menandatanganinya.')}`,
    tombol:[['Batal','secondary',null],['Kirim OTP','primary',() => kirimOtp(false)]] });
}
function kirimOtp(ulang) {
  const x = o();
  tunggu('kirim', 700, () => { x.state = 'OTP_TERKIRIM'; sayaDi(x).status = 'OTP_SENT'; x.otpHabis = Date.now() + 900000; gambar(); toast(ulang ? 'Kode OTP baru sudah dikirim ke email Anda.' : 'OTP dikirim ke email Anda.', 'positive'); bukaOtp(); });
}
function tunggu(id, ms, lalu) { S.memuat = id; gambar(); setTimeout(() => { S.memuat = ''; lalu(); }, ms); }
function bukaOtp() {
  const x = o();
  dialogOtp({ judul:'Tanda tangani akta', email:samar(EMAIL), ket:'Contoh Klien Satu', tombolOk:'Tanda Tangani', sisa:Math.max(0, Math.round((x.otpHabis - Date.now()) / 1000)),
    catatan:`Saat Anda menekan <b>Tanda Tangani</b>, tanda tangan elektronik langsung dibubuhkan pada ${x.kode} halaman ${x.hal} dan tidak dapat dibatalkan.`,
    kirimUlang:() => { x.otpHabis = Date.now() + 900000; gambar(); },
    selesai:() => {
      sayaDi(x).status = 'SIGNED'; const g = x.urutan.find(u => u.status !== 'SIGNED');
      x.state = g ? 'SUDAH_TTD' : 'SELESAI'; x.otpHabis = null; S.hal = x.hal; gambar();
      toast('Tanda tangan Anda berhasil dibubuhkan.', 'positive', 4500, g ? `Giliran berikutnya: ${g.nama} (${PERAN[g.peran]}).` : 'Semua pihak telah menandatangani akta ini.');
    } });
}

/* ---------------- dialog OTP dengan masa berlaku (HE-EAWK-05, sama dengan prototipe E-Akta Wizard PPAT) ---------------- */
let OTP = null;
function dialogOtp({ judul, email, ket, tombolOk, selesai, sisa = 900, catatan = '', kirimUlang }) {
  OTP = { sisa, ulang:Math.max(0, 60 - (900 - sisa)), coba:3, galat:'', selesai };
  dialog({ judul, isi:`<div class="otp-isi">
      <p class="surel">${ik('surat', 16)} Kode OTP dikirim ke <b>${esc(email)}</b>${ket ? ` (${esc(ket)})` : ''}.</p>
      <div class="ina-one-time-password"><div class="ina-one-time-password__container" role="group" aria-label="Kode OTP 6 digit">${Array.from({ length:6 }, (_, i) => `<input class="ina-one-time-password__input" inputmode="numeric" maxlength="1" aria-label="Digit ${i + 1}" data-otp="${i}" autocomplete="one-time-code">`).join('')}</div>
        <div class="ina-one-time-password__helper-text" id="otpPesan" aria-live="polite"></div></div>
      <div class="ina-badge ina-badge--soft ina-badge--brand ina-badge--md ina-badge--rounded-full otp-waktu" id="otpWaktu" aria-live="off">${ik('jam', 14)} <span>Kode berlaku 15:00</span></div>
      <div class="otp-ulang" id="otpUlang"></div>${catatan ? `<p class="otp-catat">${catatan}</p>` : ''}${usulan('HE-EAWK-05')}</div>`,
    tombol:[['Batal','secondary',null],[tombolOk,'primary',() => verifikasi(), true]], tanpaFokusUtama:true });
  const L = $('#lapisan'), kotak = [...L.querySelectorAll('[data-otp]')];
  kotak[0].focus();
  kotak.forEach((k, i) => {
    k.addEventListener('input', () => { k.value = k.value.replace(/\D/g, '').slice(-1); if (k.value && kotak[i + 1]) kotak[i + 1].focus(); OTP.galat = ''; segarOtp(); });
    k.addEventListener('keydown', e => { if (e.key === 'Backspace' && !k.value && kotak[i - 1]) kotak[i - 1].focus(); if (e.key === 'Enter') L.querySelector('.ina-modal__footer .ina-button:last-child').click(); });
    k.addEventListener('paste', e => { const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!d) return; e.preventDefault(); d.split('').forEach((c, j) => { if (kotak[j]) kotak[j].value = c; }); kotak[Math.min(d.length, 5)].focus(); segarOtp(); });
  });
  L.addEventListener('click', e => { if (e.target.closest('#kirimUlang')) { OTP.sisa = 15 * 60; OTP.ulang = 60; OTP.coba = 3; OTP.galat = ''; kotak.forEach(k => k.value = ''); kotak[0].focus(); kirimUlang && kirimUlang(); toast('Kode OTP baru sudah dikirim.', 'positive'); segarOtp(); } });
  segarOtp();
  clearInterval(OTP.t); OTP.t = setInterval(() => { if (!$('#otpWaktu')) { clearInterval(OTP.t); return; } OTP.sisa = Math.max(0, OTP.sisa - 1); OTP.ulang = Math.max(0, OTP.ulang - 1); segarOtp(); }, 1000);
  function kode() { return kotak.map(k => k.value).join(''); }
  function verifikasi() {
    if (OTP.sisa <= 0) return false;
    const c = kode(); if (c.length < 6) { OTP.galat = 'Masukkan 6 digit kode OTP.'; segarOtp(); return false; }
    if (c === '000000') { OTP.coba--; OTP.galat = OTP.coba > 0 ? `Kode salah. Periksa kembali kode di email Anda. Sisa percobaan: ${OTP.coba}.` : 'Kode salah 3 kali. Kirim ulang kode untuk mencoba lagi.'; kotak.forEach(k => k.value = ''); kotak[0].focus(); segarOtp(); return false; }
    clearInterval(OTP.t); $('#lapisan').innerHTML = ''; const f = OTP.selesai; OTP = null; tunggu('otp', 600, f); return true;
  }
}
function segarOtp() {
  if (!OTP || !$('#otpWaktu')) return;
  const m = Math.floor(OTP.sisa / 60), d = String(OTP.sisa % 60).padStart(2, '0'), habis = OTP.sisa <= 0;
  const w = $('#otpWaktu'); w.className = `ina-badge ina-badge--soft ina-badge--${habis ? 'error' : OTP.sisa < 120 ? 'warning' : 'brand'} ina-badge--md ina-badge--rounded-full otp-waktu`;
  w.querySelector('span').textContent = habis ? 'Waktu habis' : `Kode berlaku ${m}:${d}`;
  const ps = $('#otpPesan'), galat = habis ? 'Kode sudah kedaluwarsa. Klik "Kirim ulang kode" untuk mendapatkan kode baru.' : OTP.galat;
  ps.textContent = galat || 'Masukkan 6 digit kode dari email. Kode berlaku 15 menit.';
  ps.classList.toggle('ina-one-time-password__helper-text--error', !!galat);
  document.querySelectorAll('[data-otp]').forEach(k => { k.classList.toggle('ina-one-time-password__input--error', !!galat); k.disabled = habis || OTP.coba <= 0; });
  const u = $('#otpUlang'); const bisa = OTP.ulang <= 0 || habis || OTP.coba <= 0;
  u.innerHTML = `Tidak menerima kode? ${bisa ? tombol('Kirim ulang kode', 'link', 'sm', 'id="kirimUlang"') : `<span>Kirim ulang dalam ${Math.floor(OTP.ulang / 60)}:${String(OTP.ulang % 60).padStart(2, '0')}</span>`}`;
  const ok = document.querySelector('#lapisan .ina-modal__footer .ina-button:last-child'); if (ok) ok.disabled = habis || OTP.coba <= 0;
}
$('#simKedaluwarsa').addEventListener('click', () => { if (!OTP) { toast('Buka dialog OTP terlebih dahulu (mis. ORD-CONTOH-022 → Masukkan OTP & Tanda Tangani).'); return; } OTP.sisa = 0; segarOtp(); });

/* ---------------- tombol Bantuan di judul halaman (HE-UMUM-02) ---------------- */
function pasangPanduan() {
  const h = document.querySelector('#halaman h1'); if (!h || h.parentElement.classList.contains('judul-kiri')) return;
  const w = document.createElement('div'); w.className = 'judul-halaman';
  const kiri = document.createElement('div'); kiri.className = 'judul-kiri';
  const sub = h.nextElementSibling && h.nextElementSibling.classList.contains('sub') ? h.nextElementSibling : null;
  h.before(w); w.append(kiri); kiri.append(h); if (sub) kiri.append(sub);
  w.insertAdjacentHTML('beforeend', `<button type="button" class="ina-button ina-button--secondary ina-button--md ditandai" id="bukaBantuan" aria-label="Bantuan untuk halaman ini"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>Bantuan</span></button>`);
}
document.addEventListener('click', e => { if (e.target.closest('#bukaBantuan')) bukaBantuan(); });

/* ---------------- IDDS Drawer ---------------- */
function drawer({ judul, isi }) {
  const D = $('#lapisanDrawer'), hp = window.matchMedia('(max-width:760px)').matches;
  D.innerHTML = `<div class="ina-drawer ina-drawer--position-${hp ? 'bottom' : 'right'}" role="dialog" aria-modal="true" aria-labelledby="drwJudul">
    <div class="ina-drawer__backdrop" data-tutup-drawer></div>
    <div class="ina-drawer__panel ina-drawer__panel--width-md">
      <div class="ina-drawer__header"><h2 class="ina-drawer__title" id="drwJudul">${judul}</h2>
        <button type="button" class="ina-drawer__close-button" aria-label="Tutup bantuan" data-tutup-drawer><svg class="ina-drawer__close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      <div class="ina-drawer__content">${isi}</div>
    </div></div>`;
  D.querySelector('.ina-drawer__close-button').focus();
}
function tutupDrawer() { $('#lapisanDrawer').innerHTML = ''; }
document.addEventListener('click', e => {
  if (e.target.closest('[data-tutup-drawer]')) { tutupDrawer(); return; }
  const tg = e.target.closest('#lapisanDrawer .ina-accordion__toggle'); if (!tg) return;
  const b = tg.getAttribute('aria-expanded') !== 'true';
  tg.setAttribute('aria-expanded', b);
  tg.querySelector('.ina-accordion__icon').classList.toggle('ina-accordion__icon--open', b);
  tg.nextElementSibling.classList.toggle('ina-accordion__content--open', b);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisanDrawer').innerHTML) tutupDrawer(); });

/* ---------------- IDDS Modal & Toast ---------------- */
function dialog({ judul, isi, tombol: tb, lebar, kunciUtama, konfirmasi, tanpaFokusUtama }) {
  const L = $('#lapisan');
  L.innerHTML = `<div class="ina-modal"><div class="ina-modal__backdrop" data-i="-1"></div><div class="ina-modal__container">
    <div class="ina-modal__dialog ina-modal__dialog--size-${lebar ? 'lg' : 'md'} ${konfirmasi ? 'ina-modal-confirmation' : ''}" role="${konfirmasi ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgJudul">
      <div class="ina-modal__header"><h2 class="ina-modal__title" id="dlgJudul">${judul}</h2><button type="button" class="ina-modal__close-button" aria-label="Tutup dialog" data-i="-1">${ik('x', 22)}</button></div>
      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md" data-i="${i}">${t}</button>`).join('')}</div></div></div></div>`;
  const utama = L.querySelector('.ina-modal__footer .ina-button:last-child');
  if (kunciUtama) { utama.disabled = true; const cb = L.querySelector(kunciUtama); cb.addEventListener('change', e => { utama.disabled = !e.target.checked; const bx = cb.nextElementSibling; bx.classList.toggle('ina-checkbox__box--checked', e.target.checked); bx.classList.toggle('ina-checkbox__box--unchecked', !e.target.checked); bx.innerHTML = e.target.checked ? ik('centang', 12) : ''; }); }
  else if (!tanpaFokusUtama) utama.focus();
  L.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i;
    if (i < 0) { L.innerHTML = ''; return; }
    const [, , fn, tahan] = tb[i];
    if (tahan) { fn && fn(); return; }
    L.innerHTML = ''; fn && fn();
  };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisan').innerHTML) $('#lapisan').innerHTML = ''; });
let tt;
function toast(teks, state = 'default', ms = 3000, ket = '') {
  $('#toastWadah').innerHTML = `<div class="ina-toast ina-toast--state-${state} ina-toast--style-solid ina-toast--visible" role="status"><div class="ina-toast__icon">${ik(state === 'positive' ? 'centang' : 'info', 20)}</div>
    <div class="ina-toast__content"><div class="ina-toast__text-area"><p class="ina-toast__title">${teks}</p>${ket ? `<p class="ina-toast__description">${ket}</p>` : ''}</div></div><button class="ina-toast__close-button" aria-label="Tutup notifikasi" data-tutup-toast>${ik('x', 16)}</button></div>`;
  clearTimeout(tt); tt = setTimeout(() => $('#toastWadah').innerHTML = '', ms);
}
$('#toastWadah').addEventListener('click', e => { if (e.target.closest('[data-tutup-toast]')) $('#toastWadah').innerHTML = ''; });

/* ---------------- Bantuan (HE-UMUM-02) ---------------- */
const faq = (i, q, a) => `<div class="ina-accordion"><button type="button" class="ina-accordion__toggle" aria-expanded="false" aria-controls="faq-${i}"><div class="ina-accordion__title">${q}</div><div class="ina-accordion__toggler"><svg class="ina-accordion__icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></button><div id="faq-${i}" class="ina-accordion__content"><div class="ina-accordion__body"><p>${a}</p></div></div></div>`;
function bukaBantuan() {
  drawer({ judul:'Bantuan Penandatanganan Akta', isi:`
    <p>Di halaman ini Anda menandatangani akta secara elektronik. Tanda tangan elektronik sah secara hukum, sama seperti tanda tangan basah.</p>
    <ol class="bantu-langkah">
      <li><b>Tunggu giliran Anda.</b> Para pihak menandatangani berurutan sesuai daftar "Urutan tanda tangan". Anda menerima notifikasi saat giliran Anda tiba.</li>
      <li><b>Periksa isi akta.</b> PDF terbuka langsung di halaman tanda tangan Anda. Baca seluruh halaman sebelum menandatangani.</li>
      <li><b>Kirim OTP.</b> Peruri mengirim kode 6 digit ke email Anda. Kode berlaku 15 menit.</li>
      <li><b>Masukkan kode, lalu tekan Tanda Tangani.</b> Tanda tangan dibubuhkan dengan sertifikat elektronik (CA) Anda dan tidak dapat dibatalkan.</li>
    </ol>
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${faq(1, 'Apa itu tanda tangan elektronik?', 'Tanda tangan pada dokumen digital yang dibuat dengan sertifikat elektronik (CA) dari Peruri. Sertifikat ini membuktikan bahwa tanda tangan benar-benar milik Anda.')}
    ${faq(2, 'Mengapa tombol tanda tangan belum aktif?', 'Tanda tangan dilakukan berurutan. Tombol aktif setelah pihak sebelum Anda menandatangani dan Kantor PPAT sudah membubuhkan stempel serta menempatkan posisi tanda tangan Anda.')}
    ${faq(3, 'Kode OTP tidak masuk atau sudah kedaluwarsa', 'Periksa folder spam atau promosi di email Anda. Kode berlaku 15 menit. Jika belum masuk atau sudah kedaluwarsa, klik "Kirim ulang kode" di dialog OTP (aktif setelah 60 detik).')}
    ${faq(4, 'Saya salah menandatangani atau isi akta keliru', 'Tanda tangan yang sudah dibubuhkan tidak dapat dibatalkan dari akun Anda. Segera hubungi Kantor PPAT; kantor dapat menyusun ulang proses tanda tangan bila diperlukan.')}
    ${faq(5, 'Posisi tanda tangan saya belum ditentukan', 'Posisi tanda tangan ditentukan oleh Kantor PPAT. Hubungi kantor melalui kontak di bawah agar posisi segera ditempatkan.')}
    <h4 class="bantu-sub">Kontak Kantor PPAT ${usulan('HE-EAWK-06')}</h4>
    <div class="bantu-kontak"><div><b>${KANTOR.nama}</b><span>Kantor yang menangani akta Anda</span></div><div><b>Telepon</b><span><a href="tel:${KANTOR.telp}">${KANTOR.telp}</a></span></div><div><b>Email</b><span><a href="mailto:${KANTOR.email}">${est(KANTOR.email)}</a></span></div></div>
    <h4 class="bantu-sub">Dukungan E-PPAT ${usulan('HE-UMUM-02')}</h4>
    <div class="bantu-kontak"><div><b>Email</b><span>${est('bantuan@contoh.id')}</span></div><div><b>Telepon / WhatsApp</b><span>${est('0800-0000-0000')}</span></div><div><b>Jam layanan</b><span>${est('Senin–Jumat, 08.00–17.00 WIB')}</span></div></div>` });
}

/* ---------------- protobar & daftar perubahan ---------------- */
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar perubahan Penandatanganan Akta (Klien)', lebar:true,
    isi:`<p>Usulan disusun dari laporan Heuristic Evaluation INA Digital, halaman 36–38 (skor halaman 46,4), gambar buktinya, dan kode serta layar live akun Klien. Urutan tanda tangan, status, dan OTP tetap seperti live; yang diubah adalah navigasi ke posisi tanda tangan, kejelasan instruksi, konfirmasi, informasi OTP, kontak kantor, pencarian daftar, dan panduan. Daftar yang sama ada di spreadsheet Backlog-HE-EPPAT-Peruri.xlsx.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup','secondary',null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => {
    const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]);
  });
});
function lihat(u) {
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  if (u.ke === 'daftar') keDaftar();
  if (u.ke === 'panduan') { S.panduan = true; try { localStorage.removeItem('eawk-panduan-tutup'); } catch (e) {} keDaftar(); }
  if (u.ke === 'giliran') buka('ORD-CONTOH-021');
  if (u.ke === 'konfirm') { buka('ORD-CONTOH-021'); konfirmTtd(); return; }
  if (u.ke === 'otp') { buka('ORD-CONTOH-022'); bukaOtp(); return; }
  if (u.ke === 'tanpa-posisi') buka('ORD-CONTOH-023');
  const el = u.sorot && $(u.sorot);
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}
$('#aturUlang').addEventListener('click', () => { AKTA = contoh(); Object.assign(S, { cari:'', grup:'', urut:'perlu', panduan:true }); try { localStorage.removeItem('eawk-panduan-tutup'); } catch (e) {} keDaftar(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
gambar();
})();
</script>
