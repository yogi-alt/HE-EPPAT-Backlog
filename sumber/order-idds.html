<!doctype html>
<html lang="id" data-brand="eppat" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backlog E-PPAT Peruri — Permohonan AJB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CSS resmi IDDS (design.inadigital.go.id/getting-started/code/js), versi dikunci -->
<link href="https://unpkg.com/@idds/styles@1.6.38/dist/index.min.css" rel="stylesheet">
<!-- Brand mode E-PPAT (brand-eppat-idds/eppat.css) -->
<style id="brand-eppat">
__EPPAT_CSS__

/* Bantuan dalam IDDS Drawer + Accordion */
.ina-drawer__content .bantu-langkah{margin:4px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.ina-drawer__content .bantu-langkah li{margin-bottom:8px}
.ina-drawer__content > p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.ina-drawer__content .bantu-sub{margin:20px 0 8px}
.ina-drawer__content .bantu-kontak{grid-template-columns:1fr}
.ina-drawer__content .ina-accordion{border-bottom:1px solid var(--ina-stroke-primary)}
.ina-drawer__content .ina-accordion__body p{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}

.judul-halaman{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.judul-halaman .judul-kiri{min-width:0}
</style>
<style id="order-css">
/* ===== Order AJB — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 23–24 (HE-ORDER-01…05)
   Kerangka & teks mengikuti layar live Peruri (dilihat 23 Okt 2026, akun Asisten). ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ina-content-primary);background:var(--ina-background-secondary);-webkit-font-smoothing:antialiased}

/* protobar (khusus prototipe) */
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#0f1a17;color:#E6EDEA;font-size:12px;position:relative;z-index:60}
.protobar a{color:#E6EDEA;text-decoration:none;border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:500 11px Inter,sans-serif}
.protobar b{color:#fff}
.protobar .sep{opacity:.35}
.protobar button.pil{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
.protobar button.pil[aria-pressed="true"]{background:#3D6B5E;border-color:#3D6B5E;color:#fff}
.protobar .kanan{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
.protobar .utama{background:#3D6B5E!important;border-color:#3D6B5E!important;color:#fff!important;font-weight:600!important}
.tag-usulan{display:none!important;align-items:center;font:600 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.penanda .tag-usulan{display:inline-flex!important}
body.penanda .ditandai{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px;border-radius:10px}
.sorot{outline:3px solid #2563EB!important;outline-offset:4px;border-radius:12px}

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:var(--eppat-sidebar-icon)}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu warna (pola backlog Perdana Niaga) — nanti dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:#C2BB4B;--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.ava{width:32px;height:32px;font:600 12px Inter,sans-serif;background:var(--ina-primary-primary)!important;color:#fff!important;border-color:var(--ina-primary-primary)!important}
.uname{display:block;font:600 12px/14px Inter,sans-serif;color:var(--ina-primary-primary)}
.urole{font:400 10px Inter,sans-serif;color:var(--ina-content-secondary);letter-spacing:1.4px;text-transform:uppercase}
.content{flex:1;background-color:var(--ina-background-secondary);__BG__}
.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}

/* daftar order */
.daftar-atas{display:flex;justify-content:flex-end;margin-top:20px}
.saring{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end;margin-top:16px}
.saring .ina-text-field__label{display:block}
.saring .cari-wadah .ina-input-search{width:100%;margin-top:6px} /* IDDS Input Search, sama dengan Minuta & Verifikasi */
.tabel-wadah{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tabel-gulir{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tabel-wadah .ina-table{border:0;border-radius:0}
table.tb td{vertical-align:middle}
table.tb td .kd{font-weight:600;color:var(--ina-primary-primary);cursor:pointer}
table.tb td .kc{font-size:12px;color:var(--ina-content-secondary)}
table.tb tr.klik{cursor:pointer}
table.tb tr.klik:hover td{background:var(--ina-primary-25)}
.aksi-baris{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kosong{padding:28px;text-align:center;color:var(--ina-content-secondary)}
.halaman{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ina-stroke-primary);font-size:13px;color:var(--ina-content-secondary)}
.halaman > span{white-space:nowrap}
[data-merah]{color:var(--ina-negative-600)!important}
.tb .ina-table__cell,.tb .ina-table__header-cell{padding:12px 16px}
.tb .ina-table__cell{white-space:normal}
.lengkap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lengkap.ok{color:var(--ina-content-positive)}
.lengkap.kurang{color:var(--ina-content-secondary)}
.lengkap svg{flex:none}

/* detail order */
.det-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kepala .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);margin-top:12px}
.det-kepala h2{margin:2px 0 0;font:600 20px/28px Inter,sans-serif}
.status-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px 28px}
.status-kartu .ina-stepper{align-items:flex-start;min-height:92px;padding:4px 64px 0}
.status-kartu .ina-stepper__separator{align-self:flex-start;margin-top:11px}
.status-kartu .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.status-kaki{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ina-stroke-primary);margin-top:8px;padding-top:16px}
.status-kaki p{margin:0;font-size:14px;color:var(--ina-content-secondary)}
.status-kaki p b{color:var(--ina-content-primary)}
.status-kaki .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-kaki .alasan{font-size:12.5px;color:var(--ina-content-secondary)}
.syarat{margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.syarat h4{margin:0 0 10px;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syarat h4 .hit{font-weight:500;color:var(--ina-content-secondary)}
.syarat ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.syarat li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.syarat li .ik{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none}
.syarat li.ok .ik{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.syarat li.kurang .ik{background:var(--ina-warning-100);color:var(--ina-warning-600)}
.syarat li.ok span.t{color:var(--ina-content-secondary)}
.syarat li .ina-button{padding:0;height:auto;min-height:0}
.syarat-alert{margin-top:16px}
.syarat-alert .ina-alert__description{display:flex;flex-direction:column;gap:10px}
.syarat-daftar{display:flex;flex-wrap:wrap;gap:8px 16px}
.syarat-item{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-badge{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-button{padding:0 4px}
.langkah-berikut{color:var(--ina-content-primary)}
.info-baris{margin-top:16px}
.info-baris .ina-alert__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
.info-baris .ina-alert__text-section{flex:1;min-width:220px}

.tab-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tab-kartu > .ina-tab-horizontal{padding:0 12px;border-bottom:1px solid var(--ina-stroke-primary)}
.tab-kartu .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center}
.tab-kartu .tanda{font:600 11px Inter,sans-serif;border-radius:999px;padding:1px 7px}
.tab-kartu .tanda.ok{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.tab-kartu .tanda.kurang{background:var(--ina-warning-100);color:var(--ina-warning-700)}
.tab-kartu .tanda.netral{background:var(--ina-neutral-100);color:var(--ina-content-secondary)}
.tab-isi{padding:20px}
.tab-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tab-bar p{margin:0;font-size:13px;color:var(--ina-content-secondary)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-field textarea.ina-text-field__input{min-height:80px;resize:vertical;padding:0}
.f-kaki{display:flex;justify-content:flex-end;margin-top:16px}
.tb .nm{font-weight:500}
.tb .sub2{font-size:12px;color:var(--ina-content-secondary)}
.kunci{margin-bottom:16px}

/* dialog */
.ina-modal__body p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary)}
.seg button{border:0;border-radius:7px;background:transparent;padding:7px 14px;font:500 14px Inter,sans-serif;color:var(--ina-content-secondary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ina-primary-primary);color:#fff}
.fld{margin-bottom:16px}
.fld > .ina-text-field__label{display:flex;align-items:center;gap:6px}
.select-wadah{position:relative;display:block;width:100%}
.select-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:0;max-height:240px}
.cari-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.1);padding:4px;max-height:220px;overflow:auto}
.cari-panel button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.cari-panel button:hover{background:var(--ina-background-tertiary)}
.cari-panel small{display:block;font-size:12px;color:var(--ina-content-secondary)}
.kartu-pihak{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px;background:var(--ina-background-secondary);font-size:13.5px}
.kartu-pihak b{display:block;font-size:14px;margin-bottom:6px}
.kartu-pihak dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.kartu-pihak dt{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu-pihak dd{margin:0}
.belum-ada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ina-primary-25);border:1px solid var(--ina-primary-100);font-size:13px}
.ringkas-kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:12px 0 14px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas-kv dt{color:var(--ina-content-secondary)}
.ringkas-kv dd{margin:0;font-weight:500}
.cek-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;cursor:pointer}

.daftar-ubah{display:flex;flex-direction:column;gap:10px}
.daftar-ubah .it{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px}
.daftar-ubah .it .a{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daftar-ubah .it code{font:600 11.5px ui-monospace,Menlo,monospace;color:#2563EB}
.daftar-ubah .it b{font-size:14px}
.daftar-ubah .it p{margin:6px 0 4px;font-size:13px;line-height:19px;color:var(--ina-content-primary)}
.daftar-ubah .it .lama{font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.bantu-langkah{margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.bantu-langkah li{margin-bottom:6px}
.bantu-sub{margin:18px 0 8px;font:600 14px Inter,sans-serif;display:flex;align-items:center}
.bantu-faq{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.bantu-faq summary{cursor:pointer;font-weight:500}
.bantu-faq p{margin:8px 0 0!important}
.bantu-kontak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bantu-kontak div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.bantu-kontak b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.bantu-kontak span{font-size:14px}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.toast-wadah{position:fixed;bottom:24px;right:24px;z-index:100;max-width:calc(100vw - 32px)}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--ina-stroke-secondary);color:var(--ina-content-secondary);font:600 10px Inter,sans-serif;cursor:help;background:transparent;padding:0}
.ina-tooltip__bubble{max-width:260px;white-space:normal}

@media (max-width:1024px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,26,23,.45);z-index:35;opacity:0;pointer-events:none;transition:.22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .syarat ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  header.top{padding:0 16px}
  .user .txt,#bukaBantuan span{display:none}
  .page{padding:20px 16px 40px}
  h1{font-size:23px;line-height:32px}
  .saring{grid-template-columns:1fr}
  .f-grid,.syarat ul,.kartu-pihak dl,.bantu-kontak{grid-template-columns:1fr}
  .status-kartu{padding:18px 16px}
  .status-kartu .stepper-h{display:none}
  .status-kartu .stepper-v{display:flex!important;padding:4px 0}
  .ringkas-kv{grid-template-columns:1fr;gap:2px}
  .protobar .kanan{margin-left:0}
  table.tb thead{display:none}
  table.tb tr{display:block;border-top:1px solid var(--ina-stroke-primary);padding:8px 0}
  table.tb td{display:block;border:0;padding:4px 16px}
  .aksi-baris{justify-content:flex-start}
}
.status-kartu .stepper-v{display:none}
.status-kartu .stepper-v .ina-stepper__label small{display:inline;margin:0 0 0 8px}
.status-kartu .stepper-v .ina-stepper__separator{min-height:24px;height:24px}
</style>
</head>
<body>

<div class="protobar">
  <a href="index.html">&#9776; Daftar prototipe</a>
  <span class="sep">&bull;</span><b>Permohonan AJB</b><span class="sep">&bull;</span><span>Peran: Asisten PPAT</span>
  <span class="kanan">
    <button class="pil" id="aturUlang">Atur ulang contoh</button>
    <button class="pil" id="sakelarPenanda" aria-pressed="false">Tandai usulan</button>
    <button class="pil utama" id="bukaUbah">Daftar perubahan (10)</button>
  </span>
</div>

<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="__LOGO__" alt="E-PPAT"></div>
    <div class="ina-card ina-card--variant-basic kantor"><div class="ina-card__content"><div>
      <div class="eyebrow">Kantor Notaris &amp; PPAT</div>

function syaratData(o) {
  const s = [
    { k:'kontak', l:'Narahubung', ok: (o.kontak.nama || '').trim().length >= 2, tab:'kontak' },
    { k:'penjual', l:'Penjual', ok: hitung(o, 'PENJUAL') >= 1, tab:'pihak', tipe:'PENJUAL' },
    { k:'pembeli', l:'Pembeli', ok: hitung(o, 'PEMBELI') >= 1, tab:'pihak', tipe:'PEMBELI' },

function stepper(o, vertikal) {
  const pos = URUT.indexOf(o.status);

}
function langkahBerikut(o, sy) {
  if (o.status === 'SELESAI') return 'Akta sudah selesai. Salinan akta tersedia di menu Salinan Akta.';
  const kurang = sy.daftar.filter(x => !x.ok);
  if (!kurang.length) return `Semua syarat terpenuhi. Klik <b>Pindah ke ${ST[sy.ke].l}</b> untuk melanjutkan.`;
  const x = kurang[0];
  if (x.verif) return `Selesaikan ${kurang.map(y => y.l.replace('Verifikasi ', '')).join(', ')} di menu Verifikasi Berkas sebelum penyusunan.`;
  if (x.minuta) return 'Minuta akta belum final. Minta PPAT memfinalisasi minuta di menu Penyusunan Akta sebelum permohonan ditandai Selesai.';
  if (x.k === 'kontak') return 'Lengkapi nama narahubung di tab Narahubung.';
  if (x.k === 'objek') return 'Tambahkan objek tanah di tab Objek.';
  return `Tambahkan ${x.k === 'saksi' ? 'saksi' : x.l.toLowerCase()} di tab Para Pihak.`;
}
function kartuStatus(o) {
  const sy = syarat(o), siap = sy.daftar.every(x => x.ok), kurang = sy.daftar.filter(x => !x.ok).length;
  const tombolPindah = !sy.ke ? tombol('Selesai', 'secondary', 'md', 'disabled', ik('centang', 16))
    : tombol(`Pindah ke ${ST[sy.ke].l}`, 'primary', 'md', `id="pindah" ${siap ? '' : 'disabled aria-disabled="true"'}`, ik('panah', 16));
  return `<div class="status-kartu">
    ${stepper(o, false)}${stepper(o, true)}
    ${(() => {
      /* syarat & langkah berikutnya memakai IDDS Alert + Badge (HE-ORDER-01, HE-ORDER-05) */
      const tampilSyarat = sy.ke && (sy.daftar.length > 1 || !siap || o.status === 'DRAFTING');
      const jenis = o.status === 'SELESAI' ? 'info' : siap ? 'success' : 'caution';
      const judul = tampilSyarat ? `Syarat pindah ke ${ST[sy.ke].l} · ${sy.daftar.length - kurang} dari ${sy.daftar.length} terpenuhi${usulan('HE-ORDER-01')}` : '';
      const daftar = tampilSyarat ? `<div class="syarat-daftar">${sy.daftar.map(x => `<span class="syarat-item">${badge(`${ik(x.ok ? 'centang' : 'seru', 12)} ${x.l}`, x.ok ? 'success' : 'warning')}${x.ok ? '' : x.verif ? tombol('Verifikasi Sekarang', 'link', 'sm', 'data-verif') : x.minuta ? tombol('Buka Minuta', 'link', 'sm', 'data-minuta') : tombol('Lengkapi', 'link', 'sm', `data-lengkapi="${x.k}"`)}</span>`).join('')}</div>` : '';
      return `<div class="syarat-alert ditandai" id="syarat">${alert(jenis, judul, `${daftar}<div class="langkah-berikut" id="langkahBerikut"><b>Langkah berikutnya:</b> ${langkahBerikut(o, sy)}${usulan('HE-ORDER-05')}${o.status === 'SIAP' || o.status === 'DRAFTING' ? usulan('HE-ORDER-08') : ''}</div>`)}</div>`;
    })()}
    <div class="status-kaki"><p>Status saat ini: <b>${ST[o.status].l}</b></p>
      <div class="kanan">${sy.ke && !siap ? `<span class="alasan">Lengkapi ${kurang} syarat di atas untuk melanjutkan.</span>` : ''}${tombolPindah}</div></div>
  </div>`;
}
function tandaTab(o, t) {
  if (t === 'kontak') return (o.kontak.nama || '').trim().length >= 2 ? kecil('Lengkap', 'success') : kecil('Kurang', 'warning');
  if (t === 'pihak') { const n = syaratData(o).filter(x => x.tab === 'pihak' && !x.ok).length; return n ? kecil(`Kurang ${n}`, 'warning') : kecil('Lengkap', 'success'); }
  if (t === 'objek') return o.objek.length ? kecil(`${o.objek.length} objek`, 'success') : kecil('Belum ada', 'warning');
  return kecil(`${o.dok.filter(d => d.file).length}/${o.dok.length} terunggah`, 'neutral');
}
function layarDetail() {
  const o = ord(), kunci = o.status === 'SELESAI';
  const TIPTAB = { kontak:'Orang yang dapat dihubungi kantor untuk permohonan ini.', pihak:'Penjual, pembeli, saksi, dan pihak lain yang tercantum dalam akta.', objek:'Tanah atau bangunan yang diperjualbelikan.', dokumen:'Berkas pendukung seperti KTP, sertifikat, dan PBB.' };
  const tabs = [['kontak','Narahubung'],['pihak','Para Pihak'],['objek','Objek'],['dokumen','Dokumen']];
  return `
    <nav class="ina-breadcrumb" aria-label="Breadcrumb"><ol class="ina-breadcrumb__list"><li class="ina-breadcrumb__item"><a href="#" class="ina-breadcrumb__link"><span class="ina-breadcrumb__text">Layanan</span></a><span class="ina-breadcrumb__separator" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></li><li class="ina-breadcrumb__item"><span class="ina-breadcrumb__link ina-breadcrumb__link--active"><span class="ina-breadcrumb__text">Permohonan AJB</span></span></li></ol></nav>
    <h1>Permohonan AJB</h1><p class="sub">Kelola permintaan Akta Jual Beli, mulai dari pengajuan klien sampai akta selesai.</p>
    <div class="det-kepala"><div>${tombol('Kembali', 'secondary', 'sm', 'id="kembali"', ik('kiri', 14))}
      <div class="kode">${o.kode}</div><h2>AJB - Akta Jual Beli</h2><p class="sub">Dibuat ${o.tanggal}</p></div>
      ${o.status === 'DRAFTING' ? tombol('Buka Penyusunan Akta', 'primary', 'md', 'data-luar="Penyusunan Akta"', ik('edit', 16)) : ''}</div>
    ${kartuStatus(o)}
    ${o.status === 'SIAP' && !verifSelesai(o) ? `<div class="info-baris">${alert('info', '', 'Permohonan sudah <b>Siap</b> dan masuk antrean <b>Verifikasi Berkas</b> — periksa para pihak, objek tanah, dan harga sebelum penyusunan.', tombol('Verifikasi Sekarang', 'primary', 'sm', 'data-verif', ik('tameng', 14)))}</div>` : ''}
    <div class="tab-kartu ditandai">
      <div class="ina-tab-horizontal ina-tab-horizontal--use-brand-color"><div class="ina-tab-horizontal__container" role="tablist">${tabs.map(([kk, t]) =>
        `<button type="button" role="tab" data-tab="${kk}" aria-selected="${S.tab === kk}" class="ina-tab-horizontal__tab ina-tab-horizontal__tab--size-md ina-tab-horizontal__tab--variant-outline ${S.tab === kk ? 'ina-tab-horizontal__tab--selected' : ''}"><span title="${TIPTAB[kk]}">${t}</span>${kunci ? '' : tandaTab(o, kk)}</button>`).join('')}${usulan('HE-ORDER-04')}</div></div>
      <div class="tab-isi">
        ${kunci ? `<div class="kunci">${alert('info', '', `${ik('kunci', 14)} Akta sudah <b>selesai</b> — data permohonan dikunci (hanya dapat dilihat). Untuk salinan, buka menu <b>Salinan Akta</b>.`)}</div>` : ''}
        ${S.tab === 'kontak' ? tabKontak(o, kunci) : S.tab === 'pihak' ? tabPihak(o, kunci) : S.tab === 'objek' ? tabObjek(o, kunci) : tabDok(o, kunci)}
      </div>
    </div>`;
}
const tf = (id, l, v, ph = '', wajib = false, dis = false, tipe = 'text') => `<div class="ina-text-field"><label class="ina-text-field__label" for="${id}">${l}${wajib ? '<span class="ina-text-field__required">*</span>' : ''}</label>
  <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md ${dis ? 'ina-text-field__wrapper--disabled' : ''}"><input id="${id}" type="${tipe}" class="ina-text-field__input" value="${esc(v)}" placeholder="${esc(ph)}" ${dis ? 'disabled' : ''}></div></div>`;

    ${kunci ? '' : `<div class="f-kaki">${tombol('Simpan Narahubung', 'primary', 'md', 'id="simpanKontak"', ik('simpan', 16))}</div>`}`;
}

  const kurang = syaratData(o).filter(x => x.tab === 'pihak' && !x.ok).map(x => x.l);

    <div class="tabel-wadah" style="margin-top:0"><div class="tabel-gulir"><div class="ina-table"><table class="ina-table__container tb"><thead class="ina-table__header"><tr><th class="ina-table__header-cell">Tipe</th><th class="ina-table__header-cell">Bentuk</th><th class="ina-table__header-cell">Nama · NIK</th><th class="ina-table__header-cell ditandai" id="kolKontak">Kontak (email · HP) ${usulan('HE-ORDER-06')}</th><th class="ina-table__header-cell"></th></tr></thead>

      <td class="ina-table__cell"><div>${esc(p.email) || '—'}</div><div class="sub2">${p.hp ? esc(p.hp) : 'No. HP belum diisi'}</div></td>
      <td class="ina-table__cell">${kunci ? '' : `<div class="aksi-baris">${tombol('Ubah', 'secondary', 'sm', `data-luar="Ubah pihak"`)}${tombol('Hapus', 'tertiary', 'sm', `data-hapus-pihak="${i}" data-merah`)}</div>`}</td></tr>`).join('')
      : `<tr><td colspan="5" class="ina-table__empty-cell kosong">Belum ada para pihak.</td></tr>`}</tbody></table></div></div></div>`;

function tabObjek(o, kunci) {
  return `<div class="tab-bar"><p>${o.objek.length || kunci ? '' : 'Tambahkan minimal satu objek tanah.'}</p>${kunci ? '' : tombol('Tambah Objek', 'primary', 'md', 'id="tambahObjek"', ik('tambah', 16))}</div>
    <div class="tabel-wadah" style="margin-top:0"><div class="tabel-gulir"><div class="ina-table"><table class="ina-table__container tb"><thead class="ina-table__header"><tr><th class="ina-table__header-cell">Hak</th><th class="ina-table__header-cell">Sertifikat / NIB</th><th class="ina-table__header-cell">Luas</th><th class="ina-table__header-cell">Lokasi</th><th class="ina-table__header-cell ditandai" id="kolHarga">Harga jual beli ${usulan('HE-ORDER-07')}</th><th class="ina-table__header-cell"></th></tr></thead>
    <tbody class="ina-table__body">${o.objek.length ? o.objek.map((x, i) => `<tr class="ina-table__row"><td class="ina-table__cell">${badge(x.hak, 'neutral')}</td><td class="ina-table__cell"><div class="nm">${esc(x.sertifikat)}</div><div class="sub2">NIB ${esc(x.nib)}</div></td><td class="ina-table__cell">${esc(x.luas)} m²</td><td class="ina-table__cell">${esc(x.lokasi || '-')}</td><td class="ina-table__cell">${x.harga ? 'Rp' + rupiah(x.harga) : kecil('Belum diisi', 'warning')}</td>
      <td class="ina-table__cell">${kunci ? '' : `<div class="aksi-baris">${tombol('Ubah', 'secondary', 'sm', 'data-luar="Ubah objek"')}${tombol('Hapus', 'tertiary', 'sm', `data-hapus-objek="${i}" data-merah`)}</div>`}</td></tr>`).join('')
      : `<tr><td colspan="6" class="ina-table__empty-cell kosong">Belum ada objek.</td></tr>`}</tbody></table></div></div></div>`;
}
function tabDok(o, kunci) {

/* ---------------- gambar ---------------- */
function gambar() { gambarNav(); $('#halaman').innerHTML = S.layar === 'daftar' ? layarDaftar() : layarDetail(); pasangPanduan(); }
function buka(kode, tab = 'kontak') { S.layar = 'detail'; S.aktif = kode; S.tab = tab; gambar(); window.scrollTo({ top:0 }); }

/* ---------------- interaksi ---------------- */
const H = $('#halaman');
H.addEventListener('input', e => { if (e.target.id === 'cariOrder') { S.cari = e.target.value; const p = e.target.selectionStart; gambar(); const n = $('#cariOrder'); n.focus(); n.setSelectionRange(p, p); } });
H.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-pilih="filter"]')) { S.pilihBuka = S.pilihBuka === 'filter' ? null : 'filter'; gambar(); return; }
  const f = t.closest('[data-filter]'); if (f) { S.filter = f.dataset.filter; S.pilihBuka = null; gambar(); return; }
  if (t.closest('#muatUlang')) { toast('Daftar permohonan dimuat ulang.'); return; }
  const ho = t.closest('[data-hapus-order]'); if (ho) { e.stopPropagation(); konfirmHapus(`Hapus permohonan ${ho.dataset.hapusOrder}?`, 'Permohonan dan seluruh datanya akan dihapus. Tindakan ini tidak dapat dibatalkan.', () => { ORDER = ORDER.filter(o => o.kode !== ho.dataset.hapusOrder); gambar(); toast('Permohonan dihapus.', 'positive'); }); return; }
  const b = t.closest('[data-buka]'); if (b) { buka(b.dataset.buka); return; }
  if (t.closest('#buatOrder')) { dialogBuatOrder(); return; }
  if (t.closest('#kembali')) { S.layar = 'daftar'; gambar(); return; }
  const tb = t.closest('[data-tab]'); if (tb) { S.tab = tb.dataset.tab; gambar(); return; }
  const lk = t.closest('[data-lengkapi]'); if (lk) { const x = syaratData(ord()).find(y => y.k === lk.dataset.lengkapi); S.tab = x.tab; gambar(); if (x.tipe) dialogPihak(x.tipe); else if (x.tab === 'objek') dialogObjek(); else document.getElementById('kNama')?.focus(); return; }
  if (t.closest('[data-verif]')) { const v = ord().verif; dialog({ judul:'Verifikasi order', isi:`<p>Verifikasi dilakukan di menu <b>Verifikasi Berkas</b> dalam tiga bagian. Status saat ini:</p><dl class="ringkas-kv"><dt>Para pihak (CA)</dt><dd>${v.pihak ? 'Terverifikasi' : 'Belum'}</dd><dt>Objek tanah</dt><dd>${v.objek ? 'Terverifikasi' : 'Belum'}</dd><dt>Harga (NJOP)</dt><dd>${v.harga ? 'Terverifikasi' : 'Belum'}</dd></dl><p>Di prototipe ini, verifikasi dapat ditandai selesai untuk mensimulasikan alur.</p>`, tombol:[['Batal','tertiary',null],['Buka Prototipe Verifikasi','secondary',() => { location.href = 'Backlog-HE-VERIF-Prototype.html'; }],['Tandai semua terverifikasi','primary',() => { ord().verif = V(true, true, true); gambar(); toast('Verifikasi selesai (simulasi).', 'positive'); }]] }); return; }
  if (t.closest('[data-minuta]')) { dialog({ judul:'Minuta akta belum final', isi:'<p>Minuta disusun Asisten di menu <b>Penyusunan Akta</b>, lalu PPAT memfinalisasinya dengan nomor dan tanggal akta. Setelah final, permohonan dapat ditandai Selesai.</p><p>Di prototipe ini, finalisasi dapat disimulasikan.</p>', tombol:[['Batal','tertiary',null],['Buka Prototipe Penyusunan Akta','secondary',() => { location.href = 'Backlog-HE-MINUTA-Prototype.html'; }],['Tandai minuta final (simulasi)','primary',() => { ord().minuta = true; gambar(); toast('Minuta ditandai final (simulasi).', 'positive'); }]] }); return; }
  if (t.closest('#pindah')) { konfirmPindah(); return; }
  if (t.closest('#simpanKontak')) { const o = ord(); const nm = $('#kNama').value.trim(); if (nm.length < 2) { toast('Nama narahubung minimal 2 karakter.', 'destructive'); return; } Object.assign(o.kontak, { nama:nm, hp:$('#kHp').value.trim(), email:$('#kEmail').value.trim(), catatan:$('#kCat').value }); gambar(); toast('Narahubung tersimpan.', 'positive'); return; }
  const tp = t.closest('[data-tambah-pihak]'); if (tp) { dialogPihak(); return; }
  const hp = t.closest('[data-hapus-pihak]'); if (hp) { const o = ord(), p = o.pihak[+hp.dataset.hapusPihak]; konfirmHapus('Hapus pihak?', `Hapus <b>${esc(p.nama)}</b> (${TIPE[p.tipe]}) dari daftar para pihak? Tindakan ini tidak dapat dibatalkan.`, () => { o.pihak.splice(+hp.dataset.hapusPihak, 1); gambar(); toast('Pihak dihapus.', 'positive'); }); return; }
  if (t.closest('#tambahObjek')) { dialogObjek(); return; }
  const hob = t.closest('[data-hapus-objek]'); if (hob) { konfirmHapus('Hapus objek?', 'Hapus objek dari permohonan? Tindakan ini tidak dapat dibatalkan.', () => { ord().objek.splice(+hob.dataset.hapusObjek, 1); gambar(); toast('Objek dihapus.', 'positive'); }); return; }
  if (t.closest('#tambahDok')) { dialogDok(); return; }
  const ug = t.closest('[data-unggah]'); if (ug) { const d = ord().dok[+ug.dataset.unggah]; d.file = d.jenis.toLowerCase() + '-contoh.pdf'; d.ukuran = '240 KB'; gambar(); toast(`Dokumen "${d.file}" terunggah.`, 'positive'); return; }
  const hd = t.closest('[data-hapus-dok]'); if (hd) { const d = ord().dok[+hd.dataset.hapusDok]; konfirmHapus('Hapus dokumen?', `Hapus dokumen <b>${d.jenis}</b> dari permohonan? Tindakan ini tidak dapat dibatalkan.`, () => { ord().dok.splice(+hd.dataset.hapusDok, 1); gambar(); toast('Dokumen dihapus.', 'positive'); }); return; }
  const lu = t.closest('[data-luar]'); if (lu) { toast(`${lu.dataset.luar} tidak termasuk dalam prototipe ini.`); return; }
});
document.addEventListener('click', e => { if (S.pilihBuka === 'filter' && !e.target.closest('#f-filter')) { S.pilihBuka = null; gambar(); } });

/* ---------------- pindah status (HE-ORDER-01, HE-ORDER-02) ---------------- */
function konfirmPindah() {
  const o = ord(), sy = syarat(o), ke = sy.ke;
  if (!ke || !sy.daftar.every(x => x.ok)) return;
  const DAMPAK = {
    PENGUMPULAN:'Kantor mulai mengumpulkan data para pihak, objek, dan dokumen.',
    SIAP:'Permohonan masuk antrean Verifikasi Berkas. Setelah ini, menambah, mengubah, atau menghapus pihak akan mengembalikan permohonan ke tahap Verifikasi.',
    DRAFTING:'Pembuatan minuta akta dimulai di menu Penyusunan Akta.'
  };
  if (ke === 'SELESAI') {
    dialog({ judul:'Tandai permohonan Selesai?', isi:`<p>Setelah ditandai Selesai, <b>data permohonan dikunci</b> dan status <b>tidak dapat dikembalikan</b>. Salinan akta dikelola di menu Salinan Akta.</p>
      <dl class="ringkas-kv"><dt>Kode permohonan</dt><dd>${o.kode}</dd><dt>Para pihak</dt><dd>${o.pihak.length} pihak</dd><dt>Objek</dt><dd>${o.objek.length} objek</dd></dl>
      <label class="ina-checkbox cek-setuju" id="labelSetuju"><input type="checkbox" id="setujuSelesai" class="ina-checkbox__input peer"><div class="ina-checkbox__box ina-checkbox__box--unchecked"></div><div class="ina-checkbox__content"><span class="ina-checkbox__label">Saya sudah memastikan minuta akta final dan data permohonan benar.</span></div></label>${usulan('HE-ORDER-02')}`,
      tombol:[['Batal','secondary',null],['Tandai Selesai','primary',() => lanjut()]], kunciUtama:'#setujuSelesai' });
    return;
  }
  dialog({ judul:`Pindah ke ${ST[ke].l}?`, isi:`<p>Status permohonan <b>${o.kode}</b> akan berubah dari <b>${ST[o.status].l}</b> ke <b>${ST[ke].l}</b>.</p><p>${DAMPAK[ke]}</p><p>Status tidak dapat dikembalikan ke tahap sebelumnya.${usulan('HE-ORDER-02')}</p>`,
    tombol:[['Batal','secondary',null],[`Pindah ke ${ST[ke].l}`,'primary',() => lanjut()]] });
  function lanjut() { o.status = ke; gambar(); toast(`Status permohonan berpindah ke ${ST[ke].l}.`, 'positive'); }
}

/* ---------------- tambah pihak (HE-ORDER-03) ---------------- */
function tipeBerikut(o) { const x = syaratData(o).find(y => y.tab === 'pihak' && !y.ok); return x ? x.tipe : 'LAINNYA'; }
function dialogPihak(tipeAwal) {
  const o = ord();
  const F = { tipe: tipeAwal || tipeBerikut(o), bentuk:'Perorangan', harta:'SENDIRI', klien:null, cari:'', sumber:'external', buka:null, galat:'' };
  let jumlahTambah = 0;
  const isi = () => {
    const kurang = syaratData(o).filter(x => x.tab === 'pihak' && !x.ok).map(x => x.l);
    const utama = F.tipe === 'PENJUAL' || F.tipe === 'PEMBELI';
    const sudah = new Set(o.pihak.map(p => p.id));
    const hasil = KLIEN.filter(c => !sudah.has(c.id) && (!F.cari || (c.nama + c.email).toLowerCase().includes(F.cari.toLowerCase())));
    return `
      <div class="belum-ada">${ik('info', 16)}<span>${kurang.length ? `Belum ada: <b>${kurang.join(', ')}</b>` : 'Semua pihak yang dibutuhkan sudah ada.'}</span>${jumlahTambah ? `<span style="margin-left:auto;color:var(--ina-content-positive)">${jumlahTambah} pihak ditambahkan</span>` : ''}${usulan('HE-ORDER-03')}</div>
      <div class="fld ina-select-dropdown select-wadah"><label class="ina-text-field__label">Tipe Pihak<span class="ina-text-field__required">*</span>${tip('Penjual dan pembeli adalah pihak utama. Saksi dibutuhkan 2 orang. Pasangan ditambahkan bila penjual atau pembeli memilih harta bersama.')}</label>
        <button type="button" class="ina-select-dropdown__trigger ina-select-dropdown__trigger--size-md" data-dp="tipe"><span class="ina-select-dropdown__trigger-text ina-select-dropdown__trigger-text--selected">${TIPE[F.tipe]}</span>${ik('bawah')}</button>
        ${F.buka === 'tipe' ? `<div class="ina-select-dropdown__panel"><div class="ina-select-dropdown__options">${Object.entries(TIPE).map(([v, t]) => `<button type="button" class="ina-select-dropdown__option ${v === F.tipe ? 'ina-select-dropdown__option--selected-single' : ''}" data-dtipe="${v}">${t}</button>`).join('')}</div></div>` : ''}</div>
      ${utama ? `<div class="fld"><label class="ina-text-field__label">Bentuk Pihak<span class="ina-text-field__required">*</span>${tip('Pilih Badan Hukum (PT) bila pihak adalah perusahaan.')}</label>${grup([['Perorangan','Perorangan'],['Badan Hukum (PT)','Badan Hukum (PT)']], F.bentuk, 'dbentuk')}</div>
      <div class="fld"><label class="ina-text-field__label">Jenis Harta<span class="ina-text-field__required">*</span>${tip('Harta Bersama berarti objek dimiliki bersama suami/isteri. Pasangannya wajib ditambahkan sebagai pihak Pasangan untuk memberi persetujuan.')}</label>${grup([['SENDIRI','Harta Sendiri'],['BERSAMA','Harta Bersama']], F.harta, 'dharta')}</div>` : ''}
      ${F.tipe === 'SAKSI' ? `<div class="fld"><label class="ina-text-field__label">Sumber Saksi${tip('Saksi bisa dari luar kantor (klien terdaftar) atau dari pegawai kantor PPAT.')}</label>${grup([['external','Eksternal (Klien)'],['internal','Internal (Asisten)']], F.sumber, 'dsumber')}</div>` : ''}

          ${F.buka === 'klien' ? `<div class="ina-select-dropdown__panel cari-panel"><div class="ina-select-dropdown__options">${hasil.length ? hasil.map(c => `<button type="button" class="ina-select-dropdown__option" data-dklien="${c.id}"><span>${esc(c.nama)}<small>${esc(c.email)}</small></span>${c.nik ? '' : badge('NIK kosong', 'warning')}</button>`).join('') : '<div class="kosong" style="padding:10px">Tidak ada pengguna klien yang cocok.</div>'}</div></div>` : ''}
          <div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text ${F.galat ? 'ina-text-field__helper-text--error' : ''}">${F.galat || 'Pihak harus terdaftar sebagai pengguna (fungsi Klien). Data diri terisi otomatis dari profilnya.'}</div></div>`}

    jumlahTambah++; toast(`${TIPE[F.tipe]} ditambahkan. Lanjutkan menambah pihak berikutnya.`, 'positive');

    const db = t.closest('[data-dbentuk]'); if (db) { F.bentuk = db.dataset.dbentuk; segar(); return; }

/* HE-ORDER-07: satu formulir berkelompok, tanda wajib, harga + terbilang, galat per isian */
function rupiah(n) { return String(n).replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function terbilang(n) {
  const S = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const t = x => x < 12 ? S[x] : x < 20 ? t(x - 10) + ' belas' : x < 100 ? t(Math.floor(x / 10)) + ' puluh ' + t(x % 10) : x < 200 ? 'seratus ' + t(x - 100) : x < 1000 ? t(Math.floor(x / 100)) + ' ratus ' + t(x % 100)
    : x < 2000 ? 'seribu ' + t(x - 1000) : x < 1e6 ? t(Math.floor(x / 1000)) + ' ribu ' + t(x % 1000) : x < 1e9 ? t(Math.floor(x / 1e6)) + ' juta ' + t(x % 1e6) : x < 1e12 ? t(Math.floor(x / 1e9)) + ' miliar ' + t(x % 1e9) : t(Math.floor(x / 1e12)) + ' triliun ' + t(x % 1e12);
  return t(n).replace(/\s+/g, ' ').trim();
}

      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md" data-i="${i}" ${bahaya && i === tb.length - 1 ? 'style="background:var(--ina-negative-600);border-color:var(--ina-negative-600)"' : ''}>${t}</button>`).join('')}</div></div></div></div>`;
  const utama = L.querySelector('.ina-modal__footer .ina-button:last-child');
  if (kunciUtama) { utama.disabled = true; const cb = L.querySelector(kunciUtama); cb.addEventListener('change', e => { utama.disabled = !e.target.checked; const bx = cb.nextElementSibling; bx.classList.toggle('ina-checkbox__box--checked', e.target.checked); bx.classList.toggle('ina-checkbox__box--unchecked', !e.target.checked); bx.innerHTML = e.target.checked ? ik('centang', 12) : ''; }); }
  L.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i;
    if (i < 0) { L.innerHTML = ''; return; }
    const [, , fn, tahan] = tb[i];
    const r = fn ? fn() : undefined;
    if (!(tahan && r === false)) L.innerHTML = '';
  };
}

  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => {
    const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]);
  });
});
function lihat(u) {
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  if (u.ke === 'daftar') { S.layar = 'daftar'; gambar(); }
  if (u.ke === 'detail-002') buka('ORD-CONTOH-002');
  if (u.ke === 'tambah-pihak') { buka('ORD-CONTOH-002', 'pihak'); dialogPihak(); return; }
  if (u.ke === 'konfirm-selesai') { buka('ORD-CONTOH-004'); konfirmPindah(); return; }
  if (u.ke === 'pihak-003') buka('ORD-CONTOH-003', 'pihak');
  if (u.ke === 'objek-dialog') { buka('ORD-CONTOH-003', 'objek'); dialogObjek(); return; }
  if (u.ke === 'syarat-003') buka('ORD-CONTOH-003');
  const el = u.sorot && $(u.sorot);
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}
$('#aturUlang').addEventListener('click', () => { ORDER = contoh(); S.layar = 'daftar'; S.cari = ''; S.filter = ''; gambar(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
gambar();
})();
</script>
