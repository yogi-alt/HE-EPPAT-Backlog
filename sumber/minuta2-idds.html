__EPPAT_CSS__

/* Bantuan dalam IDDS Drawer + Accordion */
.ina-drawer__content .bantu-langkah{margin:4px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.ina-drawer__content .bantu-langkah li{margin-bottom:8px}
.ina-drawer__content > p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.ina-drawer__content .bantu-sub{margin:20px 0 8px}
.ina-drawer__content .bantu-kontak{grid-template-columns:1fr}
.ina-drawer__content .ina-accordion{border-bottom:1px solid var(--ina-stroke-primary)}
.ina-drawer__content .ina-accordion__body p{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}

.judul-halaman{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.judul-halaman .judul-kiri{min-width:0}

<style id="kerangka-css">
/* ===== Order AJB — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 23–24 (HE-ORDER-01…05)
   Kerangka & teks mengikuti layar live Peruri (dilihat 23 Okt 2026, akun Asisten). ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ina-content-primary);background:var(--ina-background-secondary);-webkit-font-smoothing:antialiased}

/* protobar (khusus prototipe) */
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#0f1a17;color:#E6EDEA;font-size:12px;position:relative;z-index:60}
.protobar a{color:#E6EDEA;text-decoration:none;border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:500 11px Inter,sans-serif}
.protobar b{color:#fff}
.protobar .sep{opacity:.6}
.protobar button.pil{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
.protobar button.pil[aria-pressed="true"]{background:#3D6B5E;border-color:#3D6B5E;color:#fff}
.protobar .kanan{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
.protobar .utama{background:#3D6B5E!important;border-color:#3D6B5E!important;color:#fff!important;font-weight:600!important}
.tag-usulan{display:none!important;align-items:center;font:600 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.penanda .tag-usulan{display:inline-flex!important}
body.penanda .ditandai{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px;border-radius:10px}
.sorot{outline:3px solid #2563EB!important;outline-offset:4px;border-radius:12px}

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:currentColor}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu color family dengan teks menunya (aturan warna IDDS: teks & ikon dari family yang sama) — token tetap dapat diatur dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:var(--ina-eppat-sidebar-content);--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item:hover svg,.sidebar .items a.nav-item:focus-visible svg{color:#fff}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.ava{width:32px;height:32px;font:600 12px Inter,sans-serif;background:var(--ina-primary-primary)!important;color:#fff!important;border-color:var(--ina-primary-primary)!important}
.uname{display:block;font:600 12px/14px Inter,sans-serif;color:var(--ina-primary-primary)}
.urole{font:400 10px Inter,sans-serif;color:var(--ina-content-secondary);letter-spacing:1.4px;text-transform:uppercase}
.content{flex:1;background-color:var(--ina-background-secondary);__BG__}
.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}

/* daftar order */
.daftar-atas{display:flex;justify-content:flex-end;margin-top:20px}
.saring{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end;margin-top:16px}
.saring .ina-text-field__label{display:block}
.saring .cari-wadah .ina-input-search{width:100%;margin-top:6px} /* IDDS Input Search, sama dengan Minuta & Verifikasi */
.tabel-wadah{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tabel-gulir{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tabel-wadah .ina-table{border:0;border-radius:0}
table.tb td{vertical-align:middle}
table.tb td .kd{font-weight:600;color:var(--ina-primary-primary);cursor:pointer}
table.tb td .kc{font-size:12px;color:var(--ina-content-secondary)}
table.tb tr.klik{cursor:pointer}
table.tb tr.klik:hover td{background:var(--ina-primary-25)}
.aksi-baris{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kosong{padding:28px;text-align:center;color:var(--ina-content-secondary)}
.halaman{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ina-stroke-primary);font-size:13px;color:var(--ina-content-secondary)}
.halaman > span{white-space:nowrap}
[data-merah]{color:var(--ina-negative-600)!important}
.tb .ina-table__cell,.tb .ina-table__header-cell{padding:12px 16px}
.tb .ina-table__cell{white-space:normal}
.lengkap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lengkap.ok{color:var(--ina-content-positive)}
.lengkap.kurang{color:var(--ina-content-secondary)}
.lengkap svg{flex:none}

/* detail order */
.det-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kepala .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);margin-top:12px}
.det-kepala h2{margin:2px 0 0;font:600 20px/28px Inter,sans-serif}
.status-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px 28px}
.status-kartu .ina-stepper{align-items:flex-start;min-height:92px;padding:4px 64px 0}
.status-kartu .ina-stepper__separator{align-self:flex-start;margin-top:11px}
.status-kartu .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.status-kaki{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ina-stroke-primary);margin-top:8px;padding-top:16px}
.status-kaki p{margin:0;font-size:14px;color:var(--ina-content-secondary)}
.status-kaki p b{color:var(--ina-content-primary)}
.status-kaki .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-kaki .alasan{font-size:12.5px;color:var(--ina-content-secondary)}
.syarat{margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.syarat h4{margin:0 0 10px;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syarat h4 .hit{font-weight:500;color:var(--ina-content-secondary)}
.syarat ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.syarat li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.syarat li .ik{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none}
.syarat li.ok .ik{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.syarat li.kurang .ik{background:var(--ina-warning-100);color:var(--ina-warning-600)}
.syarat li.ok span.t{color:var(--ina-content-secondary)}
.syarat li .ina-button{padding:0;height:auto;min-height:0}
.syarat-alert{margin-top:16px}
.syarat-alert .ina-alert__description{display:flex;flex-direction:column;gap:10px}
.syarat-daftar{display:flex;flex-wrap:wrap;gap:8px 16px}
.syarat-item{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-badge{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-button{padding:0 4px}
.langkah-berikut{color:var(--ina-content-primary)}
.info-baris{margin-top:16px}
.info-baris .ina-alert__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
.info-baris .ina-alert__text-section{flex:1;min-width:220px}

.tab-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tab-kartu > .ina-tab-horizontal{padding:0 12px;border-bottom:1px solid var(--ina-stroke-primary)}
.tab-kartu .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center}
.tab-kartu .tanda{font:600 11px Inter,sans-serif;border-radius:999px;padding:1px 7px}
.tab-kartu .tanda.ok{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.tab-kartu .tanda.kurang{background:var(--ina-warning-100);color:var(--ina-warning-700)}
.tab-kartu .tanda.netral{background:var(--ina-neutral-100);color:var(--ina-content-secondary)}
.tab-isi{padding:20px}
.tab-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tab-bar p{margin:0;font-size:13px;color:var(--ina-content-secondary)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-field textarea.ina-text-field__input{min-height:80px;resize:vertical;padding:0}
.f-kaki{display:flex;justify-content:flex-end;margin-top:16px}
.tb .nm{font-weight:500}
.tb .sub2{font-size:12px;color:var(--ina-content-secondary)}
.kunci{margin-bottom:16px}

/* dialog */
.ina-modal__body p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary)}
.seg button{border:0;border-radius:7px;background:transparent;padding:7px 14px;font:500 14px Inter,sans-serif;color:var(--ina-content-secondary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ina-primary-primary);color:#fff}
.fld{margin-bottom:16px}
.fld > .ina-text-field__label{display:flex;align-items:center;gap:6px}
.select-wadah{position:relative;display:block;width:100%}
.select-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:0;max-height:240px}
.cari-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.1);padding:4px;max-height:220px;overflow:auto}
.cari-panel button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.cari-panel button:hover{background:var(--ina-background-tertiary)}
.cari-panel small{display:block;font-size:12px;color:var(--ina-content-secondary)}
.kartu-pihak{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px;background:var(--ina-background-secondary);font-size:13.5px}
.kartu-pihak b{display:block;font-size:14px;margin-bottom:6px}
.kartu-pihak dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.kartu-pihak dt{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu-pihak dd{margin:0}
.belum-ada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ina-primary-25);border:1px solid var(--ina-primary-100);font-size:13px}
.ringkas-kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:12px 0 14px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas-kv dt{color:var(--ina-content-secondary)}
.ringkas-kv dd{margin:0;font-weight:500}
.cek-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;cursor:pointer}

.daftar-ubah{display:flex;flex-direction:column;gap:10px}
.daftar-ubah .it{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px}
.daftar-ubah .it .a{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daftar-ubah .it code{font:600 11.5px ui-monospace,Menlo,monospace;color:#2563EB}
.daftar-ubah .it b{font-size:14px}
.daftar-ubah .it p{margin:6px 0 4px;font-size:13px;line-height:19px;color:var(--ina-content-primary)}
.daftar-ubah .it .lama{font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.bantu-langkah{margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.bantu-langkah li{margin-bottom:6px}
.bantu-sub{margin:18px 0 8px;font:600 14px Inter,sans-serif;display:flex;align-items:center}
.bantu-faq{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.bantu-faq summary{cursor:pointer;font-weight:500}
.bantu-faq p{margin:8px 0 0!important}
.bantu-kontak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bantu-kontak div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.bantu-kontak b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.bantu-kontak span{font-size:14px}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.toast-wadah{position:fixed;bottom:24px;right:24px;z-index:100;max-width:calc(100vw - 32px)}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--ina-stroke-secondary);color:var(--ina-content-secondary);font:600 10px Inter,sans-serif;cursor:help;background:transparent;padding:0}
.ina-tooltip__bubble{max-width:260px;white-space:normal}

@media (max-width:1024px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,26,23,.45);z-index:35;opacity:0;pointer-events:none;transition:.22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .syarat ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  header.top{padding:0 16px}
  .user .txt,#bukaBantuan span{display:none}
  .page{padding:20px 16px 40px}
  h1{font-size:23px;line-height:32px}
  .saring{grid-template-columns:1fr}
  .f-grid,.syarat ul,.kartu-pihak dl,.bantu-kontak{grid-template-columns:1fr}
  .status-kartu{padding:18px 16px}
  .status-kartu .stepper-h{display:none}
  .status-kartu .stepper-v{display:flex!important;padding:4px 0}
  .ringkas-kv{grid-template-columns:1fr;gap:2px}
  .protobar .kanan{margin-left:0}
  table.tb thead{display:none}
  table.tb tr{display:block;border-top:1px solid var(--ina-stroke-primary);padding:8px 0}
  table.tb td{display:block;border:0;padding:4px 16px}
  .aksi-baris{justify-content:flex-start}
}
.status-kartu .stepper-v{display:none}
.status-kartu .stepper-v .ina-stepper__label small{display:inline;margin:0 0 0 8px}
.status-kartu .stepper-v .ina-stepper__separator{min-height:24px;height:24px}
</style>
<style id="minuta2-css">
/* ===== Penyusunan Akta v2 — usulan tampilan (HE-MINUTA-07) + HE-MINUTA-01…06
   Fitur sama dengan live Peruri (dilihat 23 Okt 2026, akun Asisten & PPAT); yang berubah hanya tata letak editor:
   bilah menu + bilah alat ala pengolah kata, panel Navigasi kiri, naskah sebagai kertas di tengah, panel Bagian kanan.
   Komponen INA Digital Design System (ina-*) dengan brand E-PPAT. ===== */

/* daftar minuta (sama dengan prototipe Penyusunan Akta) */
.saring-m{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.saring-m .ina-input-search{flex:1;width:auto;min-width:220px}
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45}
/* ikon ? bertooltip untuk istilah (pola bersama) */
.tanya-btn{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;margin-left:4px;border:0;border-radius:50%;background:transparent;color:var(--ina-content-secondary);cursor:help;vertical-align:middle}.tanya-btn:hover,.tanya-btn:focus-visible{color:var(--ina-primary-500);outline:2px solid var(--ina-primary-500);outline-offset:1px}
.tanya:focus-within .ina-tooltip__content{visibility:visible;opacity:1}
.tanya .tanya-btn svg{color:inherit}
.tanya .ina-tooltip__bubble{font-weight:400;font-size:12px;letter-spacing:normal;text-transform:none;color:var(--ina-white,#fff)}
.ikon-alert{display:grid;place-items:center;color:var(--ina-negative-600);margin-top:1px}
.ina-alert--critical .ina-alert__title{color:var(--ina-negative-600)}
.ina-modal-confirmation{max-width:560px}

/* ---------- dokumen (kartu editor v2) ---------- */
.dok{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.dok-kepala{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px 2px;flex-wrap:wrap}
.dok-aksi .ina-button{white-space:nowrap}
.dok-kiri{display:flex;align-items:flex-start;gap:8px;min-width:0;flex:1}
.dok-kiri #kembali.ina-button{width:36px;height:36px;min-height:0;padding:0;justify-content:center;margin-top:2px}
.dok-ikon{flex:none;color:var(--ina-primary-500);margin-top:4px}
.dok-id{min-width:0;flex:1}
.dok-b1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dok-judul{margin:0;font:600 17px/26px Inter,sans-serif;color:var(--ina-content-primary);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.dok-judul .kode{font:600 15px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary)}
.status-simpan{font-size:12.5px;color:var(--ina-content-secondary);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.status-simpan.belum{color:var(--ina-warning-700,#6b4c00)}
.penanda-var.ina-badge{cursor:pointer;border:0;font-family:Inter,sans-serif;gap:4px;display:inline-flex;align-items:center}
.penanda-var.ina-badge:hover{text-decoration:underline}
.penanda-var.ina-badge:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.dok-aksi{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:2px}

/* bilah menu = tombol IDDS tertiary kecil; isi menu = IDDS Action Dropdown */
.menu-bar{display:flex;gap:2px;margin:2px 0 0 -8px;flex-wrap:wrap}
.menu-bar .mb-btn.ina-button{height:28px;min-height:0;padding:0 8px;font-weight:400;font-size:13.5px;color:var(--ina-content-primary)}
.menu-bar .mb-btn[aria-expanded="true"]{background:var(--ina-primary-50)}
.wadah-menu{position:fixed;z-index:80}
.wadah-menu .menu-dok.ina-action-dropdown__menu{position:relative;left:auto;right:auto;top:0;margin-top:0;min-width:250px;max-width:calc(100vw - 16px);max-height:calc(100vh - 120px);overflow:auto;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.menu-dok .ina-action-dropdown__item{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.menu-dok .ina-action-dropdown__item .cek-m{width:16px;flex:none;display:inline-grid;place-items:center;color:var(--ina-primary-500)}
.menu-dok .ina-action-dropdown__item-content{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.menu-dok .pintas{font:500 11.5px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary);white-space:nowrap}
.menu-dok .ket-m{font-size:12px;color:var(--ina-content-secondary);white-space:normal}
.menu-dok .ina-action-dropdown__item--disabled .ina-badge{margin-left:auto}

/* bilah alat (HE-MINUTA-02): satu baris berjarak lega */
.alat{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:6px 12px 8px;padding:4px 8px;background:var(--ina-background-secondary);border:1px solid var(--ina-stroke-primary);border-radius:12px;position:relative}
.alat .pisah{width:1px;height:22px;background:var(--ina-stroke-primary);margin:0 6px}
.alat .btn-alat.ina-button{width:34px;height:34px;min-height:0;padding:0;justify-content:center;font-weight:600;font-size:15px}
.alat .btn-alat.i{font-style:italic;font-family:Georgia,serif}
.alat .btn-alat.u span{text-decoration:underline}
.alat .btn-alat:disabled{opacity:.4}
.alat .ina-button--sm{white-space:nowrap}
.alat .kanan-alat{margin-left:auto;display:flex;gap:6px;align-items:center}
.pop-wadah{position:absolute;left:8px;right:auto;top:calc(100% + 2px);z-index:16;width:auto}
.pop-wadah .menu-lain.ina-action-dropdown__menu{position:relative;right:auto;left:auto;top:0;margin-top:0;min-width:240px;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.pop-wadah .panel-var.ina-select-dropdown__panel{position:relative;top:0;left:auto;right:auto;margin-top:0;width:380px;max-width:calc(100vw - 48px);display:flex;flex-direction:column;max-height:460px}
.panel-var .kepala-var{padding:12px 14px 4px}
.panel-var .kepala-var b{display:block;font-size:14px;margin-bottom:4px}
.panel-var .kepala-var p{margin:0;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.panel-var .ina-select-dropdown__options{overflow:auto;max-height:none;flex:1}
.panel-var .grup-var{font:600 11px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--ina-content-secondary);padding:10px 12px 4px}
.panel-var .opsi-var{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.panel-var .opsi-var .ina-select-dropdown__option-content{display:flex;flex-direction:column;align-items:flex-start;text-align:left;flex:1;min-width:0}
.panel-var .opsi-var .ina-select-dropdown__option-label{font-size:14px;color:var(--ina-content-primary)}
.panel-var .opsi-var .c{font-size:12.5px;color:var(--ina-content-secondary)}
.panel-var .opsi-var code{flex:none;font:500 11px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}

/* keterangan peran & hasil cek ejaan */
.pita{padding:0 12px 10px}
.pita .ina-alert{padding-top:8px;padding-bottom:8px}
.ejaan{padding:0 12px 10px}
.hasil-ejaan.ina-card{display:block;width:100%;max-width:none;padding:14px 16px}
.hasil-ejaan .ina-card__content{padding:0;display:block}
.hasil-ejaan .kp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hasil-ejaan h4{margin:0;font:600 14px Inter,sans-serif;display:flex;align-items:center;gap:8px}
.hasil-ejaan .ina-card__content > p{margin:0 0 10px;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.hasil-ejaan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hasil-ejaan li{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;font-size:14px}
.hasil-ejaan .sek{font-size:12px;font-weight:600;color:var(--ina-primary-600);display:block;margin-bottom:2px}
.hasil-ejaan del{background:var(--ina-negative-50,#fef2f2);color:var(--ina-negative-600);padding:0 4px;border-radius:4px}
.hasil-ejaan ins{text-decoration:none;background:var(--ina-positive-50,#ecfdf3);color:var(--ina-content-positive);padding:0 4px;border-radius:4px}

/* ---------- area kerja: Navigasi | kertas | Bagian (HE-MINUTA-07) ---------- */
.kerja{display:flex;border-top:1px solid var(--ina-stroke-primary);height:calc(100vh - 96px);min-height:560px;position:relative}
.kol-kepala{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 8px 6px 14px}
.kol-kepala .cap{font:600 11.5px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kol-kepala .ina-button{width:32px;height:32px;min-height:0;padding:0;justify-content:center}
.nav-dok{width:268px;flex:none;border-right:1px solid var(--ina-stroke-primary);display:flex;flex-direction:column;min-height:0;background:var(--ina-background-primary)}
.nav-dok > .ina-tab-horizontal{padding:0 6px;border-bottom:1px solid var(--ina-stroke-primary);box-sizing:border-box;width:100%}
.nav-dok .ina-tab-horizontal__container{display:flex;width:100%;min-width:0;margin:0;padding:0;box-sizing:border-box}
.nav-dok .ina-tab-horizontal__container > *{flex:0 0 auto;min-width:0;display:flex}
.nav-dok .ina-tab-horizontal__tab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;font-size:13px;white-space:nowrap}
.panel-ket{display:flex;align-items:flex-start;gap:8px;margin:10px 12px 4px;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.panel-ket svg{flex:none;margin-top:1px}
.daftar-pasal{list-style:none;margin:0;padding:6px 10px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto;flex:1;min-height:0}
.it-pasal{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 4px;border:1px solid transparent;border-radius:10px;background:var(--ina-background-primary);cursor:pointer}
.it-pasal:hover{background:var(--ina-background-secondary)}
.it-pasal.aktif{border-color:var(--ina-primary-500);background:var(--ina-primary-50)}
.it-pasal:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:1px}
.it-pasal .geser{display:flex;flex-direction:column}
.it-pasal .geser button{border:0;background:transparent;padding:0 2px;height:14px;line-height:0;color:var(--ina-content-secondary);cursor:pointer}
.it-pasal .geser button:disabled{opacity:.3;cursor:default}
.it-pasal .no{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--ina-primary-500);color:#fff;font:600 11px Inter,sans-serif}
.it-pasal .no.cat{border-radius:6px;background:var(--ina-neutral-100,#f2f4f7);color:var(--ina-content-secondary)}
.it-pasal .no.kon{border-radius:6px;background:var(--ina-primary-50);color:var(--ina-primary-600)}
.kol-kepala .kiri-kk{display:inline-flex;align-items:center;gap:2px}
.lampiran-nav{border-top:1px solid var(--ina-stroke-primary);padding:4px 10px}
.lampiran-nav .lipat{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:8px 4px;border-radius:8px;cursor:pointer;font:600 11.5px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--ina-content-secondary);text-align:left}
.lampiran-nav .lipat:hover{background:var(--ina-background-secondary)}
.lampiran-nav .lipat:focus-visible{outline:2px solid var(--ina-primary-500)}
.lampiran-nav .lipat .ina-badge{text-transform:none;letter-spacing:normal}
.lampiran-nav .lipat .chev{margin-left:auto;display:inline-grid;transition:transform .15s}
.lampiran-nav .lipat[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lampiran-nav p{margin:0 4px 8px;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.it-pasal .nm{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-pasal .nm small{display:block;font-size:11.5px;font-weight:400;color:var(--ina-content-secondary)}
.it-pasal .hapus.ina-button{width:30px;height:30px;min-height:0;padding:0;justify-content:center;opacity:0}
.it-pasal:hover .hapus,.it-pasal.aktif .hapus,.it-pasal .hapus:focus-visible{opacity:1}
.it-pasal .hapus.ina-button:hover{color:var(--ina-negative-600)}
.it-pasal.baru{animation:kilau 1.6s ease}
@keyframes kilau{0%{background:var(--ina-primary-100)}100%{background:var(--ina-background-primary)}}
.panel-kaki{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ina-stroke-primary)}
.panel-kaki .ina-button{flex:1;justify-content:center;padding-left:8px;padding-right:8px}

/* rel saat panel ditutup */
.rel{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--ina-background-primary)}
.rel.kiri{border-right:1px solid var(--ina-stroke-primary)}
.rel.kanan{border-left:1px solid var(--ina-stroke-primary)}
.rel .ina-button{width:34px;height:34px;min-height:0;padding:0;justify-content:center}
.rel-teks{writing-mode:vertical-rl;transform:rotate(180deg);border:0;background:transparent;color:var(--ina-content-secondary);font:600 11.5px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;padding:8px 4px;border-radius:6px}
.rel-teks:hover{background:var(--ina-background-secondary);color:var(--ina-content-primary)}
.rel-teks:focus-visible{outline:2px solid var(--ina-primary-500)}

/* kanvas & kertas */
.kanvas{flex:1;min-width:0;overflow:auto;background:var(--ina-background-secondary);display:flex;flex-direction:column}
.kanvas-isi{flex:1;padding:24px 20px 28px}
/* kertas per halaman: ukuran & margin dari Pengaturan Dokumen; pemotongan = perkiraan dari tinggi blok */
.kertas{position:relative;color:#111;text-align:justify}
.kertas p{margin:0 0 8px}
.kertas h2,.kertas h3{font-family:inherit;margin:0 0 8px}
.hal-bingkai{max-width:620px;margin:0 auto}
.hal-bingkai + .hal-bingkai{margin-top:28px}
.hal{position:relative;box-sizing:border-box;aspect-ratio:21.5/33;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.1),0 4px 14px rgba(15,23,42,.08)}
.hal-kaki{position:absolute;bottom:0;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;box-sizing:border-box;padding:0 4px;font-size:.78em;line-height:1.4;text-align:center;color:#333;border-radius:4px}
.hal-kaki .garis-f{position:absolute;left:0;right:0;top:22%;border-top:1px solid #9aa4b2}
.hal-kaki[data-kaki]{cursor:pointer}
.hal-kaki[data-kaki]:hover,.hal-kaki[data-kaki]:focus-visible{outline:1px dashed var(--ina-primary-500);outline-offset:-2px;background:var(--ina-primary-50)}
.hal-kaki .var-chip.ina-badge{font-size:10.5px;line-height:15px;padding:0 5px;min-height:0;height:auto}
.hal-nomor{margin:8px 0 0;text-align:center;font:12px Inter,sans-serif;color:var(--ina-content-secondary)}
.hal-nomor .ina-tooltip{display:inline-flex}
.bag.lanjutan{cursor:pointer}
.bag{position:relative;border-radius:2px}
.bag + .bag{margin-top:6px}
.bag.bisa-pilih{cursor:pointer}
.bag:not(.aktif):hover{outline:1px dashed var(--ina-primary-300);outline-offset:6px}
.bag.aktif{outline:2px solid var(--ina-primary-500);outline-offset:6px}
.bag .jdl-bag{margin:0 0 4px;font:inherit;font-weight:700;text-align:center}
.bag .lbl-bag{position:absolute;top:2px;right:calc(100% + var(--lbl-geser,14px));width:80px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:Inter,sans-serif;line-height:1.3;text-align:right}
.bag .lbl-bag small{font:500 10.5px/1.3 Inter,sans-serif;letter-spacing:.3px;text-transform:uppercase;color:var(--ina-content-secondary);max-width:80px;overflow-wrap:anywhere}
.lbl-sempit .bag .lbl-bag{position:static;width:auto;flex-direction:row;align-items:center;gap:6px;margin-bottom:4px;text-align:left}
.bag .isi-bag{outline:0;min-height:1.6em}
.bag .isi-bag:empty::before{content:"Ketik isi di sini…";color:var(--ina-content-secondary)}
.catatan-kertas{margin:14px auto 0;max-width:640px;font-size:12px;color:var(--ina-content-secondary);text-align:center}
/* label variabel = IDDS Badge soft brand / warning */
.var-chip.ina-badge{display:inline-flex;margin:0 1px;font-family:Inter,sans-serif;line-height:20px;vertical-align:baseline;white-space:nowrap;cursor:default;text-align:left}
.var-chip .vk{display:none;font:500 12px ui-monospace,Menlo,monospace}
.mode-kode .var-chip .vl{display:none}
.mode-kode .var-chip .vk{display:inline}
.var-chip.galat .vl::before{content:"⚠ "}
.var-chip.kedip{animation:kedip 1s ease 3}
@keyframes kedip{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 4px var(--ina-warning-300,#fcd34d)}}
.kaki-kanvas{position:sticky;bottom:0;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--ina-background-primary);border-top:1px solid var(--ina-stroke-primary);z-index:3}
.kaki-kanvas .ket{margin-right:auto;font-size:13px;color:var(--ina-content-secondary);display:inline-flex;align-items:center;gap:6px;min-width:0}
.kaki-kanvas .ket.belum{color:var(--ina-warning-700,#6b4c00)}
.bar-hp{display:none}

/* panel Bagian */
.panel-dok{width:316px;flex:none;border-left:1px solid var(--ina-stroke-primary);display:flex;flex-direction:column;min-height:0;background:var(--ina-background-primary)}
.panel-dok .kol-kepala{padding:4px 8px 0 4px;border-bottom:1px solid var(--ina-stroke-primary)}
.panel-dok .ina-tab-horizontal{flex:1;min-width:0}
.panel-dok .ina-tab-horizontal__container{display:flex;margin:0;padding:0}
.panel-dok .ina-tab-horizontal__tab{display:inline-flex;align-items:center;gap:6px;padding:0 10px;font-size:13.5px;white-space:nowrap}
.panel-isi{flex:1;overflow:auto;min-height:0;padding:16px}
.panel-isi .kosong-ed{padding:48px 8px;text-align:center;color:var(--ina-content-secondary);font-size:14px}
.panel-isi .kosong-ed svg{display:block;margin:0 auto 12px;color:var(--ina-stroke-secondary)}
.ed-judul{display:flex;align-items:center;gap:8px;margin:0 0 14px;font:600 15px Inter,sans-serif;color:var(--ina-primary-primary)}
.cek{display:inline-flex;align-items:flex-start;gap:8px;font-size:14px;cursor:pointer;margin-top:12px}
.cek small{color:var(--ina-content-secondary);font-size:12.5px}
.grup-p{margin-top:18px;padding-top:14px;border-top:1px solid var(--ina-stroke-primary)}
.grup-p h4{margin:0 0 10px;font:600 11.5px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--ina-content-secondary)}
.ket-toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--ina-content-primary);cursor:pointer}
.ket-kecil{margin:8px 0 0;font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.galat-var{margin-top:12px}
.baris-tbl{display:flex;gap:8px;flex-wrap:wrap}
.baris-tbl .ina-button{flex:1;justify-content:center}
#hapusBagian.ina-button{color:var(--ina-negative-600)}

/* pengaturan dokumen (HE-MINUTA-06) di panel kanan */
.atur-ringkas dl{display:grid;grid-template-columns:1fr;gap:2px;margin:14px 0 0;font-size:14px}
.atur-ringkas dt{color:var(--ina-content-secondary);margin-top:8px}
.atur-ringkas dd{margin:0;font-weight:500}
.halaman-mini{position:relative;width:110px;height:169px;background:#fff;border:1px solid var(--ina-stroke-secondary);box-shadow:0 2px 6px rgba(0,0,0,.08);margin:16px auto 0}
.halaman-mini .area{position:absolute;border:1px dashed var(--ina-primary-300);background:repeating-linear-gradient(transparent 0 7px,var(--ina-neutral-100,#f2f2f2) 7px 8px)}
.halaman-mini .jilid{position:absolute;left:4px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left top;font:600 8px Inter,sans-serif;color:var(--ina-content-secondary);letter-spacing:.5px;white-space:nowrap}
.halaman-mini + small{display:block;text-align:center;margin-top:8px;font-size:12px;color:var(--ina-content-secondary)}
.atur-grup{margin-top:18px;padding-top:14px;border-top:1px solid var(--ina-stroke-primary)}
.atur-grup h4{margin:0 0 10px;font:600 11.5px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--ina-content-secondary)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g1{display:grid;grid-template-columns:1fr;gap:12px}
.ina-text-field__suffix{font-size:13px;color:var(--ina-content-secondary);padding-right:4px}
.var-footer{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.var-footer .ina-badge{cursor:help}
.atur-kaki{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--ina-stroke-primary)}

/* preview */
.pratinjau{max-height:62vh;overflow:auto;background:var(--ina-background-secondary);padding:16px;border-radius:10px}
.pratinjau .kertas p{margin:0 0 8px}
.pratinjau .bag:hover{outline:0}
.pratinjau .hal{box-shadow:none;border:1px solid var(--ina-stroke-primary)}
.pratinjau .isi-var{background:var(--ina-primary-50);border-radius:3px;padding:0 2px}
.pratinjau .isi-var.galat{background:var(--ina-warning-100);color:var(--ina-warning-700,#6b4c00)}
.pratinjau h5{margin:12px 0 4px;font:700 15px "Courier New",monospace;text-align:center}
.f-final{display:grid;gap:14px;margin-top:14px}

@media (max-width:1180px){
  .nav-dok{width:262px}

/* pemotongan halaman (perkiraan dari tinggi blok). Di aplikasi: pakai aturan yang sama dengan pembuat PDF. */
function paginasi(w, a, x, bisaKlik) {
  if (!w) return;
  const hal0 = w.querySelector('.hal'), isi0 = hal0.querySelector('.hal-isi'), bk0 = hal0.parentElement;
  const Wd = hal0.offsetWidth; if (!Wd) return;
  const pxcm = Wd / 21.5, H = (33 - num(a.atas) - num(a.bawah)) * pxcm;
  /* label jenis bagian: di luar kertas bila ruang cukup, di margin kiri kertas bila margin cukup lebar, selain itu di atas bagian */
  const padL = num(a.kiri) * pxcm, luar = hal0.getBoundingClientRect().left - w.getBoundingClientRect().left >= 76;
  w.style.setProperty('--lbl-geser', Math.round(luar ? padL + 12 : 10) + 'px');
  w.classList.toggle('lbl-sempit', !luar && padL < 96);
  const t0 = isi0.getBoundingClientRect().top, unit = [];
  isi0.querySelectorAll(':scope > .bag').forEach(bag => {
    const isi = bag.querySelector('.isi-bag'), anak = isi ? [...isi.children] : [];
    if (bag.querySelector('#editor') || anak.length < 2) { const r = bag.getBoundingClientRect(); unit.push({ bag, t:r.top - t0, b:r.bottom - t0 }); return; }
    anak.forEach((el, i) => { const r = el.getBoundingClientRect(); unit.push({ bag, el, t:(i ? r.top : bag.getBoundingClientRect().top) - t0, b:r.bottom - t0 + parseFloat(getComputedStyle(el).marginBottom || 0) }); });
  });
  let mulai = unit.length ? unit[0].t : 0, pg = 0;
  unit.forEach((u, i) => { if (i && u.b - mulai > H) { pg++; mulai = u.t; } u.pg = pg; });
  const total = pg + 1, wadah = [isi0];
  for (let i = 1; i < total; i++) { const bk = bk0.cloneNode(false), h = hal0.cloneNode(false), isi = isi0.cloneNode(false); h.append(isi); bk.append(h); w.append(bk); wadah.push(isi); }
  const perBag = new Map(); unit.forEach(u => { if (!perBag.has(u.bag)) perBag.set(u.bag, []); perBag.get(u.bag).push(u); });
  perBag.forEach((us, bag) => {
    const hs = [...new Set(us.map(u => u.pg))];
    wadah[hs[0]].append(bag);
    hs.slice(1).forEach(p => {
      const lj = bag.cloneNode(false); lj.classList.add('lanjutan'); lj.classList.remove('aktif'); lj.classList.add('bisa-pilih');
      lj.innerHTML = `${bag.dataset.lencana ? lblBag(bag.dataset.lencana + ' · lanjutan', bag.dataset.warna, bag.dataset.nama) : ''}<div class="isi-bag"></div>`;
      us.filter(u => u.pg === p).forEach(u => lj.lastElementChild.append(u.el));
      wadah[p].append(lj);
    });
  });
  const kiri = (num(a.kiri) / 21.5 * 100).toFixed(2) + '%', kanan = (num(a.kanan) / 21.5 * 100).toFixed(2) + '%', tinggi = (num(a.bawah) * pxcm).toFixed(1) + 'px';
  w.querySelectorAll('.hal').forEach((h, i) => {
    const atr = bisaKlik ? `data-kaki role="button" tabindex="0" aria-label="Kaki halaman ${i + 1}. Buka pengaturan footer." title="Klik untuk mengatur footer di Pengaturan Dokumen."` : '';
    h.insertAdjacentHTML('beforeend', `<div class="hal-kaki" ${atr} style="left:${kiri};right:${kanan};height:${tinggi}">${a.footer ? `<span class="garis-f" aria-hidden="true"></span><span class="hal-kaki-isi">${isiFooter(a, x, i + 1, total)}</span>` : ''}</div>`);
    if (!a.footer) h.parentElement.insertAdjacentHTML('beforeend', `<p class="hal-nomor">${denganTip(`<span tabindex="0">Halaman ${i + 1} dari ${total}</span>`, 'Penanda ini hanya tampil di editor dan tidak ikut tercetak. Aktifkan footer di Pengaturan Dokumen agar nomor halaman tercetak.', 'top')}</p>`);
  });
  w.dataset.total = total;
}

function panelAtur(x, fin) {

  const fld = (id, l, v, suf, help = '') => `<div class="ina-text-field"><label class="ina-text-field__label" for="${id}">${l}</label><div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><input id="${id}" class="ina-text-field__input" inputmode="decimal" value="${esc(v)}" data-atur="${id.slice(2)}"><span class="ina-text-field__suffix">${suf}</span></div>${help ? `<div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text">${help}</div></div>` : ''}</div>`;
  const FV = [['{page}', 'Nomor halaman', '1'], ['{total}', 'Jumlah halaman', '3'], ['{date}', 'Tanggal cetak', TGL_CETAK], ['{{ppat_nama}}', 'Nama PPAT', VMAP.get('ppat_nama').c], ['{{ppat_wilayah}}', 'Wilayah kerja PPAT', VMAP.get('ppat_wilayah').c], ['{{deed_number}}', 'Nomor akta', '13/2026 (diisi saat finalisasi)'], ['{{jenis_akta}}', 'Jenis akta', 'Akta Jual Beli']];
  return `<div class="atur-ringkas ditandai" id="ringkasAtur">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${std ? badge(`${ik('centang', 12)} Mengikuti standar akta PPAT`, 'success') : badge('Diubah khusus untuk akta ini', 'warning')}${tanya('Standar akta PPAT', 'Standar akta adalah format kertas, margin, dan huruf yang ditetapkan kantor untuk semua akta. Format ini berlaku kecuali Anda mengubahnya khusus untuk akta ini.')}${usulan('HE-MINUTA-06')}</div>
      <p class="ket-kecil">Pengaturan ini dipakai untuk minuta dan salinan akta, dan langsung terlihat di kertas. ${std ? 'Anda tidak perlu mengubah apa pun kecuali akta ini memerlukan format khusus.' : 'Akta lain tetap memakai standar.'}</p>
      ${halamanMini(a)}
      <dl><dt>Kertas</dt><dd>${a.kertas}, ${a.orientasi.toLowerCase()}</dd>
        <dt>Margin${tanya('Margin', 'Margin adalah jarak antara tepi kertas dan area tulis. Margin kiri dibuat lebih lebar untuk jilid dan cap.')}</dt><dd>Kiri ${a.kiri} cm (untuk jilid/cap) · atas ${a.atas} · kanan ${a.kanan} · bawah ${a.bawah} cm</dd>
        <dt>Huruf</dt><dd>${a.huruf} ${a.ukuran} pt, spasi ${a.spasi === '2' ? 'ganda (2)' : a.spasi}</dd>
        <dt>Footer${tanya('Footer', 'Footer adalah teks kaki di bagian bawah setiap halaman akta, misalnya nomor halaman atau nama PPAT. Footer tampil saat menyusun, di Pratinjau Akta, dan di PDF.')}</dt><dd>${a.footer ? 'Aktif — tampil di setiap halaman' : 'Tidak aktif'}</dd></dl>
    </div>
    ${fin ? '' : !S.aturBuka ? `<div class="atur-kaki">${std ? '' : tombol('Kembalikan ke standar', 'tertiary', 'sm', 'id="aturStandar"', ik('ulang', 15))}${tombol('Ubah untuk akta ini', 'secondary', 'sm', 'id="aturBuka"', ik('pena', 15))}</div>` : `
    <div class="atur-grup"><h4>Kertas</h4><div class="g1">
      <div class="ina-text-field"><label class="ina-text-field__label">Ukuran kertas</label><div class="ina-text-field__wrapper ina-text-field__wrapper--size-md ina-text-field__wrapper--disabled"><input class="ina-text-field__input" value="${a.kertas}" disabled></div></div>
      <div class="ina-text-field"><label class="ina-text-field__label">Orientasi</label><div class="ina-text-field__wrapper ina-text-field__wrapper--size-md ina-text-field__wrapper--disabled"><input class="ina-text-field__input" value="${a.orientasi}" disabled></div></div></div></div>
    <div class="atur-grup"><h4>Margin</h4><div class="g2">${fld('a-atas', 'Atas', a.atas, 'cm')}${fld('a-bawah', 'Bawah', a.bawah, 'cm')}${fld('a-kiri', 'Kiri', a.kiri, 'cm', 'Lebih lebar untuk jilid/cap')}${fld('a-kanan', 'Kanan', a.kanan, 'cm')}</div></div>
    <div class="atur-grup"><h4>Huruf</h4><div class="g1">
      <div class="ina-text-field"><label class="ina-text-field__label">Jenis huruf</label><div class="ina-text-field__wrapper ina-text-field__wrapper--size-md ina-text-field__wrapper--disabled"><input class="ina-text-field__input" value="${a.huruf} (khas akta)" disabled></div></div></div>
      <div class="g2" style="margin-top:12px">${fld('a-ukuran', 'Ukuran huruf', a.ukuran, 'pt')}${fld('a-spasi', 'Spasi baris', a.spasi, '×', '1 = tunggal, 2 = ganda')}</div></div>
    <div class="atur-grup"><h4>Footer</h4>
      ${cek('aFooter', 'Tampilkan footer di bagian bawah halaman', a.footer)}
      <p class="ket-kecil">Footer tampil di bagian bawah setiap halaman saat menyusun, di Pratinjau Akta, dan di PDF.${usulan('HE-MINUTA-07')}</p>
      <div class="ina-text-field" style="margin-top:12px"><label class="ina-text-field__label" for="aFooterTeks">Isi footer</label><div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><input id="aFooterTeks" class="ina-text-field__input" value="${esc(a.footerTeks)}" autocomplete="off"></div><div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text">Kertas langsung menampilkan isi footer dengan kode yang sudah diganti nilai contoh.</div></div></div>
      <p class="ket-kecil" style="margin-top:10px">Kode yang dapat dipakai di footer. Arahkan kursor untuk melihat contoh.</p>
      <div class="var-footer">${FV.map(([k, l, c]) => denganTip(kecil(`${l} · <code>${esc(k)}</code>`, 'neutral'), `Sistem mengganti ${esc(k)} dengan ${l.toLowerCase()}, misalnya ${esc(c)}.`, 'top')).join('')}</div></div>
    <div class="atur-kaki">${tombol('Kembalikan ke standar', 'tertiary', 'sm', 'id="aturStandar"', ik('ulang', 15))}${tombol('Batal', 'secondary', 'sm', 'id="aturBatal"')}${tombol('Simpan Pengaturan', 'primary', 'sm', 'id="aturSimpan"', ik('simpan', 15))}</div>`}`;
}

/* ---------------- bilah menu: setiap butir = fitur live ---------------- */
/* [aksi, label, pintasan/keterangan, syarat aktif] ; '-' = pemisah ; aksi 'segera:…' = fitur live yang belum tersedia */
const MENU = {
  File:[['atur', 'Pengaturan dokumen…', 'Atur kertas, margin, huruf, dan footer.'], ['preview', 'Pratinjau akta', 'Lihat akta dengan data yang sudah terisi.'], '-', ['kembali', 'Tutup naskah', 'Kembali ke daftar minuta.']],
  Edit:[['c:undo', 'Urungkan', 'Ctrl+Z', 'ed'], ['c:redo', 'Ulangi', 'Ctrl+Y', 'ed'], '-', ['simpan', 'Simpan bagian ini', '', 'ubah'], ['batal', 'Batalkan perubahan', '', 'ubah'], '-', ['c:x:html', 'Sunting kode HTML', '', 'ed']],
  Tampilan:[['nav', 'Panel Navigasi', '', 'cek:nav'], ['panel', 'Panel Bagian', '', 'cek:panel'], ['kode', 'Tampilkan kode variabel', '', 'cek:kode'], '-', ['c:x:penuh', 'Layar penuh', '', 'ed']],
  Sisipkan:[['tambah:PASAL', 'Pasal baru', 'Sistem menambahkannya di akhir daftar.', 'draf'], ['tambah:CATATAN', 'Catatan baru', 'Catatan adalah bagian tanpa nomor.', 'draf'], ['var', 'Variabel…', 'Variabel terisi otomatis dari permohonan.', 'ed'], '-', ['c:x:tautan', 'Tautan', '', 'ed'], ['c:x:gambar', 'Gambar', '', 'ed'], ['c:x:tabel', 'Tabel', '', 'ed'], '-', ['segera:lampiran', 'Lampiran', 'Lampiran akta akan tersedia pada pembaruan berikutnya.']],
  Format:[['c:bold', 'Tebal', 'Ctrl+B', 'ed'], ['c:italic', 'Miring', 'Ctrl+I', 'ed'], ['c:underline', 'Garis bawah', 'Ctrl+U', 'ed'], ['c:strikeThrough', 'Coret', '', 'ed'], '-', ['c:h2', 'Judul besar', '', 'ed'], ['c:h3', 'Judul kecil', '', 'ed'], '-', ['c:justifyLeft', 'Rata kiri', '', 'ed'], ['c:justifyCenter', 'Rata tengah', '', 'ed'], ['c:justifyRight', 'Rata kanan', '', 'ed'], ['c:justifyFull', 'Rata kanan-kiri', '', 'ed'], '-', ['c:insertOrderedList', 'Daftar bernomor', '', 'ed'], ['c:insertUnorderedList', 'Daftar berpoin', '', 'ed'], '-', ['c:x:warna', 'Warna teks & stabilo', '', 'ed'], ['c:x:ukuran', 'Ukuran huruf', '', 'ed'], ['c:x:spasi', 'Spasi baris', '', 'ed'], ['c:removeFormat', 'Hapus format', '', 'ed']],
  Alat:[['ejaan', 'Cek ejaan', 'Sistem memeriksa salah ketik di semua pasal.'], ['kurang', 'Variabel belum terisi', '', 'kurang'], '-', ['beritahu', 'Beritahu PPAT', 'PPAT menerima notifikasi bahwa minuta siap diperiksa.', 'asisten'], ['finalisasi', 'Finalisasi akta', 'PPAT memberi nomor dan tanggal, lalu sistem mengunci naskah.', 'ppat']],
  Bantuan:[['bantuan', 'Bantuan Penyusunan Akta', 'Panel ini memuat langkah, pertanyaan umum, dan kontak.']]
};
function syarat(s) {
  if (!s) return true;
  if (s === 'ed') return bisaEdit();
  if (s === 'ubah') return bisaEdit() && S.ubah;
  if (s === 'draf') return !final();
  if (s === 'kurang') return !final() && belumTerisi().length > 0;
  if (s === 'asisten') return !final() && S.peran === 'asisten';
  if (s === 'ppat') return !final() && S.peran === 'ppat';
  return true;
}
function bukaMenu(k, fokusPertama = false) {
  const b = $(`.mb-btn[data-menu="${k}"]`); if (!b) return;
  tutupPop(); S.menu = k;
  document.querySelectorAll('.mb-btn').forEach(x => x.setAttribute('aria-expanded', String(x === b)));
  const isi = MENU[k].filter(x => x === '-' || !((x[3] === 'asisten' && S.peran !== 'asisten') || (x[3] === 'ppat' && S.peran !== 'ppat')));
  const r = b.getBoundingClientRect();
  $('#wadahMenu').innerHTML = `<div class="ina-action-dropdown wadah-menu" style="left:${Math.max(8, Math.min(r.left, innerWidth - 268))}px;top:${r.bottom + 4}px"><div class="ina-action-dropdown__menu ina-action-dropdown__menu--visible menu-dok" role="menu" aria-label="Menu ${k}">${isi.map(x => {
    if (x === '-') return '<div class="ina-action-dropdown__divider" role="separator"></div>';
    const [a, l, ket, s] = x, segera = a.startsWith('segera:');
    const cekm = s && s.startsWith('cek:'), nyala = cekm && !!S[s.slice(4)];
    const aktif = !segera && (cekm || syarat(s));
    const label = a === 'kurang' ? `${l} (${final() ? 0 : belumTerisi().length})` : l;
    const pintas = /^Ctrl/.test(ket || '');
    return `<button type="button" class="ina-action-dropdown__item ${aktif ? '' : 'ina-action-dropdown__item--disabled'}" role="${cekm ? 'menuitemcheckbox' : 'menuitem'}" ${cekm ? `aria-checked="${nyala}"` : ''} data-aksi="${a}" ${aktif ? '' : 'disabled aria-disabled="true"'}>
      <span class="cek-m" aria-hidden="true">${nyala ? ik('centang', 14) : ''}</span>
      <span class="ina-action-dropdown__item-content">${label}${ket && !pintas ? `<span class="ket-m">${ket}</span>` : ''}</span>
      ${pintas ? `<span class="pintas">${ket}</span>` : ''}${segera ? kecil('Segera hadir', 'neutral') : ''}</button>`; }).join('')}</div></div>`;
  if (fokusPertama) $('#wadahMenu .ina-action-dropdown__item:not([disabled])')?.focus();
}
function tutupMenu(kembaliFokus = false) {
  const k = S.menu; S.menu = null; $('#wadahMenu').innerHTML = '';
  document.querySelectorAll('.mb-btn').forEach(x => x.setAttribute('aria-expanded', 'false'));
  if (kembaliFokus && k) $(`.mb-btn[data-menu="${k}"]`)?.focus();
}
/* aksi bersama: bilah menu, rel panel, bilah ponsel */
function aksi(a) {
  if (a.startsWith('c:')) { jalankan(a.slice(2)); return; }
  if (a.startsWith('tambah:')) { const t = a.slice(7); jagaPerubahan(() => tambahItem(t)); return; }
  if (a.startsWith('segera:')) return;
  switch (a) {
    case 'atur': jagaPerubahan(() => { Object.assign(S, { tab:'atur', panel:true, draf:null, ubah:false }); if (sempit()) S.nav = false; gambar(); }); break;
    case 'preview': jagaPerubahan(pratinjau); break;
    case 'kembali': jagaPerubahan(keDaftar); break;
    case 'simpan': simpanPasal(); break;
    case 'batal': batalPasal(); break;
    case 'nav': S.nav = !S.nav; if (sempit() && S.nav) S.panel = false; gambar(); fokusPanel(S.nav ? '#navDok .kol-kepala .ina-button' : '[data-aksi="nav"]'); break;
    case 'panel': S.panel = !S.panel; if (sempit() && S.panel) S.nav = false; gambar(); fokusPanel(S.panel ? '#panelDok [role="tab"][aria-selected="true"]' : '[data-aksi="panel"]'); break;
    case 'kode': aturKode(!S.kode); break;
    case 'var': togglePop('var'); break;
    case 'ejaan': cekEjaan(); break;
    case 'kurang': lompatVar(); break;
    case 'beritahu': beritahu(); break;
    case 'finalisasi': finalisasi(); break;
    case 'bantuan': bukaBantuan(); break;
  }
}
function fokusPanel(sel) { const el = [...document.querySelectorAll(sel)].find(e => e.getClientRects().length); el?.focus(); }

/* ---------------- gambar ---------------- */
function simpanDraf() {
  const ed = $('#editor'), it = item(); if (!ed || !it || !S.ubah) return;
  const d = S.draf || { judul:it.judul, isi:it.isi, tampil:it.tampil }, j = $('#judulPasal'), tj = $('#tampilJudul');
  S.draf = { judul:j ? j.value : d.judul, isi:serialisasi(ed), tampil:tj ? tj.checked : d.tampil };
}
function serialisasi(ed) {
  const c = ed.cloneNode(true);
  c.querySelectorAll('.var-chip').forEach(v => v.replaceWith(`{{${v.dataset.var}}}`));
  return c.innerHTML;
}
function gambar() {
  simpanDraf(); gambarNav(); tutupMenu();
  const gul = ['#kanvas', '#daftarPasal', '#panelIsi'].map(s => [s, $(s)?.scrollTop || 0]);
  $('#halaman').innerHTML = S.layar === 'daftar' ? layarDaftar() : layarDetail();
  if (S.layar !== 'daftar') paginasi($('#kertas'), m().atur, m(), true);
  gul.forEach(([s, v]) => { const el = $(s); if (el) el.scrollTop = v; });
  pasangPanduan(); S.kilau = null; perbaruiKepala();
  ciutSidebar();
}
/* editor penyusunan: menu samping otomatis diciutkan agar kertas lebih lega; kembali ke daftar = pilihan pengguna */
let editorTerbuka = null;
function ciutSidebar() {
  const ed = S.layar !== 'daftar'; if (!window.sidebarIdds || ed === editorTerbuka) return; editorTerbuka = ed;
  window.sidebarIdds.ciutSementara(ed ? true : null);
}
addEventListener('load', ciutSidebar); /* skrip sidebar disisipkan setelah skrip halaman */
function perbaruiKepala() {
  const p = PERAN[S.peran], u = document.querySelector('header .user');
  if (u) { const n = u.querySelector('.uname'), r = u.querySelector('.urole'), a = u.querySelector('.ava'); if (n) n.textContent = p.nama; if (r) r.textContent = p.label; if (a) a.textContent = p.huruf; }
  const layar = S.layar === 'daftar' ? 'daftar' : final() ? 'final' : S.peran;
  document.querySelectorAll('#pilLayar [data-layar]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layar === layar)));
}
/* pengaturan dokumen yang belum disimpan dikembalikan saat formulir ditinggalkan */
function batalAtur() { if (S.aturBuka && S.aturAsal && m()) m().atur = { ...S.aturAsal }; S.aturAsal = null; S.aturBuka = false; }
function keDaftar() { batalAtur(); Object.assign(S, { layar:'daftar', aktif:null, pilih:null, draf:null, ubah:false, hasil:null, galatEjaan:false, galatJudul:'', aturBuka:false }); gambar(); window.scrollTo({ top:0 }); }
function buka(kode, pilih = null, tab = 'pasal') {
  batalAtur(); Object.assign(S, { layar:'detail', aktif:kode, pilih, tab, draf:null, ubah:false, hasil:null, galatEjaan:false, galatJudul:'', aturBuka:false, nav:!sempit(), panel:!sempit() });
  gambar(); window.scrollTo({ top:0 });
  if (pilih) gulirKe(pilih);
}
function gulirKe(id) {
  const sec = $(`#kertas [data-pilih="${id}"]`), kv = $('#kanvas'); if (!sec) return;
  if (sempit()) { sec.scrollIntoView({ block:'start' }); return; }
  kv.scrollTop += sec.getBoundingClientRect().top - kv.getBoundingClientRect().top - 40;
}
function pilihItem(id, opsi = {}) {
  Object.assign(S, { pilih:id, tab:'pasal', draf:null, ubah:false, galatJudul:'' });
  if (sempit()) S.nav = false;
  gambar();
  if (opsi.gulir) gulirKe(id);
  if (opsi.titik && bisaEdit() && document.caretRangeFromPoint) {
    const ed = $('#editor'), r = document.caretRangeFromPoint(opsi.titik[0], opsi.titik[1]);
    ed.focus(); if (r && ed.contains(r.startContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
  if (opsi.fokusNav) $(`#daftarPasal [data-pilih="${id}"]`)?.focus();
}
function tandaiUbah() {
  if (S.ubah) return; S.ubah = true;
  const st = $('#statusSimpan'); if (st) { st.classList.add('belum'); st.innerHTML = `${ik('seru', 14)} Belum disimpan`; }
  const kk = $('#ketKaki'); if (kk) { kk.classList.add('belum'); kk.innerHTML = `${ik('seru', 14)} Perubahan pada bagian ini belum disimpan`; }
  ['#simpanPasal', '#batalPasal'].forEach(s => { const b = $(s); if (b) b.disabled = false; });
}
/* jaga perubahan belum disimpan dengan IDDS Modal (HE-MINUTA-04) */
function jagaPerubahan(lanjut) {
  if (!S.ubah) { lanjut(); return; }
  simpanDraf(); const it = item(), nama = it ? (it.tipe === 'PASAL' ? `Pasal ${nomorPasal(m().naskah, it)}` : it.judul) : 'pasal';
  dialog({ judul:'Simpan perubahan dulu?', isi:`<p>Perubahan pada <b>${esc(nama)}</b> belum disimpan. Jika Anda lanjut tanpa menyimpan, perubahan tersebut akan hilang.${usulan('HE-MINUTA-04')}</p>`, konfirmasi:true,
    tombol:[['Batal','tertiary',null],['Buang Perubahan','secondary',() => { S.draf = null; S.ubah = false; lanjut(); }],['Simpan & Lanjutkan','primary',() => { if (simpanPasal() === false) return false; lanjut(); }]] });
}
function simpanPasal() {
  simpanDraf(); const it = item(), d = S.draf; if (!it || !d) return;
  if (!d.judul.trim()) { S.galatJudul = 'Judul wajib diisi.'; S.panel = true; S.tab = 'pasal'; gambar(); $('#judulPasal')?.focus(); return false; }
  Object.assign(it, { judul:d.judul.trim(), isi:d.isi, tampil:d.tampil });
  S.draf = null; S.ubah = false; S.galatJudul = ''; gambar(); toast('Pasal disimpan.', 'positive');
}
function batalPasal() { S.draf = null; S.ubah = false; S.galatJudul = ''; gambar(); toast('Perubahan dibatalkan.'); }

/* ---------------- interaksi ---------------- */
const H = $('#halaman');
H.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cariMinuta') { S.cari = t.value; const p = t.selectionStart; gambar(); const n = $('#cariMinuta'); n.focus(); n.setSelectionRange(p, p); return; }
  if (t.id === 'editor' || t.id === 'judulPasal') {
    tandaiUbah();
    if (t.id === 'judulPasal') { if (S.galatJudul && t.value.trim()) S.galatJudul = ''; const it = item(), h = $('.bag.aktif .jdl-bag'); if (it && it.tipe !== 'PASAL' && h) h.textContent = t.value; }
    return;
  }
  if (t.id === 'cariVar') { S.cariVar = t.value; segarVar(); const n = $('#cariVar'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); return; }
  /* Pengaturan Dokumen: kertas langsung dipotong ulang (disimpan dengan Simpan Pengaturan, dikembalikan dengan Batal) */
  if (t.dataset.atur && num(t.value) > 0) { m().atur[t.dataset.atur] = t.value.trim().replace(',', '.'); segarKertas(); return; }
  if (t.id === 'aFooterTeks') { m().atur.footerTeks = t.value; segarKertas(); }
});
H.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tampilJudul') { setCek(t); tandaiUbah(); simpanDraf(); gambar(); $('#tampilJudul')?.focus(); return; }
  if (t.id === 'aFooter') { setCek(t); m().atur.footer = t.checked; segarKertas(); return; }
});
/* klik kaki halaman → tab Pengaturan Dokumen, fokus ke isian footer */
function bukaFooter() {
  jagaPerubahan(() => {
    Object.assign(S, { tab:'atur', panel:true, draf:null, ubah:false });
    if (!final() && !S.aturBuka) { S.aturBuka = true; S.aturAsal = { ...m().atur }; }
    if (sempit()) S.nav = false;
    gambar();
    const f = $('#aFooterTeks') || $('#ringkasAtur'); if (f) { f.scrollIntoView({ block:'center' }); if (f.id === 'ringkasAtur') f.setAttribute('tabindex', '-1'); f.focus(); }
  });
}
H.addEventListener('mousedown', e => { if (e.target.closest('.btn-alat, .menu-lain button, .opsi-var')) e.preventDefault(); });
/* IDDS Toggle "Tampilkan kode variabel" */
function aturKode(on) {
  S.kode = on; $('#kertas')?.classList.toggle('mode-kode', on);
  const t = $('#tampilKode'); if (!t) return;
  t.classList.toggle('ina-toggle--checked', on); t.setAttribute('aria-checked', on); t.querySelector('input').checked = on;
  t.querySelector('.ina-toggle__track').classList.toggle('ina-toggle__track--checked', on); t.querySelector('.ina-toggle__thumb').classList.toggle('ina-toggle__thumb--checked', on);
}
H.addEventListener('keydown', e => {
  if (e.target.id === 'tampilKode' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); aturKode(!S.kode); return; }
  if (e.target.matches && e.target.matches('[data-kaki]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); bukaFooter(); return; }
  const li = e.target.closest('#daftarPasal [data-pilih]'); if (li && e.target === li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); const id = +li.dataset.pilih; jagaPerubahan(() => pilihItem(id, { gulir:true, fokusNav:true })); return; }
  /* bilah menu: panah kiri/kanan berpindah, panah bawah/Enter membuka */
  const mb = e.target.closest('.mb-btn');

  D.querySelector('.ina-drawer__close-button').focus();
}
function tutupDrawer() { $('#lapisanDrawer').innerHTML = ''; if (asalDrawer && asalDrawer.isConnected) asalDrawer.focus(); else $('.mb-btn[data-menu="Bantuan"]')?.focus(); asalDrawer = null; }
document.addEventListener('click', e => {
  if (e.target.closest('[data-tutup-drawer]')) { tutupDrawer(); return; }
  const tg = e.target.closest('#lapisanDrawer .ina-accordion__toggle'); if (!tg) return;
  const buka = tg.getAttribute('aria-expanded') !== 'true';
  tg.setAttribute('aria-expanded', buka);
  tg.querySelector('.ina-accordion__icon').classList.toggle('ina-accordion__icon--open', buka);
  tg.nextElementSibling.classList.toggle('ina-accordion__content--open', buka);
});

/* ---------------- IDDS Modal & Toast ---------------- */
let asalDialog = null;
function tutupDialog(fokusOtomatis = true) {
  $('#lapisan').innerHTML = '';
  if (fokusOtomatis && asalDialog && asalDialog.isConnected) asalDialog.focus();
  asalDialog = null;
}
function dialog({ judul, isi, tombol: tb, lebar, bahaya, konfirmasi, kembali }) {
  const L = $('#lapisan');
  asalDialog = kembali && kembali.isConnected ? kembali : document.activeElement;
  /* konfirmasi = varian IDDS Modal Confirmation (hapus, perubahan belum disimpan); bahaya = tombol utama merah */
  L.innerHTML = `<div class="ina-modal"><div class="ina-modal__backdrop" data-i="-1"></div><div class="ina-modal__container">
    <div class="ina-modal__dialog ina-modal__dialog--size-${lebar ? 'lg' : 'md'} ${konfirmasi ? 'ina-modal-confirmation' : ''}" role="${konfirmasi ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgJudul">
      <div class="ina-modal__header"><h2 class="ina-modal__title" id="dlgJudul">${judul}</h2><button type="button" class="ina-modal__close-button" aria-label="Tutup dialog" data-i="-1">${ik('x', 22)}</button></div>
      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md ${bahaya && i === tb.length - 1 ? 'tombol-bahaya' : ''}" data-i="${i}" ${bahaya && i === tb.length - 1 ? 'style="background:var(--ina-negative-600);border-color:var(--ina-negative-600);color:#fff"' : ''}>${t}</button>`).join('')}</div></div></div></div>`;
  (L.querySelector('.ina-modal__body input') || L.querySelector('.ina-modal__footer .ina-button:last-child')).focus();
  L.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i;
    if (i < 0) { tutupDialog(); return; }
    const [, , fn, tahan] = tb[i];
    if (tahan) { const r = fn(); if (r === false) return; tutupDialog(r !== 'fokus-diatur'); return; }
    const asal = asalDialog; L.innerHTML = ''; asalDialog = null;
    const r = fn ? fn() : undefined;
    if (r !== 'fokus-diatur' && !L.innerHTML && !$('#lapisanDrawer').innerHTML && asal && asal.isConnected && !document.activeElement?.closest('#halaman .dok #editor')) asal.focus();
  };
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#lapisan').innerHTML) { tutupDialog(); return; }
  if ($('#lapisanDrawer').innerHTML) { tutupDrawer(); return; }
  if (S.menu) { tutupMenu(true); return; }
  if (popAktif) { tutupPop(); return; }
  if (sempit() && S.layar === 'detail' && (S.nav || S.panel)) { S.nav = false; S.panel = false; gambar(); }
});
let tt;
function toast(teks, state = 'default', ms = 3000, ket = '') {
  $('#toastWadah').innerHTML = `<div class="ina-toast ina-toast--state-${state} ina-toast--style-solid ina-toast--visible" role="status"><div class="ina-toast__icon">${ik(state === 'positive' ? 'centang' : 'info', 20)}</div>
    <div class="ina-toast__content"><div class="ina-toast__text-area"><p class="ina-toast__title">${teks}</p>${ket ? `<p class="ina-toast__description">${ket}</p>` : ''}</div></div><button class="ina-toast__close-button" aria-label="Tutup notifikasi" data-tutup-toast>${ik('x', 16)}</button></div>`;
  clearTimeout(tt); tt = setTimeout(() => $('#toastWadah').innerHTML = '', ms);
}
$('#toastWadah').addEventListener('click', e => { if (e.target.closest('[data-tutup-toast]')) $('#toastWadah').innerHTML = ''; });

/* ---------------- Bantuan (HE-UMUM-02) — sama dengan prototipe Penyusunan Akta; hanya letak elemen disesuaikan ---------------- */
const faq = (i, q, a) => `<div class="ina-accordion"><button type="button" class="ina-accordion__toggle" aria-expanded="false" aria-controls="faq-${i}"><div class="ina-accordion__title">${q}</div><div class="ina-accordion__toggler"><svg class="ina-accordion__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6" /></svg></div></button><div id="faq-${i}" class="ina-accordion__content"><div class="ina-accordion__body"><p>${a}</p></div></div></div>`;
function bukaBantuan() {
  drawer({ judul:'Bantuan Penyusunan Akta', isi:`
    <p>Panduan singkat menyusun naskah minuta akta sebelum difinalisasi oleh PPAT.</p>
    <ol class="bantu-langkah">
      <li><b>Buka minuta</b> berstatus Penyusunan dari daftar.</li>
      <li><b>Pilih pasal atau catatan</b> di panel Navigasi atau langsung di kertas, lalu sunting isinya di kertas dan judulnya di panel Bagian.</li>
      <li><b>Sisipkan variabel</b> untuk data yang terisi otomatis, misalnya nama penjual atau harga.</li>
      <li><b>Simpan</b> setiap pasal yang diubah.</li>
      <li><b>Cek Ejaan</b> dan <b>Pratinjau Akta</b> untuk memeriksa hasil akhir.</li>
      <li><b>Beritahu PPAT</b> bahwa minuta siap difinalisasi.</li>
    </ol>
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${faq(1, 'Apa beda pasal dan catatan?', 'Pasal diberi nomor otomatis sesuai urutannya. Catatan adalah bagian tanpa nomor, seperti pembukaan akta, para pihak, objek, para saksi, dan penutup.')}
    ${faq(2, 'Apa itu variabel?', 'Variabel adalah isian otomatis, misalnya "Nama Lengkap Penjual". Di editor variabel tampil sebagai label hijau. Saat pratinjau dan PDF dibuat, label diganti dengan data dari permohonan. Label kuning berarti variabel tidak dikenal dan tidak akan terisi.')}
    ${faq(3, 'Mengapa Cek Ejaan tidak dapat digunakan?', 'Fitur Cek Ejaan perlu diaktifkan oleh admin sistem. Selama belum aktif, Anda tetap dapat menyunting dan menyimpan pasal seperti biasa.')}
    ${faq(4, 'Apakah pasal yang terhapus bisa dikembalikan?', 'Tidak. Tambahkan kembali lewat tombol Tambah Pasal, lalu isi ulang judul dan isinya. Nomor pasal lain menyesuaikan secara otomatis.')}
    ${faq(5, 'Siapa yang memfinalisasi akta?', 'PPAT. Asisten menyusun naskah, lalu menekan Beritahu PPAT. PPAT memeriksa, mengisi nomor dan tanggal akta, kemudian memfinalisasi. Setelah final, pasal tidak dapat diubah.')}
    <h4 class="bantu-sub">Kontak dukungan ${usulan('HE-UMUM-02')}</h4>
    <div class="bantu-kontak"><div><b>Email</b><span>${est('bantuan@contoh.id')}</span></div><div><b>Telepon / WhatsApp</b><span>${est('0800-0000-0000')}</span></div><div><b>Jam layanan</b><span>${est('Senin–Jumat, 08.00–17.00 WIB')}</span></div></div>` });
}

/* ---------------- daftar perubahan ---------------- */
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar perubahan Penyusunan Akta v2', lebar:true,
    isi:`<p>Usulan tampilan v2 untuk Penyusunan Akta, disusun dari laporan Heuristic Evaluation INA Digital, halaman 25–27 (skor halaman 47,1), beserta gambar buktinya. <b>Fitur tidak berubah dari live</b>: setiap menu dan tombol memetakan ke fitur yang sudah ada. Yang diubah adalah tata letak editor, kepadatan, kejelasan istilah, panduan, dan umpan balik. Daftar yang sama ada di spreadsheet Backlog-HE-EPPAT-Peruri.xlsx.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup','secondary',null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => {
    const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; asalDialog = null; lihat(UBAH[+b.dataset.lihat]);
  });
});
function lihat(u) {
  S.ubah = false; S.draf = null;
  if (u.ke === 'bantuan') { if (S.layar !== 'detail') buka('ORD-CONTOH-004'); bukaBantuan(); return; }
  if (u.ke === 'editor' || u.ke === 'tataletak') buka('ORD-CONTOH-004', 4);
  if (u.ke === 'variabel') { buka('ORD-CONTOH-004', 2); togglePop('var'); }
  if (u.ke === 'pengaturan') buka('ORD-CONTOH-004', null, 'atur');
  if (u.ke === 'ejaan-galat') { setEjaan(false); buka('ORD-CONTOH-004', 4); cekEjaan(); return; }
  if (u.ke === 'hapus') { const ps = MINUTA.find(x => x.kode === 'ORD-CONTOH-004').naskah.filter(x => x.tipe === 'PASAL').pop(); if (!ps) { buka('ORD-CONTOH-004'); return; } buka('ORD-CONTOH-004', ps.id); hapusItem(ps.id, $(`#daftarPasal [data-hapus="${ps.id}"]`)); return; }
  const el = u.sorot && $(u.sorot);
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}
function setEjaan(aktif) { S.ejaanAktif = aktif; document.querySelectorAll('[data-ejaan]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.ejaan === 'aktif') === aktif))); }
document.querySelectorAll('[data-ejaan]').forEach(b => b.addEventListener('click', () => { setEjaan(b.dataset.ejaan === 'aktif'); S.hasil = null; S.galatEjaan = false; if (S.layar === 'detail') gambar(); toast(S.ejaanAktif ? 'Simulasi: Cek Ejaan aktif.' : 'Simulasi: Cek Ejaan belum diaktifkan admin.'); }));
/* pil layar: Daftar → editor per peran → final (hanya baca) */
document.querySelectorAll('#pilLayar [data-layar]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.layar;
  const jalan = () => {
    S.ubah = false; S.draf = null;
    if (k === 'daftar') { keDaftar(); return; }
    if (k === 'final') { buka('ORD-CONTOH-005', 4); return; }
    S.peran = k; const x = MINUTA.find(y => y.kode === 'ORD-CONTOH-004');
    buka(x.status === 'SELESAI' ? (MINUTA.find(y => y.status === 'DRAFTING') || x).kode : x.kode, 4);
  };
  jagaPerubahan(jalan);
}));
$('#aturUlang').addEventListener('click', () => { MINUTA = contoh(); S.ubah = false; S.draf = null; S.cari = ''; S.filter = ''; keDaftar(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
window.addEventListener('beforeunload', e => { if (S.ubah) { e.preventDefault(); e.returnValue = ''; } });
let lebarLalu = sempit();
let tunda;
window.addEventListener('resize', () => { const s = sempit(); if (s !== lebarLalu && S.layar === 'detail') { lebarLalu = s; S.nav = !s; S.panel = !s; gambar(); } lebarLalu = s;
  /* lebar kertas berubah → potong ulang halaman */
  clearTimeout(tunda); tunda = setTimeout(() => { if (S.layar === 'detail' && !S.ubah && !document.activeElement?.closest('#panelDok')) gambar(); }, 250); });
gambar();
})();
</script>
</body>
</html>
