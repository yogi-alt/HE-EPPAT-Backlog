<style id="system-css">
/* ===== Tenant · System (Super Admin): Dasbor, Peran & Izin, Pengaturan, Logs — penyesuaian IDDS (IDDS-TN-08…15)
   Menu ini tidak dinilai HE. Isi, kolom, dan perilaku mengikuti kode live dev-app.eppat.id/t/default;
   yang disesuaikan hanya komponen (IDDS + brand E-PPAT), letak pesan, bahasa, dan Bantuan per halaman (pola HE-UMUM-02).
   Daftar User memakai prototipe HE yang sudah ada (Backlog-HE-USER-Prototype.html). ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45;font-weight:400;text-transform:none;letter-spacing:0}
.ina-modal-confirmation{max-width:560px}
.modal-gap>*+*{margin-top:12px}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.eb{font:600 11px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ina-content-secondary)}
.blok{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}
.blok h2{margin:6px 0 4px;font:500 20px/28px Inter,sans-serif;color:var(--ina-primary-primary)}
.blok .ket{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.blok-atas{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* pengingat TERA (sama dengan prototipe TERA & Daftar User) */
.ingat{margin-top:20px}
.ingat .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.ingat .ina-alert__text-section{flex:1;min-width:240px}

/* Dasbor */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.kpi > div{position:relative;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:20px}
.kpi small{display:block;max-width:70%;font:600 11px/16px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kpi i{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:999px;background:var(--ina-primary-50);display:grid;place-items:center;color:var(--ina-primary-primary)}
.kpi i svg{width:15px;height:15px}
.kpi b{display:block;margin-top:18px;font:400 30px Inter,sans-serif;color:var(--ina-primary-primary)}
.kpi span{font-size:12.5px;color:var(--ina-content-secondary)}
.dasbor-dua{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;margin-top:24px}
.dasbor-dua .blok{margin:0}
a.aksi-cepat{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-primary-25,#f5f8f7);color:inherit;text-decoration:none;transition:border-color .15s}
a.aksi-cepat:hover,a.aksi-cepat:focus-visible{border-color:var(--ina-primary-500)}
a.aksi-cepat:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.aksi-cepat .bulat{width:40px;height:40px;border-radius:999px;background:var(--ina-primary-50);display:grid;place-items:center;color:var(--ina-primary-primary);flex:none}
.aksi-cepat .isi{flex:1;min-width:0}
.aksi-cepat .jd{display:block;font:600 14px Inter,sans-serif;color:var(--ina-primary-primary)}
.aksi-cepat .kt{display:block;margin-top:2px;font-size:12.5px;color:var(--ina-content-secondary)}
.aksi-cepat > svg{color:var(--ina-content-tertiary);flex:none}
.akt{list-style:none;margin:12px 0 0;padding:0}
.akt li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--ina-stroke-primary)}
.akt li:first-child{border-top:0}
.akt .titik{width:8px;height:8px;border-radius:999px;background:var(--ina-primary-primary);margin-top:7px;flex:none}
.akt .titik.gagal{background:var(--ina-negative-600,#d50b0b)}
.akt b{font-weight:600;color:var(--ina-primary-primary)}
.akt .wkt{font-size:12px;color:var(--ina-content-secondary)}
.lihat-semua{margin-top:12px}

/* Peran & Izin */
.matriks-wadah{margin-top:16px;overflow-x:auto;border:1px solid var(--ina-stroke-primary);border-radius:14px;background:var(--ina-background-primary)}
.matriks{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.matriks th,.matriks td{border-bottom:1px solid var(--ina-stroke-primary);padding:12px;text-align:center;font-size:14px;background:var(--ina-background-primary)}
.matriks thead th{background:var(--ina-background-secondary);font:600 11px/15px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary);min-width:104px;max-width:120px;white-space:normal;vertical-align:bottom}
.matriks .kol-peran{position:sticky;left:0;z-index:2;text-align:left;min-width:190px;box-shadow:1px 0 0 var(--ina-stroke-primary)}
.matriks thead .kol-peran{z-index:3}
.matriks tbody tr:last-child td{border-bottom:0}
.matriks tr.admin td{background:var(--ina-positive-50,#f0fbf4)}
.matriks tr:hover td{background:var(--ina-primary-25,#f5f8f7)}
.nama-peran{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;font:600 14px Inter,sans-serif;color:var(--ina-primary-primary);cursor:pointer;text-align:left}
.nama-peran:hover span,.nama-peran:focus-visible span{text-decoration:underline}
.kode-peran{display:flex;align-items:center;gap:6px;margin-top:4px;font:11px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}
.kode-peran .ina-badge{font-family:Inter,sans-serif}
.sel-izin{padding:0;border:0;background:none;cursor:pointer;border-radius:999px}
.sel-izin:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.sel-izin .ina-badge{min-width:54px;justify-content:center;gap:4px;font-weight:600}
.ina-badge.izin-kosong{background:var(--ina-background-primary);color:var(--ina-content-secondary);border:1px solid var(--ina-stroke-primary)}
td.baru-simpan .ina-badge{box-shadow:0 0 0 3px var(--ina-positive-200,#bdeccd)}
.cek-admin{color:var(--ina-content-positive);display:inline-flex}
.legenda{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--ina-content-secondary)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda .ina-badge{min-width:42px;justify-content:center}
.pilih-izin{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.pilih-izin .ina-checkbox{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:1px solid var(--ina-stroke-primary);border-radius:10px;cursor:pointer}
.pilih-izin .ina-checkbox:hover{background:var(--ina-primary-25,#f5f8f7)}
.pilih-izin .ina-checkbox__description{display:block;font-size:12.5px;color:var(--ina-content-secondary)}
.ina-modal__footer .kiri{margin-right:auto}
.ina-button.bahaya{color:var(--ina-negative-600,#d50b0b);border-color:var(--ina-negative-600,#d50b0b)}
.f-baris{margin-top:16px}
.ina-text-field select.ina-text-field__input{appearance:auto;background:transparent;border:0;width:100%;height:100%;font:inherit;font-size:14px;color:inherit;outline:0}
.ina-text-field__input:disabled{color:var(--ina-content-secondary);cursor:not-allowed}

/* Pengaturan */
.f-dua{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;margin-top:20px}
.f-dua .lebar{grid-column:1 / -1}
.sakelar{grid-column:1 / -1;padding:16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.sakelar .ket-toggle{display:inline-flex;align-items:center;gap:10px;font:600 14px Inter,sans-serif;color:var(--ina-content-primary);cursor:pointer}
.sakelar p{margin:6px 0 0 50px;font-size:13px;line-height:19px;color:var(--ina-content-secondary)}
.sakelar .ina-text-area{margin:14px 0 0 50px}
.f-kaki{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.kaki-st{margin-right:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ina-content-secondary)}
.kaki-st.ada{color:var(--ina-warning-600,#855f00)}

/* Logs */
.saring{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px}
.saring .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--ina-content-primary)}
.saring .ina-input-search{width:300px}
.pilih-wadah{position:relative}
.pilih-wadah .ina-select-dropdown__trigger{min-width:230px}
.pilih-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:auto;min-width:240px;max-height:300px;overflow:auto;z-index:20}
.saring .jumlah{margin-left:auto;align-self:center;font-size:13px;color:var(--ina-content-secondary)}
.pelaku b{display:block;font-weight:600}
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}
.ket-log{color:var(--ina-content-secondary);font-size:13.5px}
.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}
.halaman-bawah{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ina-content-secondary)}

@media (max-width:1024px){ .dasbor-dua{grid-template-columns:1fr} }
@media (max-width:760px){
  .kpi{grid-template-columns:1fr}
  .f-dua{grid-template-columns:1fr}
  .sakelar p,.sakelar .ina-text-area{margin-left:0}
  .saring .ina-input-search,.pilih-wadah,.pilih-wadah .ina-select-dropdown__trigger{width:100%}
  .saring .jumlah{margin-left:0}
}
.bantu-istilah{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:8px 0 4px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:13.5px;line-height:20px}
.bantu-istilah dt{font-weight:600}
.bantu-istilah dd{margin:0;color:var(--ina-content-secondary)}
ol.bantu-langkah{padding-left:22px}
@media (max-width:760px){ .bantu-istilah{grid-template-columns:1fr} .bantu-istilah dd{margin-bottom:6px} }

const ik = (n, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usulan = kode => `<span class="tag-usulan">penyesuaian &middot; ${kode}</span>`;
const badge = (t, j, uk = 'md', atr = '', kls = '') => `<span class="ina-badge ina-badge--soft ina-badge--${j} ina-badge--${uk} ina-badge--rounded-full ${kls}" ${atr}>${t}</span>`;
const tombol = (t, h = 'primary', uk = 'md', atr = '', ikon = '') => `<button type="button" class="ina-button ina-button--${h} ina-button--${uk}" ${atr}>${ikon}${t}</button>`;
const alert = (j, judul, isi, ekstra = '') => `<div class="ina-alert ina-alert--${j}" role="status"><div class="ina-alert__content"><div class="ina-alert__text-section">${judul ? `<div class="ina-alert__title">${judul}</div>` : ''}<div class="ina-alert__description">${isi}</div></div>${ekstra}</div></div>`;
const est = t => `<span class="isi-tim" title="Data contoh. Ganti dengan data resmi dari tim E-PPAT.">${t}</span>`;
const denganTip = (isi, t, letak = 'top') => `<span class="ina-tooltip ina-tooltip--placement-${letak}">${isi}<span class="ina-tooltip__content"><span class="ina-tooltip__bubble">${t}</span></span></span>`;
const cekBox = (id, cek, label, desk = '', atr = '') => `<label class="ina-checkbox" for="${id}"><input type="checkbox" id="${id}" class="ina-checkbox__input peer" ${cek ? 'checked' : ''} ${atr}><div class="ina-checkbox__box ina-checkbox__box--${cek ? 'checked' : 'unchecked'}">${cek ? ik('centang', 12) : ''}</div>${label ? `<div class="ina-checkbox__content"><span class="ina-checkbox__label">${label}</span>${desk ? `<span class="ina-checkbox__description">${desk}</span>` : ''}</div>` : ''}</label>`;
const toggle = (id, label, on, atr = '') => `<span class="ket-toggle"><span class="ina-toggle ina-toggle--size-sm ${on ? 'ina-toggle--checked' : ''}" role="switch" aria-checked="${on}" tabindex="0" id="${id}" aria-label="${label}" ${atr}><input type="checkbox" class="ina-toggle__input" tabindex="-1" ${on ? 'checked' : ''}><span class="ina-toggle__track ${on ? 'ina-toggle__track--checked' : ''}" style="pointer-events:none"><span class="ina-toggle__thumb ${on ? 'ina-toggle__thumb--checked' : ''}"></span></span></span><span>${label}</span></span>`;
const tf = (id, l, v = '', ph = '', wajib = false, bantu = '', atr = '') => `<div class="ina-text-field" id="f-${id}"><label class="ina-text-field__label" for="${id}">${l}${wajib ? '<span class="ina-text-field__required">*</span>' : ''}</label>
  <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><input id="${id}" type="text" class="ina-text-field__input" value="${esc(v)}" placeholder="${esc(ph)}" aria-describedby="h-${id}" ${atr}></div>
  <div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text" id="h-${id}" data-bantu="${esc(bantu)}">${bantu}</div></div></div>`;
const pilihan = (id, l, opsi, v, bantu = '') => `<div class="ina-text-field" id="f-${id}"><label class="ina-text-field__label" for="${id}">${l}</label>
  <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><select id="${id}" class="ina-text-field__input">${opsi.map(([ov, ot]) => `<option value="${ov}" ${ov === v ? 'selected' : ''}>${ot}</option>`).join('')}</select></div>
  <div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text" id="h-${id}" data-bantu="${esc(bantu)}">${bantu}</div></div></div>`;
const cariIsian = (id, ph, v, label) => `<div class="ina-input-search"><div class="ina-input-search__wrapper"><span class="ina-input-search__search-icon">${ik('cari', 20)}</span><input id="${id}" class="ina-input-search__input" type="search" placeholder="${ph}" aria-label="${label}" value="${esc(v)}" autocomplete="off"></div></div>`;
const remah = t => `<nav class="ina-breadcrumb" aria-label="Breadcrumb"><ol class="ina-breadcrumb__list"><li class="ina-breadcrumb__item"><a href="#dasbor" class="ina-breadcrumb__link"><span class="ina-breadcrumb__text">Pengaturan Aplikasi</span></a><span class="ina-breadcrumb__separator" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6" /></svg></span></li><li class="ina-breadcrumb__item"><span class="ina-breadcrumb__link ina-breadcrumb__link--active"><span class="ina-breadcrumb__text">${t}</span></span></li></ol></nav>`;

      <div class="ina-drawer__content">${isi}</div>
    </div></div>`;
  D.querySelector('.ina-drawer__close-button').focus();
}
function tutupDrawer() { $('#lapisanDrawer').innerHTML = ''; $('#bukaBantuan')?.focus(); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-tutup-drawer]')) { tutupDrawer(); return; }
  const tg = e.target.closest('#lapisanDrawer .ina-accordion__toggle'); if (!tg) return;
  const b = tg.getAttribute('aria-expanded') !== 'true';
  tg.setAttribute('aria-expanded', b);
  tg.querySelector('.ina-accordion__icon').classList.toggle('ina-accordion__icon--open', b);
  tg.nextElementSibling.classList.toggle('ina-accordion__content--open', b);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisanDrawer').innerHTML) tutupDrawer(); });

/* ---------------- IDDS Modal & Toast ---------------- */
function dialog({ judul, isi, tombol: tb, lebar, konfirmasi, bahaya }) {
  const Lp = $('#lapisan');
  Lp.innerHTML = `<div class="ina-modal"><div class="ina-modal__backdrop" data-i="-1"></div><div class="ina-modal__container">
    <div class="ina-modal__dialog ina-modal__dialog--size-${lebar ? 'lg' : 'md'} ${konfirmasi ? 'ina-modal-confirmation' : ''}" role="${konfirmasi ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgJudul">
      <div class="ina-modal__header"><h2 class="ina-modal__title" id="dlgJudul">${judul}</h2><button type="button" class="ina-modal__close-button" aria-label="Tutup dialog" data-i="-1">${ik('x', 22)}</button></div>
      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h, , , kls, ikon], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md ${kls || ''}" data-i="${i}" ${bahaya && i === tb.length - 1 ? 'style="background:var(--ina-negative-600);border-color:var(--ina-negative-600)"' : ''}>${ikon || ''}${t}</button>`).join('')}</div></div></div></div>`;
  Lp.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i; if (i < 0) { Lp.innerHTML = ''; return; }
    const [, , fn, tahan] = tb[i]; if (tahan) { fn && fn(); return; }
    Lp.innerHTML = ''; fn && fn();
  };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisan').innerHTML) $('#lapisan').innerHTML = ''; });
let tt;
function toast(teks, state = 'default', ms = 3000, ket = '') {
  $('#toastWadah').innerHTML = `<div class="ina-toast ina-toast--state-${state} ina-toast--style-solid ina-toast--visible" role="status"><div class="ina-toast__icon">${ik(state === 'positive' ? 'centang' : 'info', 20)}</div>
    <div class="ina-toast__content"><div class="ina-toast__text-area"><p class="ina-toast__title">${teks}</p>${ket ? `<p class="ina-toast__description">${ket}</p>` : ''}</div></div><button class="ina-toast__close-button" aria-label="Tutup notifikasi" data-tutup-toast>${ik('x', 16)}</button></div>`;
  clearTimeout(tt); tt = setTimeout(() => $('#toastWadah').innerHTML = '', ms);
}
$('#toastWadah').addEventListener('click', e => { if (e.target.closest('[data-tutup-toast]')) $('#toastWadah').innerHTML = ''; });

/* ---------------- Bantuan per halaman (IDDS-TN-15, pola HE-UMUM-02) ---------------- */
const faq = (i, q, a) => `<div class="ina-accordion"><button type="button" class="ina-accordion__toggle" aria-expanded="false" aria-controls="faq-${i}"><div class="ina-accordion__title">${q}</div><div class="ina-accordion__toggler"><svg class="ina-accordion__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6" /></svg></div></button><div id="faq-${i}" class="ina-accordion__content"><div class="ina-accordion__body"><p>${a}</p></div></div></div>`;
const kontak = () => `<h4 class="bantu-sub">Kontak dukungan ${usulan('IDDS-TN-15')}</h4>
  <div class="bantu-kontak"><div><b>Email</b><span>${est('bantuan@contoh.id')}</span></div><div><b>Telepon / WhatsApp</b><span>${est('0800-0000-0000')}</span></div><div><b>Jam layanan</b><span>${est('Senin–Jumat, 08.00–17.00 WIB')}</span></div></div>`;
/* butir langkah & daftar istilah (dipakai semua Bantuan) */
const lgkh = a => `<ol class="bantu-langkah">${a.map(x => `<li>${x}</li>`).join('')}</ol>`;
const istilah = a => `<dl class="bantu-istilah">${a.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const fq = (p, a) => a.map(([q, j], i) => faq(p + i, q, j)).join('');
const BANTUAN = {
  dasbor:() => ({ judul:'Bantuan Dasbor', isi:`<p>Dasbor merangkum akun pengguna dan aktivitas terbaru di kantor Anda, serta jalan pintas ke pengelolaan sistem.</p>
    <h4 class="bantu-sub">Isi halaman</h4>
    <ul class="bantu-langkah"><li><b>Total Pengguna</b>: semua akun di kantor ini, termasuk yang ditangguhkan dan nonaktif.</li><li><b>Pengguna Aktif</b>: akun yang dapat masuk saat ini.</li><li><b>Aktivitas (10 terakhir)</b>: jumlah catatan terbaru di log aktivitas.</li><li><b>Mulai dari sini</b>: jalan pintas ke Daftar Pengguna, Peran &amp; Izin, dan Pengaturan.</li><li><b>Aktivitas pengguna</b>: enam aktivitas terbaru; aktivitas gagal bertitik merah.</li></ul>
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('d', [
      ['Mengapa Pengguna Aktif lebih sedikit dari Total Pengguna?', 'Selisihnya adalah akun yang ditangguhkan atau nonaktif. Lihat statusnya di Daftar Pengguna.'],
      ['Apa itu pengingat TERA?', 'TERA adalah stempel elektronik kantor dari Peruri. Selama belum didaftarkan, akta tidak dapat dibubuhi stempel elektronik. Klik "Daftar TERA" untuk melengkapi datanya.'],
      ['Apakah pengingat TERA muncul lagi setelah ditutup?', 'Ya. Pengingat muncul lagi pada kunjungan berikutnya sampai TERA kantor terdaftar.'],
      ['Mengapa ada aktivitas bertanda Gagal?', 'Contohnya kata sandi salah saat masuk, atau akun yang ditangguhkan mencoba masuk. Buka Log Aktivitas untuk melihat keterangan dan alamat IP-nya.'],
      ['Bagaimana menambah pengguna baru?', 'Klik "Kelola pengguna", lalu "Tambah Pengguna" di Daftar Pengguna. Isi nama, email, peran, dan kata sandi awal.'],
      ['Mengapa angka belum berubah?', 'Angka dimuat saat halaman dibuka. Muat ulang halaman untuk melihat data terbaru.']])}
    ${kontak()}` }),
  peran:() => ({ judul:'Bantuan Peran & Izin', isi:`<p>Halaman ini mengatur menu yang tampil dan tindakan yang boleh dilakukan setiap peran.</p>
    <h4 class="bantu-sub">Arti izin</h4>
    <ul class="bantu-langkah">${IZIN.map(([, l, h]) => `<li><b>${l}:</b> ${h.toLowerCase()}.</li>`).join('')}</ul>
    <h4 class="bantu-sub">Langkah menambah peran</h4>
    ${lgkh(['Klik <b>Tambah Peran</b>, isi kode, nama, dan fungsi.', 'Klik sel pada baris peran baru untuk mengatur izin setiap modul.', 'Beri peran itu ke pengguna di <b>Daftar Pengguna</b>.'])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('p', [
      ['Mengapa baris Super Admin tidak bisa diubah?', 'Super Admin selalu memiliki akses penuh agar selalu ada akun yang dapat mengelola sistem.'],
      ['Apa arti angka 3/4 di sel?', 'Peran tersebut memiliki 3 dari 4 izin (Lihat, Buat, Ubah, Hapus) untuk modul itu. Pilih sel untuk melihat dan mengubah daftarnya.'],
      ['Mengapa pengguna tidak melihat menu tertentu?', 'Peran pengguna belum punya izin Lihat untuk modul itu. Untuk menu Permohonan, layanan aktanya juga harus aktif di Profil Kantor › Layanan Akta.'],
      ['Kapan perubahan izin berlaku?', 'Izin berlaku setelah Anda memilih Simpan di dialog Atur Izin. Bila menu pengguna belum berubah, minta pengguna memuat ulang halaman atau masuk ulang.'],
      ['Apa itu Fungsi peran?', 'Fungsi menentukan permohonan yang dapat dilihat dan hak finalisasi akta. PPAT: akses penuh dan dapat memfinalisasi akta. Asisten: mengisi data dan draf, melihat semua permohonan. Klien: hanya permohonan miliknya. Tidak ada: peran umum.'],
      ['Apa itu peran publik?', 'Peran yang muncul sebagai pilihan saat calon pengguna mendaftar sendiri. Peran harus aktif dan pendaftaran mandiri harus dinyalakan di Pengaturan.'],
      ['Mengapa peran tidak bisa dihapus?', 'Peran yang masih dipakai pengguna tidak dapat dihapus. Pindahkan pengguna ke peran lain di Daftar Pengguna, lalu hapus perannya.'],
      ['Apa beda menonaktifkan dan menghapus peran?', 'Peran nonaktif tetap tersimpan, tetapi tidak dapat diberikan ke pengguna baru. Peran yang dihapus hilang permanen beserta izinnya.'],
      ['Bisakah kode peran diganti?', 'Tidak. Kode dipakai sistem sebagai pengenal. Ganti nama peran bila perlu.']])}
    ${kontak()}` }),
  pengaturan:() => ({ judul:'Bantuan Pengaturan', isi:`<p>Pengaturan di halaman ini berlaku untuk seluruh pengguna di kantor Anda.</p>
    <h4 class="bantu-sub">Langkah</h4>
    ${lgkh(['Ubah isian atau sakelar yang diperlukan.', 'Periksa jumlah perubahan di bagian bawah formulir.', 'Klik <b>Simpan Perubahan</b>, atau <b>Batal</b> untuk mengembalikan isian.'])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('s', [
      ['Di mana Nama Aplikasi dan Tagline tampil?', 'Sebagai identitas aplikasi kantor Anda, misalnya di halaman masuk dan judul aplikasi.'],
      ['Zona waktu dipakai untuk apa?', 'Untuk waktu yang tampil di permohonan, log aktivitas, dan email. Pilih sesuai lokasi kantor: WIB, WITA, atau WIT.'],
      ['Apa akibat mematikan registrasi mandiri?', 'Calon pengguna tidak dapat mendaftar sendiri. Akun baru hanya dapat dibuat admin melalui Daftar Pengguna.'],
      ['Kapan memakai mode pemeliharaan?', 'Saat ada perbaikan atau pembaruan sistem. Selama aktif, pengguna selain admin melihat pesan pemeliharaan dan tidak dapat memakai aplikasi.'],
      ['Apakah admin tetap bisa masuk saat pemeliharaan?', 'Ya. Admin tetap dapat masuk untuk mematikan mode pemeliharaan.'],
      ['Bagaimana jika saya pindah menu sebelum menyimpan?', 'Aplikasi meminta konfirmasi. Bila Anda memilih Tinggalkan, perubahan yang belum disimpan hilang.'],
      ['Di mana mengubah logo dan warna aplikasi?', 'Di menu Konten Situs › Tema Tampilan.']])}
    ${kontak()}` }),
  logs:() => ({ judul:'Bantuan Log Aktivitas', isi:`<p>Log Aktivitas mencatat aktivitas pengguna di kantor Anda, misalnya masuk, mengubah draf, dan mengubah izin.</p>
    <h4 class="bantu-sub">Langkah mencari</h4>
    ${lgkh(['Pilih <b>Jenis aktivitas</b>, misalnya Gagal masuk.', 'Ketik kata di <b>Cari keterangan</b>, misalnya nomor permohonan atau "atur ulang kata sandi".', 'Klik <b>Hapus Saringan</b> bila hasilnya kosong.'])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('l', [
      ['Apa arti status Gagal?', 'Aktivitas tidak berhasil, misalnya kata sandi salah atau akun ditangguhkan. Beberapa kegagalan berturut-turut dari akun yang sama perlu diperiksa.'],
      ['Bagaimana melihat aktivitas satu pengguna saja?', 'Saringan per pengguna belum tersedia. Gunakan Jenis aktivitas dan kata di keterangan, lalu lihat kolom Pelaku.'],
      ['Apa itu kolom IP?', 'Alamat jaringan perangkat yang dipakai saat aktivitas terjadi. Gunakan untuk menelusuri akses yang mencurigakan.'],
      ['Apa itu "Buka NIK lengkap"?', 'Catatan setiap kali pengguna menampilkan NIK para pihak secara utuh. Ini dicatat untuk perlindungan data pribadi.'],
      ['Bisakah log dihapus, diubah, atau diunduh?', 'Tidak. Log hanya dapat dibaca agar riwayat tetap utuh. Bila butuh salinan log, hubungi dukungan.'],
      ['Mengapa aktivitas lama tidak muncul?', 'Halaman menampilkan 50 aktivitas per halaman. Pindah halaman di bagian bawah tabel atau persempit saringan.']])}
    ${kontak()}` })
};
function bukaBantuan() { drawer(BANTUAN[S.layar]()); }

/* ---------------- protobar & daftar penyesuaian ---------------- */
$('#bukaUbah').textContent = `Daftar penyesuaian (${UBAH.length})`;
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar penyesuaian menu Pengaturan Aplikasi', lebar:true,
    isi:`<p>Menu Pengaturan Aplikasi tidak dinilai dalam laporan Heuristic Evaluation. Isi, kolom, dan perilaku mengikuti kode live dev-app.eppat.id/t/default; yang disesuaikan adalah komponen IDDS dengan brand E-PPAT, letak pesan, bahasa, dan Bantuan per halaman sesuai saran HE-UMUM-02. Daftar Pengguna memakai prototipe HE yang sudah ada. Daftar yang sama ada di spreadsheet Backlog-HE-EPPAT-Peruri.xlsx.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup', 'secondary', null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => { const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]); });
});
function lihat(u) {
  const sorot = () => { const el = u.sorot && $(u.sorot); if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); } };
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  if (u.ke === 'izin') { pindah('peran', () => dialogIzin(PERAN.find(r => r.code === 'ROLE_ASISTEN'), 'EPPAT_VERIFIKASI')); return; }
  if (u.ke === 'tambahPeran') { pindah('peran', () => dialogPeran(null)); return; }
  pindah(u.ke, sorot);
}
$('#aturUlang').addEventListener('click', () => { PERAN = contohPeran(); LOG = contohLog(); ATUR = ATUR0(); FORM = { ...ATUR }; const l = S.layar; S = S0(); S.layar = l; gambar(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
const awal = (location.hash || '').slice(1); if (RENDER[awal]) S.layar = awal;
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RENDER[h] && h !== S.layar) pindah(h); });
gambar();
})();
</script>
