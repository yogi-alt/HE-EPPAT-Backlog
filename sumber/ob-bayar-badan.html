<style id="ob-bayar-css">
/* ===== Onboarding · Simulasi Pembayaran (dev.eppat.id) — penyesuaian IDDS (IDDS-OB-46…60)
   Dua jalur simulasi: Enterprise langsung, dan Trial lalu Upgrade ke Enterprise (bukti live 26 Okt 23.03–23.06).
   Dua tampilan dalam satu berkas dengan keadaan bersama: Pelanggan (Dasbor, Riwayat Transaksi, Perpanjang Langganan) dan
   Operator (Manajemen Onboarding, Detail Pendaftar, Verifikasi Pembayaran, Detail Transaksi). Setiap langkah pembayaran
   disimulasikan satu per satu dan tercatat di Rekam Jejak Simulasi.
   - Tampilan Pelanggan: markup Dasbor/Pembayaran VA/Setelah lunas/Riwayat disalin dari onboard-badan.html (HE Onboarding);
     kerangka aplikasi pelanggan (sidebar, menu akun) disalin dari ob-masuk-badan.html.
   - Tampilan Operator: kerangka staf (CSS/HTML/JS bertanda) disalin dari ob-monitor-badan.html; tabel & Detail Transaksi dari
     ob-verif-badan.html; stepper sembilan tahap dari Detail Pendaftar ob-monitor. ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-modal-confirmation{max-width:560px}
.modal-gap>*+*{margin-top:12px}
.eb{font:600 11px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ina-content-secondary)}
.blok{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}
.blok h2{margin:0;font:600 18px/26px Inter,sans-serif;color:var(--ina-primary-primary)}
.blok-atas{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- kerangka staf Onboarding (salin persis) ---------- */
/* sidebar: grup + menu induk bertingkat (Verifikasi, Menu, Daftar Pengguna, Peran Pengguna) */
.sidebar .items[hidden],.sidebar .anak[hidden]{display:none}
.sidebar .items button.nav-induk{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;font:500 14px Inter,sans-serif;color:var(--ina-eppat-sidebar-content)}
.sidebar .items button.nav-induk svg{width:16px;height:16px;flex:none;color:currentColor}
.sidebar .items button.nav-induk:hover{background:var(--ina-eppat-sidebar-hover);color:#fff}
.sidebar .items button.nav-induk:focus-visible,.sidebar .grp:focus-visible{outline:2px solid #fff;outline-offset:1px}
.sidebar .items button.nav-induk.berisi-aktif{color:#fff;font-weight:600}
.sidebar .nav-induk .chev{margin-left:auto;display:grid;transition:.15s}
.sidebar .nav-induk .chev svg{width:12px;height:12px}
.sidebar .nav-induk[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sidebar .anak{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item.nav-anak{padding-left:28px}
.sidebar .items a.nav-item.nav-anak svg{width:15px;height:15px}
.sidebar .grp .tag-usulan{margin-left:0}
/* kepala: menu akun (IDDS Action Dropdown) */
.user-tombol{display:flex;align-items:center;gap:10px;padding:4px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;color:inherit}
.user-tombol:hover{background:var(--ina-background-secondary)}
.user-tombol:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.user-tombol .chev-u{color:var(--ina-content-secondary);display:grid}
.user .ina-action-dropdown__menu{position:absolute;right:0;left:auto;top:calc(100% + 6px);min-width:220px;z-index:30;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.user a.ina-action-dropdown__item{text-decoration:none;color:inherit}
.user .menu-kepala{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.user .menu-kepala b{font:600 14px Inter,sans-serif;color:var(--ina-primary-primary)}
.user .menu-kepala span{font-size:12px;color:var(--ina-content-secondary)}
/* ---------- akhir kerangka staf ---------- */

/* ===== Aplikasi pelanggan (kerangka dari ob-masuk-badan / onboard-badan) ===== */
#appP[hidden],#appO[hidden]{display:none}
#navP{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.side-ob .grp-lbl{margin:18px 4px 6px;font:600 11px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.62)}
.side-ob .versi{margin-top:auto;padding:14px 4px;border-top:1px solid rgba(255,255,255,.1);font:11px ui-monospace,Menlo,monospace;color:rgba(255,255,255,.62)}

/* Dasbor pelanggan (salin onboard-badan) */
.radio-kartu .ina-radio-input__group{display:grid;gap:12px}
.radio-kartu.dua .ina-radio-input__group{grid-template-columns:1fr 1fr;gap:16px}
.radio-kartu .ina-radio-input__main-label{grid-column:1/-1;margin:0}
.radio-kartu .ina-radio-input__option{align-items:flex-start;gap:12px;padding:16px 18px;border:1.5px solid var(--ina-stroke-primary);border-radius:16px;margin:0}
.radio-kartu .ina-radio-input__option:has(.ina-radio-input__field:checked){border-color:var(--ina-primary-600);box-shadow:0 0 0 1px var(--ina-primary-600);background:var(--ina-primary-25)}
.radio-kartu .ina-radio-input__option--disabled{background:var(--ina-background-secondary)}
.radio-kartu .ina-radio-input__option-label{display:block;flex:1;cursor:pointer}
.radio-kartu .ina-radio-input__option-label .atas{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pilih-paket h4{margin:0;font:600 20px Inter,sans-serif}
.pilih-paket .harga{margin:10px 0 8px;font:700 26px Inter,sans-serif;color:var(--ina-content-primary)}
.pilih-paket ul{margin:0;padding-left:18px;font-size:14px;line-height:24px;color:var(--ina-content-secondary)}
.radio-kartu .ina-radio-input__option-label small{display:block;font-size:13px;color:var(--ina-content-secondary)}
.kartu-aksi.ina-card{display:flex;flex-direction:row;align-items:center;gap:12px;width:100%;max-width:none;padding:14px 16px;text-align:left;font:inherit;cursor:pointer;border-radius:14px}
.kartu-aksi.ina-card:hover,.kartu-aksi.ina-card:focus-visible{border-color:var(--ina-primary-500);outline:0;background:var(--ina-primary-25)}
.kartu-aksi.ina-card:disabled{cursor:not-allowed;background:var(--ina-background-secondary)}
.hero-db{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px;border-radius:18px;background:#2c3c44;color:#fff}
.hero-db h2{margin:10px 0 4px;font:700 22px/30px Inter,sans-serif;color:#fff}
.hero-db p{margin:0;font-size:14px;color:rgba(255,255,255,.85)}
.hero-db .ina-button{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.25)!important;color:#fff!important}
.kartu-db.ina-card{display:block;width:100%;max-width:none;margin-top:16px;padding:22px 24px;border-radius:18px}
.kartu-db .ina-card__content{padding:0;display:block}
.kartu-db h3{margin:0;font:600 17px/26px Inter,sans-serif;color:var(--ina-content-primary)}
.kartu-db .ket{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.berikut-db{margin-top:16px}
.berikut-db .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.berikut-db .ina-alert__text-section{flex:1;min-width:200px}
.paket{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.paket label{display:block;padding:20px 22px;border:1.5px solid var(--ina-stroke-primary);border-radius:16px;cursor:pointer}
.paket label.dipilih{border-color:var(--ina-primary-600);box-shadow:0 0 0 1px var(--ina-primary-600);background:var(--ina-primary-25)}
.paket .atas{display:flex;align-items:center;gap:10px}
.paket h4{margin:0;font:600 20px Inter,sans-serif}
.paket .harga{margin:10px 0 8px;font:700 26px Inter,sans-serif;color:var(--ina-content-primary)}
.paket ul{margin:0;padding-left:18px;font-size:14px;line-height:24px;color:var(--ina-content-secondary)}
.kaki-db{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.kaki-db .ket{margin-right:auto}
.dua-kol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.metode{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.metode button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:1.5px solid var(--ina-stroke-primary);border-radius:14px;background:#fff;text-align:left;font:inherit;cursor:pointer}
.metode button:disabled{cursor:not-allowed;background:var(--ina-background-secondary);color:var(--ina-content-secondary)}
.metode b{display:block;font-size:15px}
.metode small{display:block;font-size:13px;color:var(--ina-content-secondary)}
.metode small.alasan{margin-top:4px;color:var(--ina-content-primary)}
.metode .ina-badge{margin-left:auto}
.tagihan{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tagihan .jml{text-align:right;font-size:12px;color:var(--ina-content-secondary);letter-spacing:1px}
.tagihan .jml b{display:block;font-size:18px;color:var(--ina-content-primary);letter-spacing:0}
.no-va{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:16px;border:1px solid var(--ina-stroke-primary);border-radius:14px;background:var(--ina-background-secondary)}
.no-va span{display:block;font-size:12px;letter-spacing:1px;color:var(--ina-content-secondary)}
.no-va b{display:block;font:700 22px ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--ina-content-primary);margin-top:4px;word-break:break-all}
.no-va .ina-button{margin-left:auto}
.kv-va{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv-va div{padding:10px 14px;border:1px solid var(--ina-stroke-primary);border-radius:12px;font-size:13px;color:var(--ina-content-secondary)}
.kv-va div b{display:block;margin-top:2px;font-size:14px;color:var(--ina-content-primary);word-break:break-all}
.kv-va .lebar{grid-column:1/-1}
.cara-bayar{margin-top:14px}
.cara-bayar h4{margin:0 0 2px;font:600 14px Inter,sans-serif;color:var(--ina-content-primary)}
.cara-bayar .ket-cara{margin:0 0 6px;font-size:12.5px;color:var(--ina-content-secondary)}
.cara-bayar .ina-accordion__body ol{margin:0;padding-left:20px;font-size:14px;line-height:22px}
.tombol-blok{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tombol-blok .ina-button{justify-content:center}
.email-pratinjau{margin-top:12px;border:1px solid var(--ina-stroke-primary);border-radius:14px;overflow:hidden;font-size:14px}
.email-pratinjau .kep{padding:10px 14px;background:var(--ina-background-secondary);font-size:12.5px;color:var(--ina-content-secondary)}
.email-pratinjau .isi{padding:16px 18px;line-height:22px}
.email-pratinjau .kotak{margin:12px 0;padding:12px 14px;border-radius:10px;background:var(--ina-background-secondary)}
.email-pratinjau .kotak small{display:block;font-size:11px;letter-spacing:1px;color:var(--ina-content-secondary)}
.bantuan-db{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bantuan-db .isi{flex:1;min-width:200px}
.rw-status{white-space:nowrap}
.siap-ikon{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:var(--ina-positive-100);color:var(--ina-content-positive);margin-bottom:10px}
.akses{margin-top:14px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:14px}
.akses small{display:block;font-size:12px;color:var(--ina-content-secondary)}
.akses a.url-kantor{display:inline-block;margin-top:4px;font-weight:600;color:var(--ina-primary-primary);overflow-wrap:anywhere}
.fitur-ok{list-style:none;margin:12px 0 0;padding:0;font-size:14px;line-height:26px;color:var(--ina-content-primary)}
.fitur-ok li{display:flex;gap:8px;align-items:center}
.fitur-ok svg{color:var(--ina-content-positive);flex:none}

/* Stepper sembilan tahap (salin Detail Pendaftar ob-monitor) */
.timeline-judul{display:flex;align-items:center;gap:8px}
.gulir-step{overflow-x:auto;padding-bottom:4px}
.stepper-ob.ina-stepper{display:flex;align-items:flex-start;width:100%;min-width:820px;margin-top:20px;padding:0}
.stepper-ob .ina-stepper__item{flex-direction:column;align-items:center;gap:6px;height:auto;max-height:none;flex:0 0 auto;width:92px;padding:0}
.stepper-ob .ina-stepper__label{position:static;transform:none;white-space:normal;text-align:center;font-size:12.5px;line-height:17px;max-width:92px;margin:0}
.stepper-ob .ina-stepper__item--active .ina-stepper__label > span,.stepper-ob .ina-stepper__item--completed .ina-stepper__label > span{font-weight:600;color:var(--ina-content-primary)}
.stepper-ob .ina-stepper__label small{display:block;margin-top:2px;font-size:11.5px;font-weight:400;color:var(--ina-content-secondary)}
.stepper-ob .ina-stepper__separator{align-self:flex-start;flex:1 1 auto;min-width:6px;margin:11px -34px 0;width:auto}
.stepper-ob .ina-stepper__icon-wrapper{position:relative;z-index:1}
.stepper-ob .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stepper-vt{display:none;margin-top:16px}
.stepper-vt .ina-stepper__label small{display:block;margin-top:2px;font-size:12px;font-weight:400;color:var(--ina-content-secondary)}
.stepper-vt .ina-stepper__item--active .ina-stepper__label > span,.stepper-vt .ina-stepper__item--completed .ina-stepper__label > span{font-weight:600;color:var(--ina-content-primary)}
.stepper-vt .ina-stepper__separator{min-height:22px;height:22px}
.stepper-vt .ina-stepper__item{height:auto;max-height:none;align-items:flex-start}
.stepper-vt .ina-stepper__label{white-space:normal}

/* daftar staf (salin ob-monitor / ob-verif) */
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}
.saring-ob{display:flex;flex-direction:column;gap:14px;margin-top:20px;padding:14px 16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px}
.saring-ob .baris{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.saring-ob .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--ina-content-primary)}
.saring-ob .ina-input-search{width:340px}
.saring-ob .jumlah{margin-left:auto;align-self:center;font-size:13px;color:var(--ina-content-secondary)}
.saring-ob .ina-chip__list{display:flex;flex-wrap:wrap;gap:8px}
.saring-ob .ina-chip__item{cursor:pointer;gap:6px}
.saring-ob .ina-chip__item:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.jml-chip{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--ina-background-secondary);color:var(--ina-content-primary);font-size:11.5px;font-weight:600;line-height:18px;text-align:center}
.ina-chip__item--selected .jml-chip{background:#fff;color:var(--ina-primary-primary)}
.tb a.url-kantor{color:var(--ina-primary-primary);text-decoration:underline;word-break:break-all;font-size:13.5px}
.tb .kontak-email{overflow-wrap:anywhere}
.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}
.halaman{flex-wrap:wrap}
.aksi-baris{display:flex;justify-content:flex-end}
.tabel-v table.tb{min-width:0}
.tabel-v .ina-table__cell{white-space:normal;vertical-align:middle;min-width:0}
.tabel-v a.url-kantor{display:inline-block;max-width:230px;word-break:normal;overflow-wrap:anywhere}
.tabel-v .aksi-baris .ina-button{white-space:nowrap}
.tabel-v .kd,.tabel-v .ina-badge{white-space:nowrap}
.atas-kanan{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
.ket-muat{font-size:13px;color:var(--ina-content-secondary)}
.kembali{margin-top:4px}
.ringkas-ob{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 24px;margin-top:16px}
.ringkas-ob dt{font-size:12.5px;color:var(--ina-content-secondary)}
.ringkas-ob dd{margin:4px 0 0;font-size:14px;color:var(--ina-content-primary);word-break:break-word}
/* Detail Transaksi (salin ob-verif) */
.rinci-atas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px;padding:16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.rinci-atas dt{font:600 11px Inter,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--ina-content-secondary)}
.rinci-atas dd{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ina-content-primary)}
.rinci{margin:12px 0 0}
.rinci > div{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--ina-stroke-primary)}
.rinci > div:first-child{border-top:0}
.rinci dt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ina-content-secondary)}
.rinci dd{margin:0;font-size:14px;font-weight:600;color:var(--ina-content-primary);overflow-wrap:anywhere}
.rinci dd.mono-n{font-family:ui-monospace,Menlo,monospace}
.uji-baris{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
#tabelRiwayatTrx .ina-table__cell,#tabelJejak .ina-table__cell{white-space:normal;vertical-align:top;font-size:13px}

/* Rekam Jejak Simulasi (panel prototipe) */
.protobar-sim{border-top:1px solid rgba(255,255,255,.08)}
.protobar .pil:disabled{opacity:.45;cursor:not-allowed}
.protobar .jejak-baru{font-size:11px;color:#E6EDEA;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jejak-ringkas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.jejak-ringkas div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.jejak-ringkas b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.jejak-ringkas span{font-size:13.5px;color:var(--ina-content-primary)}
.jejak-aksi{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#tabelJejak td:nth-child(2){min-width:120px}
#tabelJejak td:nth-child(4),#tabelJejak td:nth-child(5){min-width:150px}
#tabelJejak td:last-child{min-width:240px}
#lapisanDrawer .ina-drawer{z-index:900}
#lapisan .ina-modal{z-index:1000}
#lapisanDrawer .ina-drawer__panel--width-xl{width:min(1080px,100vw);max-width:100vw}

/* Jalur Trial lalu Upgrade (IDDS-OB-56…60) */
.sisa-trial{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.sisa-trial div{padding:10px 4px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-primary);text-align:center}
.sisa-trial b{display:block;font:700 24px/30px Inter,sans-serif;color:var(--ina-primary-primary)}
.sisa-trial span{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu-db h4.sub-kartu{margin:16px 0 0;font:600 14px Inter,sans-serif;color:var(--ina-content-primary)}
.kartu-upgrade h4{margin:0;font:600 15px Inter,sans-serif;color:var(--ina-content-primary)}
.akun-chip{display:inline-block;margin:10px 0 0;padding:4px 12px;border:1px solid var(--ina-stroke-primary);border-radius:999px;background:var(--ina-background-primary);font-size:13px;color:var(--ina-content-secondary);overflow-wrap:anywhere}
.akun-chip b{color:var(--ina-content-primary)}
#paketOp h3{margin:20px 0 0;font:600 15px Inter,sans-serif;color:var(--ina-content-primary)}

@media (max-width:1200px){ .ringkas-ob{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1100px){ .gulir-step{display:none} .stepper-vt{display:flex} }
@media (max-width:760px){
  .paket,.dua-kol,.kv-va,.ringkas-ob,.rinci-atas,.jejak-ringkas{grid-template-columns:1fr}
  .radio-kartu.dua .ina-radio-input__group{grid-template-columns:1fr}
  .saring-ob .baris > div,.saring-ob .ina-input-search{width:100%;min-width:0}
  .saring-ob .jumlah{margin-left:0}
  .user-tombol .chev-u{display:none}
  #userTombolP .txt{display:none}
  .halaman > span{white-space:normal}
  .aksi-baris{justify-content:flex-start}
  .atas-kanan{margin-left:0}
  .no-va .ina-button{margin-left:0}
  .protobar .jejak-baru{max-width:100%}
  .kartu-db.ina-card{padding:18px 16px}
}
.bantu-istilah{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:8px 0 4px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:13.5px;line-height:20px}
.bantu-istilah dt{font-weight:600}

    isi:'Di layar Pilih Metode Pembayaran, QRIS dan Transfer Bank tampil sebagai pilihan nonaktif berlencana "Segera hadir". Alasannya tertulis di bawah pilihan, yaitu "Belum tersedia. Gunakan Virtual Account.", dan juga dibacakan pembaca layar (aria-describedby). Daftar bank Virtual Account tidak lagi memuat QRIS, sehingga status QRIS seragam di kedua layar. BRI Virtual Account (kode bank 002) terpilih otomatis seperti di live, sedangkan BCA, BNI, dan Mandiri tetap "Segera hadir".',
    lama:'Di layar Pilih Metode Pembayaran, QRIS berlabel "COMING SOON". Setelah Virtual Account diklik, QRIS muncul di daftar bank sebagai pilihan aktif tanpa label ("Scan dari aplikasi bank atau e-wallet mana pun"), sementara bank lain berlabel "Segera hadir" (temuan #2). Pola yang sama terulang di halaman Upgrade ke Enterprise (bukti 26 Okt 23.05). Subjudulnya berbunyi "QRIS atau Virtual Account sesuai pilihan.", dan "QRIS — Scan dari aplikasi bank atau e-wallet mana pun" muncul di antara bank.', ke:{ t:'pelanggan', layar:'dasbor', langkah:2 }, sorot:'#metodeBayar' },

    lama:'Kartu "BRI Virtual Account · Pembayaran Terverifikasi" berisi "Selesaikan Pembayaran Dalam 23:59:24" dan "Berlaku sampai 13 Okt, 14.10" tanpa tahun. Label tertulis "Reference", dan nominal "Rp 1". "Panduan Pembayaran" berisi tiga kalimat umum yang sama untuk semua kanal. Hasil Cek Status Pembayaran (bukti 26 Okt 23.05, halaman Upgrade) hanya berupa kotak "Pembayaran belum terdeteksi. Silakan transfer terlebih dahulu." tanpa jam pengecekan (lihat IDDS-OB-58).', ke:{ t:'pelanggan', layar:'dasbor', langkah:5 }, sorot:'#kartuVa' },
  { kode:'IDDS-OB-48', judul:'Riwayat tahap tersinkron: Proses Pembayaran "Sedang berjalan" sejak VA dibuat',
    isi:'Pelanggan (Progres Registrasi Anda) dan operator (Detail Pendaftar) melihat IDDS Stepper sembilan tahap dari data yang sama. Tahap Proses Pembayaran bertanda "Sedang berjalan sejak 26 Okt 2026, 14.53" begitu VA dibuat. Sebelum VA dibuat, tahap itu bertanda "Menunggu tagihan dibuat". Tagihan kedaluwarsa atau gagal ditandai "Tertahan" beserta sebabnya. Proses Administrasi bertanda "Dimulai otomatis setelah lunas". Waktu tahap dicatat saat kejadian: Proses Pembayaran mulai saat VA dibuat dan selesai saat bank mengonfirmasi, sehingga tahap tidak lagi bertanggal sama. Progres pelanggan menampilkan sembilan tahap, termasuk Verifikasi Anggota, sama dengan tampilan operator. Status pendaftar di tabel memakai nama tahap baku ("Pilih Produk"). Detail Transaksi memuat Riwayat Status tagihan yang sama dengan rekam jejak.',
    lama:'Detail Riwayat "Uji Onboarding HE (PPAT990002)" mencatat Pendaftaran 26 Okt, 14.47 … Pilih Produk 26 Okt, 14.52. Proses Pembayaran tetap "Menunggu..." padahal VA kode 002 sudah dibuat pukul 14.52 dan berstatus UNPAID. Lunas, Proses Administrasi, dan Selesai juga "Menunggu...". Status di tabel tertulis "Pilih product". Setelah lunas (bukti 26 Okt 22.45), Proses Pembayaran, Lunas, Proses Administrasi, dan Selesai bertanggal sama "26 Okt, 22.45" padahal VA dibuat pukul 14.53. Akibatnya, lama tahap pembayaran tidak terbaca (pola yang sama dengan temuan #23). Progres pelanggan hanya menampilkan delapan tahap karena Verifikasi Anggota tidak tampil.', ke:{ t:'operator', layar:'onboarding-detail', langkah:4 }, sorot:'#riwayatTahap' },
  { kode:'IDDS-OB-49', judul:'Detail Transaksi: Waktu Pembuatan VA, Batas Waktu, dan Waktu Pembayaran terisi',

    lama:'Modal Detail Transaksi Pembayaran ORD-ENTERPRISE-1793001177 menampilkan "Waktu Create VA: -" walaupun VA sudah dibuat (temuan #6). Baris lain berbunyi "Batas Waktu / Expired: 27 Okt 2026, 14.53", metode "VIRTUAL ACCOUNT (002)", paket "ENTERPRISE", dan nominal "Rp 1". Status tagihan tidak tampil di modal. Setelah lunas (26 Okt 22.45), "Waktu Create VA" tetap "-", dan baris Batas Waktu diganti "Waktu Pembayaran (Paid At): 26 Okt 2026, 22.45".', ke:{ t:'operator', layar:'pembayaran-detail', langkah:4 }, sorot:'#blokTrx' },

function paginasi(jenis, hal, n) {
  const jh = Math.max(1, Math.ceil(n / PER_HAL)), a = n ? (hal - 1) * PER_HAL + 1 : 0, b = Math.min(n, hal * PER_HAL);
  let hs = []; for (let i = 1; i <= jh; i++) if (i === 1 || i === jh || Math.abs(i - hal) <= 1) hs.push(i); else if (hs[hs.length - 1] !== '…') hs.push('…');
  return `<div class="halaman"><span>Menampilkan ${a}–${b} dari ${n}</span><nav class="ina-pagination" aria-label="Navigasi halaman"><div class="ina-pagination__nav-container"><div class="ina-pagination__page-info">Halaman ${hal} dari ${jh}</div><div class="ina-pagination__nav-buttons">
    <button type="button" class="ina-pagination__nav-button ${hal > 1 ? '' : 'ina-pagination__nav-button--disabled'}" ${hal > 1 ? `data-hal="${jenis}:${hal - 1}"` : 'disabled'} aria-label="Halaman sebelumnya">${ik('kiri', 16)}</button>
    ${hs.map(i => i === '…' ? '<span class="ina-pagination__page-info" aria-hidden="true">…</span>' : `<button type="button" class="ina-pagination__page-button ${i === hal ? 'ina-pagination__page-button--active' : ''}" data-hal="${jenis}:${i}" ${i === hal ? 'aria-current="page"' : ''} aria-label="Halaman ${i}">${i}</button>`).join('')}
    <button type="button" class="ina-pagination__nav-button ${hal < jh ? '' : 'ina-pagination__nav-button--disabled'}" ${hal < jh ? `data-hal="${jenis}:${hal + 1}"` : 'disabled'} aria-label="Halaman berikutnya">${ik('chev', 16)}</button></div></div></nav></div>`;
}

function layarOnboarding() {

      ['Bisakah saya mengganti bank atau paket?', 'Bisa, selama pembayaran belum diterima. Klik Ganti bank pembayaran atau Ganti Paket. Tagihan lama dibatalkan, jadi jangan transfer ke nomor lama. Saat ini hanya BRI Virtual Account yang tersedia.'],
      ['Kapan aplikasi kantor saya aktif?', `Setelah pembayaran lunas, sistem menyiapkan aplikasi kantor (perkiraan ${est('± 1 hari kerja')}). Lencana berubah menjadi "Status akun: Aktif" dan Anda menerima email berisi tautan masuk.`],
      ['Apakah operator dapat menandai pembayaran saya lunas (mode uji)?', 'Tidak. Status Lunas hanya berasal dari konfirmasi bank setelah Anda mentransfer. Di lingkungan uji, transfer disimulasikan dari sisi bank, bukan dengan tombol di aplikasi.'],
      ['Mengapa QRIS tidak dapat dipilih?', 'QRIS dan Transfer Bank belum tersedia. Gunakan Virtual Account.'],
      ['Berapa lama Paket Trial berlaku?', '30 hari sejak Trial aktif. Sisa masa dan tanggal berakhirnya tampil di kartu Paket Trial aktif di Dasbor.'],
      ['Apa batas Paket Trial?', 'Trial berisi 10 transaksi dan paling banyak 5 pengguna. Semua menu dapat dibuka. Upgrade ke Enterprise membuka akses penuh tanpa batas: e-Sign, e-Seal, analitik lengkap, dan dukungan teknis mendalam.'],
      ['Bagaimana cara upgrade ke Enterprise?', 'Klik Upgrade Sekarang di kartu Paket Trial. Di halaman Upgrade ke Enterprise, pilih Virtual Account, lalu BRI, lalu Buat Virtual Account, dan transfer sebelum batas waktu. Trial tetap berjalan selama pembayaran belum diterima. Setelah lunas, paket Enterprise langsung aktif; alamat aplikasi, data, dan kata sandi tidak berubah.'],
      ['Apa yang terjadi saat Trial berakhir?', `${est('Anda tidak dapat membuat transaksi baru sampai upgrade ke Enterprise. Data kantor tetap tersimpan.')} Pengingat dikirim lewat email ${est('7 hari dan 1 hari')} sebelum Trial berakhir.`],
      ['Apakah saya menerima email aktivasi lagi setelah upgrade?', 'Tidak. Email "Akun e-PPAT Anda Sudah Aktif" hanya dikirim sekali, saat Trial aktif. Setelah upgrade, Anda menerima email "Pembayaran Berhasil Diterima". Gunakan alamat aplikasi dan kata sandi yang sama.'],
      FAQ_REKAM])}
    ${kontak()}` }),
  operator:() => ({ judul:'Bantuan Pembayaran untuk Operator', isi:`<p>Operator memantau tagihan Virtual Account di Verifikasi Pembayaran dan tahap pendaftar di Detail Pendaftar. Keduanya memakai data yang sama dengan dasbor pelanggan.</p>
    <h4 class="bantu-sub">Langkah memeriksa pembayaran</h4>
    ${lgkh(['Buka <b>Verifikasi Pembayaran</b>, lalu saring status atau cari nomor invoice.', 'Klik <b>Lihat Detail</b> untuk melihat waktu pembuatan VA, batas waktu, waktu pembayaran, dan Riwayat Status.', 'Buka <b>Detail Pendaftar</b> untuk melihat tahap yang sedang berjalan.', 'Halaman ini hanya untuk melihat. Status tagihan berubah sendiri dari konfirmasi bank.'])}
    <h4 class="bantu-sub">Arti status tagihan</h4>${istilah(ARTI_STATUS)}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('o', [
      ['Pelanggan sudah transfer, tetapi status belum Lunas. Apa yang harus dilakukan?', 'Verifikasi otomatis paling lama 10 menit. Klik Muat Ulang. Bila setelah 10 menit status tetap Belum Dibayar, minta bukti transfer dan teruskan ke tim dukungan.'],
      ['Berapa lama batas waktu Virtual Account?', '24 jam sejak VA dibuat. Waktunya tertulis di baris Waktu Pembuatan VA dan Batas Waktu.'],
      ['Pelanggan mentransfer nominal yang salah. Bagaimana?', 'VA hanya menerima nominal yang persis sama, jadi transfer itu ditolak bank dan status tidak berubah. Bila saldo pelanggan terpotong, teruskan bukti transfer ke tim dukungan.'],
      ['Pelanggan ingin mengganti bank. Apa dampaknya?', 'Tagihan lama berstatus Dibatalkan dan tagihan baru dibuat. Keduanya tampil di daftar transaksi.'],
      ['Kapan aplikasi kantor pelanggan aktif?', `Setelah Lunas, tahap Proses Administrasi berjalan (perkiraan ${est('± 1 hari kerja')}). Bila belum aktif, periksa Riwayat Tahap di Detail Pendaftar lalu hubungi tim administrasi.`],
      ['Bisakah operator menandai tagihan lunas di mode uji?', 'Tidak. Tombol sandbox dihapus dari layar operator. Status hanya berubah dari konfirmasi bank; di lingkungan uji, transfer disimulasikan dari sisi bank sehingga tercatat dengan pelaku Bank.'],
      ['Mengapa tahap Proses Pembayaran "Sedang berjalan"?', 'Tahap ini dimulai saat VA dibuat dan selesai saat bank mengonfirmasi pembayaran.'],
      ['Bagaimana melihat pelanggan Trial yang upgrade?', 'Di Detail Pendaftar, bagian Paket Langganan menampilkan masa Trial, order upgrade, dan Progres Upgrade. Order upgrade tampil di Verifikasi Pembayaran dengan nomor ORD-UPGRADE dan Jenis Order "Upgrade dari Trial ke Enterprise". Trial tidak muncul di Verifikasi Pembayaran karena tidak ada tagihan.'],
      FAQ_REKAM])}
    ${kontak()}` })
};
function bukaBantuan() { drawer(BANTUAN[S.tampilan]()); }

/* ---------------- protobar: daftar penyesuaian ---------------- */
$('#bukaUbah').textContent = `Daftar penyesuaian (${UBAH.length})`;
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar penyesuaian Simulasi Pembayaran', lebar:true,
    isi:`<p>Isi, langkah, dan istilah mengikuti live dev.eppat.id (tangkapan 26 Okt 2026). Yang disesuaikan adalah komponen IDDS dengan brand E-PPAT, kejujuran status, bahasa, konfirmasi aksi berdampak, dan Bantuan. Data di prototipe ini adalah data contoh.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup', 'secondary', null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => { const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]); });
});
function lihat(u) {
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  const k = u.ke;
  if (k.langkah) { const j = k.jalur || 'enterprise'; if (SIM.jalur !== j) mulaiSim(j); keLangkah(k.langkah); if (k.cabang === 'kedaluwarsa' && bisaCabang()) aksiKedaluwarsa(); }
  S.trx = null; S.pilih = 0;
  S.tampilan = k.t; S.layar = k.layar; S[k.t === 'operator' ? 'layarO' : 'layarP'] = k.layar;
  gambar(); window.scrollTo({ top:0 });
  const el = u.sorot && $(u.sorot); if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}
$('#aturUlang').addEventListener('click', konfirmasiMulaiUlang);
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });

/* ---------------- hash: #langkah-N (Enterprise langsung), #trial-N (Trial lalu Upgrade), #pelanggan, #operator, atau kunci layar ---------------- */
function bacaHash(h) {
  const m = /^(langkah|trial)-(\d)$/.exec(h);
  if (m) { const j = m[1] === 'trial' ? 'trial' : 'enterprise'; if (SIM.jalur !== j) mulaiSim(j); keLangkah(+m[2]); sinkronLayar(); return true; }
  if (h === 'pelanggan' || h === 'operator') { S.tampilan = h; S.layar = h === 'operator' ? S.layarO : S.layarP; return true; }
  if (RENDER_P[h]) { S.tampilan = 'pelanggan'; S.layar = S.layarP = h; return true; }
  if (RENDER_O[h]) { S.tampilan = 'operator'; S.layar = S.layarO = h; return true; }
  return false;
}
mulaiSim();
bacaHash(location.hash.slice(1));
window.addEventListener('hashchange', () => { if (bacaHash(location.hash.slice(1))) gambar(); });
gambar();
})();
</script>
