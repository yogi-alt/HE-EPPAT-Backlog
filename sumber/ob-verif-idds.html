<title>Backlog E-PPAT Peruri — Onboarding · Verifikasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CSS resmi IDDS (design.inadigital.go.id/getting-started/code/js), versi dikunci -->

<!-- Brand mode E-PPAT (brand-eppat-idds/eppat.css) -->
<style id="brand-eppat">
__EPPAT_CSS__

/* Bantuan dalam IDDS Drawer + Accordion */
.ina-drawer__content .bantu-langkah{margin:4px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.ina-drawer__content .bantu-langkah li{margin-bottom:8px}
.ina-drawer__content > p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.ina-drawer__content .bantu-sub{margin:20px 0 8px}
.ina-drawer__content .bantu-kontak{grid-template-columns:1fr}
.ina-drawer__content .ina-accordion{border-bottom:1px solid var(--ina-stroke-primary)}
.ina-drawer__content .ina-accordion__body p{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}

.judul-halaman{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.judul-halaman .judul-kiri{min-width:0}
</style>
<style id="kerangka-css">
/* ===== Order AJB — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 23–24 (HE-ORDER-01…05)
   Kerangka & teks mengikuti layar live Peruri (dilihat 23 Okt 2026, akun Asisten). ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ina-content-primary);background:var(--ina-background-secondary);-webkit-font-smoothing:antialiased}

/* protobar (khusus prototipe) */
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#0f1a17;color:#E6EDEA;font-size:12px;position:relative;z-index:60}
.protobar a{color:#E6EDEA;text-decoration:none;border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:500 11px Inter,sans-serif}
.protobar b{color:#fff}
.protobar .sep{opacity:.6}
.protobar button.pil{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
.protobar button.pil[aria-pressed="true"]{background:#3D6B5E;border-color:#3D6B5E;color:#fff}
.protobar .kanan{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
.protobar .utama{background:#3D6B5E!important;border-color:#3D6B5E!important;color:#fff!important;font-weight:600!important}
.tag-usulan{display:none!important;align-items:center;font:600 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.penanda .tag-usulan{display:inline-flex!important}
body.penanda .ditandai{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px;border-radius:10px}
.sorot{outline:3px solid #2563EB!important;outline-offset:4px;border-radius:12px}

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:var(--eppat-sidebar-icon)}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu warna (pola backlog Perdana Niaga) — nanti dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:#C2BB4B;--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.ava{width:32px;height:32px;font:600 12px Inter,sans-serif;background:var(--ina-primary-primary)!important;color:#fff!important;border-color:var(--ina-primary-primary)!important}
.uname{display:block;font:600 12px/14px Inter,sans-serif;color:var(--ina-primary-primary)}
.urole{font:400 10px Inter,sans-serif;color:var(--ina-content-secondary);letter-spacing:1.4px;text-transform:uppercase}
.content{flex:1;background-color:var(--ina-background-secondary);__BG__}
.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}

/* daftar order */
.daftar-atas{display:flex;justify-content:flex-end;margin-top:20px}
.saring{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:12px;align-items:end;margin-top:16px}
.saring .ina-text-field__label{display:block}
.saring .cari-wadah .ina-input-search{width:100%;margin-top:6px} /* IDDS Input Search, sama dengan Minuta & Verifikasi */
.tabel-wadah{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tabel-gulir{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tabel-wadah .ina-table{border:0;border-radius:0}
table.tb td{vertical-align:middle}
table.tb td .kd{font-weight:600;color:var(--ina-primary-primary);cursor:pointer}
table.tb td .kc{font-size:12px;color:var(--ina-content-secondary)}
table.tb tr.klik{cursor:pointer}
table.tb tr.klik:hover td{background:var(--ina-primary-25)}
.aksi-baris{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kosong{padding:28px;text-align:center;color:var(--ina-content-secondary)}
.halaman{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--ina-stroke-primary);font-size:13px;color:var(--ina-content-secondary)}
.halaman > span{white-space:nowrap}
[data-merah]{color:var(--ina-negative-600)!important}
.tb .ina-table__cell,.tb .ina-table__header-cell{padding:12px 16px}
.tb .ina-table__cell{white-space:normal}
.lengkap{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.lengkap.ok{color:var(--ina-content-positive)}
.lengkap.kurang{color:var(--ina-content-secondary)}
.lengkap svg{flex:none}

/* detail order */
.det-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-kepala .kode{font:600 14px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);margin-top:12px}
.det-kepala h2{margin:2px 0 0;font:600 20px/28px Inter,sans-serif}
.status-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px 28px}
.status-kartu .ina-stepper{align-items:flex-start;min-height:92px;padding:4px 64px 0}
.status-kartu .ina-stepper__separator{align-self:flex-start;margin-top:11px}
.status-kartu .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.status-kaki{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ina-stroke-primary);margin-top:8px;padding-top:16px}
.status-kaki p{margin:0;font-size:14px;color:var(--ina-content-secondary)}
.status-kaki p b{color:var(--ina-content-primary)}
.status-kaki .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status-kaki .alasan{font-size:12.5px;color:var(--ina-content-secondary)}
.syarat{margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.syarat h4{margin:0 0 10px;font:600 13px Inter,sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syarat h4 .hit{font-weight:500;color:var(--ina-content-secondary)}
.syarat ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.syarat li{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.syarat li .ik{width:20px;height:20px;border-radius:999px;display:grid;place-items:center;flex:none}
.syarat li.ok .ik{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.syarat li.kurang .ik{background:var(--ina-warning-100);color:var(--ina-warning-600)}
.syarat li.ok span.t{color:var(--ina-content-secondary)}
.syarat li .ina-button{padding:0;height:auto;min-height:0}
.syarat-alert{margin-top:16px}
.syarat-alert .ina-alert__description{display:flex;flex-direction:column;gap:10px}
.syarat-daftar{display:flex;flex-wrap:wrap;gap:8px 16px}
.syarat-item{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-badge{display:inline-flex;align-items:center;gap:4px}
.syarat-item .ina-button{padding:0 4px}
.langkah-berikut{color:var(--ina-content-primary)}
.info-baris{margin-top:16px}
.info-baris .ina-alert__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%}
.info-baris .ina-alert__text-section{flex:1;min-width:220px}

.tab-kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;overflow:hidden}
.tab-kartu > .ina-tab-horizontal{padding:0 12px;border-bottom:1px solid var(--ina-stroke-primary)}
.tab-kartu .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center}
.tab-kartu .tanda{font:600 11px Inter,sans-serif;border-radius:999px;padding:1px 7px}
.tab-kartu .tanda.ok{background:var(--ina-positive-100);color:var(--ina-content-positive)}
.tab-kartu .tanda.kurang{background:var(--ina-warning-100);color:var(--ina-warning-700)}
.tab-kartu .tanda.netral{background:var(--ina-neutral-100);color:var(--ina-content-secondary)}
.tab-isi{padding:20px}
.tab-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tab-bar p{margin:0;font-size:13px;color:var(--ina-content-secondary)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-field textarea.ina-text-field__input{min-height:80px;resize:vertical;padding:0}
.f-kaki{display:flex;justify-content:flex-end;margin-top:16px}
.tb .nm{font-weight:500}
.tb .sub2{font-size:12px;color:var(--ina-content-secondary)}
.kunci{margin-bottom:16px}

/* dialog */
.ina-modal__body p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary)}
.seg button{border:0;border-radius:7px;background:transparent;padding:7px 14px;font:500 14px Inter,sans-serif;color:var(--ina-content-secondary);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ina-primary-primary);color:#fff}
.fld{margin-bottom:16px}
.fld > .ina-text-field__label{display:flex;align-items:center;gap:6px}
.select-wadah{position:relative;display:block;width:100%}
.select-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:0;max-height:240px}
.cari-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.1);padding:4px;max-height:220px;overflow:auto}
.cari-panel button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.cari-panel button:hover{background:var(--ina-background-tertiary)}
.cari-panel small{display:block;font-size:12px;color:var(--ina-content-secondary)}
.kartu-pihak{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px;background:var(--ina-background-secondary);font-size:13.5px}
.kartu-pihak b{display:block;font-size:14px;margin-bottom:6px}
.kartu-pihak dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0}
.kartu-pihak dt{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu-pihak dd{margin:0}
.belum-ada{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--ina-primary-25);border:1px solid var(--ina-primary-100);font-size:13px}
.ringkas-kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;margin:12px 0 14px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas-kv dt{color:var(--ina-content-secondary)}
.ringkas-kv dd{margin:0;font-weight:500}
.cek-setuju{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;cursor:pointer}

.daftar-ubah{display:flex;flex-direction:column;gap:10px}
.daftar-ubah .it{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px}
.daftar-ubah .it .a{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daftar-ubah .it code{font:600 11.5px ui-monospace,Menlo,monospace;color:#2563EB}
.daftar-ubah .it b{font-size:14px}
.daftar-ubah .it p{margin:6px 0 4px;font-size:13px;line-height:19px;color:var(--ina-content-primary)}
.daftar-ubah .it .lama{font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.bantu-langkah{margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.bantu-langkah li{margin-bottom:6px}
.bantu-sub{margin:18px 0 8px;font:600 14px Inter,sans-serif;display:flex;align-items:center}
.bantu-faq{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.bantu-faq summary{cursor:pointer;font-weight:500}
.bantu-faq p{margin:8px 0 0!important}
.bantu-kontak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bantu-kontak div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.bantu-kontak b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.bantu-kontak span{font-size:14px}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.toast-wadah{position:fixed;bottom:24px;right:24px;z-index:100;max-width:calc(100vw - 32px)}
.tip{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--ina-stroke-secondary);color:var(--ina-content-secondary);font:600 10px Inter,sans-serif;cursor:help;background:transparent;padding:0}
.ina-tooltip__bubble{max-width:260px;white-space:normal}

@media (max-width:1024px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,26,23,.45);z-index:35;opacity:0;pointer-events:none;transition:.22s}
  .scrim.on{opacity:1;pointer-events:auto}
  .syarat ul{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  header.top{padding:0 16px}
  .user .txt,#bukaBantuan span{display:none}
  .page{padding:20px 16px 40px}
  h1{font-size:23px;line-height:32px}
  .saring{grid-template-columns:1fr}
  .f-grid,.syarat ul,.kartu-pihak dl,.bantu-kontak{grid-template-columns:1fr}
  .status-kartu{padding:18px 16px}
  .status-kartu .stepper-h{display:none}
  .status-kartu .stepper-v{display:flex!important;padding:4px 0}
  .ringkas-kv{grid-template-columns:1fr;gap:2px}
  .protobar .kanan{margin-left:0}
  table.tb thead{display:none}
  table.tb tr{display:block;border-top:1px solid var(--ina-stroke-primary);padding:8px 0}
  table.tb td{display:block;border:0;padding:4px 16px}
  .aksi-baris{justify-content:flex-start}
}
.status-kartu .stepper-v{display:none}
.status-kartu .stepper-v .ina-stepper__label small{display:inline;margin:0 0 0 8px}
.status-kartu .stepper-v .ina-stepper__separator{min-height:24px;height:24px}
</style>
<style id="ob-verif-css">
/* ===== Onboarding · Verifikasi (Admin Onboarding, dev.eppat.id): Verifikasi Anggota, Detail Verifikasi, Verifikasi Produk, Verifikasi Pembayaran, Detail Transaksi — penyesuaian IDDS (IDDS-OB-21…30)
   Isi, kolom, saringan, dan alur mengikuti live dev.eppat.id; yang disesuaikan hanya komponen (IDDS + brand E-PPAT), kejujuran label,
   bahasa, status sistem, galat di bawah isian, konfirmasi aksi berdampak, penjaga perubahan, dan Bantuan per halaman.
   Kerangka staf (CSS, HTML, JS) disalin persis dari ob-monitor-badan.html. ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-modal-confirmation{max-width:560px}
.modal-gap>*+*{margin-top:12px}
.eb{font:600 11px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ina-content-secondary)}
.blok{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}
.blok h2{margin:0;font:600 18px/26px Inter,sans-serif;color:var(--ina-primary-primary)}

.sidebar .items button.nav-induk.berisi-aktif{color:#fff;font-weight:600}
.sidebar .nav-induk .chev{margin-left:auto;display:grid;transition:.15s}
.sidebar .nav-induk .chev svg{width:12px;height:12px}

.sidebar .anak{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item.nav-anak{padding-left:28px}
.sidebar .items a.nav-item.nav-anak svg{width:15px;height:15px}
.sidebar .grp .tag-usulan{margin-left:0}
/* kepala: menu akun (IDDS Action Dropdown) */
.user-tombol{display:flex;align-items:center;gap:10px;padding:4px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;color:inherit}
.user-tombol:hover{background:var(--ina-background-secondary)}
.user-tombol:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}
.user-tombol .chev-u{color:var(--ina-content-secondary);display:grid}
.user .ina-action-dropdown__menu{position:absolute;right:0;left:auto;top:calc(100% + 6px);min-width:220px;z-index:30;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.user a.ina-action-dropdown__item{text-decoration:none;color:inherit}
.user .menu-kepala{display:flex;flex-direction:column;gap:2px;padding:8px 12px}
.user .menu-kepala b{font:600 14px Inter,sans-serif;color:var(--ina-primary-primary)}
.user .menu-kepala span{font-size:12px;color:var(--ina-content-secondary)}

/* daftar (pola sama dengan Manajemen Onboarding) */
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}

.saring-ob .baris{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.saring-ob .lbl{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--ina-content-primary)}
.saring-ob .ina-input-search{width:340px}
.saring-ob .jumlah{margin-left:auto;align-self:center;font-size:13px;color:var(--ina-content-secondary)}
.saring-ob .ina-chip__list{display:flex;flex-wrap:wrap;gap:8px}
.saring-ob .ina-chip__item{cursor:pointer;gap:6px}

.jml-chip{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--ina-background-secondary);color:var(--ina-content-primary);font-size:11.5px;font-weight:600;line-height:18px;text-align:center}
.ina-chip__item--selected .jml-chip{background:#fff;color:var(--ina-primary-primary)}
.tb a.url-kantor{color:var(--ina-primary-primary);text-decoration:underline;word-break:break-all;font-size:13.5px}

.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}
.halaman{flex-wrap:wrap}
.aksi-baris{display:flex;justify-content:flex-end}
.tabel-v table.tb{min-width:0}
.tabel-v .ina-table__cell{white-space:normal;vertical-align:middle;min-width:0}
.tabel-v a.url-kantor{display:inline-block;max-width:230px;word-break:normal;overflow-wrap:anywhere}
.tabel-v .aksi-baris .ina-button{white-space:nowrap}

.kembali{margin-top:4px}

.foto-tombol:hover{border-color:var(--ina-primary-primary);color:var(--ina-primary-primary)}
.foto-tombol:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px}

.keputusan .baris-aksi{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.keputusan p{margin:8px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.keputusan .draf{margin-top:10px;font-size:13px;color:var(--ina-content-primary)}
.keputusan .draf:empty{display:none}

.form-kaki{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
.form-kaki .ket-simpan{font-size:13px;color:var(--ina-content-secondary)}
.ket-toggle{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--ina-content-primary);cursor:pointer}
.ket-toggle .ina-toggle:focus-visible{outline:2px solid var(--ina-primary-500);outline-offset:2px;border-radius:999px}
#tabelKontak .ina-table__cell{white-space:normal;vertical-align:middle}
#tabelKontak .kontak-isi{overflow-wrap:anywhere}
.foto-tombol .nama-kantor{display:block;font:600 14px Inter,sans-serif;color:var(--ina-content-primary);text-align:center;padding:0 8px}
.foto-tombol .kode-kantor{display:block;margin-top:2px;font:12px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary);text-align:center}
/* tab Kantor PPAT: markup, teks, dan perilaku disalin dari Profil Saya (OB-MASUK) */
#panel-kantor > .sub-blok:first-child{margin-top:0}
.sub-blok{border:1px solid var(--ina-stroke-primary);border-radius:14px;padding:18px 20px;margin-top:16px}
.sub-kepala{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px;padding-bottom:12px;border-bottom:1px solid var(--ina-stroke-primary);font:600 16px Inter,sans-serif;color:var(--ina-primary-primary)}
.sub-kepala .kanan{margin-left:auto}
.sub-judul{margin:18px 0 0;font:600 14px Inter,sans-serif;color:var(--ina-primary-primary)}

.form-p .lebar{grid-column:1/-1}

.ina-text-field__wrapper--disabled{background:var(--ina-background-secondary)}
.ina-text-area textarea{width:100%;font:inherit;font-size:14px}
.kartu-kaki{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.kaki-st{margin-right:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ina-content-secondary)}
.kaki-st.ada{color:var(--ina-warning-700,#6b4c00)}
.ikon-saja.ina-button{padding:6px;min-width:0}
.lokasi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.peta{position:relative;margin-top:12px;border:1px solid var(--ina-stroke-primary);border-radius:12px;overflow:hidden;background:#eef1ec;min-height:300px}
.peta svg.dasar{display:block;width:100%;height:300px;cursor:crosshair}
.peta .cari-peta{position:absolute;top:10px;left:56px;right:10px}
.peta .zoom{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px}
.peta .zoom button{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ina-stroke-primary);border-radius:8px;background:#fff;cursor:pointer;color:var(--ina-content-primary)}
.peta .zoom button:focus-visible{outline:2px solid var(--ina-primary-500)}
.peta-ket{margin:6px 0 0;font-size:12.5px;color:var(--ina-content-secondary)}
#blokKontakKantor .ina-table__cell{white-space:normal;vertical-align:middle}

/* Detail Transaksi */
.rinci-atas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px;padding:16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;background:var(--ina-background-secondary)}
.rinci-atas dt{font:600 11px Inter,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:var(--ina-content-secondary)}
.rinci-atas dd{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ina-content-primary)}
.rinci{margin:12px 0 0}
.rinci > div{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--ina-stroke-primary)}
.rinci > div:first-child{border-top:0}
.rinci dt{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ina-content-secondary)}
.rinci dd{margin:0;font-size:14px;font-weight:600;color:var(--ina-content-primary);overflow-wrap:anywhere}
.rinci dd.mono-n{font-family:ui-monospace,Menlo,monospace}

@media (max-width:1100px){ .det-grid{grid-template-columns:minmax(0,1fr)} .foto-tombol{aspect-ratio:auto;min-height:160px} }
@media (max-width:760px){
  .saring-ob .baris > div,.saring-ob .ina-input-search{width:100%;min-width:0}

  .halaman > span{white-space:normal}
  .aksi-baris{justify-content:flex-start}
  .form-grid,.rinci-atas,.form-p,.form-p.dua-k,.lokasi{grid-template-columns:1fr}
  #panel-kantor .sub-blok{padding:14px}
  .atas-kanan{margin-left:0}
}
.bantu-istilah{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:8px 0 4px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:13.5px;line-height:20px}
.bantu-istilah dt{font-weight:600}
.bantu-istilah dd{margin:0;color:var(--ina-content-secondary)}
ol.bantu-langkah{padding-left:22px}
@media (max-width:760px){ .bantu-istilah{grid-template-columns:1fr} .bantu-istilah dd{margin-bottom:6px} }

/* ---------------- komponen bersama halaman ---------------- */
function paginasi(jenis, hal, n) {
  const jh = Math.max(1, Math.ceil(n / PER_HAL)), a = n ? (hal - 1) * PER_HAL + 1 : 0, b = Math.min(n, hal * PER_HAL);
  let hs = []; for (let i = 1; i <= jh; i++) if (i === 1 || i === jh || Math.abs(i - hal) <= 1) hs.push(i); else if (hs[hs.length - 1] !== '…') hs.push('…');
  return `<div class="halaman"><span>Menampilkan ${a}–${b} dari ${n}</span><nav class="ina-pagination" aria-label="Navigasi halaman"><div class="ina-pagination__nav-container"><div class="ina-pagination__page-info">Halaman ${hal} dari ${jh}</div><div class="ina-pagination__nav-buttons">
    <button type="button" class="ina-pagination__nav-button ${hal > 1 ? '' : 'ina-pagination__nav-button--disabled'}" ${hal > 1 ? `data-hal="${jenis}:${hal - 1}"` : 'disabled'} aria-label="Halaman sebelumnya">${ik('kiri', 16)}</button>
    ${hs.map(i => i === '…' ? '<span class="ina-pagination__page-info" aria-hidden="true">…</span>' : `<button type="button" class="ina-pagination__page-button ${i === hal ? 'ina-pagination__page-button--active' : ''}" data-hal="${jenis}:${i}" ${i === hal ? 'aria-current="page"' : ''} aria-label="Halaman ${i}">${i}</button>`).join('')}
    <button type="button" class="ina-pagination__nav-button ${hal < jh ? '' : 'ina-pagination__nav-button--disabled'}" ${hal < jh ? `data-hal="${jenis}:${hal + 1}"` : 'disabled'} aria-label="Halaman berikutnya">${ik('chev', 16)}</button></div></div></nav></div>`;
}

const chipSaring = (id, label, jenis, opsi, aktif) => `<div class="ina-chip ditandai" id="${id}"><div class="ina-chip__list" role="group" aria-label="${label}">${opsi.map(([k, t, n]) => `<button type="button" class="ina-chip__item ina-chip__item--size-small ina-chip__item--variant-outline ${aktif === k ? 'ina-chip__item--selected' : ''}" data-saring="${jenis}:${k}" aria-pressed="${aktif === k}">${t}<span class="jml-chip">${n.toLocaleString('id-ID')}</span></button>`).join('')}</div></div>`;

    ${istilah([['Trial', 'Paket coba gratis dengan batas waktu dan transaksi.'], ['Enterprise', 'Paket berbayar. Tagihannya terlihat di Verifikasi Pembayaran.'], ['ORD-RENEW', 'Order perpanjangan paket Enterprise.'], ['Aktif', 'Paket sudah berjalan.']])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('p', [
      ['Mengapa tidak ada tombol aksi di tabel ini?', 'Seperti di aplikasi live, status paket berubah sendiri: Trial aktif saat dipilih, Enterprise aktif setelah pembayaran lunas. Halaman ini hanya untuk memantau.'],
      ['Mengapa satu anggota punya beberapa order?', 'Anggota dapat memulai dengan Trial, lalu memilih Enterprise, lalu memperpanjangnya. Setiap pilihan tercatat sebagai order baru.'],
      ['Bagaimana memeriksa pembayaran order Enterprise?', 'Buka Verifikasi Pembayaran, lalu cari kode order yang sama di kolom Invoice.'],
      ['Apa beda Trial dan Enterprise?', 'Trial gratis dengan batas waktu. Enterprise berbayar. Rinciannya ada di Pengaturan › Harga Produk.'],
      ['Bagaimana mencari order tertentu?', 'Ketik kode order, misalnya ORD-TRIAL, di kotak Cari order.'],
      ['Mengapa daftar belum berubah?', 'Daftar dimuat saat halaman dibuka. Muat ulang halaman untuk melihat order terbaru.']])}
    ${kontak()}` }),
  pembayaran:() => ({ judul:'Bantuan Verifikasi Pembayaran', isi:`<p>Verifikasi Pembayaran menampilkan semua tagihan Virtual Account untuk paket Enterprise beserta status pembayarannya.</p>
    <h4 class="bantu-sub">Langkah memeriksa tagihan</h4>
    ${lgkh(['Pilih status di chip saringan, misalnya <b>Belum Dibayar</b>.', 'Ketik nama, nomor invoice, atau nomor VA di kotak <b>Cari transaksi</b>.', 'Klik <b>Lihat Detail</b> untuk melihat rincian tagihan.', 'Klik <b>Muat Ulang</b> untuk mengambil status pembayaran terbaru.'])}
    <h4 class="bantu-sub">Arti status</h4>
    ${istilah([['Lunas', 'Tagihan sudah dibayar.'], ['Belum Dibayar', 'Tagihan sudah dibuat dan menunggu dibayar.'], ['Kedaluwarsa', 'Tagihan tidak dibayar sampai batas waktunya. Anggota perlu membuat tagihan baru.'], ['Gagal', 'Pembayaran ditolak bank atau terjadi gangguan.']])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('b', [
      ['Apakah status pembayaran berubah sendiri?', 'Ya. Status berubah saat bank mengirim konfirmasi. Klik Muat Ulang untuk melihat status terbaru.'],
      ['Anggota sudah membayar, tetapi status masih Belum Dibayar. Apa yang harus dilakukan?', 'Klik Muat Ulang. Bila status tetap sama setelah 15 menit, minta bukti transfer dan hubungi tim dukungan.'],
      ['Apa yang harus dilakukan bila tagihan kedaluwarsa?', 'Minta anggota masuk ke portal dan memilih paket lagi agar tagihan baru dibuat.'],
      ['Apa arti angka di kolom VA / Kode?', 'Nomor Virtual Account tujuan transfer untuk tagihan itu.'],
      ['Apakah saya dapat mengubah status secara manual?', 'Tidak. Status hanya berubah dari konfirmasi bank agar catatan pembayaran tetap sah.'],
      ['Mengapa saringan Gagal kosong?', 'Belum ada pembayaran yang gagal. Klik Tampilkan Semua untuk melihat semua transaksi.']])}
    ${kontak()}` }),
  'pembayaran-detail':() => ({ judul:'Bantuan Detail Transaksi', isi:`<p>Detail Transaksi Pembayaran menampilkan rincian satu tagihan Virtual Account: pengguna, paket, nomor VA, nominal, dan waktu pembayarannya.</p>
    <h4 class="bantu-sub">Istilah</h4>
    ${istilah([['Virtual Account (002)', 'Nomor rekening sementara untuk tagihan ini; 002 adalah kode bank penerbit.'], ['Waktu Pembuatan VA', 'Waktu nomor Virtual Account dibuat. "Belum ada" berarti waktunya tidak tercatat.'], ['Waktu Pembayaran', 'Waktu bank mengonfirmasi pembayaran.']])}
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${fq('t', [
      ['Mengapa Waktu Pembuatan VA tertulis "Belum ada"?', 'Waktu pembuatan tidak tercatat untuk tagihan ini. Tagihan tetap sah bila statusnya Lunas.'],
      ['Bagaimana memastikan pembayaran sudah masuk?', 'Lihat lencana status di kanan atas. Lunas berarti bank sudah mengonfirmasi pembayaran.'],
      ['Apakah nominal tagihan dapat diubah?', 'Tidak dari halaman ini. Nominal mengikuti harga paket di Pengaturan › Harga Produk saat tagihan dibuat.'],
      ['Bagaimana melihat order paket yang terkait?', 'Buka Verifikasi Produk, lalu cari nomor invoice yang sama di kolom Kode Order.'],
      ['Tagihan kedaluwarsa. Apa langkah selanjutnya?', 'Minta anggota memilih paket lagi di portal agar tagihan baru dibuat.'],
      ['Bagaimana kembali ke daftar?', 'Klik "Kembali ke Verifikasi Pembayaran". Saringan dan halaman tabel tetap seperti sebelumnya.']])}
    ${kontak()}` })
};
function bukaBantuan() { drawer(BANTUAN[S.layar]()); }

/* ---------------- protobar & daftar penyesuaian ---------------- */
$('#bukaUbah').textContent = `Daftar penyesuaian (${UBAH.length})`;
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar penyesuaian Verifikasi Onboarding', lebar:true,
    isi:`<p>Isi, kolom, saringan, dan alur mengikuti live dev.eppat.id (akun Admin). Yang disesuaikan adalah komponen IDDS dengan brand E-PPAT, kejujuran label, bahasa, status sistem, galat di bawah isian, konfirmasi aksi berdampak, penjaga perubahan, dan Bantuan per halaman. Data di prototipe ini adalah data contoh.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup', 'secondary', null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => { const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]); });
});
function lihat(u) {
  const sorot = () => { const el = u.sorot && $(u.sorot); if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); } };
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  pindah(u.ke, () => { if (u.ke === 'anggota-detail' && S.tab !== 'ppat') $('#tab-ppat').click(); sorot(); });
}
$('#aturUlang').addEventListener('click', () => { DATA = contohPendaftar(); siapkanAnggota(); PRODUK = contohProduk(); TRANSAKSI = contohTransaksi(); const l = S.layar; S = S0(); S.layar = l; gambar(); gambarMenu(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
const awal = (location.hash || '').slice(1); if (RENDER[awal]) S.layar = awal;
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RENDER[h] && h !== S.layar) pindah(h); });
gambar();
})();
</script>
</body>
