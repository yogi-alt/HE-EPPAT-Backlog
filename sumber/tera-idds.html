<!doctype html>
<html lang="id" data-brand="eppat" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backlog E-PPAT Peruri — Registrasi TERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CSS resmi IDDS (design.inadigital.go.id/getting-started/code/js), versi dikunci -->
<link href="https://unpkg.com/@idds/styles@1.6.38/dist/index.min.css" rel="stylesheet">
<!-- Brand mode E-PPAT (brand-eppat-idds/eppat.css) -->
<style id="brand-eppat">
__EPPAT_CSS__

/* Bantuan dalam IDDS Drawer + Accordion */
.ina-drawer__content .bantu-langkah{margin:4px 0 4px;padding-left:20px;font-size:14px;line-height:21px}
.ina-drawer__content .bantu-langkah li{margin-bottom:8px}
.ina-drawer__content > p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.ina-drawer__content .bantu-sub{margin:20px 0 8px}
.ina-drawer__content .bantu-kontak{grid-template-columns:1fr}
.ina-drawer__content .ina-accordion{border-bottom:1px solid var(--ina-stroke-primary)}
.ina-drawer__content .ina-accordion__body p{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}

.judul-halaman{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.judul-halaman .judul-kiri{min-width:0}
</style>
<style id="tera-css">
/* ===== Registrasi TERA — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital hal. 20–22 (HE-TERA-01…07)
   Kerangka (sidebar, header, latar) mengikuti layar live Peruri dengan token --ina-eppat-*. ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font-family:inherit}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ina-content-primary);background:var(--ina-background-secondary);-webkit-font-smoothing:antialiased}

/* protobar (khusus prototipe) */
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;background:#0f1a17;color:#E6EDEA;font-size:12px;position:relative;z-index:60}
.protobar a{color:#E6EDEA;text-decoration:none;border:1px dashed rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:500 11px Inter,sans-serif}
.protobar b{color:#fff}
.protobar .sep{opacity:.35}
.protobar .sim{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.protobar .sim span{opacity:.7}
.protobar button.pil{border:1px solid rgba(255,255,255,.25);background:transparent;color:#E6EDEA;font:500 11px Inter,sans-serif;padding:4px 10px;border-radius:999px;cursor:pointer}
.protobar button.pil[aria-pressed="true"]{background:#3D6B5E;border-color:#3D6B5E;color:#fff}
.protobar .kanan{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap}
.protobar .utama{background:#3D6B5E!important;border-color:#3D6B5E!important;color:#fff!important;font-weight:600!important}
.tag-usulan{display:none!important;align-items:center;font:600 10px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#2563EB;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.penanda .tag-usulan{display:inline-flex!important}
body.penanda .ditandai{outline:2px dashed rgba(37,99,235,.45);outline-offset:4px;border-radius:10px}
.sorot{outline:3px solid #2563EB!important;outline-offset:4px;border-radius:12px}

/* kerangka aplikasi — struktur pola Sidebar & Header IDDS, warna dari brand E-PPAT (--ina-eppat-*, --ina-primary-*) */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--ina-eppat-sidebar-bg);border-right:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding:0 16px}
.brand{display:flex;align-items:center;height:76px;flex:none;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand img{width:150px;display:block}
.kantor.ina-card{flex:none;background:var(--ina-eppat-office-card);border:0;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kantor .ina-card__content{padding:0;gap:0}
.kantor .eyebrow{font:600 10px/15px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#1f1f1f;opacity:.7}
.kantor .ina-card__title{margin:4px 0 0;font:600 10px/1.375 Inter,sans-serif;color:#1f1f1f}
.kantor .ina-card__description{-webkit-line-clamp:unset;line-clamp:unset;display:block;overflow:visible;margin:0;font-size:12px;line-height:18px;color:#1f1f1f}
.kantor .kantor-info{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:9px;line-height:13px;opacity:.8}
.kantor .baris-kantor{display:flex;align-items:flex-start;gap:6px;font-size:9px;line-height:13px;font-weight:500;color:#1f1f1f}
.kantor .baris-kantor svg{flex:none;width:10px;height:10px;margin-top:1px}
#nav{flex:1;display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;cursor:pointer;padding:16px 8px 6px;color:rgba(255,255,255,.72);font:500 12px/16px Inter,sans-serif;letter-spacing:0;text-transform:none} /* label grup sentence case (pola Sidebar IDDS) */
.grp svg{flex:none;color:var(--eppat-sidebar-icon)}
.grp > span:not(.chev){flex:1;min-width:0;text-align:left;line-height:16px} /* label grup rata kiri, sejajar ikon */
/* ikon sidebar satu warna (pola backlog Perdana Niaga) — nanti dari Konten Situs › Tema Tampilan */
:root{--eppat-sidebar-icon:#C2BB4B;--eppat-sidebar-active-icon:#FFFFFF}
.grp .chev{margin-left:auto;transition:.15s;display:grid}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.items{display:flex;flex-direction:column;gap:2px}
.sidebar .items a.nav-item{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:8px;max-height:none;border-radius:8px;text-decoration:none;font-weight:500;color:var(--ina-eppat-sidebar-content)!important;background:transparent}
.sidebar .items a.nav-item svg{width:16px;height:16px;flex:none;color:var(--eppat-sidebar-icon)}
.sidebar .items a.nav-item:hover{background:var(--ina-eppat-sidebar-hover);color:#fff!important}
.sidebar .items a.nav-item.on{background:var(--ina-eppat-sidebar-active);color:#fff!important;font-weight:600}
.sidebar .items a.nav-item.on svg{color:var(--eppat-sidebar-active-icon)}
.sidefoot{flex:none;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.75)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--ina-background-primary);border-bottom:1px solid var(--ina-stroke-primary);position:sticky;top:0;z-index:20}
.spacer{margin-left:auto}
.user{position:relative;display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px}
.ava{width:32px;height:32px;font:600 12px Inter,sans-serif;background:var(--ina-primary-primary)!important;color:#fff!important;border-color:var(--ina-primary-primary)!important}
.uname{display:block;font:600 12px/14px Inter,sans-serif;color:var(--ina-primary-primary)}
.urole{font:400 10px Inter,sans-serif;color:var(--ina-content-secondary);letter-spacing:1.4px;text-transform:uppercase}
.content{flex:1;background-color:var(--ina-background-secondary);__BG__}
.page{padding:24px 32px 56px}
.page .ina-breadcrumb{margin-bottom:8px;display:flex;justify-content:flex-start}
.page .ina-breadcrumb__list{justify-content:flex-start;margin:0;padding:0}
h1{margin:0;font:500 28px/36px Inter,sans-serif;letter-spacing:-.3px;color:var(--ina-primary-primary)}
.sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}

/* menu profil (IDDS Action Dropdown) */
.user .ina-action-dropdown__menu{position:absolute;right:0;top:calc(100% + 6px);min-width:280px;z-index:30;cursor:default;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.ina-action-dropdown__item .ket-st{margin-left:auto}

/* kartu umum (token IDDS) */
.kartu{margin-top:20px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:24px}
.eb{font:600 11px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kartu h3{margin:6px 0 8px;font:500 22px/30px Inter,sans-serif;color:var(--ina-primary-primary)}
.kartu .ket{margin:0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}

/* pengingat TERA (IDDS Alert + aksi) */
.ingat{margin:0 0 16px}
.ingat .ina-alert{text-align:left}
.ingat .ina-alert__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex:1;width:100%;text-align:left}
.ingat .ina-alert__text-section{flex:1;min-width:220px;text-align:left}

/* dashboard */
.kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-top:24px}
.kpi > div{position:relative;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px;padding:20px}
.kpi small{display:block;max-width:70%;font:600 11px/16px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kpi i{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:999px;background:var(--ina-primary-50);display:grid;place-items:center;color:var(--ina-primary-primary)}
.kpi i svg{width:15px;height:15px}
.kpi b{display:block;margin-top:18px;font:400 30px Inter,sans-serif;color:var(--ina-primary-primary)}
.kpi span{font-size:12.5px;color:var(--ina-content-secondary)}
.dash-dua{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.dash-dua .kartu{margin:0}
.donat{display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0}
.legenda{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:14px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:999px}
.batang{position:relative;height:220px;margin:6px 8px 0 40px;border-left:1px solid var(--ina-stroke-secondary);border-bottom:1px solid var(--ina-stroke-secondary)}
.batang .bar{position:absolute;left:0;top:50%;height:20px;transform:translateY(-50%);border-radius:0 6px 6px 0;background:var(--ina-primary-primary)}
.batang .lbl{position:absolute;left:-36px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ina-content-secondary)}
.sumbu{display:flex;justify-content:space-between;margin:6px 8px 0 40px;font-size:12px;color:var(--ina-content-secondary)}
.dash-baris{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--ina-stroke-primary);cursor:pointer}
.dash-baris:first-of-type{border-top:0}
.dash-baris .isi{flex:1;min-width:0}
.dash-baris .kd{font:600 14px Inter,sans-serif;color:var(--ina-primary-primary);margin-right:6px}
.dash-baris .nm{margin-top:3px;font-size:14px}
.dash-baris .kc{font-size:12px;color:var(--ina-content-secondary)}
.dash-baris svg{color:var(--ina-content-tertiary);flex:none}

/* akun saya */
.akun-tab{margin-top:24px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:12px;padding:0 8px}
.akun-tab .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center;justify-content:center}
.titik{width:7px;height:7px;border-radius:999px;background:var(--ina-warning-500);display:inline-block}
.kv-akun{margin:16px 0 0}
.kv-akun div{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--ina-stroke-primary);font-size:15px}
.kv-akun dt{font:500 11px Inter,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--ina-content-secondary);align-self:center}
.kv-akun dd{margin:0}
.kv-akun dd small{font-size:11px;color:var(--ina-content-secondary);margin-left:6px}
.atas{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* registrasi TERA */
.judul-tera{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.judul-tera h3{display:flex;align-items:center;gap:8px;margin:0}
.siapkan{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:12px;font-size:13px;color:var(--ina-content-secondary)}
.siapkan b{color:var(--ina-content-primary);font-weight:600}
.tahap{margin-top:20px;padding-top:20px;border-top:1px solid var(--ina-stroke-primary)}
/* keterangan kedua ditaruh di dalam label stepper IDDS agar selalu sejajar dengan labelnya */
.tahap .stepper-h{align-items:flex-start;min-height:92px;padding:4px 84px 0}
.tahap .stepper-h .ina-stepper__separator{align-self:flex-start;margin-top:11px}
.tahap .stepper-v{display:none}
.tahap .stepper-v .ina-stepper__label small{display:inline;margin:0 0 0 8px}
.tahap .stepper-v .ina-stepper__separator{min-height:28px;height:28px}
.tahap .ina-stepper__label small{display:block;margin-top:3px;font-size:12px;line-height:16px;font-weight:400;color:var(--ina-content-secondary)}
.isi-tim{border-bottom:1px dashed currentColor;cursor:help}
.tahap .ina-alert{margin-top:18px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;margin-top:4px}
.f-grid .ina-text-field,.f-grid .ina-select-dropdown,.f-grid .ina-file-upload{min-width:0}
.ket-bagian{margin:4px 0 18px!important;font-size:13px!important}
.lbl-baris{display:flex;align-items:center;gap:6px}
.ina-text-field__label.lbl-baris{display:flex}
.ina-tooltip .tip-ikon{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--ina-stroke-secondary);color:var(--ina-content-secondary);font:600 10px Inter,sans-serif;cursor:help;background:transparent;padding:0}
.ina-tooltip__bubble{max-width:260px;white-space:normal}
.hitung{margin-left:auto;font-size:12px;color:var(--ina-content-secondary);white-space:nowrap}
.hitung.ok{color:var(--ina-content-positive)}
.ina-text-field__bottom-area{display:flex;gap:8px}
.select-wadah{position:relative}
.select-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:0;max-height:240px}
.warna-baris{display:flex;gap:8px;align-items:center}
.warna-baris input[type=color]{width:44px;height:44px;padding:2px;border:1px solid var(--ina-stroke-primary);border-radius:8px;background:var(--ina-background-primary);cursor:pointer;flex:none}
.warna-baris .ina-text-field{flex:1}
.berkas-baris{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.berkas-baris .nama{font-size:13px;color:var(--ina-content-secondary)}
.berkas-baris .nama.ada{color:var(--ina-content-positive)}
.stempel-wadah{display:flex;gap:16px;align-items:center}
.stempel{width:104px;height:104px;flex:none;border-radius:999px;border:3px solid currentColor;display:grid;place-items:center;text-align:center;position:relative;background:#fff}
.stempel::before{content:"";position:absolute;inset:6px;border:1px solid currentColor;border-radius:999px}
.stempel span{max-width:76px;font:700 9px/11.5px Inter,sans-serif;letter-spacing:.4px;text-transform:uppercase;word-break:break-word}
.stempel-wadah p{margin:0;font-size:12px;line-height:17px;color:var(--ina-content-secondary)}
.f-kaki{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px}
.kaki-st{margin-right:auto;font-size:13px;color:var(--ina-content-secondary);display:flex;align-items:center;gap:6px}
.kaki-galat{margin-right:auto;font-size:13px;color:var(--ina-content-negative)}
.kaki-galat a{color:inherit;text-decoration:underline;cursor:pointer}

/* dialog */
.ringkas-kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:12px 0 16px;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas-kv dt{color:var(--ina-content-secondary)}
.ringkas-kv dd{margin:0;font-weight:500;word-break:break-word}
.ina-modal__body p{margin:0 0 8px;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.daftar-ubah{display:flex;flex-direction:column;gap:10px}
.daftar-ubah .it{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:12px 14px}
.daftar-ubah .it .a{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.daftar-ubah .it code{font:600 11.5px ui-monospace,Menlo,monospace;color:#2563EB}
.daftar-ubah .it b{font-size:14px}
.daftar-ubah .it p{margin:6px 0 4px;font-size:13px;line-height:19px;color:var(--ina-content-primary)}
.daftar-ubah .it .lama{font-size:12.5px;line-height:18px;color:var(--ina-content-secondary)}
.kpi.kpi-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dasbor-dua{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media (max-width:1024px){ .dasbor-dua{grid-template-columns:1fr} }
@media (max-width:760px){ .kpi.kpi-3{grid-template-columns:1fr} }
/* bantuan (HE-UMUM-02) */
.bantu-langkah{margin:8px 0 4px;padding-left:20px;font-size:14px;line-height:21px;color:var(--ina-content-primary)}
.bantu-langkah li{margin-bottom:8px}
.bantu-sub{margin:18px 0 8px;font:600 14px Inter,sans-serif;color:var(--ina-content-primary);display:flex;align-items:center}
.bantu-faq{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.bantu-faq summary{cursor:pointer;font-weight:500}
.bantu-faq p{margin:8px 0 0!important}
.bantu-kontak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bantu-kontak div{border:1px solid var(--ina-stroke-primary);border-radius:10px;padding:10px 12px;background:var(--ina-background-secondary)}
.bantu-kontak b{display:block;font-size:12px;font-weight:500;color:var(--ina-content-secondary)}
.bantu-kontak span{font-size:14px;color:var(--ina-content-primary)}
@media (max-width:760px){ .bantu-kontak{grid-template-columns:1fr} #bukaBantuan span{display:none} }
.toast-wadah{position:fixed;bottom:24px;right:24px;z-index:100;max-width:calc(100vw - 32px)}

@media (max-width:1180px){ .kpi{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1024px){
  .dash-dua{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(15,26,23,.45);z-index:35;opacity:0;pointer-events:none;transition:.22s}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media (max-width:760px){
  header.top{padding:0 16px}
  .user .txt{display:none}
  .page{padding:20px 16px 40px}
  h1{font-size:23px;line-height:32px}
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-grid{grid-template-columns:1fr}
  .kv-akun div,.ringkas-kv{grid-template-columns:1fr;gap:2px}
  .protobar .kanan{margin-left:0}
  .akun-tab .ina-tab-horizontal__tab{padding-left:8px;padding-right:8px;font-size:13px}
  .tahap .stepper-h{display:none}
  .tahap .stepper-v{display:flex;padding:4px 0}
}
</style>
</head>
<body>

<div class="protobar">
  <a href="index.html">&#9776; Daftar prototipe</a>
  <span class="sep">&bull;</span><b>Registrasi TERA</b><span class="sep">&bull;</span>
  <span class="sim" id="simStatus"></span>
  <span class="kanan">
    <button class="pil" id="sakelarPenanda" aria-pressed="false">Tandai usulan</button>
    <button class="pil utama" id="bukaUbah">Daftar perubahan (9)</button>
  </span>
</div>

<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="__LOGO__" alt="E-PPAT"></div>
    <div class="ina-card ina-card--variant-basic kantor"><div class="ina-card__content"><div>
      <div class="eyebrow">Kantor Notaris &amp; PPAT</div>
      <h3 class="ina-card__title">PPAT Contoh Satu, S.H.</h3>

function periksa(f, v) {
  const n = String(v || '').trim();
  if (f.wajib && !n) return `${f.l} wajib diisi.`;
  if (!n) return '';
  if (f.k === 'nik' && n.length !== 16) return 'NIK harus 16 angka.';
  if (f.tipe === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(n)) return 'Format email belum benar, contoh: nama@contoh.id';
  if (f.k === 'nomor_telepon' && !/^08\d{8,11}$/.test(n)) return 'Nomor ponsel diawali 08 dan berisi 10–13 angka.';
  if (f.k === 'telepon_organisasi' && !/^0\d{8,12}$/.test(n)) return 'Nomor telepon diawali 0 dan berisi 9–13 angka.';
  if (f.k === 'nomor_npwp' && n.length !== 15 && n.length !== 16) return 'NPWP harus 15 atau 16 angka.';
  if (f.k === 'tanggal_lahir' && n > new Date().toISOString().slice(0, 10)) return 'Tanggal lahir tidak boleh melewati hari ini.';
  if (f.k === 'code_warna' && !/^#[0-9A-Fa-f]{6}$/.test(n)) return 'Kode warna belum benar, contoh: #0A1F47';
  return '';
}

  const ikon = (i, k) => k === 'completed' ? `<svg class="ina-stepper__check-icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5l10 -10"/></svg>`

  const KET = {
    belum:['info','Lengkapi data di bawah ini, lalu klik <b>Simpan Pendaftaran</b>.'],
    pending:['info','Data Anda sedang diperiksa admin E-PPAT. Anda masih bisa mengubah data selama tahap ini.'],
    submitted:['info','Peruri sedang memproses pendaftaran Anda. Anda tidak perlu melakukan apa pun sampai stempel aktif.'],
    active:['success','Stempel elektronik kantor Anda sudah aktif dan siap dibubuhkan pada akta.'],
    rejected:['critical','Pendaftaran ditolak karena nama pada KTP berbeda dengan nama pada SK. Perbaiki data, lalu klik <b>Perbarui Pendaftaran</b> untuk mengajukan ulang.']
  }[S.status];
  const langkah = () => T.map((t, i) => {
    const k = kelas(i);
    return `${i ? `<div class="ina-stepper__separator ${i <= pos && S.status !== 'rejected' || (S.status === 'rejected' && i === 1) ? 'ina-stepper__separator--completed' : ''}"></div>` : ''}
      <div class="ina-stepper__item ${k ? 'ina-stepper__item--' + k : ''}"><div class="ina-stepper__icon-wrapper">${ikon(i, k)}</div><div class="ina-stepper__label">${t[0]}<small>${t[1]}</small></div></div>`; }).join('');
  /* desktop/tablet: Stepper Horizontal IDDS; ponsel: Stepper Vertical IDDS (sesuai panduan IDDS) */
  return `<div class="tahap ditandai" id="tahap">
    <div class="ina-stepper ina-stepper--horizontal ina-stepper--horizontal-responsive stepper-h">${langkah()}</div>
    <div class="ina-stepper ina-stepper--vertical stepper-v">${langkah()}</div>
    ${alert(KET[0], '', KET[1] + usulan('HE-TERA-07'))}
  </div>`;
}

function kartuBagian(b) {

}

/* satu isian — IDDS Text Field / Select Dropdown / File Upload */
function labelIsi(f, untuk) {
  return `<label class="ina-text-field__label lbl-baris" ${untuk ? `for="${untuk}"` : ''}>${f.l}${f.wajib ? '<span class="ina-text-field__required">*</span>' : ''}${f.tip ? `<span class="ina-tooltip ina-tooltip--placement-top"><button type="button" class="tip-ikon" aria-label="${esc(f.tip)}">?</button><span class="ina-tooltip__content"><span class="ina-tooltip__bubble">${f.tip}</span></span></span>` : ''}</label>`;
}
function bawah(f, v, g) {
  const hitung = f.k === 'nik' && v ? `<span class="hitung ${v.length === 16 ? 'ok' : ''}">${v.length}/16</span>` : '';
  if (g) return `<div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text ina-text-field__helper-text--error">${g}</div>${hitung}</div>`;
  if (f.help || hitung) return `<div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text">${f.help || ''}</div>${hitung}</div>`;
  return '';
}
function isian(f) {
  const v = S.form[f.k] ?? '', g = S.galat[f.k], id = 'i-' + f.k, st = g ? ' ina-text-field__wrapper--status-error' : '';
  if (f.berkas) return `<div class="ina-file-upload" id="f-${f.k}"><div class="ina-file-upload__label">${f.l}</div>
    <div class="berkas-baris">${tombol('Pilih File', 'secondary', 'sm', `data-berkas="${f.k}"`, ik('unggah', 14))}<span class="nama ${v ? 'ada' : ''}">${v ? '&#10003; ' + esc(v) : 'Belum ada file. PDF, JPG, atau PNG.'}</span></div>
    ${f.help ? `<div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text">${f.help}</div></div>` : ''}</div>`;
  if (f.pilih) {
    const pilihan = f.pilih.find(p => p[0] === v), buka = S.selectBuka === f.k;
    return `<div class="ina-select-dropdown select-wadah" id="f-${f.k}">${labelIsi(f)}
      <button type="button" class="ina-select-dropdown__trigger ina-select-dropdown__trigger--size-md ${g ? 'ina-select-dropdown__trigger--status-error' : ''}" data-pilih="${f.k}" aria-haspopup="listbox" aria-expanded="${buka}">
        <span class="ina-select-dropdown__trigger-text ${v ? 'ina-select-dropdown__trigger-text--selected' : 'ina-select-dropdown__trigger-text--placeholder'}">${esc(pilihan && v ? pilihan[1] : (f.pilih[0][0] === '' ? f.pilih[0][1] : 'Pilih'))}</span>${ik('bawah', 16)}</button>
      ${buka ? `<div class="ina-select-dropdown__panel" role="listbox"><div class="ina-select-dropdown__options">${f.pilih.filter(p => p[0] !== '').map(([a, b]) => `<button type="button" role="option" aria-selected="${a === v}" class="ina-select-dropdown__option ${a === v ? 'ina-select-dropdown__option--selected-single' : ''}" data-opsi="${f.k}" data-nilai="${a}">${b}</button>`).join('')}</div></div>` : ''}
      ${bawah(f, v, g)}</div>`;
  }
  if (f.warna) return `<div class="ina-text-field" id="f-${f.k}">${labelIsi(f, id)}<div class="warna-baris"><input type="color" data-k="${f.k}" value="${/^#[0-9A-Fa-f]{6}$/.test(v) ? v : '#0A1F47'}" aria-label="Pilih warna stempel">
      <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md${st}" style="flex:1"><input type="text" id="${id}" data-k="${f.k}" class="ina-text-field__input" value="${esc(v)}" maxlength="7"></div></div>${bawah(f, v, g)}</div>`;
  return `<div class="ina-text-field" id="f-${f.k}">${labelIsi(f, id)}
    <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md${st}"><input type="${f.tipe || 'text'}" id="${id}" data-k="${f.k}" class="ina-text-field__input" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.angka ? 'inputmode="numeric"' : ''} aria-invalid="${!!g}"></div>
    ${bawah(f, v, g)}</div>`;
}
function pratinjau() {
  const w = /^#[0-9A-Fa-f]{6}$/.test(S.form.code_warna) ? S.form.code_warna : '#0A1F47';
  return `<div class="ina-text-field" id="f-_pratinjau"><div class="ina-text-field__label">Pratinjau Stempel${usulan('HE-TERA-04')}</div>

}
function kaki() {
  const g = SEMUA.filter(f => S.galat[f.k]);

  return `${kiri}${tombol(S.status === 'belum' ? 'Simpan Pendaftaran' : 'Perbarui Pendaftaran', 'primary', 'md', 'id="simpanTera"', ik('simpan', 16))}`;

  const t = e.target.closest('[data-tab]'); if (t) { S.tab = t.dataset.tab; gambar(); return; }

  const op = e.target.closest('[data-opsi]'); if (op) { const f = SEMUA.find(x => x.k === op.dataset.opsi); S.form[f.k] = op.dataset.nilai; S.selectBuka = null; if (S.galat[f.k]) { const g = periksa(f, S.form[f.k]); if (g) S.galat[f.k] = g; else delete S.galat[f.k]; } perbaruiIsian(f, null); return; }

H.addEventListener('input', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  const f = SEMUA.find(x => x.k === el.dataset.k);
  let v = el.value;
  if (f.angka) { v = v.replace(/\D/g, '').slice(0, f.angka); el.value = v; }
  S.form[f.k] = v;
  if (S.galat[f.k]) { const g = periksa(f, v); if (g) S.galat[f.k] = g; else delete S.galat[f.k]; }
  perbaruiIsian(f, el);
});
H.addEventListener('focusout', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  const f = SEMUA.find(x => x.k === el.dataset.k);
  if (!String(S.form[f.k] || '').trim()) return;
  const g = periksa(f, S.form[f.k]);
  if ((g || undefined) !== S.galat[f.k]) { if (g) S.galat[f.k] = g; else delete S.galat[f.k]; perbaruiIsian(f, null); }
});
function perbaruiIsian(f, fokus) {
  const lama = $('#f-' + f.k); if (!lama) return;
  const tipe = fokus && fokus.type, pos = fokus && fokus.selectionStart;
  const t = document.createElement('div'); t.innerHTML = isian(f).trim(); lama.replaceWith(t.firstChild);
  if (fokus) { const baru = [...document.querySelectorAll(`[data-k="${f.k}"]`)].find(x => x.type === tipe); if (baru) { baru.focus(); try { baru.setSelectionRange(pos, pos); } catch (_) {} } }
  if (f.k === 'isi_stempel' || f.k === 'code_warna') { const p = $('#f-_pratinjau'); if (p) { t.innerHTML = pratinjau().trim(); p.replaceWith(t.firstChild); } }
  const k = $('#fKaki'); if (k) k.innerHTML = kaki();
}
function fokusIsian(k) {
  const el = $('#f-' + k); if (!el) return;
  el.scrollIntoView({ block:'center', behavior:'smooth' });
  const i = el.querySelector('input,button'); i && setTimeout(() => i.focus({ preventScroll:true }), 350);
}

/* ---------------- simpan: periksa (HE-TERA-05) → konfirmasi (HE-TERA-06) ---------------- */
function simpan() {
  S.galat = {};
  SEMUA.forEach(f => { const g = periksa(f, S.form[f.k]); if (g) S.galat[f.k] = g; });
  const salah = SEMUA.filter(f => S.galat[f.k]);
  if (salah.length) { gambar(); fokusIsian(salah[0].k); return; }
  const F = S.form, nik = F.nik.slice(0, 4) + '********' + F.nik.slice(-4);
  const dok = [F.id_card && 'Scan KTP', F.lampiran && 'Lampiran', F.dokumen_tambahan && 'Logo stempel'].filter(Boolean);
  dialog({ judul: S.status === 'belum' ? 'Simpan pendaftaran TERA?' : 'Perbarui pendaftaran TERA?',
    isi:`<p>Pastikan data berikut sudah sesuai dengan KTP dan SK pengangkatan Anda.</p>
      <dl class="ringkas-kv"><dt>Nama Lengkap</dt><dd>${esc(F.nama_lengkap)}</dd><dt>NIK</dt><dd>${nik}</dd><dt>ID PPAT / Nomor SK</dt><dd>${esc(F.id_ppat || '—')}</dd><dt>Isi Stempel</dt><dd>${esc(F.isi_stempel)}</dd><dt>Dokumen</dt><dd>${dok.length ? dok.join(', ') : 'Belum ada dokumen yang diunggah'}</dd></dl>
      <p>Setelah disimpan, admin E-PPAT akan memeriksa data Anda. Anda masih bisa mengubahnya selama pemeriksaan berlangsung.</p>
      <p>Perkiraan waktu sampai stempel aktif: <b>${est('± 4–7 hari kerja')}</b> (pemeriksaan admin ± 1–2 hari kerja, proses Peruri ± 3–5 hari kerja).${usulan('HE-TERA-07')}</p>`,
    tombol:[['Periksa Lagi','secondary',null],[S.status === 'belum' ? 'Simpan' : 'Perbarui','primary',() => {
      S.simpanan = { ...S.form }; if (perluTindakan()) S.status = 'pending';
      gambar(); $('#tahap').scrollIntoView({ block:'center', behavior:'smooth' }); toast('Pendaftaran TERA berhasil disimpan.', 'positive');
    }]] });
}



/* ---------------- tombol Bantuan di judul halaman (HE-UMUM-02) ---------------- */

}

let tt;
function toast(teks, state = 'default', ms = 3000) {
  $('#toastWadah').innerHTML = `<div class="ina-toast ina-toast--state-${state} ina-toast--style-solid ina-toast--visible" role="status">
    <div class="ina-toast__icon">${ik(state === 'positive' ? 'centang' : 'info', 20)}</div>
    <div class="ina-toast__content"><div class="ina-toast__text-area"><p class="ina-toast__title">${teks}</p></div></div>
    <button class="ina-toast__close-button" aria-label="Tutup notifikasi" data-tutup-toast>${ik('x', 16)}</button></div>`;
  clearTimeout(tt); tt = setTimeout(() => $('#toastWadah').innerHTML = '', ms);
}
$('#toastWadah').addEventListener('click', e => { if (e.target.closest('[data-tutup-toast]')) $('#toastWadah').innerHTML = ''; });

/* ---------------- daftar perubahan ---------------- */
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar perubahan Registrasi TERA', lebar:true,
    isi:`<p>Usulan disusun dari laporan Heuristic Evaluation INA Digital (halaman 20–22 dan rekomendasi IDDS). Daftar yang sama tersedia di spreadsheet Backlog-HE-EPPAT-Peruri.xlsx.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup','secondary',null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => {
    const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]);
  });
});
function lihat(u) {
  S.menuProfil = false; S.galat = {};
  if (u.ke === 'bantuan') { S.layar = 'akun'; S.tab = 'tera'; gambar(); bukaBantuan(); return; }
  if (u.ke === 'dashboard') { S.status = 'belum'; S.ingatTutup = false; S.form = KOSONG(); S.simpanan = null; S.layar = 'akun'; pindahLayar('dashboard'); }
  else if (u.ke === 'profil') { pindahLayar('dashboard'); S.menuProfil = true; gambarProfil(); }
  else {
    if (u.ke === 'tera-galat') { S.status = 'belum'; S.form = { ...KOSONG(), nik:'320000000001', email:'ppat@contoh' }; S.simpanan = null; }
    if (u.ke === 'tera-konfirm') { S.status = 'belum'; S.form = TERISI(); S.simpanan = null; }
    S.layar = 'akun'; S.tab = 'tera'; gambar();
    if (u.ke === 'tera-galat' || u.ke === 'tera-konfirm') { simpan(); return; }
  }
  const el = u.sorot && $(u.sorot);
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}

$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
gambar();
})();
