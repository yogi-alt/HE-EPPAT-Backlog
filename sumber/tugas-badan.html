<style id="tugas-css">
.kartu-akun{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.kartu-akun.dua{grid-template-columns:repeat(2,minmax(0,1fr))}.kartu-akun.satu{grid-template-columns:minmax(0,1fr)}
.kartu-akun section.ina-card .ina-card__content{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:16px;text-align:left}
.kartu-akun section.ina-card .ina-card__content > div{flex:1;min-width:0}
.kartu-akun .ina-button{flex:none}
.kartu-akun h3{margin:0;font:600 15px/22px Inter,sans-serif;color:var(--ina-primary-primary);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kartu-akun p{margin:6px 0 0;font-size:13px;line-height:18px;color:var(--ina-content-secondary)}
.kelompok{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.kelompok button{position:relative;text-align:left;padding:16px;border:1px solid var(--ina-stroke-primary);border-radius:16px;background:var(--ina-background-primary);color:var(--ina-content-primary);font:inherit;cursor:pointer}
.kelompok button[aria-pressed="true"]{border-color:var(--ina-primary-500);box-shadow:0 0 0 1px var(--ina-primary-500)}
.kelompok small{display:block;padding-right:40px;font:600 11px/15px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--ina-content-secondary)}
.kelompok b{display:block;margin-top:12px;font:500 28px/34px Inter,sans-serif;color:var(--ina-primary-primary)}
.kelompok span{font-size:13px;color:var(--ina-content-secondary)}
.kelompok i{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--ina-background-secondary);color:var(--ina-primary-primary)}
.blok-tugas{margin-top:16px;padding:20px;border:1px solid var(--ina-stroke-primary);border-radius:16px;background:var(--ina-background-primary)}
.blok-tugas .eb{font:600 11px/16px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--ina-content-secondary)}
.blok-tugas h2{margin:4px 0 0;font:500 20px/28px Inter,sans-serif;color:var(--ina-primary-primary)}
.blok-tugas>p{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--ina-content-secondary)}
.saring-t{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px;margin:16px 0 0}
.grup-baris td{padding:10px 16px;font:600 12px/16px Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--ina-content-secondary);background:var(--ina-background-secondary)}
.tb .wkt{display:block;font-size:12px;color:var(--ina-content-secondary)}
.kosong-t{padding:24px;text-align:center;color:var(--ina-content-secondary)}
@media (max-width:760px){.kartu-akun,.kartu-akun.dua,.kelompok,.saring-t{grid-template-columns:minmax(0,1fr)}.tb thead{display:none}.tb tr{display:block;padding:8px 0}.tb td{display:block;padding:4px 16px;border:0}}
</style>
</head>

    tombol:[['Tutup','secondary',null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => {
    const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]);
  });
});
function lihat(u) { const el = $(u.sorot); if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); } }
$('#bukaUbah').textContent = `Daftar perubahan (${UBAH.length})`;
$('#aturUlang').addEventListener('click', () => { AJB.hapus(); location.reload(); });
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
gambar();
})();
</script>
</body>
</html>
