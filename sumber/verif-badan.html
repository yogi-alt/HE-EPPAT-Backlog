<style id="verif-css">
/* ===== Verifikasi Akta (Asisten/PPAT) — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital (skor 54,5; rincian di UX Metric Lab, Highlight #5) (HE-VERIF-01…05)
   Kerangka, tab, isian, dan teks mengikuti layar & kode live Peruri (dilihat 23 Okt 2026). Data contoh sama dengan prototipe Order AJB. ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45}
.istilah{border-bottom:1px dashed currentColor;cursor:help}
.ina-modal-confirmation{max-width:560px}

/* daftar */
.saring-v{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.saring-v .ina-input-search{flex:1;width:auto;min-width:220px}
.urut-wadah{position:relative}
.urut-wadah .ina-select-dropdown__trigger{min-width:230px}
.urut-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:auto;right:0;min-width:240px;z-index:20}
.ringkas-saring{margin-top:10px;font-size:13px;color:var(--ina-content-secondary)}
.tunggu{display:flex;flex-direction:column;gap:2px}
.tunggu small{font-size:12px;color:var(--ina-content-secondary)}
.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}

/* detail */
.det-atas{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.det-atas .meta{font-size:14px;color:var(--ina-content-secondary)}
.det-judul{margin:12px 0 0;font:500 22px/30px Inter,sans-serif;color:var(--ina-primary-primary)}
.det-sub{margin:2px 0 0;font-size:14px;color:var(--ina-content-secondary)}
.info-tunggu{margin-top:16px}
.info-tunggu .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.info-tunggu .ina-alert__text-section{flex:1;min-width:240px}
.tab-verif{margin-top:16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:12px;padding:0 8px}
.tab-verif .ina-tab-horizontal__tab{gap:8px;display:inline-flex;align-items:center;justify-content:center}
.kartu.ina-card{display:block;width:100%;max-width:none;margin-top:16px;padding:24px;border-radius:16px}
.kartu .ina-card__content{padding:0;display:block}
.kartu-kepala{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.kartu-kepala .ikon-bulat{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--ina-primary-50);color:var(--ina-primary-600);flex:none}
.kartu-kepala h2{margin:0;font:600 19px/28px Inter,sans-serif;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kartu-kepala p{margin:4px 0 0;font-size:14px;line-height:21px;color:var(--ina-content-secondary)}
.kartu-kepala .kanan{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.kartu-kepala .kanan small{font-size:12px;color:var(--ina-content-secondary)}
.daftar-pihak{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.daftar-pihak li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:12px}
.daftar-pihak .nm{font-weight:600;font-size:15px}
.daftar-pihak .peran{font-size:12px;color:var(--ina-content-secondary);letter-spacing:.5px}
.daftar-pihak .kanan{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daftar-pihak .solusi{flex-basis:100%;margin:0;font-size:13px;color:var(--ina-content-secondary)}
.daftar-pihak li.perlu{border-color:var(--ina-warning-300,#f5c451);background:var(--ina-warning-50,#fffbeb)}
.cek{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.objek{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px;margin-top:16px;padding:14px 16px;border:1px solid var(--ina-stroke-primary);border-radius:12px;font-size:14px}
.objek dt{font-size:12px;color:var(--ina-content-secondary)}
.objek dd{margin:2px 0 0;font-weight:500}
.objek .lebar{grid-column:1/-1}
.periksa{margin:16px 0 0;padding:12px 16px 12px 34px;border-radius:12px;background:var(--ina-background-secondary);font-size:14px;line-height:24px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.f-grid .lebar{grid-column:1/-1}
.ina-text-area{margin-top:16px}
.hitung{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--ina-background-secondary)}
.hitung span{display:block;font-size:12px;color:var(--ina-content-secondary)}
.hitung b{display:block;font-size:18px;color:var(--ina-primary-primary);margin-top:2px}
.hitung small{display:block;font-size:12px;color:var(--ina-content-secondary);margin-top:2px}
.banding{margin-top:12px}
.kartu-kaki{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--ina-stroke-primary)}
.kartu-kaki .ket{margin-right:auto;font-size:13px;color:var(--ina-content-secondary)}
.selesai-semua{margin-top:16px}
.selesai-semua .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.selesai-semua .ina-alert__text-section{flex:1;min-width:240px}
.ringkas{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:12px 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas dt{color:var(--ina-content-secondary)}
.ringkas dd{margin:0;font-weight:500}
.ina-text-field__prefix-text{font-size:14px;color:var(--ina-content-secondary);padding-right:6px}

@media (max-width:760px){
  .tab-verif .ina-tab-horizontal__tab span.lbl{font-size:13px}
  .kartu.ina-card{padding:18px 16px}
  .objek{grid-template-columns:1fr 1fr}
  .f-grid,.hitung{grid-template-columns:1fr}
  .ringkas{grid-template-columns:1fr;gap:2px}
  .ringkas dd{margin-bottom:6px}
  .saring-v .ina-button-group{width:100%;overflow-x:auto}
  .urut-wadah,.urut-wadah .ina-select-dropdown__trigger{width:100%}
  .kartu-kepala .kanan{margin-left:0;align-items:flex-start}
}
</style>
</head>

function terbilang(n) {
  n = Math.floor(n);
  if (n < 12) return SATUAN[n];
  if (n < 20) return terbilang(n - 10) + ' belas';
  if (n < 100) return terbilang(Math.floor(n / 10)) + ' puluh' + (n % 10 ? ' ' + terbilang(n % 10) : '');
  if (n < 200) return 'seratus' + (n - 100 ? ' ' + terbilang(n - 100) : '');
  if (n < 1000) return terbilang(Math.floor(n / 100)) + ' ratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
  if (n < 2000) return 'seribu' + (n - 1000 ? ' ' + terbilang(n - 1000) : '');
  if (n < 1e6) return terbilang(Math.floor(n / 1000)) + ' ribu' + (n % 1000 ? ' ' + terbilang(n % 1000) : '');
  if (n < 1e9) return terbilang(Math.floor(n / 1e6)) + ' juta' + (n % 1e6 ? ' ' + terbilang(n % 1e6) : '');
  if (n < 1e12) return terbilang(Math.floor(n / 1e9)) + ' miliar' + (n % 1e9 ? ' ' + terbilang(n % 1e9) : '');
  return terbilang(Math.floor(n / 1e12)) + ' triliun' + (n % 1e12 ? ' ' + terbilang(n % 1e12) : '');
}

/* ---------------- verifikasi (live) + konfirmasi (HE-VERIF-03) ---------------- */
function cekCa() {
  const x = o();
  tunggu('ca', 800, () => {
    x.dicek = '26 Okt 2026, ' + new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' }).replace(':', '.');
    const semua = x.pihak.every(pihakOk);
    if (semua && !x.v.pihak) { selesaiBagian(x, 'pihak'); return; }
    gambar();
    const kurang = x.pihak.filter(p => !pihakOk(p)).length;
    toast('Verifikasi para pihak diperbarui.', kurang ? 'default' : 'positive', 4000, kurang ? `${kurang} pihak belum terverifikasi. Lihat keterangan di setiap pihak.` : '');
  });
}
const ringkas = rows => `<dl class="ringkas">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const pernyataan = t => `<label class="ina-checkbox cek" for="setuju" style="margin-top:12px"><input type="checkbox" id="setuju" class="ina-checkbox__input peer"><div class="ina-checkbox__box ina-checkbox__box--unchecked"></div><div class="ina-checkbox__content"><span class="ina-checkbox__label">${t}</span></div></label>`;

      <ol class="periksa"><li>Sertifikat asli sesuai dengan data di permohonan.</li><li>Tidak ada blokir atau sengketa atas tanah.</li><li>Luas dan lokasi sesuai dengan sertifikat.</li></ol>
      ${ringkas([['Objek', `${b.hak} No. ${b.sertifikat}`], ['NIB', b.nib], ['Luas', `${b.luas} m²`], ['Catatan', x.catObjek ? esc(x.catObjek) : '—']])}
      ${pernyataan('Saya sudah memeriksa ketiga hal di atas.')}`,
    tombol:[['Batal','secondary',null],['Tandai Terverifikasi','primary',() => tunggu('objek', 700, () => selesaiBagian(x, 'objek'))]] });

function konfirmHarga() {
  const x = o(); let ada = false;

    tombol:[['Batal','secondary',null],['Simpan & Verifikasi','primary',() => tunggu('harga', 700, () => selesaiBagian(x, 'harga'))]] });
}

  if (u.ke === 'harga-011') buka('ORD-CONTOH-011', 'harga');
