<style id="user-css">
/* ===== Daftar User (Super Admin) — komponen IDDS + brand E-PPAT (HE-UMUM-01)
   + usulan dari laporan Heuristic Evaluation INA Digital (skor 79,5; rincian di UX Metric Lab, Highlight #9) (HE-USER-01…04, HE-UMUM-03)
   Kerangka, kolom, menu aksi, dialog, dan teks mengikuti kode live Peruri. Data contoh sama dengan prototipe Order AJB, Verifikasi, dan E-Akta Wizard. ===== */
.ina-tooltip:not(:hover):not(:focus-within) .ina-tooltip__content{display:none}
.ina-tooltip__bubble{display:block;width:max-content;max-width:min(260px,80vw);white-space:normal;text-align:left;line-height:1.45;font-weight:400;text-transform:none;letter-spacing:0}
.istilah{border-bottom:1px dashed currentColor;cursor:help}
.ina-modal-confirmation{max-width:560px}
.ingat{margin-top:20px}
.ingat .ina-alert__content{display:flex;flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
.ingat .ina-alert__text-section{flex:1;min-width:240px}

/* alat daftar (live: status, peran, jumlah, cari, Tambah User) */
.alat{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 16px;background:var(--ina-background-primary);border:1px solid var(--ina-stroke-primary);border-radius:16px}
.alat .kiri,.alat .kanan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alat .jumlah{font-size:13px;color:var(--ina-content-secondary)}
.alat .ina-input-search{width:240px}
.pilih-wadah{position:relative}
.pilih-wadah .ina-select-dropdown__trigger{min-width:160px}
.pilih-wadah .ina-select-dropdown__panel{top:calc(100% + 4px);left:0;right:auto;min-width:180px;z-index:20}
/* aksi massal (HE-USER-02) */
.massal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 16px;border-radius:12px;background:var(--ina-primary-50,#eaf2ef);border:1px solid var(--ina-primary-200,#cfe3dc);font-size:14px}
.massal b{margin-right:auto}
td.cek-sel,th.cek-sel{width:44px}
.ina-checkbox.sel{display:inline-flex;cursor:pointer}
.nm-user{font-weight:600;color:var(--ina-primary-primary)}
.kd-user{font:11px ui-monospace,Menlo,monospace;color:var(--ina-content-secondary)}
.sel-email{font-size:13px;color:var(--ina-content-secondary)}
.aksi-wadah{position:relative;display:inline-block}
.aksi-wadah .ina-action-dropdown__menu{position:absolute;right:0;left:auto;top:calc(100% + 4px);min-width:190px;z-index:30;visibility:visible;opacity:1;pointer-events:auto;transform:none}
.aksi-wadah .ikon-aksi{width:32px;height:32px;padding:0;justify-content:center}
tr.dipilih td{background:var(--ina-primary-25,#f4faf7)}
.kosong{text-align:center;padding:28px 12px;color:var(--ina-content-secondary)}

/* formulir */
.f-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.f-baris{margin-top:16px}
.ina-text-field select.ina-text-field__input{appearance:auto;background:transparent;border:0;width:100%;height:100%;font:inherit;font-size:14px;color:inherit;outline:0}
.terkunci-isi{padding:10px 12px;border:1px solid var(--ina-stroke-primary);border-radius:8px;background:var(--ina-background-secondary);font-size:14px;color:var(--ina-content-secondary)}
.syarat-pw{list-style:none;margin:8px 0 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 16px}
.syarat-pw li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ina-content-secondary)}
.syarat-pw .tanda{width:16px;height:16px;border-radius:999px;border:1.5px solid var(--ina-stroke-secondary);display:grid;place-items:center;flex:none}
.syarat-pw li.ok{color:var(--ina-content-positive)}
.syarat-pw li.ok .tanda{border-color:var(--ina-content-positive);background:var(--ina-positive-100)}
.pw-atas{display:flex;justify-content:flex-end;margin-top:6px}
.ringkas{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:12px 0;padding:12px 14px;border:1px solid var(--ina-stroke-primary);border-radius:10px;background:var(--ina-background-secondary);font-size:14px}
.ringkas dt{color:var(--ina-content-secondary)}
.ringkas dd{margin:0;font-weight:500}
.pw-sementara{display:flex;align-items:center;gap:10px;margin-top:8px}
.pw-sementara code{flex:1;padding:10px 12px;border:1px solid var(--ina-stroke-primary);border-radius:8px;background:#fff;font:600 15px ui-monospace,Menlo,monospace;color:var(--ina-primary-primary);word-break:break-all}
.daftar-nama{margin:8px 0 0;padding:10px 14px 10px 32px;border-radius:10px;background:var(--ina-background-secondary);font-size:14px;line-height:24px}
.daftar-nama small{color:var(--ina-content-secondary)}
.modal-gap>*+*{margin-top:12px}
/* impor (HE-UMUM-03) */
.langkah-impor{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pratinjau{max-height:260px;overflow:auto;border:1px solid var(--ina-stroke-primary);border-radius:10px;margin-top:12px}
.pratinjau table{width:100%;border-collapse:collapse;font-size:13px}
.pratinjau th,.pratinjau td{padding:8px 10px;border-bottom:1px solid var(--ina-stroke-primary);text-align:left;vertical-align:top}
.pratinjau th{background:var(--ina-background-secondary);font-weight:600}
.pratinjau tr.galat td{background:var(--ina-negative-50,#fff1f1)}
.pratinjau td small{display:block;color:var(--ina-negative-600,#c81e1e)}

@media (max-width:760px){
  .alat .ina-input-search{width:100%}
  .alat .kanan,.alat .kiri{width:100%}
  .f-grid3,.f-grid2{grid-template-columns:1fr}
  .ringkas{grid-template-columns:1fr;gap:2px}
  .ringkas dd{margin-bottom:6px}
  .ina-button-group{overflow-x:auto;max-width:100%}
}
</style>
</head>

const tampil = () => { const q = S.cari.trim().toLowerCase(); return USER.filter(u => (S.status === 'all' || u.status === S.status) && (S.peran === 'all' || u.peran === S.peran) && (!q || `${u.nama} ${u.email}`.toLowerCase().includes(q))); };
function layar() {
  const rows = tampil(), semua = rows.length && rows.every(u => S.pilih.has(u.id));
  const ingat = S.tera ? `<div class="ingat">${alert('caution', '', 'Stempel Elektronik (TERA) kantor Anda belum didaftarkan. Lengkapi data pendaftaran TERA agar akta bisa distempel elektronik.', `<div style="display:flex;gap:8px;align-items:center">${tombol('Daftar TERA', 'primary', 'sm', 'data-ke-tera', ik('panah', 14))}<button type="button" class="ina-alert__close-button" data-tutup-tera aria-label="Tutup pengingat">${ik('x', 16)}</button></div>`)}</div>` : '';

  return `${remah()}<h1>Daftar Pengguna</h1><p class="sub">Kelola akun pegawai kantor dan klien: tambah pengguna, ubah peran, dan atur status akun.</p>

      <div class="kiri">
        <div class="ina-button-group" role="group" aria-label="Saring status akun">${ST_SARING.map(([v, t]) => `<button type="button" class="ina-button-group__button ${v === S.status ? 'ina-button-group__button--selected' : ''}" aria-pressed="${v === S.status}" data-status="${v}"><span class="ina-button-group__button-content">${t}</span></button>`).join('')}</div>
        <div class="ina-select-dropdown pilih-wadah"><button type="button" class="ina-select-dropdown__trigger ina-select-dropdown__trigger--size-md" id="peranTombol" aria-haspopup="listbox" aria-expanded="${S.peranBuka}" aria-label="Saring peran"><span class="ina-select-dropdown__trigger-text ina-select-dropdown__trigger-text--selected">${PERAN_SARING.find(p => p[0] === S.peran)[1]}</span>${ik('bawah')}</button>
          ${S.peranBuka ? `<div class="ina-select-dropdown__panel"><div class="ina-select-dropdown__options" role="listbox">${PERAN_SARING.map(([v, t]) => `<button type="button" role="option" aria-selected="${v === S.peran}" class="ina-select-dropdown__option ${v === S.peran ? 'ina-select-dropdown__option--selected-single' : ''}" data-peran="${v}">${t}</button>`).join('')}</div></div>` : ''}</div>
        <span class="jumlah">${rows.length} pengguna</span>
      </div>
      <div class="kanan">
        ${cari('cariUser', 'Cari nama / email…', S.cari, 'Cari user')}
        ${tombol('Impor dari Berkas', 'secondary', 'sm', 'id="impor"', ik('unggah', 14))}${usulan('HE-UMUM-03')}
        ${tombol('Tambah Pengguna', 'primary', 'sm', 'id="tambah"', ik('user', 14))}
      </div>
    </div>
    ${dipilih.length ? `<div class="massal ditandai" id="bilahMassal" role="region" aria-label="Aksi untuk pengguna terpilih"><b>${dipilih.length} pengguna dipilih</b>
      ${tombol('Aktifkan', 'secondary', 'sm', 'data-massal="ACTIVE"', ik('centang', 14))}${tombol('Tangguhkan', 'secondary', 'sm', 'data-massal="SUSPENDED"', ik('kunci', 14))}${tombol('Batalkan pilihan', 'tertiary', 'sm', 'id="batalPilih"')}${usulan('HE-USER-02')}</div>` : ''}
    <div class="tabel-wadah"><div class="tabel-gulir"><div class="ina-table"><table class="ina-table__container tb">
      <thead class="ina-table__header"><tr>
        <th class="ina-table__header-cell cek-sel">${cekBox('pilihSemua', semua, '', 'aria-label="Pilih semua pengguna yang tampil" data-pilih-semua')}</th>
        <th class="ina-table__header-cell">Nama</th><th class="ina-table__header-cell">Email</th><th class="ina-table__header-cell">Peran</th><th class="ina-table__header-cell">Login terakhir</th>
        <th class="ina-table__header-cell ditandai" id="kolomCa">${denganTip(`<span class="istilah" tabindex="0">Status CA</span>`, KET_CA, 'bottom')}${usulan('HE-USER-01')}</th>
        <th class="ina-table__header-cell">Status</th><th class="ina-table__header-cell"></th></tr></thead>
      <tbody class="ina-table__body">${rows.length ? rows.map(u => { const c = CA[u.ca], [sl, sb] = STATUS[u.status], p = S.pilih.has(u.id);
        return `<tr class="ina-table__row ${p ? 'dipilih' : ''} ${S.sorot === u.id ? 'sorot' : ''}" data-id="${u.id}">
          <td class="ina-table__cell cek-sel">${cekBox('pilih' + u.id, p, '', `aria-label="Pilih ${esc(u.nama)}" data-pilih="${u.id}"`)}</td>
          <td class="ina-table__cell"><div class="nm-user">${esc(u.nama)}</div><div class="kd-user">${u.kode}</div></td>
          <td class="ina-table__cell"><span class="sel-email">${esc(u.email)}</span></td>
          <td class="ina-table__cell">${badge(PERAN[u.peran], 'info', 'sm')}</td>
          <td class="ina-table__cell"><span class="sel-email">${u.login || '—'}</span></td>
          <td class="ina-table__cell">${denganTip(badge(c.l, c.b, 'sm', 'tabindex="0"'), c.t)}</td>
          <td class="ina-table__cell">${badge(sl, sb, 'sm')}</td>
          <td class="ina-table__cell" style="text-align:right">${menuAksi(u)}</td></tr>`; }).join('')
        : `<tr><td colspan="8" class="ina-table__empty-cell kosong">${S.cari ? `Tidak ada pengguna cocok dengan "${esc(S.cari)}".` : 'Belum ada pengguna.'}</td></tr>`}</tbody></table></div></div></div>`;
}
/* menu aksi per baris: IDDS Action Dropdown (HE-USER-04) */
function menuAksi(u) {
  const buka = S.menu === u.id;
  return `<span class="aksi-wadah ina-action-dropdown">${denganTip(`<button type="button" class="ina-button ina-button--secondary ina-button--sm ikon-aksi" data-menu="${u.id}" aria-haspopup="menu" aria-expanded="${buka}" aria-label="Aksi untuk ${esc(u.nama)}">${ik('menu', 16)}</button>`, 'Aksi', 'left')}
    ${buka ? `<div class="ina-action-dropdown__menu ina-action-dropdown__menu--visible" role="menu">
      <button type="button" class="ina-action-dropdown__item" role="menuitem" data-ubah="${u.id}"><span class="ina-action-dropdown__item-icon">${ik('edit')}</span><span class="ina-action-dropdown__item-content">Ubah Data</span></button>
      <button type="button" class="ina-action-dropdown__item" role="menuitem" data-reset="${u.id}"><span class="ina-action-dropdown__item-icon">${ik('kunciKey')}</span><span class="ina-action-dropdown__item-content">Reset Password</span></button>
      ${u.status === 'ACTIVE' ? `<button type="button" class="ina-action-dropdown__item" role="menuitem" data-ubah-status="${u.id}" data-ke-status="SUSPENDED"><span class="ina-action-dropdown__item-icon">${ik('kunci')}</span><span class="ina-action-dropdown__item-content">Tangguhkan</span></button>`
        : `<button type="button" class="ina-action-dropdown__item" role="menuitem" data-ubah-status="${u.id}" data-ke-status="ACTIVE"><span class="ina-action-dropdown__item-icon">${ik('centang')}</span><span class="ina-action-dropdown__item-content">Aktifkan</span></button>`}</div>` : ''}</span>`;
}
function gambar() { gambarNav(); $('#halaman').innerHTML = layar(); pasangPanduan(); }
function sorotBaris(id) { S.sorot = id; gambar(); setTimeout(() => { S.sorot = null; document.querySelector(`tr[data-id="${id}"]`)?.classList.remove('sorot'); }, 2400); }

/* ---------------- interaksi ---------------- */
const H = $('#halaman');
H.addEventListener('input', e => { if (e.target.id !== 'cariUser') return; S.cari = e.target.value; const pos = e.target.selectionStart; gambar(); const i = $('#cariUser'); i.focus(); i.setSelectionRange(pos, pos); });
H.addEventListener('change', e => {
  const p = e.target.closest('[data-pilih]'); if (p) { const id = +p.dataset.pilih; p.checked ? S.pilih.add(id) : S.pilih.delete(id); gambar(); return; }
  if (e.target.closest('[data-pilih-semua]')) { const rows = tampil(); e.target.checked ? rows.forEach(u => S.pilih.add(u.id)) : rows.forEach(u => S.pilih.delete(u.id)); gambar(); }
});
H.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-ke-tera]')) { location.href = 'Backlog-HE-TERA-Prototype.html'; return; }
  if (t.closest('[data-tutup-tera]')) { S.tera = false; gambar(); return; }
  const st = t.closest('[data-status]'); if (st) { S.status = st.dataset.status; gambar(); return; }
  if (t.closest('#peranTombol')) { S.peranBuka = !S.peranBuka; gambar(); return; }
  const pr = t.closest('[data-peran]'); if (pr) { S.peran = pr.dataset.peran; S.peranBuka = false; gambar(); return; }
  if (t.closest('#tambah')) { dialogUser('create'); return; }
  if (t.closest('#impor')) { dialogImpor(); return; }
  if (t.closest('#batalPilih')) { S.pilih.clear(); gambar(); return; }
  const ms = t.closest('[data-massal]'); if (ms) { konfirmMassal(ms.dataset.massal); return; }
  const mn = t.closest('[data-menu]'); if (mn) { const id = +mn.dataset.menu; S.menu = S.menu === id ? null : id; gambar(); return; }
  const ub = t.closest('[data-ubah]'); if (ub) { S.menu = null; gambar(); dialogUser('edit', USER.find(u => u.id === +ub.dataset.ubah)); return; }
  const rs = t.closest('[data-reset]'); if (rs) { S.menu = null; gambar(); dialogReset(USER.find(u => u.id === +rs.dataset.reset)); return; }
  const us = t.closest('[data-ubah-status]'); if (us) { S.menu = null; gambar(); konfirmStatus(USER.find(u => u.id === +us.dataset.ubahStatus), us.dataset.keStatus); return; }
});
document.addEventListener('click', e => {
  if (S.menu && !e.target.closest('.aksi-wadah')) { S.menu = null; gambar(); }
  if (S.peranBuka && !e.target.closest('.pilih-wadah')) { S.peranBuka = false; gambar(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.menu) { S.menu = null; gambar(); } });

/* ---------------- Tambah / Ubah User (live) + syarat password seragam (HE-USER-03) ---------------- */
const tf = (id, l, v = '', ph = '', wajib = false, bantu = '', tipe = 'text') => `<div class="ina-text-field" id="f-${id}"><label class="ina-text-field__label" for="${id}">${l}${wajib ? '<span class="ina-text-field__required">*</span>' : ''}</label>
  <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><input id="${id}" type="${tipe}" class="ina-text-field__input" value="${esc(v)}" placeholder="${ph}"></div>
  <div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text" id="h-${id}" data-bantu="${esc(bantu)}">${bantu}</div></div></div>`;
const pilihan = (id, l, opsi, v, wajib, bantu = '') => `<div class="ina-text-field" id="f-${id}"><label class="ina-text-field__label" for="${id}">${l}${wajib ? '<span class="ina-text-field__required">*</span>' : ''}</label>
  <div class="ina-text-field__wrapper ina-text-field__wrapper--size-md"><select id="${id}" class="ina-text-field__input">${opsi.map(([ov, ot]) => `<option value="${ov}" ${ov === v ? 'selected' : ''}>${ot}</option>`).join('')}</select></div>
  <div class="ina-text-field__bottom-area"><div class="ina-text-field__helper-text" id="h-${id}" data-bantu="${esc(bantu)}">${bantu}</div></div></div>`;
const pwIsian = (id, l, ph, bantu) => `<div class="ina-password-input ditandai" id="f-${id}"><label class="ina-password-input__label" for="${id}">${l}<span class="ina-password-input__required">*</span></label>
  <div class="ina-password-input__wrapper ina-password-input__wrapper--size-md ina-password-input__wrapper--neutral"><input id="${id}" type="password" class="ina-password-input__input" placeholder="${ph}" autocomplete="new-password">
  <div class="ina-password-input__actions"><button type="button" class="ina-password-input__toggle-button" data-lihat-pw="${id}" aria-label="Tampilkan password" aria-pressed="false">${ik('mata', 18)}</button></div></div>
  <div class="ina-password-input__status-area"><span class="ina-password-input__status-message" id="h-${id}" aria-live="polite">${bantu}</span></div></div>`;
function dialogUser(mode, u) {
  const baru = mode === 'create';
  dialog({ judul: baru ? 'Tambah Pengguna Baru' : `Ubah Pengguna — ${esc(u.nama)}`, lebar:true,
    isi:`<div class="f-grid3">${tf('uDepan', 'Nama Depan', baru ? '' : u.nama.split(' ')[0], '', true)}${tf('uTengah', 'Nama Tengah', '')}${tf('uBelakang', 'Nama Belakang', baru ? '' : u.nama.split(' ').slice(1).join(' '))}</div>
      ${baru ? `<div class="f-baris">${tf('uEmail', 'Email', '', 'nama@contoh.id', true, '', 'email')}</div>
        <div class="f-baris">${pwIsian('uPw', 'Password Awal', 'Buat password awal', 'Sampaikan password ini ke pengguna. Pengguna dapat menggantinya sendiri di menu Akun Saya.')}
          <ul class="syarat-pw" id="syaratPw" aria-live="polite">${SYARAT_PW.map(([l], i) => `<li data-syarat="${i}"><span class="tanda" aria-hidden="true"></span>${l}</li>`).join('')}</ul>
          <div class="pw-atas">${tombol('Buat Password Acak', 'tertiary', 'sm', 'id="pwAcak"', ik('acak', 14))}${usulan('HE-USER-03')}</div></div>`
        : `<div class="f-baris"><label class="ina-text-field__label">Email</label><div class="terkunci-isi">${esc(u.email)} <small>(tidak dapat diubah dari sini)</small></div></div>`}
      <div class="f-grid2">${pilihan('uPeran', 'Peran', [...(baru ? [['', 'Pilih peran']] : [['', '(tidak berubah)']]), ['ROLE_ASISTEN', 'Asisten'], ['ROLE_PPAT', 'PPAT'], ['ROLE_KLIEN', 'Klien']], '', baru, baru ? '' : 'Kosongkan untuk membiarkan peran tetap.')}
        ${baru ? '' : pilihan('uStatus', 'Status', [['ACTIVE', 'Aktif'], ['SUSPENDED', 'Ditangguhkan'], ['INACTIVE', 'Non-aktif']], u.status, true)}</div>`,
    tombol:[['Batal', 'secondary', null], [baru ? 'Buat Pengguna' : 'Simpan Perubahan', 'primary', () => simpanUser(mode, u), true]] });
  const L = $('#lapisan');
  if (baru) {
    L.querySelector('#uPw').addEventListener('input', cekPw);
    L.querySelector('#pwAcak').addEventListener('click', () => { $('#uPw').value = acakPw(); $('#uPw').type = 'text'; cekPw(); });
  }
  L.addEventListener('click', e => { const lp = e.target.closest('[data-lihat-pw]'); if (!lp) return; const i = $('#' + lp.dataset.lihatPw), lihat = i.type === 'password'; i.type = lihat ? 'text' : 'password'; lp.setAttribute('aria-pressed', lihat); lp.setAttribute('aria-label', lihat ? 'Sembunyikan password' : 'Tampilkan password'); lp.innerHTML = ik(lihat ? 'mataTutup' : 'mata', 18); });
  L.addEventListener('input', e => { const f = e.target.closest('.ina-text-field'); if (f) bersih(f.id.slice(2)); });
  $('#uDepan').focus();
}
function acakPw() {
  const set = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%&*?'], semua = set.join('');
  const r = s => s[Math.floor(Math.random() * s.length)];
  const a = set.map(r); while (a.length < 14) a.push(r(semua));
  return a.sort(() => Math.random() - .5).join('');
}
function setPw(pesan, jenis) {
  const w = $('#f-uPw .ina-password-input__wrapper'), h = $('#h-uPw');
  w.className = `ina-password-input__wrapper ina-password-input__wrapper--size-md ina-password-input__wrapper--${jenis || 'neutral'}`;
  h.textContent = pesan; h.className = `ina-password-input__status-message ${jenis ? 'ina-password-input__status-message--' + jenis : ''}`;
}
function cekPw() {
  const v = $('#uPw').value, ok = SYARAT_PW.map(([, uji]) => uji(v));
  document.querySelectorAll('#syaratPw li').forEach((li, i) => { li.classList.toggle('ok', ok[i]); li.querySelector('.tanda').innerHTML = ok[i] ? ik('centang', 12) : ''; });
  setPw(v && ok.every(Boolean) ? 'Password sudah memenuhi semua syarat.' : 'Sampaikan password ini ke pengguna. Pengguna dapat menggantinya sendiri di menu Akun Saya.', v && ok.every(Boolean) ? 'success' : '');
}
function galat(id, pesan) { const w = $(`#f-${id} .ina-text-field__wrapper`), h = $(`#h-${id}`); w?.classList.add('ina-text-field__wrapper--status-error'); if (h) { h.textContent = pesan; h.classList.add('ina-text-field__helper-text--error'); } }
function bersih(id) { const w = $(`#f-${id} .ina-text-field__wrapper`), h = $(`#h-${id}`); w?.classList.remove('ina-text-field__wrapper--status-error'); if (h) { h.classList.remove('ina-text-field__helper-text--error'); h.textContent = h.dataset.bantu || ''; } }
function simpanUser(mode, u) {
  const v = id => ($('#' + id)?.value ?? '').trim(); let ada = false;
  if (v('uDepan').length < 2) { galat('uDepan', 'Nama depan minimal 2 karakter.'); ada = true; }
  if (mode === 'create') {
    if (!/^\S+@\S+\.\S+$/.test(v('uEmail'))) { galat('uEmail', 'Format email tidak valid. Contoh: nama@contoh.id'); ada = true; }
    else if (USER.some(x => x.email === v('uEmail').toLowerCase())) { galat('uEmail', 'Email ini sudah terdaftar. Gunakan email lain.'); ada = true; }
    if (!SYARAT_PW.every(([, uji]) => uji($('#uPw').value))) { setPw('Password belum memenuhi semua syarat di bawah.', 'error'); ada = true; }
    if (!v('uPeran')) { galat('uPeran', 'Pilih peran pengguna.'); ada = true; }
  }
  if (ada) { $('#lapisan .ina-text-field__wrapper--status-error input, #lapisan .ina-text-field__wrapper--status-error select, #lapisan .ina-password-input__wrapper--error input')?.focus(); return; }
  const nama = [v('uDepan'), v('uTengah'), v('uBelakang')].filter(Boolean).join(' ');
  $('#lapisan').innerHTML = '';
  if (mode === 'create') { const id = Math.max(...USER.map(x => x.id)) + 1; USER.unshift({ id, nama, email:v('uEmail').toLowerCase(), peran:v('uPeran'), ca:'none', status:'ACTIVE', login:'', kode:'USR_CONTOH' + id }); sorotBaris(id); toast('Pengguna berhasil dibuat.', 'positive', 4000, `${nama} dapat masuk dengan email dan password awal.`); }
  else { Object.assign(u, { nama, peran:v('uPeran') || u.peran, status:v('uStatus') }); sorotBaris(u.id); toast('Pengguna berhasil diperbarui.', 'positive'); }
}

/* ---------------- Reset Password (live, 2 tahap) ---------------- */
function dialogReset(u) {
  dialog({ judul:`Reset password — ${esc(u.nama)}`, konfirmasi:true,
    isi:`<div class="modal-gap"><p>Sistem akan membuat password acak 12 karakter untuk pengguna ini. Password lama dinonaktifkan dan <b>pengguna otomatis keluar dari semua perangkat</b>.</p>
      ${alert('info', '', `Password sementara akan <b>dikirim otomatis ke email pengguna</b> (${esc(u.email)}). Password juga ditampilkan sekali di sini sebagai cadangan bila email gagal terkirim.`)}</div>`,
    tombol:[['Batal', 'secondary', null], ['Reset Password', 'primary', () => {
      const pw = acakPw().slice(0, 12);
      dialog({ judul:`Password sementara — ${esc(u.nama)}`,
        isi:`<div class="modal-gap">${alert('success', 'Password terkirim ke email user', `Password sementara sudah dikirim ke ${esc(u.email)}. Password di bawah dapat dipakai sebagai cadangan bila pengguna tidak menerima email.`)}
          <p>Password ini <b>tidak akan ditampilkan lagi</b> setelah dialog ditutup.</p>
          <div><span class="ina-text-field__label">Password sementara</span><div class="pw-sementara"><code id="pwSementara">${pw}</code>${tombol('Salin', 'secondary', 'sm', 'id="salinPw"', ik('salin', 14))}</div></div>
          ${alert('info', '', 'Pengguna harus masuk ulang dengan password ini. Semua sesi aktifnya sudah diakhiri.')}</div>`,
        tombol:[['Selesai', 'primary', null]] });
      $('#salinPw').addEventListener('click', e => { e.stopPropagation(); navigator.clipboard?.writeText(pw).catch(() => {}); toast('Password disalin.', 'positive'); });
    }]] });
}

/* ---------------- Tangguhkan / Aktifkan (live) + massal (HE-USER-02) ---------------- */
function konfirmStatus(u, ke) {
  const tangguh = ke === 'SUSPENDED';
  dialog({ judul: tangguh ? `Tangguhkan "${esc(u.nama)}"?` : `Aktifkan "${esc(u.nama)}"?`, konfirmasi:true,
    isi: tangguh ? `<p>Akun <b>${esc(u.nama)}</b> akan ditangguhkan dan <b>tidak bisa masuk</b> sampai diaktifkan kembali. Sesi aktif yang ada tidak langsung diputus.</p>`
      : `<p>Akun <b>${esc(u.nama)}</b> akan diaktifkan kembali dan <b>bisa masuk</b> seperti biasa.</p>`,
    tombol:[['Batal', 'secondary', null], [tangguh ? 'Tangguhkan' : 'Aktifkan', 'primary', () => { u.status = ke; sorotBaris(u.id); toast(`${u.nama} ${tangguh ? 'ditangguhkan' : 'diaktifkan'}.`, 'positive'); }]] });
}
function konfirmMassal(ke) {
  const tangguh = ke === 'SUSPENDED', dipilih = USER.filter(u => S.pilih.has(u.id));
  const ubah = dipilih.filter(u => u.status !== ke), lewat = dipilih.filter(u => u.status === ke);
  if (!ubah.length) { toast(`Semua pengguna terpilih sudah berstatus ${STATUS[ke][0]}.`); return; }
  dialog({ judul: `${tangguh ? 'Tangguhkan' : 'Aktifkan'} ${ubah.length} pengguna?`, konfirmasi:true,
    isi:`<p>${tangguh ? 'Pengguna berikut akan ditangguhkan dan <b>tidak bisa masuk</b> sampai diaktifkan kembali:' : 'Pengguna berikut akan diaktifkan kembali dan <b>bisa masuk</b> seperti biasa:'}${usulan('HE-USER-02')}</p>
      <ol class="daftar-nama">${ubah.map(u => `<li>${esc(u.nama)} <small>· ${esc(u.email)}</small></li>`).join('')}</ol>
      ${lewat.length ? `<p class="sel-email" style="margin-top:10px">${lewat.length} pengguna dilewati karena statusnya sudah ${STATUS[ke][0]}: ${lewat.map(u => esc(u.nama)).join(', ')}.</p>` : ''}`,
    tombol:[['Batal', 'secondary', null], [`${tangguh ? 'Tangguhkan' : 'Aktifkan'} ${ubah.length} Pengguna`, 'primary', () => { ubah.forEach(u => { u.status = ke; }); S.pilih.clear(); gambar(); toast(`${ubah.length} pengguna ${tangguh ? 'ditangguhkan' : 'diaktifkan'}.`, 'positive', 4000, lewat.length ? `${lewat.length} pengguna dilewati karena statusnya sudah sesuai.` : ''); }]] });
}

/* ---------------- Impor dari berkas (HE-UMUM-03) ---------------- */
const CONTOH_IMPOR = [
  { nama:'Contoh Klien Empat', email:'klien4@contoh.id', hp:'081200000104' },
  { nama:'Contoh Klien Lima', email:'klien5@contoh.id', hp:'081200000105' },
  { nama:'Contoh Klien Enam', email:'klien6contoh.id', hp:'081200000106' },
  { nama:'Contoh Penjual Satu', email:'penjual1@contoh.id', hp:'081200000011' },
  { nama:'', email:'klien7@contoh.id', hp:'' }
];
function cekBaris(r) { if (!r.nama.trim()) return 'Nama kosong.'; if (!/^\S+@\S+\.\S+$/.test(r.email)) return 'Format email tidak valid.'; if (USER.some(u => u.email === r.email)) return 'Email sudah terdaftar.'; return ''; }
function dialogImpor() {
  dialog({ judul:'Impor pengguna klien dari berkas', lebar:true,
    isi:`<div class="modal-gap"><p>Tambahkan banyak klien sekaligus. Pengguna hasil impor berperan <b>Klien</b> dan menerima password sementara melalui email.${usulan('HE-UMUM-03')}</p>
      <div class="langkah-impor">${badge('1. Unduh templat', 'brand', 'sm')}${badge('2. Unggah berkas', 'neutral', 'sm')}${badge('3. Periksa dan simpan', 'neutral', 'sm')}</div>
      <div>${tombol('Unduh Templat CSV', 'secondary', 'sm', 'id="unduhTemplat"', ik('unduh', 14))} <span class="sel-email">Kolom: nama, email, nomor HP (opsional).</span></div>
      <div class="ina-file-upload" id="f-impor"><div class="ina-file-upload__label">Berkas pengguna<span class="ina-text-field__required">*</span></div>
        <div class="ina-file-upload__dropzone" role="button" tabindex="0" id="pilihBerkas" aria-label="Pilih berkas CSV atau Excel"><div class="ina-file-upload__content"><div class="ina-file-upload__icon">${ik('unggah', 24)}</div>
          <div class="ina-file-upload__text"><div class="ina-file-upload__title">Seret berkas ke sini atau klik untuk memilih</div><div class="ina-file-upload__description">CSV atau Excel (.xlsx), maks. 500 baris. Gunakan templat agar kolomnya sesuai.</div></div>
          <span class="ina-file-upload__button">Pilih File</span></div></div>
        <div class="ina-file-upload__files" id="berkasImpor"></div></div>
      <div id="pratinjau"></div></div>`,
    tombol:[['Batal', 'secondary', null], ['Simpan Pengguna Valid', 'primary', () => simpanImpor(), true]] });
  const L = $('#lapisan'), simpan = L.querySelector('.ina-modal__footer .ina-button:last-child'); simpan.disabled = true;
  L.querySelector('#unduhTemplat').addEventListener('click', e => { e.stopPropagation(); toast('Templat CSV diunduh (simulasi).'); });
  const pilih = e => { e.stopPropagation();
    $('#berkasImpor').innerHTML = `<div class="ina-file-upload__file ina-file-upload__file--success"><div class="ina-file-upload__file-icon-wrapper ina-file-upload__file-icon-wrapper--success">${ik('centang', 16)}</div><div class="ina-file-upload__file-info"><div class="ina-file-upload__file-name">daftar-klien-contoh.csv</div><div class="ina-file-upload__file-size">2 KB · ${CONTOH_IMPOR.length} baris</div></div></div>`;
    const hasil = CONTOH_IMPOR.map(r => ({ ...r, galat:cekBaris(r) })), valid = hasil.filter(r => !r.galat).length;
    $('#pratinjau').innerHTML = `${alert(valid === hasil.length ? 'success' : 'caution', `${valid} dari ${hasil.length} baris siap disimpan`, valid === hasil.length ? 'Semua baris valid.' : `${hasil.length - valid} baris bermasalah tidak ikut disimpan. Perbaiki di berkas, lalu impor ulang baris tersebut.`)}
      <div class="pratinjau"><table><thead><tr><th>Baris</th><th>Nama</th><th>Email</th><th>Nomor HP</th><th>Hasil</th></tr></thead><tbody>${hasil.map((r, i) => `<tr class="${r.galat ? 'galat' : ''}"><td>${i + 2}</td><td>${esc(r.nama) || '—'}</td><td>${esc(r.email)}</td><td>${r.hp || '—'}</td><td>${r.galat ? badge('Tidak disimpan', 'error', 'sm') + `<small>${r.galat}</small>` : badge('Siap', 'success', 'sm')}</td></tr>`).join('')}</tbody></table></div>`;
    simpan.disabled = !valid; simpan.textContent = `Simpan ${valid} Pengguna`; L._hasil = hasil;
    document.querySelectorAll('.langkah-impor .ina-badge').forEach((b, i) => b.className = `ina-badge ina-badge--soft ina-badge--${i === 2 ? 'brand' : 'success'} ina-badge--sm ina-badge--rounded-full`);
  };
  L.querySelector('#pilihBerkas').addEventListener('click', pilih);
  L.querySelector('#pilihBerkas').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pilih(e); } });
}
function simpanImpor() {
  const hasil = $('#lapisan')._hasil || [], valid = hasil.filter(r => !r.galat);
  let id = Math.max(...USER.map(x => x.id));
  valid.forEach(r => { id++; USER.unshift({ id, nama:r.nama, email:r.email, peran:'ROLE_KLIEN', ca:'none', status:'ACTIVE', login:'', kode:'USR_CONTOH' + id }); });
  $('#lapisan').innerHTML = ''; S.peran = 'ROLE_KLIEN'; gambar();
  toast(`${valid.length} klien berhasil diimpor.`, 'positive', 4500, `Password sementara dikirim ke email masing-masing. ${hasil.length - valid.length} baris tidak disimpan.`);
}

/* ---------------- tombol Bantuan di judul halaman (HE-UMUM-02) ---------------- */
function pasangPanduan() {
  const h = document.querySelector('#halaman h1'); if (!h || h.parentElement.classList.contains('judul-kiri')) return;
  const w = document.createElement('div'); w.className = 'judul-halaman';
  const kiri = document.createElement('div'); kiri.className = 'judul-kiri';
  const sub = h.nextElementSibling && h.nextElementSibling.classList.contains('sub') ? h.nextElementSibling : null;
  h.before(w); w.append(kiri); kiri.append(h); if (sub) kiri.append(sub);
  w.insertAdjacentHTML('beforeend', `<button type="button" class="ina-button ina-button--secondary ina-button--md ditandai" id="bukaBantuan" aria-label="Bantuan untuk halaman ini"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>Bantuan</span></button>`);
}
document.addEventListener('click', e => { if (e.target.closest('#bukaBantuan')) bukaBantuan(); });

/* ---------------- IDDS Drawer ---------------- */
function drawer({ judul, isi }) {
  const D = $('#lapisanDrawer'), hp = window.matchMedia('(max-width:760px)').matches;
  D.innerHTML = `<div class="ina-drawer ina-drawer--position-${hp ? 'bottom' : 'right'}" role="dialog" aria-modal="true" aria-labelledby="drwJudul">
    <div class="ina-drawer__backdrop" data-tutup-drawer></div>
    <div class="ina-drawer__panel ina-drawer__panel--width-md">
      <div class="ina-drawer__header"><h2 class="ina-drawer__title" id="drwJudul">${judul}</h2>
        <button type="button" class="ina-drawer__close-button" aria-label="Tutup bantuan" data-tutup-drawer><svg class="ina-drawer__close-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      <div class="ina-drawer__content">${isi}</div>
    </div></div>`;
  D.querySelector('.ina-drawer__close-button').focus();
}
function tutupDrawer() { $('#lapisanDrawer').innerHTML = ''; }
document.addEventListener('click', e => {
  if (e.target.closest('[data-tutup-drawer]')) { tutupDrawer(); return; }
  const tg = e.target.closest('#lapisanDrawer .ina-accordion__toggle'); if (!tg) return;
  const b = tg.getAttribute('aria-expanded') !== 'true';
  tg.setAttribute('aria-expanded', b);
  tg.querySelector('.ina-accordion__icon').classList.toggle('ina-accordion__icon--open', b);
  tg.nextElementSibling.classList.toggle('ina-accordion__content--open', b);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisanDrawer').innerHTML) tutupDrawer(); });

/* ---------------- IDDS Modal & Toast ---------------- */
function dialog({ judul, isi, tombol: tb, lebar, konfirmasi }) {
  const L = $('#lapisan');
  L.innerHTML = `<div class="ina-modal"><div class="ina-modal__backdrop" data-i="-1"></div><div class="ina-modal__container">
    <div class="ina-modal__dialog ina-modal__dialog--size-${lebar ? 'lg' : 'md'} ${konfirmasi ? 'ina-modal-confirmation' : ''}" role="${konfirmasi ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dlgJudul">
      <div class="ina-modal__header"><h2 class="ina-modal__title" id="dlgJudul">${judul}</h2><button type="button" class="ina-modal__close-button" aria-label="Tutup dialog" data-i="-1">${ik('x', 22)}</button></div>
      <div class="ina-modal__body">${isi}</div>
      <div class="ina-modal__footer">${tb.map(([t, h], i) => `<button type="button" class="ina-button ina-button--${h} ina-button--md" data-i="${i}">${t}</button>`).join('')}</div></div></div></div>`;
  L.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b || b.disabled) return;
    const i = +b.dataset.i; if (i < 0) { L.innerHTML = ''; return; }
    const [, , fn, tahan] = tb[i]; if (tahan) { fn && fn(); return; }
    L.innerHTML = ''; fn && fn();
  };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lapisan').innerHTML) $('#lapisan').innerHTML = ''; });
let tt;
function toast(teks, state = 'default', ms = 3000, ket = '') {
  $('#toastWadah').innerHTML = `<div class="ina-toast ina-toast--state-${state} ina-toast--style-solid ina-toast--visible" role="status"><div class="ina-toast__icon">${ik(state === 'positive' ? 'centang' : 'info', 20)}</div>
    <div class="ina-toast__content"><div class="ina-toast__text-area"><p class="ina-toast__title">${teks}</p>${ket ? `<p class="ina-toast__description">${ket}</p>` : ''}</div></div><button class="ina-toast__close-button" aria-label="Tutup notifikasi" data-tutup-toast>${ik('x', 16)}</button></div>`;
  clearTimeout(tt); tt = setTimeout(() => $('#toastWadah').innerHTML = '', ms);
}
$('#toastWadah').addEventListener('click', e => { if (e.target.closest('[data-tutup-toast]')) $('#toastWadah').innerHTML = ''; });

/* ---------------- Bantuan (HE-UMUM-02) ---------------- */
const faq = (i, q, a) => `<div class="ina-accordion"><button type="button" class="ina-accordion__toggle" aria-expanded="false" aria-controls="faq-${i}"><div class="ina-accordion__title">${q}</div><div class="ina-accordion__toggler"><svg class="ina-accordion__icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></button><div id="faq-${i}" class="ina-accordion__content"><div class="ina-accordion__body"><p>${a}</p></div></div></div>`;
function bukaBantuan() {
  drawer({ judul:'Bantuan Daftar Pengguna', isi:`
    <p>Halaman ini untuk mengelola akun pegawai kantor (PPAT, Asisten) dan klien (penjual, pembeli, saksi).</p>
    <h4 class="bantu-sub">Peran</h4>
    <ul class="bantu-langkah"><li><b>PPAT:</b> memfinalisasi minuta dan menandatangani akta.</li><li><b>Asisten:</b> membuat permohonan, verifikasi, dan menyusun minuta.</li><li><b>Klien:</b> pihak dalam akta yang menandatangani secara elektronik.</li></ul>
    <h4 class="bantu-sub">Pertanyaan umum</h4>
    ${faq(1, 'Apa arti Status CA?', KET_CA + ' Registrasi CA dilakukan pengguna sendiri melalui Akun Saya.')}
    ${faq(2, 'Apa beda Ditangguhkan dan Non-aktif?', 'Ditangguhkan: pengguna tidak bisa masuk sementara, misalnya selama pemeriksaan. Non-aktif: akun tidak dipakai lagi. Keduanya dapat diaktifkan kembali.')}
    ${faq(3, 'Syarat password awal', 'Minimal 12 karakter dan mengandung huruf besar, huruf kecil, angka, serta simbol. Gunakan "Buat Password Acak" agar syarat terpenuhi, lalu sampaikan ke pengguna.')}
    ${faq(4, 'Bagaimana mengimpor banyak klien?', 'Klik "Impor dari Berkas", unduh templat CSV, isi nama dan email, lalu unggah. Baris yang bermasalah ditampilkan beserta alasannya dan tidak ikut disimpan.')}
    ${faq(5, 'Pengguna tidak menerima email password', 'Gunakan Reset Password. Password sementara juga ditampilkan sekali di dialog sehingga dapat disampaikan langsung ke pengguna.')}
    <h4 class="bantu-sub">Kontak dukungan ${usulan('HE-UMUM-02')}</h4>
    <div class="bantu-kontak"><div><b>Email</b><span>${est('bantuan@contoh.id')}</span></div><div><b>Telepon / WhatsApp</b><span>${est('0800-0000-0000')}</span></div><div><b>Jam layanan</b><span>${est('Senin–Jumat, 08.00–17.00 WIB')}</span></div></div>` });
}

/* ---------------- protobar & daftar perubahan ---------------- */
$('#bukaUbah').addEventListener('click', () => {
  dialog({ judul:'Daftar perubahan Daftar Pengguna', lebar:true,
    isi:`<p>Usulan disusun dari laporan Heuristic Evaluation INA Digital (skor halaman 79,5; rincian dan gambar bukti di laporan lengkap UX Metric Lab) serta kode live. Kolom, saringan, menu aksi, Reset Password, dan Tangguhkan/Aktifkan tetap seperti live; yang diubah adalah penjelasan Status CA, aksi massal, syarat password, kejelasan aksi, impor berkas, dan bantuan. Daftar yang sama ada di spreadsheet Backlog-HE-EPPAT-Peruri.xlsx.</p>
      <div class="daftar-ubah">${UBAH.map((u, i) => `<div class="it"><div class="a"><code>${u.kode}</code><b>${u.judul}</b></div><p>${u.isi}</p><div class="lama"><b>Saat ini:</b> ${u.lama}</div>
        <div style="margin-top:10px">${tombol('Lihat di layar', 'secondary', 'sm', `data-lihat="${i}"`)}</div></div>`).join('')}</div>`,
    tombol:[['Tutup', 'secondary', null]] });
  $('#lapisan').querySelector('.daftar-ubah').addEventListener('click', e => { const b = e.target.closest('[data-lihat]'); if (!b) return; e.stopPropagation(); $('#lapisan').innerHTML = ''; lihat(UBAH[+b.dataset.lihat]); });
});
function lihat(u) {
  if (u.ke === 'bantuan') { bukaBantuan(); return; }
  if (u.ke === 'tambah') { dialogUser('create'); $('#f-uPw')?.scrollIntoView({ block:'center' }); return; }
  if (u.ke === 'impor') { dialogImpor(); return; }
  if (u.ke === 'massal') { S.pilih = new Set([10, 11]); gambar(); }
  if (u.ke === 'aksi') { S.menu = 3; gambar(); return; }
  const el = u.sorot && $(u.sorot);
  if (el) { el.scrollIntoView({ block:'center', behavior:'smooth' }); el.classList.add('sorot'); setTimeout(() => el.classList.remove('sorot'), 2400); }
}
$('#aturUlang').addEventListener('click', () => { USER = contoh(); Object.assign(S, { status:'all', peran:'all', cari:'', pilih:new Set(), menu:null, tera:true }); gambar(); toast('Data contoh dikembalikan ke awal.'); });
$('#sakelarPenanda').addEventListener('click', e => { const on = document.body.classList.toggle('penanda'); e.currentTarget.setAttribute('aria-pressed', on); });
$('#burger').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); });
gambar();
})();
</script>
